}
function BsPlaner({ ctx, lehrlinge, onClose }) {
  const { db, user, aendern } = ctx;
  const h = heute();
  const schuljahrEnde = `${+h.slice(5, 7) >= 7 ? parseInt(h) + 1 : parseInt(h)}-06-30`;
  const [maId, setMaId] = useState(lehrlinge[0]?.id || "");
  const ma = db.mitarbeiter.find(m => m.id === maId);
  const [plan, setPlan] = useState(() => ma ? bsWochentage(db, ma) : { tag1: 1, tag2: 2 });
  const [von, setVon] = useState(h);
  const [bis, setBis] = useState(schuljahrEnde);
  const [ohneSommer, setOhneSommer] = useState(true); // = alle Wiener Schulferien auslassen
  const [ersetzen, setErsetzen] = useState(true);
  if (!ma) return <Modal titel="Berufsschule planen" onClose={onClose}><Leer text="Keine Lehrlinge, für die du zuständig bist." /></Modal>;
  const termine = bis >= von ? bsTermine(db, ma, von, bis, plan, ohneSommer) : [];
  const bestehend = db.abwesenheiten.filter(a => a.maId === ma.id && a.art === "berufsschule" && a.status !== "storniert" && a.von >= von && a.von <= bis && !gesperrt(db, ma.id, a.von));
  const konflikt = termine.filter(t => db.abwesenheiten.some(a => a.maId === ma.id && a.art !== "berufsschule" && (wirksam(a) || a.status === "beantragt") && t.d >= a.von && t.d <= (a.bis || a.von)));
  const neu = termine.filter(t => !konflikt.includes(t) && !gesperrt(db, ma.id, t.d) && (ersetzen || !bestehend.some(a => a.von === t.d)));
  const ljListe = [...new Set(termine.map(t => lehrjahr(ma, t.d)))];
  function speichern() {
    aendern(n => {
      if (ersetzen) { const ids = new Set(bestehend.map(a => a.id)); n.abwesenheiten = n.abwesenheiten.filter(a => !ids.has(a.id)); }
      Object.assign(n.mitarbeiter.find(m => m.id === ma.id), { bsTag1: +plan.tag1, bsTag2: +plan.tag2 }); // fixe Schultage merken
      neu.forEach(t => n.abwesenheiten.push({ id: uid(), maId: ma.id, art: "berufsschule", von: t.d, bis: t.d, status: "genehmigt", anteil: t.anteil < 1 ? t.anteil : undefined, notiz: t.anteil < 1 ? "halber Schultag" : "", beantragtAm: h, erfasstVon: user.id, entschiedenVon: user.id }));
    }, `${neu.length} Berufsschultage eingetragen`);
    onClose();
  }
  const tagWahl = (k, label) => <Feld label={label}><select className={inputCls} value={plan[k]} onChange={e => setPlan({ ...plan, [k]: +e.target.value })}>
    {modellVon(db, ma).tage.map((x, i) => +x > 0 ? <option key={i} value={i}>{WT_LANG[i]}</option> : null)}</select></Feld>;
  return <Modal breit titel="Berufsschule planen" onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!neu.length && !(ersetzen && bestehend.length)}>{neu.length} Tage eintragen</Knopf></>}>
    <div className="grid sm:grid-cols-2 gap-4">
      <Feld label="Lehrling" breit><select className={inputCls} value={maId} onChange={e => { setMaId(e.target.value); const m = db.mitarbeiter.find(x => x.id === e.target.value); setPlan(bsWochentage(db, m)); }}>
        {lehrlinge.map(m => <option key={m.id} value={m.id}>{m.name} · {lehrjahr(m, h) || "–"}. Lehrjahr</option>)}</select></Feld>
      <Feld label="Von"><input type="date" className={inputCls} value={von} onChange={e => setVon(e.target.value)} /></Feld>
      <Feld label="Bis" hilfe="Standard: Ende des Schuljahres"><input type="date" className={inputCls} value={bis} min={von} onChange={e => setBis(e.target.value)} /></Feld>
      {tagWahl("tag1", "Schultag (ganzer Tag)")}
      {tagWahl("tag2", "Zusätzlicher halber Tag (1. Lehrjahr)")}
      <p className="text-xs text-stone-500 sm:col-span-2 -mt-2">Die gewählten Tage werden beim Lehrling als fixe Schultage gespeichert.</p>
      <label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={ohneSommer} onChange={e => setOhneSommer(e.target.checked)} />Schulferien Wien auslassen (Herbst, Weihnachten, Semester, Ostern, Pfingsten, Sommer, 15.11.)</label>
      {ohneSommer && (() => { const fer = []; tageZw(von, bis > von ? bis : von).forEach(d => { const f = schulferien(d); if (f && !fer.some(x => x.von === f.von)) fer.push(f); });
        return fer.length > 0 && <div className="sm:col-span-2 -mt-2 text-xs text-stone-500">Schulfrei im Zeitraum: {fer.map(f => `${f.name} ${f.von === f.bis ? fmtD(f.von) : fmtZr(f.von, f.bis)}`).join(" · ")}. Schulautonome Tage deiner Berufsschule bitte zusätzlich stornieren.</div>; })()}
      <label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={ersetzen} onChange={e => setErsetzen(e.target.checked)} />Bereits geplante Berufsschultage in diesem Zeitraum ersetzen ({bestehend.length})</label>
    </div>
    <div className="mt-4 space-y-2">
      <div className="rounded-[14px] bg-white ring-1 ring-inset ring-stone-200 p-3 text-sm">
        <b>{neu.length} Schultage</b> ({fmtTage(neu.reduce((s, t) => s + t.anteil, 0))} Tage gerechnet, davon {neu.filter(t => t.anteil < 1).length} halbe) · Lehrjahr {ljListe.join(" → ") || "–"}
        <div className="text-xs text-stone-500 mt-1">Regel: {Object.entries(db.einstellungen.bsTageJeLehrjahr).map(([lj, t]) => `${lj}. Lj. ${fmtTage(t)} Tag${+t === 1 ? "" : "e"}`).join(" · ")} pro Woche (änderbar unter Einstellungen). Feiertage werden übersprungen, ein Lehrjahreswechsel im Zeitraum wird automatisch berücksichtigt.</div>
      </div>
      {konflikt.length > 0 && <Hinweis ton="warn">{konflikt.length} Tage übersprungen, weil schon Urlaub oder eine andere Abwesenheit eingetragen ist.</Hinweis>}
      <Hinweis>Die Wiener Schulferien sind fix hinterlegt und werden jedes Jahr neu berechnet. Nur schulautonome Tage der Berufsschule bitte einzeln unter „Alle Einträge“ (Filter Berufsschule) stornieren.</Hinweis>
    </div>
  </Modal>;
}
function GesundForm({ a, onOk, onAbbruch }) {
  const [bis, setBis] = useState(addTage(heute(), -1) < a.von ? a.von : addTage(heute(), -1));
  return <div className="flex flex-wrap items-center gap-2 text-xs">

  </div>;
}

// ─── MITARBEITER ──────────────────────────────────────────────────────────────
// Falsches Chefin-Profil (z. B. beim leeren Start den Namen einer Mitarbeiterin eingetragen):
// eigenes Chefin-Profil neu anlegen, das bisherige wird normale/r Mitarbeiter/in – mit allen Daten.
function ChefinTausch({ ctx, ma, onClose }) {
  const { db, user, aendern, login } = ctx;
  const [offen, setOffen] = useState(false);
  const [name, setName] = useState("");
  const vergeben = db.mitarbeiter.some(m => m.name.trim().toLowerCase() === name.trim().toLowerCase());
  function tauschen() {
    const neuId = uid();
    aendern(n => {
      const alt = n.mitarbeiter.find(m => m.id === ma.id);
      const nr = `P-${pad(n.mitarbeiter.length + 1).padStart(3, "0")}`;
      n.mitarbeiter.push({ id: neuId, name: name.trim(), personalnr: n.mitarbeiter.some(m => m.personalnr === nr) ? `P-${uid().slice(0, 4)}` : nr, abteilung: "Leitung", funktion: "Inhaberin",
        eintritt: alt.eintritt, modellId: alt.modellId, urlaubstage: 25, urlaubStart: 25, urlaubStartAm: heute(), saldoStart: 0, vorgesetzterId: null, rolle: "admin", aktiv: true });
      alt.rolle = "mitarbeiter"; alt.vorgesetzterId = null;
      if (alt.funktion === "Inhaberin") alt.funktion = "";
      if (alt.abteilung === "Leitung") alt.abteilung = "Salon";
      n.personalLog = n.personalLog || [];
      const t = new Date().toISOString();
      n.personalLog.push({ id: uid(), am: t, von: neuId, maId: neuId, aktion: "angelegt", details: `als Chefin – ersetzt das Chefin-Profil „${alt.name}“` });
      n.personalLog.push({ id: uid(), am: t, von: neuId, maId: alt.id, aktion: "Stammdaten geändert", details: "Rolle: Administrator → Mitarbeiter/in (Chefin-Profil neu angelegt)" });
    }, `Chefin-Profil „${name.trim()}“ angelegt – ${ma.name} ist jetzt Mitarbeiter/in`);
    onClose();
    login(neuId);
  }
  if (!offen) return <button type="button" className="text-sm font-semibold text-gold-700 hover:underline" onClick={() => setOffen(true)}>Das bin gar nicht ich – „{ma.name}“ ist eine Mitarbeiterin / ein Mitarbeiter →</button>;
  return <div className="rounded-xl border border-gold-300 bg-gold-50 p-4 space-y-3">
    <div className="text-sm"><b>Chefin-Profil richtigstellen:</b> Für dich wird ein neues Chefin-Profil angelegt. <b>{ma.name}</b> wird normale/r Mitarbeiter/in und behält alle bisherigen Daten (Eintritt, Urlaub, Zeiten). Danach bist du mit deinem neuen Profil angemeldet.</div>
    <Feld label="Dein Name (Chefin)"><input className={inputCls} value={name} placeholder="Vor- und Nachname" onChange={e => setName(e.target.value)} /></Feld>
    {vergeben && <p className="text-xs text-rose-700">Diesen Namen gibt es schon in der Liste.</p>}
    <div className="flex gap-2"><Knopf onClick={tauschen} disabled={!name.trim() || vergeben}>Chefin-Profil anlegen</Knopf><Knopf art="sekundaer" onClick={() => setOffen(false)}>Abbrechen</Knopf></div>
  </div>;
}

function MaDialog({ ctx, ma, onClose }) {
  const { db, user, aendern } = ctx;
  const neu = !ma;
  const [f, setF] = useState(ma ? { ...ma } : { id: uid(), name: "", personalnr: `P-${pad(db.mitarbeiter.length + 1).padStart(3, "0")}`, abteilung: "", funktion: "", eintritt: heute(), modellId: db.modelle[0].id, urlaubstage: 25, urlaubStart: 25, urlaubStartAm: heute(), saldoStart: 0, vorgesetzterId: user.id, rolle: "mitarbeiter", aktiv: true, kjbg: false });
  const set = (k, v) => setF({ ...f, [k]: v });
  const vorschlag = vorschlagUrlaubstage(db, f);
  const [planDlg, setPlanDlg] = useState(null);
  const [austrittForm, setAustrittForm] = useState(false);
  const austritt = f.austritt ? austrittsUrlaub(db, f) : null;
  const kontoAustritt = f.austritt ? zeitkonto(db, f, f.austritt < heute() ? f.austritt : heute()) : 0;
  const nachAustritt = f.austritt ? db.abwesenheiten.filter(a => a.maId === f.id && a.von > f.austritt && (wirksam(a) || a.status === "beantragt")) : [];
  const verlauf = (db.personalLog || []).filter(l => l.maId === f.id).slice().reverse();
  function planSpeichern(m, ab) {
    aendern(n => { modellUebernehmen(n, m, ab); if (planDlg.kopie) { const x = n.mitarbeiter.find(q => q.id === f.id); if (x) x.modellId = m.id; } }, `Dienstplan gespeichert${ab > "2000-01-01" ? ` (gültig ab ${fmtD(ab)})` : ""}`);
    if (planDlg.kopie) set("modellId", m.id);
    setPlanDlg(null);
  }
  const fehler = !f.name.trim() ? "Name fehlt." : db.mitarbeiter.some(m => m.id !== f.id && m.personalnr === f.personalnr) ? "Personalnummer bereits vergeben."
    : f.austritt && f.eintritt && f.austritt < f.eintritt ? "Austritt liegt vor dem Eintritt." : f.austritt && !f.austrittArt ? "Bitte die Art der Beendigung wählen." : null;
  function speichern() {
    aendern(n => {
      const i = n.mitarbeiter.findIndex(m => m.id === f.id), alt = i >= 0 ? n.mitarbeiter[i] : null;
      const d = { ...f, urlaubstage: +f.urlaubstage || 0, urlaubStart: f.urlaubStart === "" || f.urlaubStart == null ? undefined : +f.urlaubStart, saldoStart: +f.saldoStart || 0, aktiv: !f.austritt || f.austritt >= heute() };
      if (i >= 0) n.mitarbeiter[i] = d; else n.mitarbeiter.push(d);
      n.personalLog = n.personalLog || [];
      const log = (aktion, details) => n.personalLog.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: d.id, aktion, details });
      if (!alt) { log("angelegt", `Eintritt ${fmtD(d.eintritt)} · ${modellVon(n, d).name}`); return; }
      if (!alt.austritt && d.austritt) {
        log("Austritt eingetragen", [`letzter Arbeitstag ${fmtD(d.austritt)}`, d.austrittArt, d.austrittNotiz,
          `Urlaub offen ${fmtTage(austritt.offen)} Tage (Urlaubsjahr ab ${fmtD(austritt.von)}, anteilig ${fmtTage(austritt.teil)} von ${austritt.jahresanspruch})`, `Zeitkonto ${fmtH(kontoAustritt, true)} h`].filter(Boolean).join(" · "));
        // Genehmigte/beantragte Abwesenheiten nach dem letzten Arbeitstag entfallen
        n.abwesenheiten.filter(a => a.maId === d.id && a.von > d.austritt && (wirksam(a) || a.status === "beantragt"))
          .forEach(a => { a.status = "storniert"; a.notiz = `${a.notiz ? a.notiz + " · " : ""}storniert wegen Austritt`; });
      } else if (alt.austritt && !d.austritt) log("Austritt rückgängig gemacht", `war ${fmtD(alt.austritt)} (${alt.austrittArt || "–"})`);
      else if (alt.austritt && d.austritt && (alt.austritt !== d.austritt || alt.austrittArt !== d.austrittArt)) log("Austritt geändert", `${fmtD(alt.austritt)} → ${fmtD(d.austritt)} · ${d.austrittArt}`);
      const geaendert = Object.keys(STAMM_FELDER).filter(k => String(alt[k] ?? "") !== String(d[k] ?? ""));
      if (geaendert.length) log("Stammdaten geändert", geaendert.map(k => k === "geburtsdatum" ? "Geburtsdatum geändert" : `${STAMM_FELDER[k]}: ${stammWert(n, k, alt[k])} → ${stammWert(n, k, d[k])}`).join(" · "));
    }, neu ? "Mitarbeiter/in angelegt" : f.austritt && !ma?.austritt ? "Austritt eingetragen und dokumentiert" : "Änderungen gespeichert");
    onClose();
  }
  return <Modal breit titel={neu ? "Neue/r Mitarbeiter/in" : f.name} onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!!fehler}>Speichern</Knopf></>}>
    {!neu && f.id === user.id && <div className="mb-4 space-y-3"><Hinweis>Das ist <b>dein eigenes Profil</b> (Chefin / Administratorin). Mitarbeiter/innen legst du unter „+ Neu“ oder „Import“ an – nicht hier.</Hinweis>
      {istAdmin(user) && !ctx.live && <ChefinTausch ctx={ctx} ma={ma} onClose={onClose} />}</div>}
    <div className="grid sm:grid-cols-2 gap-4">
      <Feld label="Name" hilfe={ctx.live ? "Namen ändern in der Abwesenheiten-App (Teil der Anmeldung)" : null}><input className={inputCls} value={f.name} disabled={ctx.live} onChange={e => set("name", e.target.value)} /></Feld>
      <Feld label="Personalnummer"><input className={inputCls} value={f.personalnr} onChange={e => set("personalnr", e.target.value)} /></Feld>
      <Feld label="Bereich (optional)" hilfe="Nur zum Sortieren und Filtern – kann leer bleiben.">
        <input className={inputCls} value={f.abteilung || ""} placeholder="z. B. Salon" onChange={e => set("abteilung", e.target.value)} />
        <div className="mt-1.5 flex flex-wrap gap-1.5">{[...new Set(["Salon", "Rezeption", "Ausbildung", ...db.mitarbeiter.map(m => m.abteilung).filter(Boolean)])].map(a =>

      <Feld label="Funktion"><input className={inputCls} value={f.funktion} onChange={e => set("funktion", e.target.value)} /></Feld>
      <Feld label="Eintrittsdatum"><input type="date" className={inputCls} value={f.eintritt || ""} onChange={e => set("eintritt", e.target.value)} /></Feld>

        <select className={inputCls} value={f.modellId} onChange={e => set("modellId", e.target.value)}>{db.modelle.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select>
        <div className="mt-2 flex flex-wrap gap-2">
          <Knopf klein art="sekundaer" icon="stift" onClick={() => { const m = modellVon(db, f); setPlanDlg({ modell: { ...m, plan: WT.map((_, i) => planAusModell(m, i)) } }); }}>Dienstplan & Pausen bearbeiten</Knopf>

// ─── IMPORT: Beschäftigungsstand-Liste (Excel) ───────────────────────────────
// Erwartet den bisherigen Aufbau: Name in Spalte A, darunter Eintritt bzw. „von - bis“,
// Spalte C „25 UT“ (Anspruch), Spalte D „UT 28“ (Resttage am Jahresende).
function datumAus(v) {
  if (v instanceof Date && !isNaN(v)) return datStr(new Date(v.getTime() + 12 * 3600e3)); // Zeitzonen-Puffer
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return datStr(new Date(d.getTime() + 12 * 3600e3)); }
  const m = String(v || "").trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  return m ? `${m[3]}-${pad(+m[2])}-${pad(+m[1])}` : null;
}
function leseBeschaeftigungsstand(zeilen) {
  const zahl = t => { const m = String(t ?? "").replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? +m[0] : null; };
  let jahr = null;
  zeilen.slice(0, 10).forEach(r => r.forEach(c => { if (!jahr && Number.isInteger(c) && c > 2000 && c < 2100) jahr = c; }));
  const personen = [];
  for (let i = 0; i < zeilen.length; i++) {
    const r = zeilen[i] || [], name = typeof r[0] === "string" ? r[0].trim().replace(/[,;]+$/, "") : "";
    const ut = String(r[2] ?? "");
    if (!name || !/UT/i.test(ut) || /angestellte|beschäftigungsstand/i.test(name)) continue;
    const unter = (zeilen[i + 1] || [])[0];
    let eintritt = datumAus(unter), austritt = null;
    if (!eintritt && typeof unter === "string") {
      const teile = unter.split(/\s*[-–]\s*/);
      if (teile.length === 2) { eintritt = datumAus(teile[0]); austritt = datumAus(teile[1]); }
    }
    personen.push({ name, eintritt, austritt, urlaubstage: zahl(ut), rest: zahl(r[3]), mitnehmen: true });
  }
  return { jahr, personen };
}
function ImportDialog({ ctx, onClose }) {
  const { db, user, aendern } = ctx;
  const [daten, setDaten] = useState(null);
  const [fehler, setFehler] = useState(null);
  const [laedt, setLaedt] = useState(false);
  const aktJahr = new Date().getFullYear();
  async function datei(ev) {
    const f = ev.target.files?.[0]; if (!f) return;
    setLaedt(true); setFehler(null);
    try {
      const X = await ladeXlsx();
      const wb = X.read(await f.arrayBuffer(), { type: "array", cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const d = leseBeschaeftigungsstand(X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }));
      if (!d.personen.length) throw new Error("In der Datei wurden keine Mitarbeiter/innen erkannt.");
      d.personen.forEach(p => { p.vorhanden = db.mitarbeiter.some(m => m.name.trim().toLowerCase() === p.name.toLowerCase()); p.mitnehmen = ctx.live ? p.vorhanden : p.mitnehmen && !p.vorhanden; });
      setDaten(d);
    } catch (e) { setFehler(e.message || "Datei konnte nicht gelesen werden."); }
    setLaedt(false); ev.target.value = "";
  }
  const vorjahr = daten?.jahr === aktJahr - 1;
  const gewaehlt = daten ? daten.personen.filter(p => p.mitnehmen && p.eintritt) : [];
  function uebernehmen() {
    // Echter Betrieb: Personen kommen aus der Abwesenheiten-App – hier nur Eintritt, Urlaubstage und offenen Urlaub aktualisieren
    if (ctx.live) {
      aendern(n => {
        gewaehlt.forEach(p => {
          const ma = n.mitarbeiter.find(m => m.name.trim().toLowerCase() === p.name.toLowerCase()); if (!ma) return;
          Object.assign(ma, { eintritt: p.eintritt, ...(p.urlaubstage != null ? { urlaubstage: p.urlaubstage } : {}),
            ...(daten.jahr && !p.austritt && p.rest != null ? { urlaubStart: p.rest, urlaubStartAm: `${daten.jahr + 1}-01-01` } : {}) });
          n.personalLog.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: ma.id, aktion: "aktualisiert (Import)",
            details: `aus Beschäftigungsstand ${daten.jahr ?? ""} · Eintritt ${fmtD(p.eintritt)} · ${p.urlaubstage ?? ma.urlaubstage} UT${p.rest != null && daten.jahr ? ` · offen ${p.rest} am 01.01.${daten.jahr + 1}` : ""}` });
        });
      }, `${gewaehlt.length} Mitarbeiter/innen aktualisiert`);
      onClose(); return;
    }
    aendern(n => {
      n.personalLog = n.personalLog || [];
      let nr = n.mitarbeiter.length;
      gewaehlt.forEach(p => {
        let pnr; do { nr++; pnr = `P-${String(nr).padStart(3, "0")}`; } while (n.mitarbeiter.some(m => m.personalnr === pnr));
        const ausgetreten = !!p.austritt;
        const ma = { id: uid(), name: p.name, personalnr: pnr, abteilung: "", funktion: "", eintritt: p.eintritt, modellId: n.modelle[0].id,
          urlaubstage: p.urlaubstage ?? 25, saldoStart: 0,
          ...(daten.jahr && !ausgetreten && p.rest != null ? { urlaubStart: p.rest, urlaubStartAm: `${daten.jahr + 1}-01-01` } : {}),
          vorgesetzterId: user.id, rolle: "mitarbeiter", aktiv: !ausgetreten || p.austritt >= heute() };
        if (ausgetreten) Object.assign(ma, { austritt: p.austritt, austrittArt: "Sonstiges", austrittNotiz: `aus Beschäftigungsstand ${daten.jahr ?? ""} übernommen` });
        n.mitarbeiter.push(ma);
        n.personalLog.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: ma.id, aktion: "angelegt (Import)",
          details: `aus Beschäftigungsstand ${daten.jahr ?? ""} · Eintritt ${fmtD(p.eintritt)}${ausgetreten ? ` · Austritt ${fmtD(p.austritt)}` : ""} · ${ma.urlaubstage} UT${ma.urlaubStart != null ? ` · offen ${ma.urlaubStart} Tage am ${fmtD(ma.urlaubStartAm)}` : ""}` });
      });
    }, `${gewaehlt.length} Mitarbeiter/innen übernommen`);
    onClose();
  }
  return <Modal breit titel="Mitarbeiter importieren" onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf disabled={!gewaehlt.length} onClick={uebernehmen}>{gewaehlt.length} {ctx.live ? "aktualisieren" : "übernehmen"}</Knopf></>}>
    {!daten ? <div className="space-y-4">
      <p className="text-sm text-stone-600">Wähle deine Excel-Liste „Beschäftigungsstand“ (wie für den Steuerberater). Erkannt werden Name, Eintritt bzw. „von – bis“, Urlaubsanspruch (UT) und Resttage.</p>
      <label className="flex flex-col items-center justify-center gap-2 rounded-[14px] border-2 border-dashed border-gold-300 bg-gold-50 py-10 cursor-pointer hover:border-gold-500">
        <span className="text-3xl">📄</span><span className="font-bold text-gold-700">{laedt ? "Wird gelesen …" : "Excel-Datei auswählen"}</span><span className="text-xs text-stone-500">.xlsx</span>
        <input type="file" accept=".xlsx,.xls" className="hidden" onChange={datei} />
      </label>
      {fehler && <Hinweis ton="fehler">{fehler}</Hinweis>}
      <p className="text-xs text-stone-500">Die Datei wird nur hier im Browser gelesen und nirgends hochgeladen.</p>
    </div> : <div className="space-y-4">
      <div className="text-sm">Beschäftigungsstand <b>{daten.jahr ?? "?"}</b> · {daten.personen.length} Personen erkannt</div>
      <Tabelle kopf={["", "Name", "Eintritt", "Austritt", { t: "UT", cls: "text-right" }, { t: "Rest", cls: "text-right" }, ""]}>
        {daten.personen.map((p, i) => <tr key={i} className={p.mitnehmen ? "" : "text-stone-400"}>
          <td className="px-3 py-2"><input type="checkbox" disabled={!p.eintritt || (ctx.live && !p.vorhanden)} checked={p.mitnehmen && !!p.eintritt} onChange={e => { const ps = [...daten.personen]; ps[i] = { ...p, mitnehmen: e.target.checked }; setDaten({ ...daten, personen: ps }); }} /></td>
          <td className="px-3 py-2 font-medium">{p.name}</td>
          <td className="px-3 py-2 tabular">{p.eintritt ? fmtD(p.eintritt) : <span className="text-rose-700">nicht erkannt</span>}</td>
          <td className="px-3 py-2 tabular">{p.austritt ? fmtD(p.austritt) : "–"}</td>
          <td className="px-3 py-2 text-right tabular">{p.urlaubstage ?? "–"}</td>
          <td className="px-3 py-2 text-right tabular">{p.rest ?? "–"}</td>
          <td className="px-3 py-2 text-xs">{ctx.live ? (p.vorhanden ? <span className="text-emerald-700">wird aktualisiert</span> : <span className="text-amber-700">nicht in der Abwesenheiten-App – dort zuerst anlegen</span>)
            : p.vorhanden ? <span className="text-amber-700">schon vorhanden</span> : p.austritt ? "wird als ausgetreten angelegt" : ""}</td>
        </tr>)}
      </Tabelle>
      {daten.jahr ? <Hinweis>Die Resttage werden als <b>offener Urlaub am 01.01.{daten.jahr + 1}</b> übernommen. Danach genommenen Urlaub bitte als Urlaub nachtragen{vorjahr ? "" : ` (die Liste ist von ${daten.jahr})`} – der neue Anspruch kommt jeweils am Jahrestag des Eintritts dazu.</Hinweis>
        : <Hinweis ton="warn">Kein Jahr erkannt – die Resttage werden nicht übernommen. Offenen Urlaub bitte je Person eintragen.</Hinweis>}
      <p className="text-xs text-stone-500">{ctx.live ? "Übernommen werden Eintritt, Urlaubstage und offener Urlaub. Namen müssen genau wie in der Abwesenheiten-App geschrieben sein." : `Dienstplan: „${db.modelle[0]?.name}“, Personalnummern werden vergeben. Funktion, Geburtsdatum (Lehrlinge) usw. danach je Person ergänzen.`}</p>
    </div>}
  </Modal>;
}

function Kalender({ ctx }) {
  const { db, sichtbar, user } = ctx;
  const [monat, setMonat] = useState(monatKey(heute()));
  // Teamkalender: alle Aktiven sehen genehmigte Abwesenheiten aller (ohne Art bei Krankenstand für Nicht-Leitung)
  const team = (istLeitung(user) ? sichtbar : db.mitarbeiter).filter(m => m.aktiv || tageImMonat(monat).some(d => beschaeftigt(m, d)));
  const tage = tageImMonat(monat), h = heute();
  const leitung = istLeitung(user);
  const zelle = (m, d) => {
    if (!beschaeftigt(m, d)) return { cls: "bg-stone-100", t: "" };
    const a = abwAm(db, m.id, d), b = abwAntragAm(db, m.id, d);
    const frei = !modellSollMin(db, m, d) || feiertag(d);
    if (a) {
      // Im Team ist bekannt, wer krank, auf Urlaub oder beim Arzt ist → für alle sichtbar
      const teil = teilTag(a);
      return { cls: `${teil ? ARTEN[a.art].hell : ARTEN[a.art].voll} ${frei ? "opacity-40" : ""}`, t: ARTEN[a.art].kurz + (anteil(a) < 1 ? "½" : ""), title: ARTEN[a.art].label + (teil ? ` (${abwZusatz(a)})` : "") };
    }
    if (b && (leitung || m.id === user.id)) return { cls: `${ARTEN[b.art].hell} streifen`, t: "?", title: `${ARTEN[b.art].label} beantragt` };
    if (frei) return { cls: "bg-stone-100", t: "" };
    return { cls: "", t: "" };
  };
  return <div className="space-y-5">
    <Seitenkopf titel="Teamkalender" sub="Urlaub, Krankenstand und Abwesenheiten auf einen Blick">
      <MonatWahl monat={monat} setMonat={setMonat} />
    </Seitenkopf>
    <Karte innen="p-0">
      <div className="overflow-x-auto">
        <table className="text-xs border-separate border-spacing-0 w-full">
          <thead><tr>
            <th className="sticky left-0 z-10 bg-white text-left px-3 py-2 font-medium text-stone-500 border-b border-stone-200 min-w-[9rem]">Mitarbeiter/in</th>
            {tage.map(d => { const ft = feiertag(d); return <th key={d} title={ft?.name} className={`px-0 py-1.5 font-medium border-b border-stone-200 min-w-[1.9rem] ${ft ? "text-rose-600" : wd(d) >= 5 ? "text-stone-400" : "text-stone-500"} ${d === h ? "bg-amber-100" : ""}`}>
              <div>{WT[wd(d)].slice(0, 2)}</div><div className="tabular text-stone-800 font-semibold">{parseInt(d.slice(8))}</div></th>; })}
          </tr></thead>
          <tbody>
            {team.map(m => <tr key={m.id}>
              <td className="sticky left-0 z-10 bg-white px-3 py-1.5 border-b border-stone-100 whitespace-nowrap font-medium text-stone-800">{m.name}</td>
              {tage.map(d => { const z = zelle(m, d); return <td key={d} className={`border-b border-l border-stone-100 p-0.5 ${d === h ? "bg-amber-50" : ""}`}>
                <div title={z.title} className={`h-7 rounded flex items-center justify-center font-semibold ${z.cls}`}>{z.t}</div></td>; })}
            </tr>)}
            <tr><td className="sticky left-0 bg-white px-3 py-1.5 text-stone-500">Abwesend</td>
              {tage.map(d => { const n = team.filter(m => abwAm(db, m.id, d) && modellSollMin(db, m, d) && !feiertag(d)).length; return <td key={d} className={`text-center py-1.5 tabular font-medium ${n >= 3 ? "text-rose-700" : "text-stone-500"}`}>{n || ""}</td>; })}</tr>
          </tbody>
        </table>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-2 px-5 py-3 border-t border-stone-100 text-xs text-stone-600">
        {Object.entries(ARTEN).map(([k, a]) => <span key={k} className="inline-flex items-center gap-1.5"><span className={`w-4 h-4 rounded text-[9px] font-bold flex items-center justify-center ${a.voll}`}>{a.kurz}</span>{a.label}</span>)}
        <span className="inline-flex items-center gap-1.5"><span className="w-5 h-4 rounded text-[9px] font-bold flex items-center justify-center bg-indigo-100 text-indigo-800">BS½</span>halber Tag</span>
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-amber-100 streifen" />beantragt</span>
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-stone-100 ring-1 ring-stone-200" />frei / Schließtag / Feiertag</span>
      </div>
    </Karte>

      <ul className="grid sm:grid-cols-2 lg:grid-cols-3 text-sm">
        {feiertage(parseInt(monat)).map(f => <li key={f.datum} className={`px-5 py-2 flex justify-between gap-2 border-b border-stone-100 ${f.datum < h ? "text-stone-400" : ""}`}><span>{f.name}</span><span className="tabular">{fmtDk(f.datum)}</span></li>)}
      </ul>
    </Karte>
  </div>;
}

// Dateiname im ZIP: „P-003 Julia Pichler/2026-09-15_Krankenstand_1.jpg“
function belegDateinamen(m, a) {
  const ordner = `${m.personalnr || ""} ${m.name}`.trim().replace(/[\\/:*?"<>|]/g, "");
  return (a.dateien || []).map((d, i) => `${ordner}/${a.von}_${ARTEN[a.art].label.replace(/[^\wÄÖÜäöüß-]+/g, "-")}_${i + 1}.${(d.name.split(".").pop() || "dat").toLowerCase()}`);
}

// Arbeitszeitnachweise aller Personen eines Monats – je Person eine Seite
// ISO-Kalenderwoche
function kalenderWoche(d) {
  const t = parseD(d); t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}
// Monatlicher Zeitbericht je Person (Aufbau wie der bisherige Zeitbericht des Salons):
// Kopf, Tage nach Wochen mit Zwischensummen, Monatssumme, Urlaub, Zeitkonto, Abwesenheiten
function DruckNachweise({ db, liste, monat }) {
  const tage = tageImMonat(monat), bisD = tage[tage.length - 1] < heute() ? tage[tage.length - 1] : heute();
  const jetzt = new Date();
  const th = "py-1 font-semibold", num = "text-right tabular";
  return <div className="druck-bereich">
    {liste.map((m, idx) => {
      const ab = abschlussVon(db, m.id, monat);
      const zeilen = tage.filter(d => beschaeftigt(m, d)).map(d => tagInfo(db, m, d))
        .filter(t => t.soll > 0 || t.z || t.a || (t.ft && modellSollMin(db, m, t.d) > 0));
      const wochen = [];
      zeilen.forEach(t => { const kw = kalenderWoche(t.d); let w = wochen[wochen.length - 1]; if (!w || w.kw !== kw) wochen.push(w = { kw, tage: [] }); w.tage.push(t); });
      const sum = ts => ts.reduce((s, t) => { if (t.zaehlt) { s.soll += t.soll; s.erf += t.ist + t.gut; s.saldo += t.saldo; } return s; }, { soll: 0, erf: 0, saldo: 0 });
      const gesamt = sum(zeilen);
      // Abwesenheiten im Monat (Arbeitstage laut Dienstplan)
      const abw = { urlaub: 0, krank: 0, bezahlt: 0, unbezahlt: 0 };
      zeilen.forEach(t => { if (!t.a || modellSollMin(db, m, t.d) <= 0 || ARTEN[t.a.art].stunden) return;
        const x = anteil(t.a), art = t.a.art;
        if (art === "urlaub") abw.urlaub += x; else if (KRANK_ARTEN.includes(art)) abw.krank += x; else if (ARTEN[art].gutschrift) abw.bezahlt += x; else abw.unbezahlt += x; });
      const arztMin = zeilen.reduce((s, t) => s + (t.a && ARTEN[t.a.art].stunden ? t.gut : 0), 0);
      const uk = urlaubsKonto(db, m, bisD);
      const kontoVorher = zeitkonto(db, m, addTage(tage[0], -1)), kontoJetzt = zeitkonto(db, m, bisD);
      const plan = WT.map((t, i) => { const x = planAusModell(modellVon(db, m), i, tage[0]); return x ? `${t} ${x.b}–${x.e}${x.p ? ` (${pauseTxt(x)})` : ""}` : null; }).filter(Boolean).join(" · ");
      const code = t => [t.ft && t.ft.name, t.a ? `${ARTEN[t.a.art].kurz} ${ARTEN[t.a.art].label}${teilTag(t.a) ? ` (${abwZusatz(t.a)})` : ""}` : null,
        t.z?.auto?.length ? `auto: ${t.z.auto.map(x => AUTO_TEXT[x]).join(", ")}` : null,
        t.z?.quelle === "korrektur" || t.z?.quelle === "manuell" ? "korrigiert" : null,
        t.z?.roh ? `gestempelt ${t.z.roh.beginn || t.z.beginn}–${t.z.roh.ende || t.z.ende || ""}, gerundet` : null, t.z?.notiz || null].filter(Boolean).join(" · ");
      return <div key={m.id} className={idx < liste.length - 1 ? "seitenumbruch" : ""} style={{ fontSize: 9.5 }}>
        <div className="text-center text-[15px] font-bold tracking-wide">Zeitbericht</div>
        <div className="flex justify-between border-b border-stone-500 pb-1 mb-2 text-[10px]">
          <span className="font-semibold">{db.einstellungen.firmenname}</span>
          <span>{fmtD(tage[0])} – {fmtD(tage[tage.length - 1])}</span>
        </div>
        <div className="grid grid-cols-[auto_1fr_auto_1fr] gap-x-3 gap-y-0.5 mb-2 text-[9.5px]">
          <span className="text-stone-500">Name:</span><b>{m.name}</b>
          <span className="text-stone-500">Bereich:</span><span>{m.abteilung || "–"}</span>
          <span className="text-stone-500">Mitarbeiternr.:</span><span>{m.personalnr || "–"}</span>
          <span className="text-stone-500">Funktion:</span><span>{m.funktion || "–"}</span>
          <span className="text-stone-500">Dienstplan:</span><span className="col-span-3">{modellVon(db, m).name}{plan ? ` – ${plan}` : ""}</span>
        </div>
        <table className="w-full" style={{ fontSize: 9 }}>
          <thead><tr className="text-left border-y border-stone-500"><th className={th}>Datum</th><th className={th}>Tag</th><th className={th}>Hinein</th><th className={th}>Hinaus</th><th className={`${th} text-right`}>Pause</th>
            <th className={`${th} text-right`}>Geplant</th><th className={`${th} text-right`}>Erfüllt</th><th className={`${th} text-right`}>Saldo</th><th className={`${th} pl-3`}>Kommentar / Code</th></tr></thead>
          {wochen.map(w => { const s = sum(w.tage); return <tbody key={w.kw}>
            <tr><td colSpan={9} className="pt-1.5 font-semibold text-stone-600">Woche {w.kw}</td></tr>
            {w.tage.map(t => <tr key={t.d} className="border-b border-stone-100">
              <td className="py-[1px] tabular">{t.d.slice(8)}.{t.d.slice(5, 7)}.</td><td>{WT[wd(t.d)]}</td><td className="tabular">{t.z?.beginn || ""}</td><td className="tabular">{t.z?.ende || ""}</td>
              <td className={num}>{t.z ? `${t.z.pause}′` : ""}</td><td className={num}>{t.soll ? fmtH(t.soll) : ""}</td>
              <td className={num}>{t.z || t.gut ? fmtH(t.ist + t.gut) : ""}</td><td className={num}>{t.zaehlt && (t.soll || t.ist || t.gut) ? fmtH(t.saldo, true) : ""}</td>
              <td className="pl-3">{code(t)}</td></tr>)}
            <tr className="font-semibold"><td colSpan={5} /><td className={`${num} border-t border-stone-400`}>{fmtH(s.soll)}</td><td className={`${num} border-t border-stone-400`}>{fmtH(s.erf)}</td><td className={`${num} border-t border-stone-400`}>{fmtH(s.saldo, true)}</td><td /></tr>
          </tbody>; })}
          <tbody><tr className="font-bold text-[10px]"><td colSpan={5} className="pt-2">Summe {fmtMonat(monat)}</td><td className={`${num} pt-2 border-t-2 border-stone-600`}>{fmtH(gesamt.soll)}</td><td className={`${num} pt-2 border-t-2 border-stone-600`}>{fmtH(gesamt.erf)}</td><td className={`${num} pt-2 border-t-2 border-stone-600`}>{fmtH(gesamt.saldo, true)}</td><td /></tr></tbody>
        </table>
        <div className="mt-3 grid grid-cols-3 gap-3 text-[9.5px]">
          <div className="border border-stone-300 rounded p-2"><div className="font-bold mb-1">Urlaub (Tage)</div>
            <div className="text-stone-500 mb-0.5">Urlaubsjahr {fmtD(uk.von)} – {fmtD(uk.bis)}</div>
            {uk.imStart ? <div className="flex justify-between"><span>Offen am {fmtD(uk.ab)} (Startbestand)</span><b>{fmtTage(uk.uebertrag)}</b></div> : <>
              <div className="flex justify-between"><span>Anspruch{uk.anteilig ? " (anteilig)" : ""}</span><b>{fmtTage(uk.anspruch)}</b></div>
              {uk.uebertrag ? <div className="flex justify-between"><span>Rest aus Vorjahr</span><span>{fmtTage(uk.uebertrag)}</span></div> : null}</>}
            <div className="flex justify-between"><span>Verbraucht bis heute</span><span>{fmtTage(uk.konsumiert)}</span></div>
            <div className="flex justify-between"><span>Dieser Monat</span><span>{fmtTage(abw.urlaub)}</span></div>
            {uk.geplant ? <div className="flex justify-between"><span>Schon eingeplant</span><span>{fmtTage(uk.geplant)}</span></div> : null}
            <div className="flex justify-between border-t border-stone-300 mt-0.5 pt-0.5"><span>Offen</span><b>{fmtTage(uk.rest)}</b></div></div>
          <div className="border border-stone-300 rounded p-2"><div className="font-bold mb-1">Zeitkonto (Stunden)</div>
            <div className="flex justify-between"><span>Stand vorher</span><span>{fmtH(kontoVorher, true)}</span></div>
            <div className="flex justify-between"><span>Dieser Monat</span><span>{fmtH(gesamt.saldo, true)}</span></div>
            <div className="flex justify-between border-t border-stone-300 mt-0.5 pt-0.5"><span>Gesamtsaldo</span><b>{fmtH(kontoJetzt, true)}</b></div></div>
          <div className="border border-stone-300 rounded p-2"><div className="font-bold mb-1">Abwesenheiten (Arbeitstage)</div>
            <div className="flex justify-between"><span>Urlaub</span><span>{fmtTage(abw.urlaub)}</span></div>
            <div className="flex justify-between"><span>Krankenstand / Unfall</span><span>{fmtTage(abw.krank)}</span></div>
            <div className="flex justify-between"><span>Sonstige bezahlt</span><span>{fmtTage(abw.bezahlt)}</span></div>
            <div className="flex justify-between"><span>Unbezahlt</span><span>{fmtTage(abw.unbezahlt)}</span></div>
            {arztMin > 0 && <div className="flex justify-between"><span>Arztbesuche</span><span>{fmtH(arztMin)} h</span></div>}</div>
        </div>
        <div className="mt-2 text-stone-600 text-[9px]">{ab?.bestaetigtAm ? `Von Mitarbeiter/in bestätigt am ${fmtD(ab.bestaetigtAm)}. ` : ""}{ab?.abgeschlossenAm ? `Abgeschlossen am ${fmtD(ab.abgeschlossenAm)} von ${nameVon(db, ab.abgeschlossenVon)}.` : "Monat noch nicht abgeschlossen."} Arbeitszeitaufzeichnung gem. § 26 AZG{jugendlich(m, tage[0]) ? " · unter 18: KJBG" : ""}.</div>
        {db.einstellungen.pdfUnterschrift && <div className="flex justify-between gap-10 mt-10">
          <div className="flex-1 border-t border-stone-500 pt-1">Datum, Unterschrift Mitarbeiter/in</div>
          <div className="flex-1 border-t border-stone-500 pt-1">Datum, Unterschrift Arbeitgeber/in</div>
        </div>}
        <div className="mt-3 flex justify-between text-[8.5px] text-stone-500"><span>Erstellt am {fmtD(heute())} um {pad(jetzt.getHours())}:{pad(jetzt.getMinutes())}</span><span>Blatt {idx + 1} / {liste.length}</span></div>
      </div>; })}
  </div>;
}

// Salon-WLAN (echter Betrieb): die öffentliche IP des Salon-Anschlusses merkt sich der Server
function SalonWlan({ ctx }) {
  const { sb, user } = ctx;
  const [netze, setNetze] = useState([]), [status, setStatus] = useState(null), [fehl, setFehl] = useState(null);
  const holen = () => Promise.all([sbq(sb.rpc("zeit_salon_netze_liste")).then(setNetze), sbq(sb.rpc("zeit_stempel_status")).then(setStatus)]).catch(e => setFehl(e.message));
  useEffect(() => { holen(); }, []);
  const tu = p => p.then(holen).catch(e => setFehl(e.message));
  return <div className="mt-4 rounded-xl border border-stone-200 p-3 text-sm space-y-2">
    <div className="font-medium">Salon-WLAN</div>
    {netze.length ? <ul className="text-xs text-stone-600">{netze.map(n => <li key={n.ip} className="flex justify-between gap-2"><span>{n.name} · {n.ip}</span>{istAdmin(user) && <button className="text-rose-700 underline" onClick={() => tu(sbq(sb.rpc("zeit_salon_netz_entfernen", { p_ip: n.ip })))}>entfernen</button>}</li>)}</ul>
      : <p className="text-rose-700 text-xs font-medium">Noch kein Salon-WLAN gemerkt – solange kann am Handy niemand stempeln.</p>}
    {status && <p className="text-xs">{status.im_salon_netz ? "✓ Dieses Gerät ist gerade im Salon-WLAN." : "Dieses Gerät ist gerade nicht im gemerkten Salon-WLAN."}</p>}
    {istAdmin(user) && <button className="rounded-full bg-stone-900 text-white text-sm font-semibold px-4 py-2" onClick={() => tu(sbq(sb.rpc("zeit_salon_netz_merken", { p_name: "Salon-WLAN" })))}>📶 Ich bin im Salon-WLAN – merken</button>}
    <p className="text-xs text-stone-500">Im Salon mit dem Salon-WLAN verbunden tippen. Wechselt der Internetanbieter die Adresse, einfach nochmal tippen.</p>
    {fehl && <Hinweis ton="fehler">{fehl}</Hinweis>}
  </div>;
}

// Außentermine: an diesen Tagen darf die Person überall am Handy stempeln (z. B. Hochzeit)
function AussenTermine({ ctx }) {
  const { db, user, aendern } = ctx;
  const admin = istAdmin(user);
  const aktive = db.mitarbeiter.filter(m => m.aktiv);
  const [f, setF] = useState({ maId: aktive[0]?.id || "", datum: heute(), notiz: "" });
  const liste = (db.aussentermine || []).filter(x => x.datum >= addTage(heute(), -30)).sort((a, b) => a.datum.localeCompare(b.datum));
  const doppelt = !!aussenterminAm(db, f.maId, f.datum);
  function hinzu() {
    aendern(n => {
      (n.aussentermine = n.aussentermine || []).push({ id: uid(), maId: f.maId, datum: f.datum, notiz: f.notiz.trim(), von: user.id });
      n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: f.maId, datum: f.datum, aktion: "Außentermin freigegeben", alt: null, neu: null, grund: f.notiz.trim() || "Außentermin" });
    }, "Außentermin eingetragen");
    setF({ ...f, notiz: "" });
  }
  function weg(x) {
    aendern(n => {
      n.aussentermine = n.aussentermine.filter(q => q.id !== x.id);
      n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: x.maId, datum: x.datum, aktion: "Außentermin entfernt", alt: null, neu: null, grund: x.notiz || "Außentermin" });
    }, "Außentermin entfernt");
  }
  return <div className="mt-5 border-t border-stone-100 pt-4">
    <div className="text-sm font-semibold">🚗 Außentermine</div>
    <p className="text-xs text-stone-500 mt-0.5">Für einen einzelnen Tag darf die Person überall am Handy stempeln – z. B. Hochzeit. Alle anderen Tage bleiben wie oben eingestellt.</p>
    {liste.length > 0 && <ul className="mt-3 divide-y divide-stone-100 rounded-xl border border-stone-200 text-sm">
      {liste.map(x => <li key={x.id} className="flex items-center gap-3 px-3 py-2">
        <span className="tabular w-24">{fmtDk(x.datum)}</span><span className="font-medium flex-1 min-w-0 truncate">{nameVon(db, x.maId)}{x.notiz ? <span className="font-normal text-stone-500"> · {x.notiz}</span> : null}</span>
        {admin && <button className="text-xs text-rose-700 hover:underline" onClick={() => weg(x)}>entfernen</button>}
      </li>)}
    </ul>}
    {admin && <div className="mt-3 grid sm:grid-cols-[1fr_auto_1fr_auto] gap-2 items-end">
      <Feld label="Mitarbeiter/in"><select className={inputCls} value={f.maId} onChange={e => setF({ ...f, maId: e.target.value })}>{aktive.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></Feld>
      <Feld label="Tag"><input type="date" className={inputCls} value={f.datum} onChange={e => setF({ ...f, datum: e.target.value })} /></Feld>
      <Feld label="Wofür (optional)"><input className={inputCls} placeholder="z. B. Hochzeit Brautstyling" value={f.notiz} onChange={e => setF({ ...f, notiz: e.target.value })} /></Feld>
      <Knopf onClick={hinzu} disabled={!f.maId || !f.datum || doppelt}>Freigeben</Knopf>
    </div>}
    {doppelt && <p className="mt-1 text-xs text-stone-500">Für diesen Tag ist schon ein Außentermin eingetragen.</p>}
  </div>;
}

          {minFeld("kjbgTagMaxMin", "Tageshöchstarbeitszeit", "§ 11 KJBG: 8 h (9 h bei Verteilung)")}

          <p className="mt-2 text-xs text-stone-500">Wien: 1. Lehrjahr 1,5 Tage, 2. und 3. Lehrjahr 1 Tag. Berufsschulzeit wird nach KJBG auf die Arbeitszeit angerechnet. Planen unter „Krankenstand → Berufsschule planen“.</p>

          <Feld label="Überstundenzuschlag %" hilfe="§ 10 AZG: 50 %"><input type="number" className={inputCls} disabled={!admin} value={e.zuschlagUeberstunden} onChange={ev => setE("zuschlagUeberstunden", +ev.target.value)} /></Feld>

          <Feld label="Kollektivvertrag" breit><input className={inputCls} disabled={!admin} value={e.kollektivvertrag} onChange={ev => setE("kollektivvertrag", ev.target.value)} /></Feld>

      <Karte titel="Rollen & Berechtigungen" innen="p-0">

          {[
            ["Eigene Zeiten stempeln & ansehen", 1, 1, 1],
            ["Korrektur der eigenen Zeit beantragen", 1, 1, 1],
            ["Zeiten des eigenen Teams ändern (mit Grund)", 1, 1, 0],
            ["Urlaub/Abwesenheit des Teams genehmigen", 1, 1, 0],

          ].map(([t, ...r]) => <tr key={t}><td className="px-3 py-2">{t}</td>{r.map((x, i) => <td key={i} className="px-3 py-2 text-center">{x ? <Icon n="haken" className="w-4 h-4 inline text-emerald-600" /> : <span className="text-stone-300">–</span>}</td>)}</tr>)}
        </Tabelle>
        <p className="px-5 py-3 text-xs text-stone-500">Vorgesetzte genehmigen nur für Personen, bei denen sie als Vorgesetzte/r eingetragen sind – nie für sich selbst. In der Live-Version setzt die Datenbank (RLS) das durch.</p>

    {admin && !ctx.live && <Karte titel="Testdaten">
      <p className="text-sm text-stone-600">Alle Daten liegen nur in diesem Browser. {db.eigeneDaten ? "Du testest mit deinen eigenen Mitarbeiter/innen." : "Derzeit erfundene Demo-Daten."} Mit „Sichern“ und „Laden“ nimmst du die Testdaten auf ein anderes Gerät mit.</p>
      <div className="mt-4 flex flex-wrap gap-2">
        <Knopf art="sekundaer" icon="download" onClick={async () => {
          // Belege als Data-URL mitsichern, damit sie auf dem anderen Gerät auch da sind
          const belege = {};
          for (const meta of db.abwesenheiten.flatMap(a => a.dateien || [])) {
            const blob = await BelegSpeicher.get(meta.id).catch(() => null);
            if (blob) belege[meta.id] = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
          }
          const url = URL.createObjectURL(new Blob([JSON.stringify({ ...db, _belege: belege })], { type: "application/json" }));
          const a = document.createElement("a"); a.href = url; a.download = `zeitverwaltung_testdaten_${heute()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
        }}>Testdaten sichern</Knopf>
        <label className="inline-flex items-center justify-center gap-1.5 rounded-full font-semibold text-[13px] px-4 py-2 bg-white text-stone-900 ring-1 ring-inset ring-stone-200 hover:ring-gold-500 cursor-pointer">
          <Icon n="plus" className="w-4 h-4" />Testdaten laden
          <input type="file" accept=".json,application/json" className="hidden" onChange={ev => {
            const datei = ev.target.files?.[0]; if (!datei) return;
            datei.text().then(t => { const n = JSON.parse(t); if (n?.version !== 1 || !Array.isArray(n.mitarbeiter)) throw new Error();
              if (!confirm(`Testdaten vom Gerät laden? (${n.mitarbeiter.length} Personen) – die aktuellen Daten in diesem Browser werden ersetzt.`)) return;
              const { _belege, ...rest } = n;
              Promise.all(Object.entries(_belege || {}).map(([id, durl]) => BelegSpeicher.put(id, dataUrlZuBlob(durl))))
                .catch(() => alert("Einige Bestätigungen konnten nicht übernommen werden."))
                .finally(() => setDb({ ...rest, einstellungen: { ...STANDARD_EINSTELLUNGEN, ...rest.einstellungen } }));
            }).catch(() => alert("Diese Datei ist keine Sicherung der Zeitverwaltung."));
            ev.target.value = "";
          }} />

        <Knopf art="geist" onClick={() => { if (confirm("Erfundene Demo-Daten laden? Alle Daten in diesem Browser werden ersetzt.")) setDb(demoDaten()); }}>Demo-Daten laden</Knopf>
      </div>
      <p className="mt-3 text-xs text-stone-500">Die Sicherungsdatei enthält Personaldaten – nicht weitergeben, nach dem Test löschen.</p>
    </Karte>}
    {modellNeu && <ModellDialog db={db} neu={!db.modelle.some(x => x.id === modellNeu.id)} modell={modellNeu} oz={e.oeffnungszeiten} onSave={modellSpeichern} onClose={() => setModellNeu(null)} />}
  </div>;
}
function ModellDialog({ db, modell, oz, neu, onSave, onClose }) {
  const [m, setM] = useState(modell);
  const [ab, setAb] = useState(`${monatKey(heute())}-01`);
  const setTag = (i, t) => { const plan = [...m.plan]; plan[i] = t; setM({ ...m, plan }); };
  const summe = m.plan.reduce((s, t) => s + planStunden(t), 0);
  const nutzer = db.mitarbeiter.filter(x => x.modellId === modell.id);
  // Änderungen dürfen nicht in schon abgeschlossene Monate hineinreichen
  const gesperrtAb = !neu && db.abschluesse.some(a => a.abgeschlossenAm && a.monat >= monatKey(ab || "0000") && nutzer.some(x => x.id === a.maId));
  const fehler = !m.name.trim() ? "Bezeichnung fehlt." : !neu && !ab ? "Gültig-ab-Datum fehlt." : gesperrtAb ? "Ab diesem Datum sind schon Monate abgeschlossen – bitte ein späteres Datum wählen (oder den Monat zuerst wieder öffnen)." : null;
  return <Modal breit titel={neu ? "Neuer Dienstplan" : "Dienstplan & Pausen bearbeiten"} onClose={onClose} fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={() => onSave(mitStunden(m), neu ? "2000-01-01" : ab)} disabled={!!fehler}>Speichern</Knopf></>}>
    <div className="space-y-4">
      <div className="grid sm:grid-cols-2 gap-4">
        <Feld label="Bezeichnung"><input className={inputCls} value={m.name} onChange={e => setM({ ...m, name: e.target.value })} /></Feld>
        {!neu && <Feld label="Gültig ab" hilfe="Tage davor bleiben beim alten Plan"><input type="date" className={inputCls} value={ab} onChange={e => setAb(e.target.value)} /></Feld>}
      </div>
      <div className="space-y-1.5">
        {WT_LANG.map((t, i) => { const p = m.plan[i]; return <div key={i} className="flex flex-wrap items-center gap-2">
          <label className="flex items-center gap-2 w-32 text-sm font-semibold"><input type="checkbox" checked={!!p} onChange={e => setTag(i, e.target.checked ? (oz?.[i] ? { b: oz[i].b, e: oz[i].e, p: 60 } : { b: "09:00", e: "18:00", p: 60 }) : null)} />{t}</label>
          {p ? <>
            <input type="time" className={`${inputKlein} py-1.5`} value={p.b} onChange={e => setTag(i, { ...p, b: e.target.value })} />
            <span className="text-stone-400">–</span>
            <input type="time" className={`${inputKlein} py-1.5`} value={p.e} onChange={e => setTag(i, { ...p, e: e.target.value })} />
            <span className="text-xs text-stone-500 ml-1">Pause</span>
            <input type="number" min="0" step="5" className={`${inputKlein} py-1.5 w-16`} value={p.p} onChange={e => setTag(i, { ...p, p: +e.target.value })} />
            <span className="text-xs text-stone-500">min{+p.p > 0 && " ab"}</span>
            {+p.p > 0 && <input type="time" className={`${inputKlein} py-1.5`} value={p.pb || ""} title="Fixe Pausenzeit (optional)" onChange={e => setTag(i, { ...p, pb: e.target.value || undefined })} />}
            <span className="text-xs text-stone-500">· <b className="text-stone-800">{fmtTage(planStunden(p))} h</b></span>
            {ausserhalbOeffnung(oz, i, p) && <span className="text-xs text-amber-700">außerhalb Öffnungszeit{oz?.[i] ? ` (${oz[i].b}–${oz[i].e})` : " (geschlossen)"}</span>}
          </> : <span className="text-xs text-stone-400">frei</span>}
        </div>; })}
      </div>
      <p className="text-xs text-stone-500">„Pause ab“ ist optional: Habt ihr fixe Pausenzeiten (z. B. 11:30–12:30), hier den Beginn eintragen – sie stehen dann im Dienstplan, im Zeitbericht und in der Pausen-Vereinbarung. Hat jede Person eine andere Pausenzeit: im Profil der Person auf „Eigener Plan für diese Person“ tippen – sonst gilt die Pause für alle mit diesem Plan.</p>
      <div className="text-sm">Summe: <b>{fmtTage(summe)} h/Woche</b>{nutzer.length > 0 && <span className="text-stone-500"> · gilt für {nutzer.map(x => x.name.split(" ")[0]).join(", ")}</span>}</div>
      {modell.versionen?.length > 1 && <div className="text-xs text-stone-500">Bisherige Versionen: {modell.versionen.map(v => `ab ${fmtD(v.ab)} (${fmtTage(v.plan.reduce((s, t) => s + planStunden(t), 0))} h)`).join(" · ")}</div>}
      {fehler && <p className="text-xs text-rose-700">{fehler}</p>}
    </div>
  </Modal>;
}

// ─── EINFACHE ANSICHT FÜR MITARBEITER/INNEN (wie das bisherige System) ───────
// Nur drei Reiter: Heute (Stempeln), Meine Zeiten, Urlaub & Krank. Chefin/Leitung: volle Ansicht.
function MeineZeiten({ ctx }) {
  const { db, user, aendern } = ctx;
  const [monat, setMonat] = useState(monatKey(heute()));
  const [dialog, setDialog] = useState(null);
  const h = heute(), tage = tageImMonat(monat).filter(d => d <= h && beschaeftigt(user, d));
  const zeilen = tage.map(d => tagInfo(db, user, d)).filter(t => t.soll > 0 || t.z || t.a).reverse();
  const sm = tage.length ? summe(db, user, tage[0], tage[tage.length - 1]) : { soll: 0, ist: 0, gut: 0, saldo: 0 };
  const konto = zeitkonto(db, user, addTage(h, -1));
  const ab = abschlussVon(db, user.id, monat);
  const vorbei = monat < monatKey(h);
  const offeneKorr = db.korrekturen.filter(k => k.maId === user.id && k.status === "offen");
  function bestaetigen() { aendern(n => { let x = n.abschluesse.find(a => a.maId === user.id && a.monat === monat); if (!x) { x = { maId: user.id, monat }; n.abschluesse.push(x); } x.bestaetigtAm = heute(); }, "Danke – Monat bestätigt"); }
  return <div className="space-y-4">
    <div className="flex items-center justify-between">
      <button className="p-2 rounded-full hover:bg-white text-xl" onClick={() => setMonat(monatVerschieben(monat, -1))} aria-label="Monat zurück">‹</button>
      <div className="text-lg font-bold capitalize">{fmtMonat(monat)}</div>
      <button className="p-2 rounded-full hover:bg-white text-xl disabled:opacity-30" disabled={monat >= monatKey(h)} onClick={() => setMonat(monatVerschieben(monat, 1))} aria-label="Monat vor">›</button>
    </div>
    <div className="grid grid-cols-3 gap-2 text-center">
      <div className="bg-white rounded-[14px] border border-stone-200 py-3"><div className="text-lg font-bold tabular">{fmtH(sm.ist + sm.gut)}</div><div className="text-[11px] text-stone-500">gearbeitet</div></div>
      <div className="bg-white rounded-[14px] border border-stone-200 py-3"><div className="text-lg font-bold tabular">{fmtH(sm.soll)}</div><div className="text-[11px] text-stone-500">geplant</div></div>
      <div className="bg-white rounded-[14px] border border-stone-200 py-3"><div className={`text-lg font-bold tabular ${konto < 0 ? "text-rose-700" : "text-emerald-700"}`}>{fmtH(konto, true)}</div><div className="text-[11px] text-stone-500">Zeitkonto</div></div>
    </div>
    {vorbei && !ab?.bestaetigtAm && !ab?.abgeschlossenAm && zeilen.length > 0 && <div className="rounded-[14px] bg-amber-50 border border-amber-200 p-4 text-sm">
      <p>Bitte schau deine Zeiten im {fmtMonat(monat)} durch. Stimmt alles?</p>
      <div className="mt-3"><Knopf icon="haken" onClick={bestaetigen}>Ja, Zeiten bestätigen</Knopf></div></div>}
    {ab?.bestaetigtAm && <p className="text-xs text-emerald-700 text-center">✓ Von dir bestätigt am {fmtD(ab.bestaetigtAm)}</p>}
    {offeneKorr.length > 0 && <p className="text-xs text-amber-700 text-center">{offeneKorr.length} Änderungswunsch{offeneKorr.length === 1 ? "" : "e"} wartet auf die Chefin.</p>}
    <div className="bg-white rounded-[14px] border border-stone-200 divide-y divide-stone-100">
      {zeilen.length === 0 ? <p className="p-5 text-sm text-stone-500 text-center">Noch keine Einträge in diesem Monat.</p> :
      zeilen.map(t => <button key={t.d} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-stone-50" onClick={() => !gesperrt(db, user.id, t.d) && setDialog(t.d)}>
