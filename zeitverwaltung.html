        <div className="text-sm text-stone-400">{s.text}</div>
      </button>; })}
    </div>
    <div className="px-6 py-4 flex items-center justify-between text-xs text-stone-500">
      <span>Demo ohne PIN. Live: persönliche PIN, vom Server geprüft · Uhrzeit vom Server</span>
      <button onClick={onEnde} className="underline hover:text-stone-300">Tablet-Modus beenden</button>
    </div>
    {m && <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-40" onClick={() => setWahl(null)}>
      <div className="bg-stone-50 text-stone-900 rounded-[22px] p-6 w-full max-w-xl einblenden" onClick={e => e.stopPropagation()}>
        <div className="flex items-center gap-3"><Avatar name={m.name} /><div><div className="text-xl font-semibold">{m.name}</div><div className="text-sm text-stone-500">{st.text}</div></div>
          <button className="ml-auto p-2 rounded-full hover:bg-stone-100" onClick={() => setWahl(null)}><Icon n="x" /></button></div>
        <div className="mt-6 flex flex-wrap gap-3">
          {st.k === "aus" && <button className={`${gross} bg-emerald-600 text-white`} onClick={() => buchen(m, "kommen")}><Icon n="play" className="w-6 h-6" />Kommen</button>}
          {st.k === "aus" && st.plan && hm2min(nowHM()) > hm2min(st.plan.b) + 30 && <button className={`${gross} bg-stone-200`} onClick={() => buchen(m, "nurGehen")}>Gehen<span className="text-sm font-normal">(Kommen vergessen)</span></button>}
          {st.k === "da" && <><button className={`${gross} bg-amber-400`} onClick={() => buchen(m, "pauseStart")}><Icon n="pause" className="w-6 h-6" />Pause</button>
            <button className={`${gross} bg-gold-500 text-white`} onClick={() => buchen(m, "gehen")}><Icon n="stopp" className="w-6 h-6" />Gehen</button></>}
          {st.k === "pause" && <><button className={`${gross} bg-emerald-600 text-white`} onClick={() => buchen(m, "pauseEnde")}><Icon n="play" className="w-6 h-6" />Pause Ende</button>
            <button className={`${gross} bg-stone-900 text-white`} onClick={() => buchen(m, "gehen")}><Icon n="stopp" className="w-6 h-6" />Gehen</button></>}
          {(st.k === "fertig" || st.k === "abw") && <p className="text-stone-600">{st.k === "fertig" ? "Heute schon ausgestempelt. Änderungen bitte über die Zeiterfassung." : `Heute eingetragen: ${st.text}.`}</p>}
        </div>
        {db.einstellungen.autoPause && (st.k === "da" || st.k === "pause") && <p className="mt-4 text-sm text-stone-500">Pause nicht gestempelt? Beim Gehen wird sie laut Dienstplan eingetragen.</p>}
      </div>
    </div>}
  </div>;
}

// ─── STEMPELUHR ───────────────────────────────────────────────────────────────
function Stempeluhr({ ctx }) {
  const { db, user, aendern } = ctx;
  const d = heute(), z = zeitAm(db, user.id, d), a = abwAm(db, user.id, d);
  const soll = sollMin(db, user, d), netto = nettoMin(z);
  const zustand = !z ? "aus" : z.ende ? "fertig" : z.pauseStart ? "pause" : "arbeit";
  const pauseBisher = (z?.pause || 0) + (z?.pauseStart && !z?.ende ? Math.max(0, hm2min(nowHM()) - hm2min(z.pauseStart)) : 0);
  const kj = jugendlich(user, d);
  const pauseAb = kj ? db.einstellungen.kjbgPauseAbMin : db.einstellungen.pauseAbMin;
  const plan = planTag(db, user, d);
  const kommenVergessen = zustand === "aus" && plan && !a && hm2min(nowHM()) > hm2min(plan.b) + 30;
  function stempel(aktion) { aendern(n => stempelBuchen(n, n.mitarbeiter.find(m => m.id === user.id), aktion)); }
  const weiss = "rounded-full font-bold text-sm px-5 py-2.5 transition disabled:opacity-40";
  return <section className="now-card rounded-[14px] text-white p-5">
    <div className="flex items-center justify-between gap-2">
      <span className="text-[11px] tracking-[.14em] font-bold opacity-90 uppercase">⏱️ Stempeluhr</span>
      <span className="text-xs opacity-80">{WT_LANG[wd(d)]}, {fmtD(d)}</span>
    </div>
    <div className="mt-2 text-[19px] font-bold leading-snug">{{ aus: a ? `Heute: ${ARTEN[a.art].label}` : plan ? "Noch nicht eingestempelt" : "Heute frei", arbeit: `Im Dienst seit ${z?.beginn}`, pause: `In Pause seit ${z?.pauseStart}`, fertig: `Dienst beendet · ${z?.beginn}–${z?.ende}` }[zustand]}</div>
    <div className="mt-3 flex items-end gap-6 flex-wrap">
      <div><div className="text-4xl font-bold tabular leading-none">{fmtH(netto)}</div><div className="text-xs opacity-80 mt-1">Arbeitszeit heute</div></div>
      <div><div className="text-lg font-semibold tabular leading-none">{plan ? `${plan.b}–${plan.e}` : fmtH(soll)}</div><div className="text-xs opacity-80 mt-1">Dienstplan</div></div>
      <div><div className="text-lg font-semibold tabular leading-none">{pauseBisher} min</div><div className="text-xs opacity-80 mt-1">Pause{plan?.p ? ` (Plan ${plan.p})` : ""}</div></div>
    </div>
    {zustand !== "aus" && zustand !== "fertig" && netto > pauseAb - 30 && pauseBisher < db.einstellungen.pauseMin &&
      <div className="mt-4 rounded-xl bg-white/15 px-3 py-2.5 text-[13px]">Spätestens nach {fmtH(pauseAb)} h Arbeit sind {db.einstellungen.pauseMin} min Pause Pflicht ({kj ? "§ 15 KJBG" : "§ 11 AZG"}).{db.einstellungen.autoPause ? " Wird keine Pause gestempelt, trägt die App beim Gehen die Pause laut Plan ein." : ""}</div>}
    <div className="mt-5 flex flex-wrap items-center gap-2 no-print">
      {zustand === "aus" && <button className={`${weiss} bg-white text-gold-700 hover:bg-stone-50`} onClick={() => stempel("kommen")} disabled={gesperrt(db, user.id, d)}>Kommen</button>}
      {kommenVergessen && <button className={`${weiss} bg-white/15 text-white hover:bg-white/25`} onClick={() => stempel("nurGehen")} title={`Beginn wird laut Plan (${plan.b}) eingetragen`}>Gehen (Kommen vergessen)</button>}
      {zustand === "arbeit" && <><button className={`${weiss} bg-white/15 text-white hover:bg-white/25`} onClick={() => stempel("pauseStart")}>Pause</button><button className={`${weiss} bg-white text-gold-700 hover:bg-stone-50`} onClick={() => stempel("gehen")}>Gehen</button></>}
      {zustand === "pause" && <><button className={`${weiss} bg-white text-gold-700 hover:bg-stone-50`} onClick={() => stempel("pauseEnde")}>Pause beenden</button><button className={`${weiss} bg-white/15 text-white hover:bg-white/25`} onClick={() => stempel("gehen")}>Gehen</button></>}
      {zustand === "fertig" && <span className="text-[13px] opacity-90">Änderungen bitte als Korrektur unter „Zeiterfassung“.</span>}
    </div>
  </section>;
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ ctx }) {
  const { db, user, sichtbar, setSeite } = ctx;
  const h = heute(), jahr = new Date().getFullYear(), mk = monatKey(h);
  const konto = zeitkonto(db, user, h);
  const uk = urlaubsKonto(db, user, jahr);
  const naechsterUrlaub = db.abwesenheiten.filter(a => a.maId === user.id && a.art === "urlaub" && wirksam(a) && a.von >= h).sort((a, b) => a.von.localeCompare(b.von))[0];
  const aktiveTeam = sichtbar.filter(m => m.aktiv);
  const leitung = istLeitung(user);

  const heuteDa = aktiveTeam.map(m => ({ m, z: zeitAm(db, m.id, h), a: abwAm(db, m.id, h), soll: sollMin(db, m, h) }));
  const imDienst = heuteDa.filter(x => x.z && !x.z.ende);
  const abwesend = heuteDa.filter(x => x.a);
  const offenAntraege = db.abwesenheiten.filter(a => a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId)));
  const offenKorr = db.korrekturen.filter(k => k.status === "offen" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === k.maId)));
  const vormonat = monatVerschieben(mk, -1);
  const offeneAbschluesse = aktiveTeam.filter(m => beschaeftigt(m, `${vormonat}-01`) && !abschlussVon(db, m.id, vormonat)?.abgeschlossenAm);
  const hinweise = aktiveTeam.flatMap(m => hinweiseZeitraum(db, m, addTage(h, -30), h)).filter(x => x.stufe === "fehler");
  const demnaechst = db.abwesenheiten.filter(a => wirksam(a) && aktiveTeam.some(m => m.id === a.maId) && a.von > h && a.von <= addTage(h, 21)).sort((a, b) => a.von.localeCompare(b.von));

  return <div className="space-y-5">
    <Seitenkopf titel={`Hallo ${user.name.split(" ")[0]}`} sub={`${WT_LANG[wd(h)]}, ${fmtD(h)} · ${ROLLEN[user.rolle].label}`} />
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <Kpi label="Mein Zeitkonto" wert={fmtH(konto, true)} sub="Stand bis gestern" ton={konto >= 0 ? "pos" : "neg"} />
      <Kpi label="Resturlaub" wert={`${uk.rest} T`} sub={`${uk.konsumiert} verbraucht · ${uk.geplant} geplant`} />
      {leitung ? <>
        <Kpi label="Heute im Dienst" wert={`${imDienst.length} / ${heuteDa.filter(x => x.soll > 0).length}`} sub="eingestempelt / laut Plan" />
        <Kpi label="Offene Aufgaben" wert={offenAntraege.length + offenKorr.length} sub={`${offenAntraege.length} Anträge · ${offenKorr.length} Korrekturen`} ton={offenAntraege.length + offenKorr.length ? "neg" : undefined} />
      </> : <>
        <Kpi label="Nächster Urlaub" wert={naechsterUrlaub ? fmtD(naechsterUrlaub.von).slice(0, 6) : "–"} sub={naechsterUrlaub ? `${urlaubsTage(db, user, naechsterUrlaub.von, naechsterUrlaub.bis)} Urlaubstage` : "nichts geplant"} />
        <Kpi label="Monat bisher" wert={fmtH(summe(db, user, `${mk}-01`, h).saldo, true)} sub={fmtMonat(mk)} />
      </>}
    </div>

    <div className="grid lg:grid-cols-3 gap-5">
      <div className="lg:col-span-2 space-y-5">
        <Stempeluhr ctx={ctx} />
        {leitung && <Karte titel="Heute im Salon" innen="p-0">
          {heuteDa.filter(x => x.soll > 0 || x.z || x.a).length === 0 ? <Leer text="Heute ist laut Arbeitszeitmodellen niemand eingeplant (Schließtag/Feiertag)." /> :
          <ul className="divide-y divide-stone-100">
            {heuteDa.filter(x => x.soll > 0 || x.z || x.a).map(({ m, z, a, soll }) => <li key={m.id} className="flex items-center gap-3 px-5 py-2.5">
              <Avatar name={m.name} klein />
              <div className="flex-1 min-w-0"><div className="text-sm font-medium truncate">{m.name}</div><div className="text-xs text-stone-500">{m.funktion} · Soll {fmtH(soll)} h</div></div>
              {a ? <ArtChip art={a.art} /> : z && !z.ende ? <span className="text-xs font-medium text-emerald-700 inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500" />seit {z.beginn}{z.pauseStart ? " · Pause" : ""}</span>
                : z ? <span className="text-xs text-stone-500">{z.beginn}–{z.ende}</span> : <span className="text-xs text-amber-700">noch nicht eingestempelt</span>}
            </li>)}
          </ul>}
        </Karte>}
      </div>
      <div className="space-y-5">
        {leitung && <Karte titel="Zu erledigen" innen="p-0">
          <ul className="divide-y divide-stone-100 text-sm">
            <li className="px-5 py-3 flex justify-between gap-2 cursor-pointer hover:bg-stone-50" onClick={() => setSeite("urlaub")}><span>Urlaubs- & Abwesenheitsanträge</span><b className="tabular">{offenAntraege.length}</b></li>
            <li className="px-5 py-3 flex justify-between gap-2 cursor-pointer hover:bg-stone-50" onClick={() => setSeite("zeit")}><span>Zeitkorrekturen prüfen</span><b className="tabular">{offenKorr.length}</b></li>
            <li className="px-5 py-3 flex justify-between gap-2 cursor-pointer hover:bg-stone-50" onClick={() => setSeite("auswertung")}><span>Monatsabschluss {fmtMonat(vormonat)}</span><b className="tabular">{offeneAbschluesse.length} offen</b></li>
            <li className="px-5 py-3 flex justify-between gap-2 cursor-pointer hover:bg-stone-50" onClick={() => setSeite("zeit")}><span>Automatisch ergänzt (7 Tage) – prüfen</span><b className="tabular">{db.zeiten.filter(z => z.auto?.length && z.datum >= addTage(h, -7) && aktiveTeam.some(m => m.id === z.maId)).length}</b></li>
            <li className="px-5 py-3 flex justify-between gap-2 cursor-pointer hover:bg-stone-50" onClick={() => setSeite("krank")}><span>AU-Bestätigungen ausständig</span><b className="tabular">{db.abwesenheiten.filter(a => KRANK_ARTEN.includes(a.art) && wirksam(a) && !a.au && aktiveTeam.some(m => m.id === a.maId)).length}</b></li>
          </ul>
        </Karte>}
        <Karte titel="Heute abwesend" innen="p-0">
          {abwesend.length === 0 ? <Leer text="Niemand abwesend." /> : <ul className="divide-y divide-stone-100">
            {abwesend.map(({ m, a }) => <li key={m.id} className="px-5 py-2.5 flex items-center justify-between gap-2"><span className="text-sm">{m.name}</span><ArtChip art={a.art} /></li>)}
          </ul>}
        </Karte>
        <Karte titel="Nächste 3 Wochen" innen="p-0">
          {demnaechst.length === 0 ? <Leer text="Keine geplanten Abwesenheiten." /> : <ul className="divide-y divide-stone-100">
            {demnaechst.slice(0, 8).map(a => <li key={a.id} className="px-5 py-2.5"><div className="flex items-center justify-between gap-2"><span className="text-sm font-medium">{nameVon(db, a.maId)}</span><ArtChip art={a.art} /></div><div className="text-xs text-stone-500 mt-0.5">{fmtZr(a.von, a.bis)}</div></li>)}
          </ul>}
        </Karte>
        {leitung && hinweise.length > 0 && <Karte titel="Arbeitszeitgesetz · letzte 30 Tage" innen="p-4 space-y-2">
          {hinweise.slice(0, 4).map((x, i) => <Hinweis key={i} ton="fehler"><b>{x.ma.name}</b>, {fmtDk(x.d)}: {x.text}</Hinweis>)}
          {hinweise.length > 4 && <p className="text-xs text-stone-500">… und {hinweise.length - 4} weitere (siehe Zeiterfassung).</p>}
        </Karte>}
      </div>
    </div>
  </div>;
}

// ─── ZEITERFASSUNG ────────────────────────────────────────────────────────────
function ZeitDialog({ ctx, ma, datum, onClose }) {
  const { db, user, aendern } = ctx;
  const z = zeitAm(db, ma.id, datum);
  const direkt = darfVerwalten(user, ma) || (istAdmin(user) && ma.id === user.id);
  const plan = planTag(db, ma, datum);
  const [f, setF] = useState({ beginn: z?.beginn || plan?.b || "09:00", ende: z?.ende || plan?.e || "", pause: z?.pause ?? plan?.p ?? 30, notiz: z?.notiz || "", grund: "" });
  const [loeschen, setLoeschen] = useState(false);
  const netto = f.beginn && f.ende ? hm2min(f.ende) - hm2min(f.beginn) - (+f.pause || 0) : 0;
  const fehler = loeschen ? (!f.grund.trim() ? "Bitte einen Grund angeben." : null)
    : !f.beginn || !f.ende ? "Beginn und Ende angeben." : hm2min(f.ende) <= hm2min(f.beginn) ? "Ende muss nach Beginn liegen." : netto < 0 ? "Pause länger als Anwesenheit." : !f.grund.trim() ? "Bitte einen Grund angeben (wird protokolliert)." : null;

  function speichern() {
    const neu = loeschen ? null : { beginn: f.beginn, ende: f.ende, pause: +f.pause || 0 };
    const alt = z ? { beginn: z.beginn, ende: z.ende, pause: z.pause } : null;
    if (direkt) {
      aendern(n => {
        const i = n.zeiten.findIndex(q => q.id === z?.id);
        if (loeschen) n.zeiten.splice(i, 1);
        else if (i >= 0) Object.assign(n.zeiten[i], neu, { notiz: f.notiz, quelle: "korrektur", pauseStart: null });
        else n.zeiten.push({ id: uid(), maId: ma.id, datum, ...neu, notiz: f.notiz, quelle: "manuell" });
        n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: ma.id, datum, aktion: loeschen ? "gelöscht" : z ? "korrigiert" : "nachgetragen", alt, neu, grund: f.grund });
      }, "Zeiteintrag gespeichert und protokolliert");
    } else {
      aendern(n => {
        n.korrekturen.push({ id: uid(), maId: ma.id, datum, zeitId: z?.id || null, alt, neu, grund: f.grund, status: "offen", von: user.id, am: heute() });
      }, "Korrekturantrag gesendet");
    }
    onClose();
  }
  return <Modal titel={`${direkt ? (z ? "Zeiteintrag bearbeiten" : "Zeit nachtragen") : "Korrektur beantragen"} · ${fmtDk(datum)}`} onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!!fehler}>{direkt ? "Speichern" : "Antrag senden"}</Knopf></>}>
    <div className="space-y-4">
      <div className="text-sm text-stone-600">{ma.name} · Soll an diesem Tag: <b>{fmtH(sollMin(db, ma, datum))} h</b></div>
      {!loeschen && <div className="grid grid-cols-3 gap-3">
        <Feld label="Beginn"><input type="time" className={inputCls} value={f.beginn} onChange={e => setF({ ...f, beginn: e.target.value })} /></Feld>
        <Feld label="Ende"><input type="time" className={inputCls} value={f.ende} onChange={e => setF({ ...f, ende: e.target.value })} /></Feld>
        <Feld label="Pause (min)"><input type="number" min="0" step="5" className={inputCls} value={f.pause} onChange={e => setF({ ...f, pause: e.target.value })} /></Feld>
      </div>}
      {!loeschen && f.ende && <div className="text-sm">Arbeitszeit netto: <b className="tabular">{fmtH(Math.max(0, netto))} h</b></div>}
      {!loeschen && <Feld label="Notiz (optional)"><input className={inputCls} value={f.notiz} onChange={e => setF({ ...f, notiz: e.target.value })} /></Feld>}
      <Feld label="Grund der Änderung" hilfe="Pflichtfeld – jede Änderung wird mit Zeitpunkt, Person und Grund protokolliert (Nachvollziehbarkeit der Aufzeichnungen, § 26 AZG).">
        <textarea rows="2" className={inputCls} value={f.grund} onChange={e => setF({ ...f, grund: e.target.value })} />
      </Feld>
      {direkt && z && <label className="flex items-center gap-2 text-sm text-rose-700"><input type="checkbox" checked={loeschen} onChange={e => setLoeschen(e.target.checked)} />Eintrag löschen</label>}
      {!direkt && <Hinweis>Deine Vorgesetzte bzw. die Verwaltung prüft den Antrag. Erst nach Genehmigung wird die Zeit geändert.</Hinweis>}
      {fehler && <p className="text-xs text-rose-700">{fehler}</p>}
    </div>
  </Modal>;
}

function KorrekturListe({ ctx, liste }) {
  const { db, user, aendern } = ctx;
  function entscheiden(k, ok) {
    aendern(n => {
      const x = n.korrekturen.find(q => q.id === k.id);
      x.status = ok ? "genehmigt" : "abgelehnt"; x.entschiedenVon = user.id; x.entschiedenAm = heute();
      if (!ok) return;
      const i = n.zeiten.findIndex(q => q.maId === k.maId && q.datum === k.datum);
      if (!k.neu) { if (i >= 0) n.zeiten.splice(i, 1); }
      else if (i >= 0) Object.assign(n.zeiten[i], k.neu, { quelle: "korrektur", pauseStart: null });
      else n.zeiten.push({ id: uid(), maId: k.maId, datum: k.datum, ...k.neu, quelle: "korrektur" });
      n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: k.maId, datum: k.datum, aktion: "Korrekturantrag genehmigt", alt: k.alt, neu: k.neu, grund: k.grund });
    }, ok ? "Korrektur übernommen" : "Korrektur abgelehnt");
  }
  const t = v => v ? `${v.beginn}–${v.ende || "…"} · ${v.pause} min` : "kein Eintrag";
  return <ul className="divide-y divide-stone-100">
    {liste.map(k => <li key={k.id} className="px-5 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
      <div className="flex-1 text-sm">
        <div className="font-medium">{nameVon(db, k.maId)} · {fmtDk(k.datum)}</div>
        <div className="text-xs text-stone-600 mt-0.5 tabular"><span className="line-through text-stone-400">{t(k.alt)}</span> → <b>{t(k.neu)}</b></div>
        <div className="text-xs text-stone-500 mt-0.5">„{k.grund}“</div>
      </div>
      {gesperrt(db, k.maId, k.datum) ? <span className="text-xs text-stone-500">Monat abgeschlossen</span> : <div className="flex gap-2">
        <Knopf klein art="rot" icon="x" onClick={() => entscheiden(k, false)}>Ablehnen</Knopf>
        <Knopf klein art="gruen" icon="haken" onClick={() => entscheiden(k, true)}>Übernehmen</Knopf>
      </div>}
    </li>)}
  </ul>;
}

function Monatsabschluss({ ctx, ma, monat, summeMonat, konto }) {
  const { db, user, aendern } = ctx;
  const ab = abschlussVon(db, ma.id, monat);
  const vorbei = monat < monatKey(heute());
  const offeneKorr = db.korrekturen.filter(k => k.maId === ma.id && k.status === "offen" && monatKey(k.datum) === monat).length;
  const laufend = db.zeiten.some(z => z.maId === ma.id && monatKey(z.datum) === monat && !z.ende);
  const autoTage = db.zeiten.filter(z => z.maId === ma.id && monatKey(z.datum) === monat && z.auto?.length).length;
  const darfAbschliessen = darfVerwalten(user, ma) || (istAdmin(user) && ma.id === user.id);
  const [grund, setGrund] = useState(null);

  function setze(fn, text) { aendern(n => { let x = n.abschluesse.find(a => a.maId === ma.id && a.monat === monat); if (!x) { x = { maId: ma.id, monat }; n.abschluesse.push(x); } fn(x, n); }, text); }
  const schritt = (fertig, titel, sub) => <div className="flex items-start gap-3">
    <span className={`mt-0.5 w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${fertig ? "bg-emerald-600 text-white" : "ring-1 ring-stone-300 text-transparent"}`}><Icon n="haken" className="w-3.5 h-3.5" /></span>
    <div><div className="text-sm font-medium">{titel}</div><div className="text-xs text-stone-500">{sub}</div></div>
  </div>;

  return <Karte titel="Monatsabschluss" aktion={ab?.abgeschlossenAm ? <Badge status="genehmigt">Abgeschlossen</Badge> : <Badge status="offen">Offen</Badge>}>
    <div className="space-y-3">
      {schritt(!!ab?.bestaetigtAm, "Bestätigung durch Mitarbeiter/in", ab?.bestaetigtAm ? `am ${fmtD(ab.bestaetigtAm)}` : "Zeiten geprüft und bestätigt")}
      {schritt(!!ab?.abgeschlossenAm, "Abschluss durch Vorgesetzte/Verwaltung", ab?.abgeschlossenAm ? `am ${fmtD(ab.abgeschlossenAm)} von ${nameVon(db, ab.abgeschlossenVon)} · Saldo ${fmtH(ab.saldoMonat ?? summeMonat.saldo, true)}` : "Monat wird gesperrt, Saldo geht ins Zeitkonto")}
    </div>
    {autoTage > 0 && !ab?.abgeschlossenAm && <div className="mt-4"><Hinweis ton="warn">{autoTage} Tag{autoTage === 1 ? "" : "e"} automatisch laut Dienstplan ergänzt (Kennzeichen „auto“). Bitte vor dem Bestätigen prüfen – stimmt etwas nicht, Korrektur beantragen.</Hinweis></div>}
    {!vorbei && !ab?.abgeschlossenAm && <p className="mt-4 text-xs text-stone-500">Der Abschluss ist ab dem 1. des Folgemonats möglich.</p>}
    {vorbei && !ab?.abgeschlossenAm && (offeneKorr > 0 || laufend) && <div className="mt-4"><Hinweis ton="warn">{offeneKorr > 0 ? `${offeneKorr} offene Korrekturanträge. ` : ""}{laufend ? "Ein Tag hat noch kein Arbeitsende." : ""} Bitte zuerst klären.</Hinweis></div>}
    <div className="mt-4 flex flex-wrap gap-2 no-print">
      {vorbei && !ab?.bestaetigtAm && !ab?.abgeschlossenAm && ma.id === user.id &&
        <Knopf art="sekundaer" icon="haken" onClick={() => setze(x => { x.bestaetigtAm = heute(); }, "Monat bestätigt")}>Zeiten bestätigen</Knopf>}
      {vorbei && !ab?.abgeschlossenAm && darfAbschliessen &&
        <Knopf icon="schloss" disabled={offeneKorr > 0 || laufend} onClick={() => setze(x => { x.abgeschlossenAm = heute(); x.abgeschlossenVon = user.id; x.saldoMonat = summeMonat.saldo; x.kontoStand = konto; }, "Monat abgeschlossen")}>
          Monat abschließen{!ab?.bestaetigtAm ? " (ohne Bestätigung)" : ""}</Knopf>}
      {ab?.abgeschlossenAm && istAdmin(user) && grund === null && <Knopf art="rot" klein onClick={() => setGrund("")}>Wieder öffnen</Knopf>}
    </div>
    {grund !== null && <div className="mt-3 flex gap-2">
      <input className={inputCls} placeholder="Grund für das Öffnen (Pflicht)" value={grund} onChange={e => setGrund(e.target.value)} />
      <Knopf art="rot" disabled={!grund.trim()} onClick={() => { setze((x, n) => { delete x.abgeschlossenAm; delete x.abgeschlossenVon; n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: ma.id, datum: `${monat}-01`, aktion: "Monat wieder geöffnet", grund }); }, "Monat wieder geöffnet"); setGrund(null); }}>Öffnen</Knopf>
    </div>}
  </Karte>;
}

function Zeiterfassung({ ctx }) {
  const { db, user, sichtbar } = ctx;
  const [maId, setMaId] = useState(user.id);
  const [monat, setMonat] = useState(monatKey(heute()));
  const [dialog, setDialog] = useState(null);
  const [abwDialog, setAbwDialog] = useState(null);
  const [protokollOffen, setProtokollOffen] = useState(false);
  const ma = db.mitarbeiter.find(m => m.id === maId) || user;
  const tage = tageImMonat(monat);
  const sm = summe(db, ma, tage[0], tage[tage.length - 1]);
  const konto = zeitkonto(db, ma, tage[tage.length - 1] < heute() ? tage[tage.length - 1] : heute());
  const hinweise = hinweiseZeitraum(db, ma, tage[0], tage[tage.length - 1]);
  const istGesperrt = !!abschlussVon(db, ma.id, monat)?.abgeschlossenAm;
  const eigene = ma.id === user.id;
  const direkt = darfVerwalten(user, ma) || (istAdmin(user) && eigene);
  const offeneKorr = db.korrekturen.filter(k => k.status === "offen" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === k.maId)));
  const meineKorr = db.korrekturen.filter(k => k.maId === ma.id && monatKey(k.datum) === monat);
  const protokoll = db.protokoll.filter(p => p.maId === ma.id && monatKey(p.datum) === monat);

  return <div className="space-y-5">
    <Seitenkopf titel="Zeiterfassung" sub="Arbeitsbeginn, -ende und Pausen · Aufzeichnungspflicht nach § 26 AZG">
      {sichtbar.length > 1 && <MaWahl liste={sichtbar} wert={maId} setWert={setMaId} />}
      <MonatWahl monat={monat} setMonat={setMonat} />
      <Knopf art="sekundaer" icon="drucker" onClick={() => window.print()}>Nachweis drucken</Knopf>
    </Seitenkopf>
    <div className="print-only mb-3">
      <div className="text-lg font-semibold">Arbeitszeitnachweis {fmtMonat(monat)}</div>
      <div className="text-sm">{db.einstellungen.firmenname} · {ma.name} ({ma.personalnr}) · {modellVon(db, ma).name}</div>
    </div>

    {eigene && monat === monatKey(heute()) && <div className="no-print"><Stempeluhr ctx={ctx} /></div>}

    {offeneKorr.length > 0 && <Karte titel={`Offene Korrekturanträge (${offeneKorr.length})`} innen="p-0" className="no-print"><KorrekturListe ctx={ctx} liste={offeneKorr} /></Karte>}

    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
      <Kpi label="Soll" wert={fmtH(sm.soll)} sub="bis heute" />
      <Kpi label="Ist" wert={fmtH(sm.ist)} sub="gearbeitet" />
      <Kpi label="Abwesenheit" wert={fmtH(sm.gut)} sub="angerechnet" />
      <Kpi label="Saldo Monat" wert={fmtH(sm.saldo, true)} ton={sm.saldo >= 0 ? "pos" : "neg"} sub={db.einstellungen.ueberstunden && (sm.ueberstunden || sm.mehrarbeit) ? `ÜS ${fmtH(sm.ueberstunden)} · MA ${fmtH(sm.mehrarbeit)}` : "Abweichung vom Plan"} />
      <Kpi label="Zeitkonto" wert={fmtH(konto, true)} ton={konto >= 0 ? "pos" : "neg"} sub="kumuliert" />
    </div>

    <div className="grid xl:grid-cols-3 gap-5">
      <Karte className="xl:col-span-2" innen="p-0" titel={<span className="flex items-center gap-2">{ma.name} · <span className="capitalize">{fmtMonat(monat)}</span>{istGesperrt && <Icon n="schloss" className="w-4 h-4 text-stone-500" />}</span>}
        aktion={<span className="text-xs text-stone-500">{modellVon(db, ma).name}</span>}>
        <Tabelle kopf={["Tag", "Beginn", "Ende", { t: "Pause", cls: "text-right" }, { t: "Ist", cls: "text-right" }, { t: "Soll", cls: "text-right" }, { t: "Saldo", cls: "text-right" }, "Info", { t: "", cls: "no-print" }]}>
          {tage.map(d => {
            const t = tagInfo(db, ma, d), hw = pruefeTag(db, ma, d), beantragt = abwAntragAm(db, ma.id, d);
            const korr = db.korrekturen.find(k => k.maId === ma.id && k.datum === d && k.status === "offen");
            const frei = !t.soll && !t.z;
            const zukunft = d > heute();
            const darfAktion = !istGesperrt && !zukunft && beschaeftigt(ma, d) && !korr && (direkt || (eigene && !frei));
            return <tr key={d} className={`${frei ? "bg-stone-50/70 text-stone-400" : ""} ${d === heute() ? "bg-amber-50/60" : ""}`}>
              <td className="px-3 py-2 whitespace-nowrap font-medium tabular">{fmtDk(d)}</td>
              <td className="px-3 py-2 tabular">{t.z?.beginn || ""}</td>
              <td className="px-3 py-2 tabular">{t.z ? (t.z.ende || <span className="text-emerald-700">läuft</span>) : ""}</td>
              <td className="px-3 py-2 tabular text-right">{t.z ? `${t.z.pause}′` : ""}</td>
              <td className="px-3 py-2 tabular text-right">{t.z ? fmtH(t.ist) : t.gut ? <span className="text-stone-500">{fmtH(t.gut)}</span> : ""}</td>
              <td className="px-3 py-2 tabular text-right">{t.soll ? fmtH(t.soll) : ""}</td>
              <td className={`px-3 py-2 tabular text-right font-medium ${!t.zaehlt || (!t.soll && !t.ist) ? "text-stone-300" : t.saldo > 0 ? "text-emerald-700" : t.saldo < 0 ? "text-rose-700" : "text-stone-500"}`}>{t.zaehlt && (t.soll || t.ist) ? fmtH(t.saldo, true) : ""}</td>
              <td className="px-3 py-2">
                <div className="flex flex-wrap items-center gap-1">
                  {t.ft && <span className="text-xs text-rose-700 font-medium">{t.ft.name}</span>}
                  {t.a && <ArtChip art={t.a.art} halb={anteil(t.a) < 1} />}
                  {beantragt && !t.a && <span className="text-xs text-amber-700">{ARTEN[beantragt.art].label} beantragt</span>}
                  {korr && <Badge status="offen">Korrektur offen</Badge>}
                  {t.z?.quelle === "korrektur" || t.z?.quelle === "manuell" ? <span className="text-[11px] text-stone-500" title="Manuell erfasst oder korrigiert – siehe Protokoll">✎</span> : null}
                  {t.z?.auto?.length ? <span className="inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium bg-amber-50 text-amber-800 ring-1 ring-inset ring-amber-200" title="Nicht gestempelt – laut Dienstplan eingetragen">auto: {t.z.auto.map(x => AUTO_TEXT[x]).join(", ")}</span> : null}
                  {hw.map((x, i) => <span key={i} title={x.text} className={`inline-flex ${x.stufe === "fehler" ? "text-rose-600" : "text-amber-600"}`}><Icon n="warnung" className="w-4 h-4" /></span>)}
                  {!t.z && !t.a && t.soll > 0 && t.zaehlt && <span className="text-xs text-rose-700">fehlt</span>}
                </div>
              </td>
              <td className="px-2 py-1.5 text-right no-print">
                <div className="flex justify-end gap-0.5">
                  {direkt && !istGesperrt && beschaeftigt(ma, d) && !t.a && t.soll > 0 && <button onClick={() => setAbwDialog(d)} className="p-1.5 rounded-full text-stone-400 hover:bg-white hover:text-gold-700" title="Urlaub / Krankenstand nachtragen">🌴</button>}
                  {darfAktion && <button onClick={() => setDialog(d)} className="p-1.5 rounded-full text-stone-500 hover:bg-white hover:text-gold-700" title={direkt ? "Zeiten & Pause bearbeiten" : "Korrektur beantragen"}><Icon n="stift" className="w-4 h-4" /></button>}
                </div>
              </td>
            </tr>;
          })}
        </Tabelle>
        <div className="print-only px-3 pt-10">
          <div className="flex justify-between gap-10 text-xs">
            <div className="flex-1 border-t border-stone-400 pt-1">Datum, Unterschrift Mitarbeiter/in</div>
            <div className="flex-1 border-t border-stone-400 pt-1">Datum, Unterschrift Arbeitgeber/in</div>
          </div>
        </div>
      </Karte>

      <div className="space-y-5">
        <Monatsabschluss key={ma.id + monat} ctx={ctx} ma={ma} monat={monat} summeMonat={sm} konto={konto} />
        <Karte titel="Prüfung AZG / KJBG" aktion={jugendlich(ma, tage[0]) || jugendlich(ma, tage[tage.length - 1]) ? <span className="text-xs font-medium text-indigo-700">unter 18 · KJBG</span> : null} innen="p-4 space-y-2">
          {hinweise.length === 0 ? <Hinweis ton="ok">Keine Auffälligkeiten bei Pausen, Höchstarbeitszeit und Ruhezeit.</Hinweis> :
            hinweise.map((x, i) => <Hinweis key={i} ton={x.stufe === "fehler" ? "fehler" : "warn"}>{x.woche ? `Woche ab ${fmtDk(x.d)}` : fmtDk(x.d)}: {x.text}</Hinweis>)}
        </Karte>
        {meineKorr.length > 0 && <Karte titel="Korrekturanträge" innen="p-0">
          <ul className="divide-y divide-stone-100">{meineKorr.map(k => <li key={k.id} className="px-5 py-2.5 flex items-center justify-between gap-2 text-sm">
            <span>{fmtDk(k.datum)} <span className="text-xs text-stone-500">„{k.grund}“</span></span><Badge status={k.status} />
          </li>)}</ul>
        </Karte>}
        <Karte titel="Änderungsprotokoll" aktion={<button className="text-xs text-stone-600 hover:underline no-print" onClick={() => setProtokollOffen(!protokollOffen)}>{protokollOffen ? "ausblenden" : `${protokoll.length} Einträge`}</button>} innen={protokollOffen ? "p-0" : "p-0 hidden"}>
          {protokoll.length === 0 ? <Leer text="Keine Änderungen in diesem Monat." /> : <ul className="divide-y divide-stone-100 text-xs">
            {protokoll.slice().reverse().map(p => <li key={p.id} className="px-5 py-2.5">
              <div className="font-medium text-stone-800">{fmtDk(p.datum)} · {p.aktion}</div>
              <div className="text-stone-500">{new Date(p.am).toLocaleString("de-AT")} · {nameVon(db, p.von)}{p.alt || p.neu ? ` · ${p.alt ? `${p.alt.beginn}–${p.alt.ende}` : "neu"} → ${p.neu ? `${p.neu.beginn}–${p.neu.ende}` : "gelöscht"}` : ""}</div>
              {p.grund && <div className="text-stone-600">„{p.grund}“</div>}
            </li>)}
          </ul>}
        </Karte>
      </div>
    </div>
    {dialog && <ZeitDialog ctx={ctx} ma={ma} datum={dialog} onClose={() => setDialog(null)} />}
    {abwDialog && <AbwDialog ctx={ctx} modus="alle" vorMa={ma.id} vorDatum={abwDialog} onClose={() => setAbwDialog(null)} />}
  </div>;
}

// ─── ABWESENHEITS-DIALOG (Urlaub, Krankenstand, sonstige) ────────────────────
function AbwDialog({ ctx, modus, onClose, vorMa, vorDatum, bestand }) {
  const { db, user, sichtbar, aendern } = ctx;
  const auswahl = sichtbar.filter(m => (m.aktiv || m.id === bestand?.maId) && (m.id === user.id || darfVerwalten(user, m)));
  const arten = bestand || modus === "alle" ? Object.keys(ARTEN) : modus === "urlaub" ? ["urlaub"] : Object.keys(ARTEN).filter(a => a !== "urlaub");
  const [f, setF] = useState(bestand
    ? { maId: bestand.maId, art: bestand.art, von: bestand.von, bis: bestand.bis || bestand.von, offen: !bestand.bis, au: !!bestand.au, halb: anteil(bestand) < 1, notiz: bestand.notiz || "" }
    : { maId: vorMa || user.id, art: arten[0], von: vorDatum || heute(), bis: vorDatum || heute(), offen: false, au: false, halb: false, notiz: "" });
  const ma = db.mitarbeiter.find(m => m.id === f.maId);
  const art = ARTEN[f.art];
  const fuerAndere = f.maId !== user.id;
  const bis = f.offen ? null : f.bis;
  const tage = f.art === "urlaub" ? urlaubsTage(db, ma, f.von, bis || f.von) : tageZw(f.von, bis || f.von).length;
  const uk = urlaubsKonto(db, ma, parseInt(f.von));
  const ftImZeitraum = tageZw(f.von, bis || f.von).filter(d => feiertag(d) && modellSollMin(db, ma, d) > 0);
  const ueberschneidung = db.abwesenheiten.filter(a => a.id !== bestand?.id && a.maId === f.maId && (wirksam(a) || a.status === "beantragt") && a.von <= (bis || "9999") && (a.bis || "9999") >= f.von);
  const kollegen = db.abwesenheiten.filter(a => a.maId !== f.maId && wirksam(a) && a.von <= (bis || f.von) && (a.bis || heute()) >= f.von && db.mitarbeiter.find(m => m.id === a.maId)?.aktiv);
  const gesperrtIn = tageZw(f.von, bis || f.von).some(d => gesperrt(db, f.maId, d));
  const fehler = !f.von ? "Beginn angeben." : bis && bis < f.von ? "Ende liegt vor dem Beginn." : ueberschneidung.length ? "Für diesen Zeitraum gibt es bereits einen Eintrag." : gesperrtIn ? "Zeitraum liegt in einem abgeschlossenen Monat." : f.art === "urlaub" && tage === 0 ? "Im Zeitraum liegen keine Arbeitstage." : null;
  const halbMoeglich = !art.meldung && f.art !== "urlaub" && !f.offen && f.von === f.bis;
  const neuStatus = art.meldung ? "gemeldet" : (fuerAndere && darfVerwalten(user, ma)) || (istAdmin(user) && !fuerAndere) ? "genehmigt" : "beantragt";
  const status = bestand ? (bestand.status === "beantragt" ? bestand.status : neuStatus) : neuStatus;
  // Nachgetragene Abwesenheit: automatisch ergänzte Arbeitstage („auto: ganzer Tag“) fallen weg,
  // gestempelte Tage bleiben und werden nur angezeigt
  const ganzTag = !(halbMoeglich && f.halb);
  const zeitraum = f.von ? tageZw(f.von, bis || (f.von > heute() ? f.von : heute())) : [];
  const autoTage = ganzTag ? zeitraum.filter(d => zeitAm(db, f.maId, d)?.auto?.includes("tag")) : [];
  const gestempelt = ganzTag ? zeitraum.filter(d => { const z = zeitAm(db, f.maId, d); return z && !z.auto?.includes("tag"); }) : [];

  function speichern() {
    aendern(n => {
      const daten = { maId: f.maId, art: f.art, von: f.von, bis, status, anteil: halbMoeglich && f.halb ? 0.5 : undefined, au: art.meldung ? f.au : undefined, notiz: f.notiz };
      if (bestand) Object.assign(n.abwesenheiten.find(a => a.id === bestand.id), daten, { geaendertVon: user.id, geaendertAm: heute() });
      else n.abwesenheiten.push({ id: uid(), ...daten, beantragtAm: heute(), erfasstVon: user.id, entschiedenVon: status === "genehmigt" ? user.id : undefined });
      if (status !== "beantragt") autoTage.forEach(d => {
        const z = n.zeiten.find(q => q.maId === f.maId && q.datum === d);
        n.zeiten.splice(n.zeiten.indexOf(z), 1);
        n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: user.id, maId: f.maId, datum: d, aktion: "automatischen Eintrag entfernt", alt: { beginn: z.beginn, ende: z.ende, pause: z.pause }, neu: null, grund: `${ARTEN[f.art].label} nachgetragen` });
      });
    }, bestand ? "Abwesenheit geändert" : status === "beantragt" ? "Antrag gesendet" : "Eintrag gespeichert");
    onClose();
  }
  function loeschen() { aendern(n => { Object.assign(n.abwesenheiten.find(a => a.id === bestand.id), { status: "storniert", geaendertVon: user.id, geaendertAm: heute() }); }, "Eintrag storniert"); onClose(); }
  const titel = bestand ? "Abwesenheit bearbeiten" : modus === "alle" ? "Urlaub / Krankenstand nachtragen" : modus === "urlaub" ? (fuerAndere ? "Urlaub eintragen" : "Urlaub beantragen") : "Krankmeldung / Abwesenheit erfassen";
  return <Modal titel={titel} onClose={onClose}
    fuss={<>{bestand && <Knopf art="rot" onClick={loeschen}>Stornieren</Knopf>}<span className="flex-1" /><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!!fehler}>{bestand ? "Speichern" : status === "beantragt" ? "Antrag senden" : status === "gemeldet" ? "Melden" : "Eintragen"}</Knopf></>}>
    <div className="grid sm:grid-cols-2 gap-4">
      {auswahl.length > 1 && <Feld label="Mitarbeiter/in" breit><select className={inputCls} value={f.maId} onChange={e => setF({ ...f, maId: e.target.value })}>{auswahl.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></Feld>}
      {arten.length > 1 && <Feld label="Art der Abwesenheit" breit><select className={inputCls} value={f.art} onChange={e => setF({ ...f, art: e.target.value })}>{arten.map(a => <option key={a} value={a}>{ARTEN[a].label}</option>)}</select></Feld>}
      <Feld label="Von"><input type="date" className={inputCls} value={f.von} onChange={e => setF({ ...f, von: e.target.value, bis: f.bis < e.target.value ? e.target.value : f.bis })} /></Feld>
      <Feld label="Bis">
        <input type="date" className={inputCls} value={f.offen ? "" : f.bis} disabled={f.offen} min={f.von} onChange={e => setF({ ...f, bis: e.target.value })} />
        {art.meldung && <label className="flex items-center gap-2 mt-1.5 text-xs text-stone-600"><input type="checkbox" checked={f.offen} onChange={e => setF({ ...f, offen: e.target.checked })} />Ende noch offen</label>}
        {halbMoeglich && <label className="flex items-center gap-2 mt-1.5 text-xs text-stone-600"><input type="checkbox" checked={f.halb} onChange={e => setF({ ...f, halb: e.target.checked })} />nur halber Tag</label>}
      </Feld>
      {art.meldung && <Feld label="Arbeitsunfähigkeitsbestätigung" breit hilfe={`Firmenregel: Bestätigung ab dem ${db.einstellungen.auAbTag}. Kalendertag vorlegen (änderbar unter Einstellungen).`}>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={f.au} onChange={e => setF({ ...f, au: e.target.checked })} />AU-Bestätigung liegt vor</label>
      </Feld>}
      <Feld label="Notiz (optional)" breit hilfe={art.meldung ? "Keine Diagnosen eintragen – die gehen den Betrieb nichts an." : null}><input className={inputCls} value={f.notiz} onChange={e => setF({ ...f, notiz: e.target.value })} /></Feld>
    </div>
    <div className="mt-4 space-y-2">
      {f.art === "urlaub" ? <div className="rounded-[14px] bg-white ring-1 ring-inset ring-stone-200 p-3 text-sm grid grid-cols-3 gap-2 text-center">
        <div><div className="text-xl font-semibold tabular">{tage}</div><div className="text-xs text-stone-500">Urlaubstage</div></div>
        <div><div className="text-xl font-semibold tabular">{uk.rest}</div><div className="text-xs text-stone-500">Rest {parseInt(f.von)}</div></div>
        <div><div className={`text-xl font-semibold tabular ${uk.rest - tage < 0 ? "text-rose-700" : ""}`}>{uk.rest - tage}</div><div className="text-xs text-stone-500">danach</div></div>
      </div> : <div className="text-sm text-stone-600">{bis ? `${tage} Kalendertage` : "Laufend – das Ende wird mit der Gesundmeldung eingetragen."}</div>}
      {f.art === "urlaub" && <p className="text-xs text-stone-500">Gezählt werden nur Arbeitstage laut Arbeitszeitmodell „{modellVon(db, ma).name}“. Wochenenden, Schließtage und Feiertage zählen nicht.</p>}
      {ftImZeitraum.length > 0 && <Hinweis>Feiertage im Zeitraum (nicht abgezogen): {ftImZeitraum.map(d => feiertag(d).name).join(", ")}</Hinweis>}
      {f.art === "urlaub" && uk.rest - tage < 0 && <Hinweis ton="warn">Der Antrag übersteigt den Resturlaub. Vorgriff nur nach Vereinbarung.</Hinweis>}
      {kollegen.length > 0 && <Hinweis ton="warn">Gleichzeitig abwesend: {[...new Set(kollegen.map(a => nameVon(db, a.maId)))].join(", ")}</Hinweis>}
      {status === "genehmigt" && fuerAndere && !bestand && <Hinweis>Du trägst als Vorgesetzte/r ein – der Eintrag gilt sofort als genehmigt.</Hinweis>}
      {autoTage.length > 0 && status !== "beantragt" && <Hinweis>{autoTage.length} automatisch ergänzte Arbeitstag{autoTage.length === 1 ? "" : "e"} ({autoTage.map(fmtDk).join(", ")}) {autoTage.length === 1 ? "wird" : "werden"} dafür entfernt.</Hinweis>}
      {gestempelt.length > 0 && <Hinweis ton="warn">An {gestempelt.map(fmtDk).join(", ")} gibt es gestempelte Zeiten. Falls die Person da nicht gearbeitet hat, bitte in der Zeiterfassung löschen.</Hinweis>}
      {fehler && <p className="text-xs text-rose-700">{fehler}</p>}
    </div>
  </Modal>;
}

function AntragListe({ ctx, liste }) {
  const { db, user, aendern } = ctx;
  function entscheiden(a, status) { aendern(n => { const x = n.abwesenheiten.find(q => q.id === a.id); x.status = status; x.entschiedenVon = user.id; x.entschiedenAm = heute(); }, status === "genehmigt" ? "Antrag genehmigt" : "Antrag abgelehnt"); }
  return <ul className="divide-y divide-stone-100">
    {liste.map(a => {
      const ma = db.mitarbeiter.find(m => m.id === a.maId);
      const kollegen = db.abwesenheiten.filter(x => x.maId !== a.maId && wirksam(x) && x.von <= (a.bis || a.von) && (x.bis || heute()) >= a.von);
      return <li key={a.id} className="px-5 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
        <Avatar name={ma.name} klein />
        <div className="flex-1 text-sm">
          <div className="font-medium flex flex-wrap items-center gap-2">{ma.name} <ArtChip art={a.art} /></div>
          <div className="text-xs text-stone-600 mt-0.5">{fmtZr(a.von, a.bis)} · {a.art === "urlaub" ? `${urlaubsTage(db, ma, a.von, a.bis)} Urlaubstage · Rest danach ${urlaubsKonto(db, ma, parseInt(a.von)).rest - urlaubsTage(db, ma, a.von, a.bis)}` : `${tageZw(a.von, a.bis || a.von).length} Tag${tageZw(a.von, a.bis || a.von).length === 1 ? "" : "e"}`}{a.notiz ? ` · „${a.notiz}“` : ""}</div>
          {kollegen.length > 0 && <div className="text-xs text-amber-700 mt-0.5">Gleichzeitig weg: {[...new Set(kollegen.map(x => nameVon(db, x.maId)))].join(", ")}</div>}
        </div>
        <div className="flex gap-2">
          <Knopf klein art="rot" icon="x" onClick={() => entscheiden(a, "abgelehnt")}>Ablehnen</Knopf>
          <Knopf klein art="gruen" icon="haken" onClick={() => entscheiden(a, "genehmigt")}>Genehmigen</Knopf>
        </div>
      </li>;
    })}
  </ul>;
}

// ─── URLAUB ───────────────────────────────────────────────────────────────────
function Urlaub({ ctx }) {
  const { db, user, sichtbar, aendern } = ctx;
  const [jahr, setJahr] = useState(new Date().getFullYear());
  const [dialog, setDialog] = useState(false);
  const [bearbeiten, setBearbeiten] = useState(null);
  const uk = urlaubsKonto(db, user, jahr);
  const offen = db.abwesenheiten.filter(a => a.art === "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId)));
  const liste = db.abwesenheiten.filter(a => a.art === "urlaub" && sichtbar.some(m => m.id === a.maId) && (a.von.startsWith(jahr) || (a.bis || "").startsWith(jahr))).sort((a, b) => b.von.localeCompare(a.von));
  const leitung = istLeitung(user);
  function stornieren(a) { aendern(n => { n.abwesenheiten.find(q => q.id === a.id).status = "storniert"; }, "Urlaub storniert"); }

  return <div className="space-y-5">
    <Seitenkopf titel="Urlaub" sub="Anträge, Genehmigung und Urlaubskonto (Urlaubsjahr = Kalenderjahr)">
      <select className={`${inputKlein}`} value={jahr} onChange={e => setJahr(+e.target.value)}>{[jahr - 1, jahr, jahr + 1].map(j => <option key={j}>{j}</option>)}</select>
      <Knopf icon="plus" onClick={() => setDialog(true)}>{leitung ? "Urlaub eintragen" : "Urlaub beantragen"}</Knopf>
    </Seitenkopf>
    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
      <Kpi label="Anspruch" wert={uk.anspruch} sub="Tage" />
      <Kpi label="Übertrag" wert={uk.uebertrag} sub="aus Vorjahr" />
      <Kpi label="Verbraucht" wert={uk.konsumiert} sub="Tage" />
      <Kpi label="Geplant" wert={uk.geplant} sub="genehmigt" />
      <Kpi label="Beantragt" wert={uk.beantragt} sub="offen" />
      <Kpi label="Rest" wert={uk.rest} ton={uk.rest < 0 ? "neg" : "pos"} sub="verfügbar" />
    </div>
    {offen.length > 0 && <Karte titel={`Zur Genehmigung (${offen.length})`} innen="p-0"><AntragListe ctx={ctx} liste={offen} /></Karte>}
    <div className="grid xl:grid-cols-5 gap-5">
      <Karte titel="Urlaubsanträge" className={leitung ? "xl:col-span-3" : "xl:col-span-5"} innen="p-0">
        {liste.length === 0 ? <Leer text="Keine Urlaube in diesem Jahr." /> :
        <Tabelle kopf={["Mitarbeiter/in", "Zeitraum", { t: "Tage", cls: "text-right" }, "Status", ""]}>
          {liste.map(a => { const ma = db.mitarbeiter.find(m => m.id === a.maId); const darf = (a.maId === user.id && a.status === "beantragt") || (darfVerwalten(user, ma) && a.status !== "storniert" && a.status !== "abgelehnt" && a.von >= heute()); return <tr key={a.id}>
            <td className="px-3 py-2.5 font-medium whitespace-nowrap">{ma.name}</td>
            <td className="px-3 py-2.5 whitespace-nowrap tabular">{fmtZr(a.von, a.bis)}</td>
            <td className="px-3 py-2.5 text-right tabular">{urlaubsTage(db, ma, a.von, a.bis)}</td>
            <td className="px-3 py-2.5"><Badge status={a.status} />{a.entschiedenVon && a.status !== "beantragt" && <span className="block text-[11px] text-stone-500 mt-0.5">von {nameVon(db, a.entschiedenVon)}</span>}</td>
            <td className="px-3 py-2.5 text-right whitespace-nowrap">{darfVerwalten(user, ma) && a.status !== "storniert" && !gesperrt(db, a.maId, a.von) ? <Knopf klein art="geist" icon="stift" onClick={() => setBearbeiten(a)}>Bearbeiten</Knopf> : darf && <Knopf klein art="geist" onClick={() => stornieren(a)}>Stornieren</Knopf>}</td>
          </tr>; })}
        </Tabelle>}
      </Karte>
      {leitung && <Karte titel={`Urlaubskonten ${jahr}`} className="xl:col-span-2" innen="p-0">
        <Tabelle kopf={["Name", { t: "Anspr.", cls: "text-right" }, { t: "Verbr.", cls: "text-right" }, { t: "Gepl.", cls: "text-right" }, { t: "Rest", cls: "text-right" }]}>
          {sichtbar.filter(m => m.aktiv).map(m => { const k = urlaubsKonto(db, m, jahr); return <tr key={m.id}>
            <td className="px-3 py-2.5 whitespace-nowrap">{m.name}</td>
            <td className="px-3 py-2.5 text-right tabular">{k.anspruch + k.uebertrag}</td>
            <td className="px-3 py-2.5 text-right tabular">{k.konsumiert}</td>
            <td className="px-3 py-2.5 text-right tabular">{k.geplant}{k.beantragt ? <span className="text-amber-700"> +{k.beantragt}</span> : ""}</td>
            <td className={`px-3 py-2.5 text-right tabular font-semibold ${k.rest < 0 ? "text-rose-700" : ""}`}>{k.rest}</td>
          </tr>; })}
        </Tabelle>
        <p className="px-5 py-3 text-xs text-stone-500">Anspruch inkl. Übertrag. Urlaub verjährt nach § 4 Abs 5 UrlG zwei Jahre nach Ende des Urlaubsjahres, in dem er entstanden ist.</p>
      </Karte>}
    </div>
    {dialog && <AbwDialog ctx={ctx} modus="urlaub" onClose={() => setDialog(false)} />}
    {bearbeiten && <AbwDialog ctx={ctx} bestand={bearbeiten} onClose={() => setBearbeiten(null)} />}
  </div>;
}

// ─── KRANKENSTAND / ABWESENHEITEN ─────────────────────────────────────────────
function Krankenstand({ ctx }) {
  const { db, user, sichtbar, aendern } = ctx;
  const [dialog, setDialog] = useState(false);
  const [filterArt, setFilterArt] = useState("");
  const [gesund, setGesund] = useState(null);
  const jahr = new Date().getFullYear(), h = heute();
  const leitung = istLeitung(user);
  const alle = db.abwesenheiten.filter(a => a.art !== "urlaub" && sichtbar.some(m => m.id === a.maId));
  const laufend = alle.filter(a => wirksam(a) && a.von <= h && (!a.bis || a.bis >= h));
  const offen = alle.filter(a => a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId)));
  const liste = alle.filter(a => (!filterArt || a.art === filterArt) && a.art !== "berufsschule" || (filterArt === "berufsschule" && a.art === "berufsschule")).sort((a, b) => b.von.localeCompare(a.von));
  const [bsPlaner, setBsPlaner] = useState(false);
  const [bearbeiten, setBearbeiten] = useState(null);
  const lehrlinge = sichtbar.filter(m => m.aktiv && m.lehrbeginn);
  const darfBearbeiten = a => a.maId === user.id || darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId));

  function gesundMelden(a, bis) { aendern(n => { n.abwesenheiten.find(q => q.id === a.id).bis = bis; }, "Gesundmeldung eingetragen"); setGesund(null); }
  function auSetzen(a) { aendern(n => { const x = n.abwesenheiten.find(q => q.id === a.id); x.au = !x.au; }, "AU-Status geändert"); }
  function stornieren(a) { aendern(n => { n.abwesenheiten.find(q => q.id === a.id).status = "storniert"; }, "Eintrag storniert"); }

  return <div className="space-y-5">
    <Seitenkopf titel="Krankenstand & Abwesenheiten" sub="Krankmeldungen, Pflegefreistellung, Zeitausgleich, Berufsschule und mehr">
      {leitung && lehrlinge.length > 0 && <Knopf art="sekundaer" icon="kalender" onClick={() => setBsPlaner(true)}>Berufsschule planen</Knopf>}
      <Knopf icon="plus" onClick={() => setDialog(true)}>{leitung ? "Krankenstand / Urlaub eintragen" : "Krankmeldung / Abwesenheit"}</Knopf>
    </Seitenkopf>
    <div className="grid lg:grid-cols-2 gap-5">
      <Karte titel="Derzeit abwesend" innen="p-0">
        {laufend.length === 0 ? <Leer text="Aktuell niemand abwesend." /> : <ul className="divide-y divide-stone-100">
          {laufend.map(a => { const tag = tageZw(a.von, h).length; const auNoetig = KRANK_ARTEN.includes(a.art) && !a.au && tag >= db.einstellungen.auAbTag; return <li key={a.id} className="px-5 py-3">
            <div className="flex items-center justify-between gap-2"><span className="text-sm font-medium">{nameVon(db, a.maId)}</span><ArtChip art={a.art} /></div>
            <div className="text-xs text-stone-500 mt-0.5">{fmtZr(a.von, a.bis)} · {tag}. Tag{KRANK_ARTEN.includes(a.art) ? ` · AU ${a.au ? "liegt vor" : "fehlt"}` : ""}</div>
            {auNoetig && <div className="mt-2"><Hinweis ton="warn">AU-Bestätigung ab dem {db.einstellungen.auAbTag}. Tag erforderlich.</Hinweis></div>}
            {darfBearbeiten(a) && ARTEN[a.art].meldung && <div className="mt-2 flex flex-wrap gap-2 no-print">
              {gesund === a.id ? <GesundForm a={a} onOk={b => gesundMelden(a, b)} onAbbruch={() => setGesund(null)} /> : <>
                <Knopf klein art="sekundaer" icon="haken" onClick={() => setGesund(a.id)}>Gesund melden</Knopf>
                {KRANK_ARTEN.includes(a.art) && leitung && <Knopf klein art="geist" onClick={() => auSetzen(a)}>{a.au ? "AU zurücksetzen" : "AU erhalten"}</Knopf>}
              </>}
            </div>}
          </li>; })}
        </ul>}
      </Karte>
      {offen.length > 0 ? <Karte titel={`Zur Genehmigung (${offen.length})`} innen="p-0"><AntragListe ctx={ctx} liste={offen} /></Karte> :
        <Karte titel="Gut zu wissen" innen="p-5 space-y-2 text-sm text-stone-700">
          <p><b>Krankmeldung:</b> unverzüglich melden; eine Arbeitsunfähigkeitsbestätigung kann der Betrieb verlangen (§ 4 EFZG / § 8 Abs 8 AngG).</p>
          <p><b>Entgeltfortzahlung:</b> 6 Wochen voll, ab dem 2. Dienstjahr 8, ab dem 16. 10 und ab dem 26. 12 Wochen, danach 4 Wochen zur Hälfte – pro Arbeitsjahr.</p>
          <p><b>Pflegefreistellung:</b> bis zu einer Woche pro Arbeitsjahr (§ 16 UrlG).</p>
        </Karte>}
    </div>

    {lehrlinge.length > 0 && <Karte titel="Lehrlinge & Berufsschule" innen="p-0">
      <Tabelle kopf={["Name", "Lehrbeginn", "Lehrjahr", { t: "BS-Tage/Woche", cls: "text-right" }, "Geplant bis", "Nächster Schultag"]}>
        {lehrlinge.map(m => {
          const bs = db.abwesenheiten.filter(a => a.maId === m.id && a.art === "berufsschule" && wirksam(a));
          const bisD = bs.reduce((x, a) => a.von > x ? a.von : x, "");
          const naechster = bs.filter(a => a.von >= h).sort((a, b) => a.von.localeCompare(b.von))[0];
          const ljJetzt = lehrjahr(m, h), ljBis = bisD ? lehrjahr(m, bisD) : ljJetzt;
          return <tr key={m.id}>
            <td className="px-3 py-2.5 font-medium whitespace-nowrap">{m.name}</td>
            <td className="px-3 py-2.5 tabular">{fmtD(m.lehrbeginn)}</td>
            <td className="px-3 py-2.5">{ljJetzt ? `${ljJetzt}. Lehrjahr` : "–"}{ljBis && ljBis !== ljJetzt ? <span className="text-xs text-stone-500"> → {ljBis}. im Planzeitraum</span> : ""}</td>
            <td className="px-3 py-2.5 text-right tabular">{fmtTage(bsTageProWoche(db, m, h))}</td>
            <td className="px-3 py-2.5 tabular">{bisD ? fmtD(bisD) : <span className="text-amber-700">nichts geplant</span>}</td>
            <td className="px-3 py-2.5 tabular">{naechster ? `${fmtDk(naechster.von)}${anteil(naechster) < 1 ? " (½)" : ""}` : "–"}</td>
          </tr>;
        })}
      </Tabelle>
      <p className="px-5 py-3 text-xs text-stone-500">Berufsschulzeit gilt als Arbeitszeit und wird im Zeitkonto voll angerechnet, ein halber Schultag zur Hälfte – den Rest des Tages arbeitet der Lehrling im Salon.</p>
    </Karte>}

    {leitung && <Karte titel={`Krankenstandstage ${jahr}`} innen="p-0">
      <Tabelle kopf={["Name", { t: "Kalendertage", cls: "text-right" }, { t: "Fälle", cls: "text-right" }, { t: "Pflegefr.", cls: "text-right" }, { t: "Dienstjahre", cls: "text-right" }, { t: "EFZ voll", cls: "text-right" }]}>
        {sichtbar.filter(m => m.aktiv).map(m => {
          const kt = abwKalendertage(db, m, KRANK_ARTEN, `${jahr}-01-01`, `${jahr}-12-31`);
          const faelle = db.abwesenheiten.filter(a => a.maId === m.id && KRANK_ARTEN.includes(a.art) && wirksam(a) && a.von.startsWith(jahr)).length;
          const efz = efzWochen(m) * 7;
          return <tr key={m.id}>
            <td className="px-3 py-2.5 whitespace-nowrap">{m.name}</td>
            <td className="px-3 py-2.5 text-right tabular font-medium">{kt}</td>
            <td className="px-3 py-2.5 text-right tabular">{faelle}</td>
            <td className="px-3 py-2.5 text-right tabular">{abwKalendertage(db, m, ["pflege"], `${jahr}-01-01`, `${jahr}-12-31`)}</td>
            <td className="px-3 py-2.5 text-right tabular">{dienstjahre(m.eintritt)}</td>
            <td className="px-3 py-2.5 text-right tabular"><span className={kt > efz ? "text-rose-700 font-medium" : ""}>{efzWochen(m)} Wo.</span></td>
          </tr>;
        })}
      </Tabelle>
      <p className="px-5 py-3 text-xs text-stone-500">Kalenderjahr als Näherung. Die Entgeltfortzahlung rechnet nach Arbeitsjahr (ab Eintritt) – die Lohnverrechnung ist maßgeblich.</p>
    </Karte>}

    <Karte titel="Alle Einträge" aktion={<select className={`${inputKlein} py-1 text-xs`} value={filterArt} onChange={e => setFilterArt(e.target.value)}>
      <option value="">Alle Arten (ohne Berufsschule)</option>{Object.keys(ARTEN).filter(a => a !== "urlaub").map(a => <option key={a} value={a}>{ARTEN[a].label}</option>)}</select>} innen="p-0">
      {liste.length === 0 ? <Leer text="Keine Einträge." /> :
      <Tabelle kopf={["Mitarbeiter/in", "Art", "Zeitraum", { t: "Tage", cls: "text-right" }, "AU", "Status", ""]}>
        {liste.slice(0, 60).map(a => <tr key={a.id}>
          <td className="px-3 py-2.5 whitespace-nowrap font-medium">{nameVon(db, a.maId)}</td>
          <td className="px-3 py-2.5"><ArtChip art={a.art} /></td>
          <td className="px-3 py-2.5 whitespace-nowrap tabular">{fmtZr(a.von, a.bis)}</td>
          <td className="px-3 py-2.5 text-right tabular">{tageZw(a.von, a.bis || heute()).length}</td>
          <td className="px-3 py-2.5 text-xs">{KRANK_ARTEN.includes(a.art) ? (a.au ? "✓" : <span className="text-amber-700">fehlt</span>) : ""}</td>
          <td className="px-3 py-2.5"><Badge status={a.status} /></td>
          <td className="px-3 py-2.5 text-right whitespace-nowrap">{darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId)) && a.status !== "storniert" && !gesperrt(db, a.maId, a.von) ? <Knopf klein art="geist" icon="stift" onClick={() => setBearbeiten(a)}>Bearbeiten</Knopf> : darfBearbeiten(a) && a.status === "beantragt" && <Knopf klein art="geist" onClick={() => stornieren(a)}>Stornieren</Knopf>}</td>
        </tr>)}
      </Tabelle>}
    </Karte>
    {dialog && <AbwDialog ctx={ctx} modus={leitung ? "alle" : "abw"} onClose={() => setDialog(false)} />}
    {bearbeiten && <AbwDialog ctx={ctx} bestand={bearbeiten} onClose={() => setBearbeiten(null)} />}
    {bsPlaner && <BsPlaner ctx={ctx} lehrlinge={lehrlinge.filter(m => darfVerwalten(user, m))} onClose={() => setBsPlaner(false)} />}
  </div>;
}
function BsPlaner({ ctx, lehrlinge, onClose }) {
  const { db, user, aendern } = ctx;
  const h = heute();
  const schuljahrEnde = `${+h.slice(5, 7) >= 7 ? parseInt(h) + 1 : parseInt(h)}-06-30`;
  const [maId, setMaId] = useState(lehrlinge[0]?.id || "");
  const ma = db.mitarbeiter.find(m => m.id === maId);
  const [plan, setPlan] = useState(() => ma ? bsWochentage(db, ma) : { tag1: 1, tag2: 2 });
  const [von, setVon] = useState(h);
  const [bis, setBis] = useState(schuljahrEnde);
  const [ohneSommer, setOhneSommer] = useState(true);
  const [ersetzen, setErsetzen] = useState(true);
  if (!ma) return <Modal titel="Berufsschule planen" onClose={onClose}><Leer text="Keine Lehrlinge, für die du zuständig bist." /></Modal>;
  const termine = bis >= von ? bsTermine(db, ma, von, bis, plan, ohneSommer) : [];
  const bestehend = db.abwesenheiten.filter(a => a.maId === ma.id && a.art === "berufsschule" && a.status !== "storniert" && a.von >= von && a.von <= bis && !gesperrt(db, ma.id, a.von));
  const konflikt = termine.filter(t => db.abwesenheiten.some(a => a.maId === ma.id && a.art !== "berufsschule" && (wirksam(a) || a.status === "beantragt") && t.d >= a.von && t.d <= (a.bis || a.von)));
  const neu = termine.filter(t => !konflikt.includes(t) && !gesperrt(db, ma.id, t.d) && (ersetzen || !bestehend.some(a => a.von === t.d)));
  const ljListe = [...new Set(termine.map(t => lehrjahr(ma, t.d)))];
  function speichern() {
    aendern(n => {
      if (ersetzen) { const ids = new Set(bestehend.map(a => a.id)); n.abwesenheiten = n.abwesenheiten.filter(a => !ids.has(a.id)); }
      Object.assign(n.mitarbeiter.find(m => m.id === ma.id), { bsTag1: +plan.tag1, bsTag2: +plan.tag2 }); // fixe Schultage merken
      neu.forEach(t => n.abwesenheiten.push({ id: uid(), maId: ma.id, art: "berufsschule", von: t.d, bis: t.d, status: "genehmigt", anteil: t.anteil < 1 ? t.anteil : undefined, notiz: t.anteil < 1 ? "halber Schultag" : "", beantragtAm: h, erfasstVon: user.id, entschiedenVon: user.id }));
    }, `${neu.length} Berufsschultage eingetragen`);
    onClose();
  }
  const tagWahl = (k, label) => <Feld label={label}><select className={inputCls} value={plan[k]} onChange={e => setPlan({ ...plan, [k]: +e.target.value })}>
    {modellVon(db, ma).tage.map((x, i) => +x > 0 ? <option key={i} value={i}>{WT_LANG[i]}</option> : null)}</select></Feld>;
  return <Modal breit titel="Berufsschule planen" onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!neu.length && !(ersetzen && bestehend.length)}>{neu.length} Tage eintragen</Knopf></>}>
    <div className="grid sm:grid-cols-2 gap-4">
      <Feld label="Lehrling" breit><select className={inputCls} value={maId} onChange={e => { setMaId(e.target.value); const m = db.mitarbeiter.find(x => x.id === e.target.value); setPlan(bsWochentage(db, m)); }}>
        {lehrlinge.map(m => <option key={m.id} value={m.id}>{m.name} · {lehrjahr(m, h) || "–"}. Lehrjahr</option>)}</select></Feld>
      <Feld label="Von"><input type="date" className={inputCls} value={von} onChange={e => setVon(e.target.value)} /></Feld>
      <Feld label="Bis" hilfe="Standard: Ende des Schuljahres"><input type="date" className={inputCls} value={bis} min={von} onChange={e => setBis(e.target.value)} /></Feld>
      {tagWahl("tag1", "Schultag (ganzer Tag)")}
      {tagWahl("tag2", "Zusätzlicher halber Tag (1. Lehrjahr)")}
      <p className="text-xs text-stone-500 sm:col-span-2 -mt-2">Die gewählten Tage werden beim Lehrling als fixe Schultage gespeichert.</p>
      <label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={ohneSommer} onChange={e => setOhneSommer(e.target.checked)} />Sommerferien (Juli/August) auslassen</label>
      <label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={ersetzen} onChange={e => setErsetzen(e.target.checked)} />Bereits geplante Berufsschultage in diesem Zeitraum ersetzen ({bestehend.length})</label>
    </div>
    <div className="mt-4 space-y-2">
      <div className="rounded-[14px] bg-white ring-1 ring-inset ring-stone-200 p-3 text-sm">
        <b>{neu.length} Schultage</b> ({fmtTage(neu.reduce((s, t) => s + t.anteil, 0))} Tage gerechnet, davon {neu.filter(t => t.anteil < 1).length} halbe) · Lehrjahr {ljListe.join(" → ") || "–"}
        <div className="text-xs text-stone-500 mt-1">Regel: {Object.entries(db.einstellungen.bsTageJeLehrjahr).map(([lj, t]) => `${lj}. Lj. ${fmtTage(t)} Tag${+t === 1 ? "" : "e"}`).join(" · ")} pro Woche (änderbar unter Einstellungen). Feiertage werden übersprungen, ein Lehrjahreswechsel im Zeitraum wird automatisch berücksichtigt.</div>
      </div>
      {konflikt.length > 0 && <Hinweis ton="warn">{konflikt.length} Tage übersprungen, weil schon Urlaub oder eine andere Abwesenheit eingetragen ist.</Hinweis>}
      <Hinweis>Herbst-, Weihnachts-, Semester- und Osterferien der Berufsschule danach einzeln unter „Alle Einträge“ (Filter Berufsschule) stornieren.</Hinweis>
    </div>
  </Modal>;
}
function GesundForm({ a, onOk, onAbbruch }) {
  const [bis, setBis] = useState(addTage(heute(), -1) < a.von ? a.von : addTage(heute(), -1));
  return <div className="flex flex-wrap items-center gap-2 text-xs">
    <span>Letzter Abwesenheitstag:</span>
    <input type="date" className={`${inputKlein} py-1`} value={bis} min={a.von} onChange={e => setBis(e.target.value)} />
    <Knopf klein onClick={() => onOk(bis)}>Speichern</Knopf><Knopf klein art="geist" onClick={onAbbruch}>Abbrechen</Knopf>
  </div>;
}

// ─── MITARBEITER ──────────────────────────────────────────────────────────────
function MaDialog({ ctx, ma, onClose }) {
  const { db, user, aendern } = ctx;
  const neu = !ma;
  const [f, setF] = useState(ma ? { ...ma } : { id: uid(), name: "", personalnr: `P-${pad(db.mitarbeiter.length + 1).padStart(3, "0")}`, abteilung: "", funktion: "", eintritt: heute(), modellId: db.modelle[0].id, urlaubstage: 25, urlaubUebertrag: 0, saldoStart: 0, vorgesetzterId: user.id, rolle: "mitarbeiter", aktiv: true, kjbg: false });
  const set = (k, v) => setF({ ...f, [k]: v });
  const vorschlag = vorschlagUrlaubstage(db, f);
  const [planDlg, setPlanDlg] = useState(null);
  function planSpeichern(m, ab) {
    aendern(n => { modellUebernehmen(n, m, ab); if (planDlg.kopie) { const x = n.mitarbeiter.find(q => q.id === f.id); if (x) x.modellId = m.id; } }, `Dienstplan gespeichert${ab > "2000-01-01" ? ` (gültig ab ${fmtD(ab)})` : ""}`);
    if (planDlg.kopie) set("modellId", m.id);
    setPlanDlg(null);
  }
  const fehler = !f.name.trim() ? "Name fehlt." : db.mitarbeiter.some(m => m.id !== f.id && m.personalnr === f.personalnr) ? "Personalnummer bereits vergeben." : null;
  function speichern() {
    aendern(n => { const i = n.mitarbeiter.findIndex(m => m.id === f.id); const d = { ...f, urlaubstage: +f.urlaubstage || 0, urlaubUebertrag: +f.urlaubUebertrag || 0, saldoStart: +f.saldoStart || 0 }; if (i >= 0) n.mitarbeiter[i] = d; else n.mitarbeiter.push(d); }, neu ? "Mitarbeiter/in angelegt" : "Änderungen gespeichert");
    onClose();
  }
  return <Modal breit titel={neu ? "Neue/r Mitarbeiter/in" : f.name} onClose={onClose}
    fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={speichern} disabled={!!fehler}>Speichern</Knopf></>}>
    <div className="grid sm:grid-cols-2 gap-4">
      <Feld label="Name"><input className={inputCls} value={f.name} onChange={e => set("name", e.target.value)} /></Feld>
      <Feld label="Personalnummer"><input className={inputCls} value={f.personalnr} onChange={e => set("personalnr", e.target.value)} /></Feld>
      <Feld label="Abteilung"><input className={inputCls} list="abteilungen" value={f.abteilung} onChange={e => set("abteilung", e.target.value)} />
        <datalist id="abteilungen">{[...new Set(db.mitarbeiter.map(m => m.abteilung))].map(a => <option key={a} value={a} />)}</datalist></Feld>
      <Feld label="Funktion"><input className={inputCls} value={f.funktion} onChange={e => set("funktion", e.target.value)} /></Feld>
      <Feld label="Eintrittsdatum"><input type="date" className={inputCls} value={f.eintritt || ""} onChange={e => set("eintritt", e.target.value)} /></Feld>
      <Feld label="Austrittsdatum" hilfe="Leer lassen, solange beschäftigt."><input type="date" className={inputCls} value={f.austritt || ""} onChange={e => set("austritt", e.target.value || undefined)} /></Feld>
      <Feld label="Dienstplan" breit hilfe={`${fmtTage(wochenStd(modellVon(db, f)))} Wochenstunden · ${WT.map((t, i) => { const x = planAusModell(modellVon(db, f), i); return x ? `${t} ${x.b}–${x.e}${x.p ? ` (${x.p}′ Pause)` : ""}` : null; }).filter(Boolean).join(" · ")}`}>
        <select className={inputCls} value={f.modellId} onChange={e => set("modellId", e.target.value)}>{db.modelle.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select>
        <div className="mt-2 flex flex-wrap gap-2">
          <Knopf klein art="sekundaer" icon="stift" onClick={() => { const m = modellVon(db, f); setPlanDlg({ modell: { ...m, plan: WT.map((_, i) => planAusModell(m, i)) } }); }}>Dienstplan & Pausen bearbeiten</Knopf>
          <Knopf klein art="geist" icon="plus" onClick={() => { const m = modellVon(db, f); setPlanDlg({ kopie: true, modell: { ...m, id: uid(), name: `Dienstplan ${f.name.split(" ")[0] || "neu"}`, plan: WT.map((_, i) => planAusModell(m, i)), versionen: JSON.parse(JSON.stringify(m.versionen || [{ ab: "2000-01-01", plan: m.plan }])) } }); }}>Eigener Plan für diese Person</Knopf>
        </div>
      </Feld>
      <Feld label="Urlaubstage / Jahr" hilfe={`Vorschlag nach UrlG: ${vorschlag} (aliquot zu ${tageProWoche(modellVon(db, f))} Arbeitstagen/Woche${dienstjahre(f.eintritt) >= 25 ? ", 6. Urlaubswoche" : ""})`}>
        <div className="flex gap-2"><input type="number" className={inputCls} value={f.urlaubstage} onChange={e => set("urlaubstage", e.target.value)} />{+f.urlaubstage !== vorschlag && <Knopf art="sekundaer" klein onClick={() => set("urlaubstage", vorschlag)}>übernehmen</Knopf>}</div></Feld>
      <Feld label="Resturlaub Vorjahr"><input type="number" className={inputCls} value={f.urlaubUebertrag} onChange={e => set("urlaubUebertrag", e.target.value)} /></Feld>
      <Feld label="Vorgesetzte/r"><select className={inputCls} value={f.vorgesetzterId || ""} onChange={e => set("vorgesetzterId", e.target.value || null)}>
        <option value="">– keine/r –</option>{db.mitarbeiter.filter(m => m.id !== f.id && m.aktiv && m.rolle !== "mitarbeiter").map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></Feld>
      <Feld label="Rolle"><select className={inputCls} value={f.rolle} disabled={!istAdmin(user) || f.id === user.id} onChange={e => set("rolle", e.target.value)}>{Object.entries(ROLLEN).map(([k, r]) => <option key={k} value={k}>{r.label}</option>)}</select></Feld>
      <Feld label="Geburtsdatum" hilfe={f.geburtsdatum ? (jugendlich(f, heute()) ? `Unter 18 – KJBG-Regeln gelten bis ${fmtD(`${parseInt(f.geburtsdatum) + 18}${f.geburtsdatum.slice(4)}`)}, danach automatisch AZG` : "Volljährig – es gilt das AZG") : "Für Lehrlinge wichtig: bis 18 gelten automatisch die strengeren KJBG-Regeln"}>
        <input type="date" className={inputCls} value={f.geburtsdatum || ""} onChange={e => set("geburtsdatum", e.target.value || undefined)} /></Feld>
      {f.lehrbeginn && <Feld label="Lehrbeginn" hilfe={`Derzeit ${lehrjahr(f, heute()) || "–"}. Lehrjahr · Berufsschule ${fmtTage(bsTageProWoche(db, f, heute()))} Tag(e)/Woche`}>
        <input type="date" className={inputCls} value={f.lehrbeginn} onChange={e => set("lehrbeginn", e.target.value || undefined)} /></Feld>}
      {f.lehrbeginn && <Feld label="Fixe Berufsschultage" hilfe="Ganzer Tag · halber Tag (nur im 1. Lehrjahr)">
        <div className="flex gap-2">
          <select className={inputCls} value={bsWochentage(db, f).tag1} onChange={e => set("bsTag1", +e.target.value)}>{WT_LANG.map((t, i) => <option key={i} value={i}>{t}</option>)}</select>
          <select className={inputCls} value={bsWochentage(db, f).tag2} onChange={e => set("bsTag2", +e.target.value)}>{WT_LANG.map((t, i) => <option key={i} value={i}>{t}</option>)}</select>
        </div></Feld>}
      <Feld label="Zeitkonto-Übertrag (Minuten)" hilfe="Saldo aus dem alten System beim Start"><input type="number" className={inputCls} value={f.saldoStart} onChange={e => set("saldoStart", e.target.value)} /></Feld>
      <div className="space-y-2 pt-5">
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!f.lehrbeginn} onChange={e => set("lehrbeginn", e.target.checked ? (f.eintritt || heute()) : undefined)} />Lehrling</label>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={f.aktiv} disabled={f.id === user.id} onChange={e => set("aktiv", e.target.checked)} />Aktiv (kann sich anmelden)</label>
      </div>
    </div>
    {fehler && <p className="mt-3 text-xs text-rose-700">{fehler}</p>}
    {planDlg && <ModellDialog db={db} modell={planDlg.modell} oz={db.einstellungen.oeffnungszeiten} neu={false} onSave={planSpeichern} onClose={() => setPlanDlg(null)} />}
  </Modal>;
}
function Mitarbeiter({ ctx }) {

      {istLeitung(user) && <><input className={`${inputKlein} w-48`} placeholder="Suchen …" value={suche} onChange={e => setSuche(e.target.value)} />
        <label className="flex items-center gap-1.5 text-sm text-stone-600"><input type="checkbox" checked={nurAktiv} onChange={e => setNurAktiv(e.target.checked)} />nur aktive</label></>}

        {liste.map(m => { const konto = zeitkonto(db, m, heute()); const k = urlaubsKonto(db, m, jahr); return <tr key={m.id} className={m.aktiv ? "" : "text-stone-400"}>
          <td className="px-3 py-2.5"><div className="flex items-center gap-2.5"><Avatar name={m.name} klein /><div><div className="font-medium whitespace-nowrap">{m.name}{m.lehrbeginn && lehrjahr(m, heute()) && <span className="ml-1.5 text-[10px] font-semibold text-stone-700 bg-stone-100 rounded px-1">{lehrjahr(m, heute())}. Lj.</span>}{jugendlich(m, heute()) && <span className="ml-1.5 text-[10px] font-semibold text-indigo-700 bg-indigo-50 rounded px-1" title="unter 18 – KJBG">KJBG</span>}</div><div className="text-xs text-stone-500">{m.funktion}</div></div></div></td>
