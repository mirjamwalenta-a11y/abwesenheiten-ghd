const pad = n => String(n).padStart(2, "0");

function tageImMonat(mk) { const [y, m] = mk.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${mk}-${pad(i+1)}`); }

  "Ende der Lehrzeit", "Lösung in der Probezeit", "Entlassung", "Vorzeitiger Austritt", "Pensionierung", "Sonstiges"];

  return { von: k.von, bis: k.bis, teil: k.teil ?? k.anspruch, jahresanspruch: k.jahresanspruch, uebertrag: k.uebertrag, imStart: k.imStart,
    verbraucht: k.konsumiert + k.geplant, tage: tageZw(k.von, ma.austritt).length, tageUJ: k.ujTage, offen: k.rest };
}
// Jahresabschluss: alle, die im Jahr beschäftigt waren – Stand 31.12. bzw. letzter Arbeitstag
function jahresDaten(db, jahr) {
  const von = `${jahr}-01-01`, bis = `${jahr}-12-31`;
  const personen = db.mitarbeiter.filter(m => (!m.eintritt || m.eintritt <= bis) && (!m.austritt || m.austritt >= von))
    .sort((a, b) => (a.personalnr || "").localeCompare(b.personalnr || ""));
  const zeilen = personen.map(m => {
    const ausgetreten = !!m.austritt && m.austritt <= bis;
    const stichtag = ausgetreten ? m.austritt : bis;
    // Urlaub im Urlaubsjahr (ab Eintrittsdatum), in dem der Stichtag liegt – nur Urlaub bis zum Stichtag
    const k = urlaubsKonto(db, m, stichtag, { stichtag: true });
    const start = m.eintritt && m.eintritt > von ? m.eintritt : von;
    const aliquot = k.anteilig, anspruch = k.imStart ? k.jahresanspruch : k.anspruch;
    const verbraucht = k.konsumiert + k.geplant, offen = k.rest;
    const faelle = db.abwesenheiten.filter(a => a.maId === m.id && KRANK_ARTEN.includes(a.art) && wirksam(a) && a.von <= stichtag && (a.bis || heute()) >= von);
    const krankAT = tageZw(von, stichtag).filter(d => { const a = abwAm(db, m.id, d); return a && KRANK_ARTEN.includes(a.art) && sollMin(db, m, d) > 0; }).length;
    const arztMin = db.abwesenheiten.filter(a => a.maId === m.id && a.art === "arzt" && wirksam(a) && a.von >= von && a.von <= stichtag).reduce((s, a) => s + (+a.minuten || 0), 0);
    const arbeitstage = tageZw(start, stichtag).filter(d => sollMin(db, m, d) > 0).length;
    const urlaubImKJ = db.abwesenheiten.filter(a => a.maId === m.id && a.art === "urlaub" && wirksam(a)).reduce((n, a) => {
      const v = a.von > start ? a.von : start, b = (a.bis || a.von) < stichtag ? (a.bis || a.von) : stichtag; return n + (v <= b ? urlaubsTage(db, m, v, b) : 0); }, 0);
    return { m, ausgetreten, stichtag, start, arbeitstageOhneUrlaub: Math.max(0, arbeitstage - urlaubImKJ), anspruchJahr: k.jahresanspruch, anspruch, aliquot,
      uebertrag: k.imStart ? null : k.uebertrag, startbestand: k.imStart ? k.uebertrag : null, ujVon: k.von, ujBis: k.bis, verbraucht, offen,
      krankKT: abwKalendertage(db, m, ["krank"], von, stichtag), unfallKT: abwKalendertage(db, m, ["unfall"], von, stichtag), krankAT, faelle,
      pflegeKT: abwKalendertage(db, m, ["pflege"], von, stichtag), arztMin, konto: zeitkonto(db, m, stichtag < heute() ? stichtag : heute()) };
  });
  const amStichtag = d => db.mitarbeiter.filter(m => (!m.eintritt || m.eintritt <= d) && (!m.austritt || m.austritt >= d)).length;
  return { jahr, von, bis, zeilen, stand0101: amStichtag(von), stand3112: amStichtag(bis),
    eintritte: personen.filter(m => m.eintritt >= von && m.eintritt <= bis).length, austritte: zeilen.filter(z => z.ausgetreten).length,
    vorlaeufig: bis >= heute() };
}

function fmtZrKurz(v, b) {
  if (!b || v === b) return fmtD(v);
  return v.slice(0, 4) === b.slice(0, 4) ? `${fmtD(v).slice(0, 6)} - ${fmtD(b)}` : `${fmtD(v)} - ${fmtD(b)}`;

// ─── AUTOMATIK (fixer Dienstplan) ─────────────────────────────────────────────
// Ergänzt vergangene Tage laut Plan: vergessenes Gehen, fehlende Pause, ganz vergessene Tage.
// Live-Version: läuft jede Nacht als Serverfunktion (zeit_automatik, siehe Schema-Entwurf).
// Jede Ergänzung ist markiert und steht im Protokoll; der Monat wird erst nach Prüfung bestätigt.
function automatik(n) {
  const e = n.einstellungen, h = heute();
  const ab = addTage(h, -62) > (e.kontoStart || "") ? addTage(h, -62) : e.kontoStart;
  let anzahl = 0;
  const log = (ma, d, was, alt, neu) => { anzahl++; n.protokoll.push({ id: uid(), am: new Date().toISOString(), von: "system", maId: ma.id, datum: d, aktion: `automatisch ergänzt: ${was}`, alt, neu, grund: "laut Dienstplan (nicht gestempelt)" }); };
  for (const ma of n.mitarbeiter.filter(m => m.aktiv || m.austritt)) {
    for (let d = ab; d <= h; d = addTage(d, 1)) {
      if (!beschaeftigt(ma, d) || feiertag(d) || gesperrt(n, ma.id, d)) continue;
      const plan = planTag(n, ma, d); if (!plan) continue;
      // heute erst, wenn das Dienstende laut Plan + Wartezeit vorbei ist
      if (d === h && hm2min(nowHM()) < hm2min(plan.e) + (e.autoGehenNachMin ?? 60)) continue;
      const a = abwAm(n, ma.id, d);
      if (a && (!teilTag(a) || ARTEN[a.art]?.soll0)) continue;
      let z = zeitAm(n, ma.id, d);
      if (!z) {
        if (!e.autoFehltag) continue;
        // halber Abwesenheitstag (z. B. Berufsschule vormittags): nur der Rest bis Dienstende
        const rest = modellSollMin(n, ma, d) - (a ? gutMin(a, modellSollMin(n, ma, d)) : 0);
        // Restarbeitszeit nach Schule/Arzt: Pause laut Plan nur, wenn der Rest sie gesetzlich braucht
        const restPause = a ? (rest > (jugendlich(ma, d) ? e.kjbgPauseAbMin : e.pauseAbMin) ? Math.max(+plan.p || 0, e.pauseMin) : 0) : (+plan.p || 0);
        const beginn = a ? min2hm(hm2min(plan.e) - rest - restPause) : plan.b;
        z = { id: uid(), maId: ma.id, datum: d, beginn, ende: plan.e, pause: restPause, quelle: "auto", auto: ["tag"] };
        n.zeiten.push(z); log(ma, d, "ganzer Tag", null, { beginn: z.beginn, ende: z.ende, pause: z.pause });
        continue;
      }
      if (!z.ende && e.autoGehen) {
        const alt = { beginn: z.beginn, ende: null, pause: z.pause };
        z.ende = hm2min(plan.e) > hm2min(z.beginn) ? plan.e : z.beginn;
        if (z.pauseStart) { z.pause += Math.max(0, hm2min(z.ende) - hm2min(z.pauseStart)); z.pauseStart = null; }
        z.auto = [...(z.auto || []), "gehen"]; log(ma, d, "Gehen", alt, { beginn: z.beginn, ende: z.ende, pause: z.pause });
      }
      if (autoPauseAktiv(e) && pauseFehlt(n, ma, z)) {
        const alt = { beginn: z.beginn, ende: z.ende, pause: z.pause };
        z.pause = Math.max(+plan.p || 0, e.pauseMin);
        z.auto = [...(z.auto || []), "pause"]; log(ma, d, "Pause", alt, { beginn: z.beginn, ende: z.ende, pause: z.pause });
      }
    }
  }
  return anzahl;
}

// Stempeln (Handy-Stempeluhr und Salon-Tablet nutzen dieselbe Logik)
function stempelBuchen(n, ma, aktion) {
  const d = heute(), t = nowHM(), plan = planTag(n, ma, d), vn = ma.name.split(" ")[0];
  let x = n.zeiten.find(q => q.maId === ma.id && q.datum === d);
  if (aktion === "kommen") {
    const b = aufPlanRunden(n.einstellungen, plan, t, "b");
    n.zeiten.push({ id: uid(), maId: ma.id, datum: d, beginn: b, ende: null, pause: 0, pauseStart: null, quelle: "stempel", ...(b !== t ? { roh: { beginn: t } } : {}) });
    const kaffee = kaffeeText(plan, t);
    return kaffee ? `Guten Morgen ${vn}! ${kaffee}` : `${vn}: Kommen ${t}${b !== t ? ` (zählt ab ${b} laut Plan)` : ""}`;
  }
  if (aktion === "nurGehen") { // Kommen vergessen → Beginn laut Plan
    x = { id: uid(), maId: ma.id, datum: d, beginn: plan?.b || t, ende: null, pause: 0, pauseStart: null, quelle: "stempel", auto: ["kommen"] };
    n.zeiten.push(x); aktion = "gehen";
  }
  if (aktion === "pauseStart") { x.pauseStart = t; return `${vn}: Pause ab ${t}`; }
  if (aktion === "pauseEnde") { x.pause += Math.max(0, hm2min(t) - hm2min(x.pauseStart)); x.pauseStart = null; return `${vn}: Pause beendet (${t})`; }
  if (aktion === "gehen") {
    if (x.pauseStart) { x.pause += Math.max(0, hm2min(t) - hm2min(x.pauseStart)); x.pauseStart = null; }
    x.ende = aufPlanRunden(n.einstellungen, plan, t, "e");
    if (x.ende !== t) x.roh = { ...(x.roh || {}), ende: t };
    const ab = abschied(n, ma, d);
    let msg = `Danke ${vn}! ${ab.text} ${ab.em} (Gehen ${t}${x.ende !== t ? `, zählt bis ${x.ende}` : ""})`;
    if (x.auto?.includes("kommen")) msg += ` · Beginn ${x.beginn} laut Plan`;
    if (autoPauseAktiv(n.einstellungen) && pauseFehlt(n, ma, x)) {
      x.pause = Math.max(+plan?.p || 0, n.einstellungen.pauseMin);
      x.auto = [...(x.auto || []), "pause"];
      msg += ` · Pause ${x.pause} min laut Plan eingetragen`;
    }
    return msg;
  }
}

  const ma5Tage = zeiten.filter(z => z.maId === "ma5" && monatKey(z.datum) === m1);
  if (ma5Tage[3]) { ma5Tage[3].pause = 15; }
  const ma3Tage = zeiten.filter(z => z.maId === "ma3" && monatKey(z.datum) === m1);
  if (ma3Tage[6]) { ma3Tage[6].beginn = "08:30"; ma3Tage[6].ende = "19:00"; ma3Tage[6].pause = 60; }
  // Vergessenes Stempeln im offenen Monat – die Automatik ergänzt das beim Start
  const offen = zeiten.filter(z => z.datum >= `${m1}-01` && z.datum < h);
  [3, 11, 19].forEach(i => { if (offen[i]) offen[i].ende = null; });
  [5, 14].forEach(i => { if (offen[i]) offen[i].pause = 0; });
  [8, 22, 30].forEach(i => { const z = offen[i]; if (z) zeiten.splice(zeiten.indexOf(z), 1); });

  // Heute: wer laut Modell arbeitet, ist schon eingestempelt (außer der Inhaberin – zum Ausprobieren)
  for (const ma of mitarbeiter) {
    if (ma.id === "ma1" || !ma.aktiv) continue;
    const mod = modellVon(db0, ma);
    if (!+mod.tage[wd(h)] || feiertag(h) || abwAm(db0, ma.id, h)) continue;
    const b = hm2min(planAusModell(mod, wd(h)).b);
    if (jetzt.getHours() * 60 + jetzt.getMinutes() < b) continue;
    zeiten.push({ id: uid(), maId: ma.id, datum: h, beginn: min2hm(b), ende: null, pause: 0, pauseStart: null, quelle: "stempel" });
  }

  // Monatsabschluss: vorletzter Monat abgeschlossen, letzter Monat teilweise bestätigt
  const abschluesse = [];
  for (const ma of mitarbeiter.filter(m => beschaeftigt(m, `${m0}-01`))) {
    abschluesse.push({ maId: ma.id, monat: m0, bestaetigtAm: `${m1}-02`, abgeschlossenAm: `${m1}-03`, abgeschlossenVon: "ma1" });
  }
  abschluesse.push({ maId: "ma3", monat: m1, bestaetigtAm: `${m2}-01` });
  abschluesse.push({ maId: "ma4", monat: m1, bestaetigtAm: `${m2}-02` });

  // Offener Korrekturantrag
  const letzteJulia = zeiten.filter(z => z.maId === "ma3" && z.ende && z.datum < h && !abschluesse.some(a => a.maId === "ma3" && a.monat === monatKey(z.datum) && a.abgeschlossenAm)).slice(-1)[0];
  const korrekturen = [];
  if (letzteJulia && letzteJulia.ende) korrekturen.push({ id: uid(), maId: "ma3", datum: letzteJulia.datum, zeitId: letzteJulia.id,
    alt: { beginn: letzteJulia.beginn, ende: letzteJulia.ende, pause: letzteJulia.pause },
    neu: { beginn: letzteJulia.beginn, ende: min2hm(hm2min(letzteJulia.ende) + 30), pause: letzteJulia.pause },
    grund: "Letzte Kundin hat länger gedauert, Ausstempeln vergessen.", status: "offen", von: "ma3", am: h });

  const personalLog = [{ id: uid(), am: `${m0}-01T10:00:00.000Z`, von: "ma1", maId: "ma8", aktion: "Austritt eingetragen", details: `letzter Arbeitstag ${fmtD(`${m0}-15`)} · Kündigung durch Arbeitnehmer/in · Urlaub offen 3,5 Tage · Zeitkonto +1:20 h` }];
  const db1 = { ...db0, zeiten, abschluesse, korrekturen, personalLog, version: 1 };
  automatik(db1);
  return db1;
}

// Prototyp: Dateien liegen in IndexedDB dieses Browsers. Live: privater Storage-Bucket,
// lesbar nur für die Person selbst und die Leitung (siehe Schema-Entwurf).
const BelegSpeicher = {
  _db: null,
  oeffnen() {
    if (!this._db) this._db = new Promise((ok, fehler) => {
      const r = indexedDB.open("ghd-zeitverwaltung-belege", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("dateien");
      r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error);
    });
    return this._db;
  },
  async tx(modus, fn) {
    const d = await this.oeffnen();
    return new Promise((ok, fehler) => { const t = d.transaction("dateien", modus); const r = fn(t.objectStore("dateien")); t.oncomplete = () => ok(r?.result); t.onerror = () => fehler(t.error); });
  },
  put(id, blob) { return this.tx("readwrite", s => s.put(blob, id)); },
  get(id) { return this.tx("readonly", s => s.get(id)); },
  del(id) { return this.tx("readwrite", s => s.delete(id)); },
};
// Fotos auf max. 1600 px verkleinern (Handyfotos haben sonst mehrere MB)
async function belegVorbereiten(file) {
  if (!file.type.startsWith("image/")) return { blob: file, name: file.name, typ: file.type || "application/pdf" };
  try {
    const bild = await createImageBitmap(file), f = Math.min(1, 1600 / Math.max(bild.width, bild.height));
    const c = document.createElement("canvas"); c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
    c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
    return { blob, name: file.name.replace(/\.[^.]+$/, "") + ".jpg", typ: "image/jpeg" };
  } catch (e) { return { blob: file, name: file.name, typ: file.type }; }
}
// data:-URL → Blob ohne fetch (die Seite erlaubt keine Netzwerkzugriffe, CSP connect-src)
function dataUrlZuBlob(durl) {
  const [kopf, b64] = durl.split(","), typ = (kopf.match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: typ });
}
async function belegeSpeichern(files, vonId) {
  const metas = [];
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) throw new Error(`„${file.name}“ ist größer als 10 MB.`);
    const v = await belegVorbereiten(file), id = uid();
    await BelegSpeicher.put(id, v.blob);
    metas.push({ id, name: v.name, typ: v.typ, groesse: v.blob.size, am: new Date().toISOString(), von: vonId });
  }
  return metas;
}
async function belegOeffnen(meta) {
  const blob = await BelegSpeicher.get(meta.id);
  if (!blob) { alert("Die Datei ist in diesem Browser nicht vorhanden (z. B. auf einem anderen Gerät hochgeladen)."); return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener"; a.download = meta.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

    <div className="flex justify-center gap-4 mb-6">{[0, 1, 2, 3].map(i => <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all ${i < pin.length ? (dunkel ? "border-gold-500 bg-gold-500" : "border-stone-900 bg-stone-900") : "border-stone-300"}`} />)}</div>
    <div className="grid grid-cols-3 gap-3 max-w-xs mx-auto w-full">
      {["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"].map((k, i) => k === "" ? <div key={i} /> :
        <button key={i} onClick={() => tipp(k)} className={`h-14 rounded-2xl text-xl font-semibold transition-all active:scale-95 ${k === "del" ? "text-stone-500 hover:bg-stone-100" : "bg-white border border-stone-200 text-stone-900 hover:border-gold-500"}`}>{k === "del" ? "⌫" : k}</button>)}
    </div>
  </div>;
}
