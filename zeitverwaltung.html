// Erster Start durch die Chefin: Standard-Dienstpläne anlegen, allen ohne Plan „Vollzeit“
// bzw. „Lehrling“ zuordnen und den Start der Zeitverwaltung (Zeitkonto, Automatik) festhalten
async function liveEinrichten(sb, { db, ohnePlan }) {
  let geaendert = false, mod = db.modelle;
  if (!mod.length) {
    for (const m of standardModelle()) {
      const id = crypto.randomUUID();
      await sbq(sb.from("zeit_arbeitsmodelle").insert({ id, name: m.name }));
      await sbq(sb.from("zeit_modell_tage").insert(m.plan.map((t, i) => t && { modell_id: id, gueltig_ab: "2000-01-01", wochentag: i, beginn: t.b, ende: t.e, pause_min: +t.p || 0 }).filter(Boolean)));
      mod = [...mod, { id, name: m.name }];
    }
    geaendert = true;
  }
  const vz = mod.find(m => /vollzeit/i.test(m.name)) || mod[0], le = mod.find(m => /lehrling/i.test(m.name)) || vz;
  for (const id of ohnePlan) {
    const m = db.mitarbeiter.find(x => x.id === id); if (!m?.aktiv) continue;
    await sbq(sb.from("zeit_modell_zuordnung").upsert({ person_id: id, gueltig_ab: "2000-01-01", modell_id: urlaubsGruppe(m) === "lehrling" ? le.id : vz.id }));
    geaendert = true;
  }
  if (!db.einstellungen.kontoStart) {
    await sbq(sb.from("abw_einstellungen").upsert({ schluessel: "zeitverwaltung", wert: { ...db.einstellungen, kontoStart: heute() } }));
    geaendert = true;
  }
  return geaendert;
}

// Änderungen der Oberfläche (alt → neu) in die Datenbank schreiben – nur über die
// Wege, die der Server erlaubt. Danach wird immer neu geladen.
async function liveSpeichern(sb, alt, neu, user) {
  const ich = user.id, chefin = istAdmin(user);
  const gleich = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  const nachId = l => Object.fromEntries((l || []).map(x => [x.id, x]));
  const neuProt = (neu.protokoll || []).filter(p => !(alt.protokoll || []).some(q => q.id === p.id));
  const grundFuer = (maId, datum, std) => neuProt.find(p => p.maId === maId && p.datum === datum && p.grund)?.grund || std;
  // Einstellungen (nur Chefin – RLS auf abw_einstellungen)
  if (!gleich(alt.einstellungen, neu.einstellungen)) await sbMuss(sb.from("abw_einstellungen").upsert({ schluessel: "zeitverwaltung", wert: neu.einstellungen }).select("schluessel"), "Nur die Chefin darf Einstellungen ändern.");
  // Dienstpläne mit Versionen (gültig ab)
  for (const m of neu.modelle) {
    const a = alt.modelle.find(x => x.id === m.id);
    if (a && a.name === m.name && gleich(a.versionen, m.versionen)) continue;
    await sbMuss(sb.from("zeit_arbeitsmodelle").upsert({ id: m.id, name: m.name }).select("id"), "Nur Chefin/Leitung dürfen Dienstpläne ändern.");
    const vsNeu = m.versionen || [{ ab: "2000-01-01", plan: m.plan }], vsAlt = a?.versionen || [];
    for (const v of vsNeu) {
      if (gleich(vsAlt.find(x => x.ab === v.ab)?.plan, v.plan)) continue;
      await sbq(sb.from("zeit_modell_tage").delete().eq("modell_id", m.id).eq("gueltig_ab", v.ab));
      const zeilen = v.plan.map((t, i) => t && t.b && t.e ? { modell_id: m.id, gueltig_ab: v.ab, wochentag: i, beginn: t.b, ende: t.e, pause_min: +t.p || 0, pause_beginn: t.pb || null } : null).filter(Boolean);
      if (zeilen.length) await sbq(sb.from("zeit_modell_tage").insert(zeilen));
    }
    for (const v of vsAlt) if (!vsNeu.some(x => x.ab === v.ab)) await sbq(sb.from("zeit_modell_tage").delete().eq("modell_id", m.id).eq("gueltig_ab", v.ab));
  }
  // Mitarbeiter/innen: Stammdaten in abw_team (wie Abwesenheiten-App) und zeit_profil
  const PROFIL = { personalnr: "personalnr", abteilung: "abteilung", funktion: "funktion", vorgesetzterId: "vorgesetzter_id", geburtsdatum: "geburtsdatum",
    urlaubStart: "urlaub_start", urlaubStartAm: "urlaub_start_am", austrittArt: "austritt_art", austrittNotiz: "austritt_notiz", lehrbeginn: "lehrbeginn",
    bsTag1: "bs_tag1", bsTag2: "bs_tag2", saldoStart: "saldo_start_min", urlaubsGruppe: "urlaub_gruppe" };
  for (const m of neu.mitarbeiter) {
    const a = alt.mitarbeiter.find(x => x.id === m.id);
    if (!a) throw new Error("Neue Mitarbeiter/innen bitte in der Abwesenheiten-App anlegen – dort bekommen sie ihre PIN.");
    if (gleich(a, m)) continue;
    if (a.name !== m.name) throw new Error("Namen bitte in der Abwesenheiten-App ändern – der Name ist Teil der Anmeldung.");
    const team = {};
    if ((a.eintritt || null) !== (m.eintritt || null)) team.eintrittsdatum = m.eintritt || null;
    if (+a.urlaubstage !== +m.urlaubstage) team.urlaub_anspruch = +m.urlaubstage || 0;
    if ((a.austritt || null) !== (m.austritt || null)) team.ausgeschieden_am = m.austritt || null;
    if (Object.keys(team).length) await sbMuss(sb.from("abw_team").update(team).eq("id", m.id).select("id"), "Nur die Chefin darf Stammdaten ändern.");
    if (Object.keys(PROFIL).some(k => !gleich(a[k] === "" ? null : a[k], m[k] === "" ? null : m[k]))) {
      const zeile = { person_id: m.id };
      Object.entries(PROFIL).forEach(([k, sp]) => { const v = m[k]; zeile[sp] = v === undefined || v === "" ? null : v; });
      zeile.saldo_start_min = Math.round(+m.saldoStart || 0);
      if (zeile.urlaub_start !== null) zeile.urlaub_start = +zeile.urlaub_start;
      await sbMuss(sb.from("zeit_profil").upsert(zeile).select("person_id"), "Keine Berechtigung für dieses Profil.");
    }
    if (a.modellId !== m.modellId) await sbMuss(sb.from("zeit_modell_zuordnung").upsert({ person_id: m.id, gueltig_ab: heute(), modell_id: m.modellId }).select("person_id"), "Keine Berechtigung für den Dienstplan.");
  }
  for (const l of (neu.personalLog || []).filter(l => !(alt.personalLog || []).some(q => q.id === l.id)))
    await sbq(sb.from("zeit_personal_verlauf").insert({ person_id: l.maId, von_person: ich, aktion: l.aktion, details: l.details || null }));
  // Außentermine (nur Chefin – RLS)
  const aA = nachId(alt.aussentermine), aN = nachId(neu.aussentermine);
  for (const x of neu.aussentermine || []) if (!aA[x.id]) await sbMuss(sb.from("zeit_aussentermine").insert({ person_id: x.maId, datum: x.datum, notiz: x.notiz || null, angelegt_von: ich }).select("person_id"), "Nur die Chefin darf Außentermine freigeben.");
  for (const x of alt.aussentermine || []) if (!aN[x.id]) await sbMuss(sb.from("zeit_aussentermine").delete().eq("person_id", x.maId).eq("datum", x.datum).select("person_id"), "Nur die Chefin darf Außentermine entfernen.");
  // Korrekturanträge: stellen (Mitarbeiter/in) oder entscheiden (Leitung, Server übernimmt die Zeit)
  const erledigt = new Set(), kA = nachId(alt.korrekturen);
  for (const k of neu.korrekturen) {
    const a = kA[k.id];
    if (!a) { await sbq(sb.from("zeit_korrekturen").insert({ person_id: k.maId, datum: k.datum, neu_beginn: k.neu?.beginn || null, neu_ende: k.neu?.ende || null, neu_pause_min: k.neu ? +k.neu.pause || 0 : null, grund: k.grund, beantragt_von: ich })); continue; }
    if (a.status === "offen" && k.status !== "offen") { await sbq(sb.rpc("zeit_korrektur_entscheiden", { p_id: k.id, p_genehmigt: k.status === "genehmigt" })); erledigt.add(`${k.maId}|${k.datum}`); }
  }
  // Arbeitszeiten ändern (Chefin/Leitung) – immer über zeit_buchung_aendern: mit Grund, protokolliert
  const schl = z => `${z.maId}|${z.datum}`;
  const zA = Object.fromEntries(alt.zeiten.map(z => [schl(z), z])), zN = Object.fromEntries(neu.zeiten.map(z => [schl(z), z]));
  for (const k of new Set([...Object.keys(zA), ...Object.keys(zN)])) {
    if (erledigt.has(k)) continue;
    const a = zA[k], n = zN[k], [maId, datum] = k.split("|");
    if (a && n && a.beginn === n.beginn && a.ende === n.ende && +a.pause === +n.pause) continue;
    if (!darfVerwalten(user, neu.mitarbeiter.find(m => m.id === maId)) && !chefin) continue; // Nebeneffekt bei Mitarbeiter/innen – zählt nur der Server
    const grund = grundFuer(maId, datum, "Korrektur");
    if (!n) await sbq(sb.rpc("zeit_buchung_aendern", { p_person: maId, p_datum: datum, p_beginn: null, p_ende: null, p_pause_min: null, p_grund: grund, p_loeschen: true }));
    else await sbq(sb.rpc("zeit_buchung_aendern", { p_person: maId, p_datum: datum, p_beginn: n.beginn, p_ende: n.ende, p_pause_min: +n.pause || 0, p_grund: grund, p_loeschen: false }));
  }
  // Monatsabschluss
  const mk = a => `${a.maId}|${a.monat}`, bA = Object.fromEntries(alt.abschluesse.map(a => [mk(a), a]));
  for (const b of neu.abschluesse) {
    const a = bA[mk(b)] || {}, monat = `${b.monat}-01`;
    if (!a.bestaetigtAm && b.bestaetigtAm && b.maId === ich) await sbq(sb.rpc("zeit_monat_bestaetigen", { p_monat: monat }));
    if (!a.abgeschlossenAm && b.abgeschlossenAm) await sbq(sb.rpc("zeit_monat_abschliessen", { p_person: b.maId, p_monat: monat }));
    if (a.abgeschlossenAm && !b.abgeschlossenAm) await sbq(sb.rpc("zeit_monat_oeffnen", { p_person: b.maId, p_monat: monat, p_grund: neuProt.find(p => p.maId === b.maId && p.grund)?.grund || "wieder geöffnet" }));
  }
  // Urlaub, Krankenstand & Co. – dieselbe Tabelle wie die Abwesenheiten-App
  const zeile = x => ({ person_id: x.maId, typ: artTyp(x.art), zeit_art: x.art, von: x.von, bis: x.bis || x.von, offen: !x.bis,
    status: !chefin || x.status === "beantragt" ? "ausstehend" : x.status === "abgelehnt" ? "abgelehnt" : "genehmigt",
    anteil: x.anteil || 1, minuten: x.minuten || null, au_bestaetigung: ARTEN[x.art]?.au ? !!x.au : null, notiz: x.notiz || null });
  const abA = nachId(alt.abwesenheiten), neueAbw = [];
  for (const x of neu.abwesenheiten) {
    const a = abA[x.id];
    if (!a) { if (x.status !== "storniert") neueAbw.push({ ...zeile(x), erstellt: heute(), ...(chefin && x.status !== "beantragt" ? { entschieden_von: ich, entschieden_am: new Date().toISOString() } : {}) }); continue; }
    if (gleich(a, x)) continue;
    if (x.status === "storniert") { await sbMuss(sb.from("abw_anfragen").delete().eq("id", x.id).select("id"), "Nur die Chefin kann Einträge löschen – bitte bei ihr melden."); continue; }
    const z = zeile(x);
    if (a.status !== x.status) { z.entschieden_von = ich; z.entschieden_am = new Date().toISOString(); }
    await sbMuss(sb.from("abw_anfragen").update(z).eq("id", x.id).select("id"), "Nur die Chefin kann das ändern.");
  }
  for (const x of alt.abwesenheiten) if (!neu.abwesenheiten.some(y => y.id === x.id)) await sbMuss(sb.from("abw_anfragen").delete().eq("id", x.id).select("id"), "Nur die Chefin kann Einträge löschen.");
  if (neueAbw.length) await sbq(sb.from("abw_anfragen").insert(neueAbw));
  // Nachrichten als gelesen markieren (neue Nachrichten schreibt nur der Server)
  const nA = nachId(alt.nachrichten);
  for (const x of neu.nachrichten || []) if (nA[x.id] && !nA[x.id].gelesen && x.gelesen) await sbq(sb.from("zeit_nachrichten").update({ gelesen_am: new Date().toISOString() }).eq("id", x.id));
}

// Stempeln am eigenen Handy: Uhrzeit, Rundung, Ort und Pause bestimmt der Server
async function liveStempeln(sb, db, ma, aktion) {
  const plan = planTag(db, ma, heute()), vn = ma.name.split(" ")[0];
  const b = await sbq(sb.rpc("zeit_stempeln", { p_aktion: AKTION_RPC[aktion], p_auto_pause: true }));
  if (aktion === "kommen") { const k = kaffeeText(plan); return k ? `Guten Morgen ${vn}! ${k}` : `${vn}: Kommen ${hm5(b.beginn)}`; }
  if (aktion === "gehen" || aktion === "nurGehen") { const ab = abschied(db, ma); return `Danke ${vn}! ${ab.text} ${ab.em}`; }
  return aktion === "pauseStart" ? `${vn}: Pause ab ${nowHM()}` : `${vn}: Pause beendet`;
}

function LiveApp() {
  const sb = useMemo(() => window.supabase.createClient(SB_URL, SB_KEY), []);
  const [phase, setPhase] = useState("start"); // start | login | laden | app | terminal
  const [db, setDb] = useState(null);
  const [ichId, setIchId] = useState(null);
  const [fehler, setFehler] = useState(null);
  const [toast, setToast] = useState(null);
  const dbRef = useRef(null); dbRef.current = db;
  const speichert = useRef(0);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4000); return () => clearTimeout(t); }, [toast]);
  const neuLaden = () => liveLaden(sb).then(r => setDb(r.db));
  async function nachAnmeldung() {
    setFehler(null);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setPhase("login"); return; }
    if (await sbq(sb.rpc("zeit_ist_terminal"))) { setPhase("terminal"); return; }
    setPhase("laden");
    let r = await liveLaden(sb);
    const me = r.db.mitarbeiter.find(m => abwEmail(m.name) === session.user.email);
    if (!me || !me.aktiv) { await sb.auth.signOut(); setFehler("Für diesen Zugang gibt es kein aktives Profil."); setPhase("login"); return; }
    if (me.rolle === "admin" && await liveEinrichten(sb, r)) r = await liveLaden(sb);
    setIchId(me.id); setDb(r.db); setPhase("app");
  }
  useEffect(() => { nachAnmeldung().catch(e => { setFehler(e.message); setPhase("login"); }); }, []);
  // Daten anderer Geräte (Tablet, Handys) regelmäßig und beim Zurückkehren holen
  useEffect(() => {
    if (phase !== "app") return;
    const hol = () => { if (!speichert.current) neuLaden().catch(() => {}); };
    const t = setInterval(hol, 60000);
    const sicht = () => { if (document.visibilityState === "visible") hol(); };
    document.addEventListener("visibilitychange", sicht);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", sicht); };
  }, [phase]);
  async function abmelden() { await sb.auth.signOut(); setDb(null); setIchId(null); setPhase("login"); }
  const toastEl = toast && <div className="no-print fixed bottom-20 sm:bottom-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-5 py-3 rounded-full shadow-lg flex items-center gap-2 max-w-[92vw]">{toast}</div>;
  if (phase === "start" || phase === "laden") return <div className="min-h-screen flex items-center justify-center text-stone-500 text-sm">Lade Zeitverwaltung …</div>;
  if (phase === "terminal") return <LiveTerminal sb={sb} onAbmelden={abmelden} />;
  if (phase === "login" || !db) return <LiveLogin sb={sb} fehler={fehler} onAngemeldet={() => nachAnmeldung().catch(e => { setFehler(e.message); setPhase("login"); })} />;
  const user = db.mitarbeiter.find(m => m.id === ichId);
  if (!user) return <LiveLogin sb={sb} fehler="Profil nicht gefunden." onAngemeldet={nachAnmeldung} />;
  const aendern = (fn, meldung) => {
    const alt = dbRef.current, n = JSON.parse(JSON.stringify(alt)), r = fn(n);
    setDb(n); speichert.current++;
    liveSpeichern(sb, alt, n, user)
      .then(() => { if (meldung || typeof r === "string") setToast(meldung || r); })
      .catch(e => setToast(`⚠️ Nicht gespeichert: ${e.message}`))
      .finally(() => neuLaden().catch(() => {}).finally(() => { speichert.current--; }));
  };
  const stempeln = async (maId, aktion) => {
    const ma = db.mitarbeiter.find(m => m.id === maId);
    try { setToast(await liveStempeln(sb, db, ma, aktion)); } finally { neuLaden().catch(() => {}); }
  };
  return <Rahmen key={user.id} db={db} setDb={setDb} user={user} aendern={aendern} logout={abmelden} login={() => {}} toastEl={toastEl} stempeln={stempeln} live sb={sb} />;
}

// Anmeldung: Name antippen → PIN (dieselbe wie in der Abwesenheiten-App)
function LiveLogin({ sb, fehler, onAngemeldet }) {
  const [team, setTeam] = useState(null);
  const [wahl, setWahl] = useState(null);
  const [fehl, setFehl] = useState(fehler);
  const [laeuft, setLaeuft] = useState(false);
  const [tablet, setTablet] = useState(false);
  useEffect(() => { sbq(sb.from("abw_team_login").select("id,name").order("name")).then(setTeam).catch(e => setFehl("Keine Verbindung: " + e.message)); }, []);
  async function pin(p) {
    setLaeuft(true); setFehl(null);
    const { error } = await sb.auth.signInWithPassword({ email: abwEmail(wahl.name), password: p + "-ghd" });
    setLaeuft(false);
    if (error) { setFehl(/invalid/i.test(error.message) ? "PIN falsch." : error.message); return; }
    onAngemeldet();
  }
  if (tablet) return <TabletEinrichten sb={sb} onZurueck={() => setTablet(false)} onFertig={onAngemeldet} />;
  return <div className="min-h-screen flex items-center justify-center p-4">
    <div className="w-full max-w-sm">
      <p className="text-[11px] text-stone-500 uppercase tracking-[.14em] font-semibold text-center">Great Hair Day</p>
      <h1 className="text-2xl font-bold text-center mb-6">Zeitverwaltung</h1>
      {fehl && <div className="mb-4"><Hinweis ton="fehler">{fehl}</Hinweis></div>}
      {!wahl ? <div className="bg-white rounded-[14px] border border-stone-200 divide-y divide-stone-100">
        {!team ? <p className="p-4 text-sm text-stone-500">Lade …</p> : team.map(m => <button key={m.id} onClick={() => { setWahl(m); setFehl(null); }} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-stone-50">
          <Avatar name={m.name} klein /><span className="font-semibold">{m.name}</span></button>)}
      </div> : <div className="bg-white rounded-[14px] border border-stone-200 p-6">
        <button className="text-sm text-stone-500 mb-3" onClick={() => setWahl(null)}>‹ zurück</button>
        <div className="text-center font-bold text-lg">{wahl.name}</div>
        <p className="text-center text-sm text-stone-500 mb-5">PIN eingeben (wie in der Abwesenheiten-App)</p>
        {laeuft ? <p className="text-center text-sm text-stone-500 py-10">Anmelden …</p> : <PinFeld onFertig={pin} />}
      </div>}
      <button onClick={() => setTablet(true)} className="mt-6 w-full text-sm text-stone-500 underline">Dieses Gerät als Stempel-Tablet einrichten</button>
      <p className="mt-4 text-center text-xs text-stone-400"><a className="underline" href="?test">Testversion mit Beispieldaten</a></p>
    </div>
  </div>;
}

// Einmalig am Salon-Tablet: mit dem eigenen Geräte-Zugang anmelden (nur die Chefin kennt das Passwort)
function TabletEinrichten({ sb, onZurueck, onFertig }) {
  const [email, setEmail] = useState(""), [pw, setPw] = useState(""), [fehl, setFehl] = useState(null);
  async function los() {
    setFehl(null);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    if (error) { setFehl("Anmeldung fehlgeschlagen."); return; }
    if (!(await sbq(sb.rpc("zeit_ist_terminal")))) { await sb.auth.signOut(); setFehl("Dieser Zugang ist nicht als Stempel-Tablet freigeschaltet."); return; }
    onFertig();
  }
  return <div className="min-h-screen flex items-center justify-center p-4"><div className="w-full max-w-sm bg-white rounded-[14px] border border-stone-200 p-6 space-y-4">
    <button className="text-sm text-stone-500" onClick={onZurueck}>‹ zurück</button>
    <h1 className="text-xl font-bold">Stempel-Tablet einrichten</h1>
    <p className="text-sm text-stone-600">Einmalig mit dem Geräte-Zugang des Tablets anmelden. Danach zeigt dieses Gerät nur noch die Stempeluhr.</p>
    <Feld label="E-Mail des Tablet-Zugangs"><input className={inputCls} type="email" autoComplete="off" value={email} onChange={e => setEmail(e.target.value)} /></Feld>
    <Feld label="Passwort"><input className={inputCls} type="password" autoComplete="off" value={pw} onChange={e => setPw(e.target.value)} /></Feld>
    {fehl && <Hinweis ton="fehler">{fehl}</Hinweis>}
    <Knopf onClick={los} disabled={!email || !pw}>Einrichten</Knopf>
  </div></div>;
}

// Salon-Tablet im echten Betrieb: sieht nur Vornamen und den heutigen Status (zeit_terminal_liste),
// jede Stempelung mit persönlicher PIN – geprüft am Server, 5 Fehlversuche = 15 min Sperre
function LiveTerminal({ sb, onAbmelden }) {
  const [liste, setListe] = useState([]);
  const [wahl, setWahl] = useState(null);
  const [pin, setPin] = useState(null);
  const [fehl, setFehl] = useState(null);
  const [gruss, setGruss] = useState(null);
  const [uhr, setUhr] = useState(nowHM());
  const [ende, setEnde] = useState(false);
  const holen = () => sbq(sb.rpc("zeit_terminal_liste")).then(setListe).catch(e => setFehl(e.message));
  useEffect(() => { holen(); const t = setInterval(() => { setUhr(nowHM()); holen(); }, 30000); const u = setInterval(() => setUhr(nowHM()), 5000); return () => { clearInterval(t); clearInterval(u); }; }, []);
  useEffect(() => { if (!wahl) return; const t = setTimeout(() => { setWahl(null); setPin(null); }, 45000); return () => clearTimeout(t); }, [wahl]);
  useEffect(() => { if (!gruss) return; const t = setTimeout(() => setGruss(null), 7000); return () => clearTimeout(t); }, [gruss]);
  const d = heute(), jetzt = hm2min(nowHM());
  const info = p => p.abwesend ? p.abwesend : p.status === "aus" ? (p.plan_beginn ? `Plan ${hm5(p.plan_beginn)}–${hm5(p.plan_ende)}` : "heute frei")
    : p.status === "fertig" ? "schon gegangen" : p.status === "pause" ? `Pause seit ${hm5(p.seit)}` : p.plan_beginn && jetzt < hm2min(hm5(p.plan_beginn)) ? `☕ da seit ${hm5(p.seit)} · Beginn ${hm5(p.plan_beginn)}` : `da seit ${hm5(p.seit)}`;
  async function buchen(aktion) {
    const p = wahl; setFehl(null);
    try {
      const r = await sbq(sb.rpc("zeit_terminal_stempeln", { p_person: p.person_id, p_pin: pin, p_aktion: AKTION_RPC[aktion] }));
      if (!r.ok) { setFehl(r.fehler); setPin(null); return; }
      setWahl(null); setPin(null); holen();
      if (aktion === "kommen") { const k = kaffeeText(p.plan_beginn && { b: hm5(p.plan_beginn) }); setGruss({ em: k ? "☕" : "👋", titel: `${k ? "Guten Morgen" : "Hallo"} ${p.vorname}!`, text: k || `Eingecheckt um ${nowHM()}.`, sub: "Du bist eingecheckt." }); }
      else if (aktion === "gehen" || aktion === "nurGehen") { const ab = p.urlaub_ab ? { em: "🌴", text: "Einen schönen Urlaub!" } : wd(d) === 5 ? { em: "☀️", text: "Ein schönes Wochenende!" } : { em: "🌙", text: "Einen schönen Abend!" }; setGruss({ em: ab.em, titel: `Danke ${p.vorname}!`, text: ab.text, sub: "Du bist ausgecheckt." }); }
      else setGruss({ em: aktion === "pauseStart" ? "🥪" : "💪", titel: p.vorname, text: aktion === "pauseStart" ? "Gute Pause!" : "Pause beendet.", sub: "" });
    } catch (e) { setFehl(e.message); setPin(null); }
  }
  const gross = "flex-1 min-w-[9rem] rounded-full py-5 text-xl font-bold flex items-center justify-center gap-2";
  const farbe = { da: "bg-emerald-400", pause: "bg-amber-400", aus: "bg-stone-500", fertig: "bg-stone-300" };
  return <div className="min-h-screen bg-stone-900 text-white flex flex-col">
    <div className="flex items-center justify-between px-6 py-4">
      <div><div className="text-[11px] text-stone-400 uppercase tracking-[.14em] font-semibold">Great Hair Day</div><div className="text-lg font-bold">{WT_LANG[wd(d)]}, {fmtD(d)}</div></div>
      <div className="text-5xl font-semibold tabular">{uhr}</div>
    </div>
    <div className="px-6 text-stone-400 text-sm">Name antippen zum Stempeln</div>
    {fehl && !wahl && <div className="mx-6 mt-3 rounded-xl bg-rose-900/60 px-4 py-2 text-sm">{fehl}</div>}
    <div className="flex-1 p-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 content-start">
      {liste.map(p => <button key={p.person_id} onClick={() => { setWahl(p); setPin(null); setFehl(null); }} className="rounded-[14px] bg-stone-800 border border-stone-700 hover:border-gold-400 p-5 text-left">
        <div className="flex items-center gap-3"><span className="w-9 h-9 rounded-full bg-gold-500 text-white text-sm font-bold flex items-center justify-center">{p.vorname[0]}</span><span className={`ml-auto w-3 h-3 rounded-full ${p.abwesend ? "bg-sky-300" : farbe[p.status]}`} /></div>
        <div className="mt-3 text-lg font-semibold">{p.vorname}</div>
        <div className="text-sm text-stone-400">{info(p)}</div>
      </button>)}
    </div>
    <div className="px-6 py-4 flex items-center justify-between text-xs text-stone-500">
      <span>PIN und Uhrzeit prüft der Server</span>
      {!ende ? <button onClick={() => setEnde(true)} className="underline hover:text-stone-300">Tablet abmelden</button>
        : <span>Wirklich abmelden? Danach braucht es den Geräte-Zugang. <button className="underline text-rose-300" onClick={onAbmelden}>Ja</button> · <button className="underline" onClick={() => setEnde(false)}>Nein</button></span>}
    </div>
    {gruss && <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50" onClick={() => setGruss(null)}>
      <div className="bg-stone-50 text-stone-900 rounded-[22px] p-8 w-full max-w-xl text-center einblenden">
        <div className="text-6xl">{gruss.em}</div><div className="mt-4 text-2xl font-bold">{gruss.titel}</div><div className="mt-2 text-xl">{gruss.text}</div>
        <div className="mt-5 text-sm text-stone-500">{gruss.sub} Antippen zum Schließen.</div>
      </div></div>}
    {wahl && <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-40" onClick={() => { setWahl(null); setPin(null); }}>
      <div className="bg-stone-50 text-stone-900 rounded-[22px] p-6 w-full max-w-xl einblenden" onClick={e => e.stopPropagation()}>
        <div className="text-center text-2xl font-bold">{wahl.vorname}</div>
        <div className="text-center text-sm text-stone-500 mb-4">{info(wahl)}</div>
        {fehl && <div className="mb-4"><Hinweis ton="fehler">{fehl}</Hinweis></div>}
        {wahl.abwesend ? <p className="text-center text-stone-600">Heute eingetragen: {wahl.abwesend}.</p>
        : !pin ? <PinFeld onFertig={setPin} />
        : <div className="flex flex-wrap gap-3">
          {wahl.status === "aus" && <button className={`${gross} bg-emerald-600 text-white`} onClick={() => buchen("kommen")}>▶ Kommen</button>}
          {wahl.status === "aus" && wahl.plan_beginn && jetzt > hm2min(hm5(wahl.plan_beginn)) + 30 && <button className={`${gross} bg-stone-200`} onClick={() => buchen("nurGehen")}>Gehen<span className="text-sm font-normal">(Kommen vergessen)</span></button>}
          {wahl.status === "da" && <><button className={`${gross} bg-amber-400`} onClick={() => buchen("pauseStart")}>⏸ Pause</button><button className={`${gross} bg-gold-500 text-white`} onClick={() => buchen("gehen")}>■ Gehen</button></>}
          {wahl.status === "pause" && <><button className={`${gross} bg-emerald-600 text-white`} onClick={() => buchen("pauseEnde")}>▶ Pause Ende</button><button className={`${gross} bg-stone-900 text-white`} onClick={() => buchen("gehen")}>■ Gehen</button></>}
          {wahl.status === "fertig" && <p className="text-stone-600">Heute schon ausgestempelt. Änderungen bitte bei der Chefin.</p>}
        </div>}
      </div>
    </div>}
  </div>;
}

// ─── APP-RAHMEN ───────────────────────────────────────────────────────────────
const NAV = [
  { id: "dashboard",  label: "Dashboard",     em: "🏠" },
  { id: "zeit",       label: "Zeiterfassung", em: "⏱️" },
  { id: "urlaub",     label: "Urlaub",        em: "🌴" },
  { id: "krank",      label: "Krankenstand",  em: "🤒" },
  { id: "mitarbeiter",label: "Mitarbeiter",   em: "👥" },
  { id: "kalender",   label: "Kalender",      em: "📅" },
  { id: "auswertung", label: "Auswertungen",  em: "📊" },
  { id: "einstellung",label: "Einstellungen", em: "⚙️" },
];

function App() {
  const [db, setDb] = useState(ladeDb);
  const [userId, setUserId] = useState(() => { try { return sessionStorage.getItem(SESS_KEY); } catch (e) { return null; } });
  const [toast, setToast] = useState(null);
  const [, setTick] = useState(0);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { /* ohne Speicher weiter */ } }, [db]);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);

  // Dieses Gerät ist das Stempel-Tablet? Merkt sich der Browser, damit es nach Neuladen
  // direkt wieder im Tablet-Modus startet (live: eigener Geräte-Zugang, siehe SQL-Entwurf)
  const TABLET_KEY = "ghd-zeitverwaltung-tablet";
  const [terminal, setTerminalRoh] = useState(() => { try { return localStorage.getItem(TABLET_KEY) === "1"; } catch (e) { return false; } });
  function setTerminal(an) { try { an ? localStorage.setItem(TABLET_KEY, "1") : localStorage.removeItem(TABLET_KEY); } catch (e) { } setTerminalRoh(an); }
  // Automatik beim Öffnen und danach alle 5 Minuten, damit z. B. das Salon-Tablet abends
  // vergessenes „Gehen“ noch am selben Tag ergänzt (live: Server-Job alle 15 Minuten)
  useEffect(() => {
    const lauf = () => setDb(alt => {
      const n = JSON.parse(JSON.stringify(alt));
      let geaendert = automatik(n);
      // Wer ausgetreten ist (letzter Arbeitstag vorbei), kann sich nicht mehr anmelden
      n.mitarbeiter.forEach(m => { if (m.aktiv && m.austritt && m.austritt < heute()) { m.aktiv = false; geaendert++; } });
      return geaendert ? n : alt;
    });
    lauf();
    const t = setInterval(lauf, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, []);

  // fn darf eine Meldung zurückgeben (z. B. beim Stempeln)
  const aendern = (fn, meldung) => { const n = JSON.parse(JSON.stringify(db)); const r = fn(n); setDb(n); if (meldung || typeof r === "string") setToast(meldung || r); };
  const toastEl = toast && <div className="no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-5 py-3 rounded-full shadow-lg flex items-center gap-2 max-w-[92vw]"><Icon n="haken" className="w-4 h-4 text-emerald-400 shrink-0" />{toast}</div>;
  const user = db.mitarbeiter.find(m => m.id === userId && m.aktiv);
  function login(id) { try { sessionStorage.setItem(SESS_KEY, id); } catch (e) { } setUserId(id); }
  function logout() { try { sessionStorage.removeItem(SESS_KEY); } catch (e) { } setUserId(null); }
  if (terminal) return <>{<Terminal db={db} aendern={aendern} onEnde={() => setTerminal(false)} />}{toastEl}</>;
  if (!user) return <Login db={db} onLogin={login} onTerminal={() => setTerminal(true)} onEigene={name => { const n = leereDaten(name); setDb(n); login(n.mitarbeiter[0].id); }} />;

  const stempeln = (maId, aktion) => aendern(n => stempelBuchen(n, n.mitarbeiter.find(m => m.id === maId), aktion));
  return <Rahmen key={user.id} db={db} setDb={setDb} user={user} aendern={aendern} logout={logout} login={login} toastEl={toastEl} stempeln={stempeln} />;
}

// Oberfläche nach dem Anmelden – gleich für Testversion und echten Betrieb (live)
function Rahmen({ db, setDb, user, aendern, logout, login, toastEl, stempeln, live, sb }) {
  const [seite, setSeiteRoh] = useState("dashboard");
  const [navOffen, setNavOffen] = useState(false);
  const setSeite = s => { setSeiteRoh(s); setNavOffen(false); window.scrollTo(0, 0); };
  const ctx = { db, setDb, user, aendern, sichtbar: sichtbareMA(db, user), setSeite, login, stempeln, live: !!live, sb };
  // Mitarbeiter/innen: einfache Ansicht wie im bisherigen System; Chefin/Leitung: volle Ansicht
  if (!istLeitung(user)) return <EinfachApp ctx={ctx} logout={logout} toastEl={toastEl} />;
  const badges = {
    urlaub: db.abwesenheiten.filter(a => a.art === "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    krank: db.abwesenheiten.filter(a => a.art !== "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    zeit: db.korrekturen.filter(k => k.status === "offen" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === k.maId))).length,
  };
  const Seite = { dashboard: Dashboard, zeit: Zeiterfassung, urlaub: Urlaub, krank: Krankenstand, mitarbeiter: Mitarbeiter, kalender: Kalender, auswertung: Auswertungen, einstellung: Einstellungen }[seite];
  const navLabel = n => n.id === "mitarbeiter" && !istLeitung(user) ? "Mein Profil" : n.label;

  const navInhalt = <>
    <div className="px-5 pt-7 pb-5">
      <p className="text-[11px] text-stone-500 uppercase tracking-[.14em] font-semibold">Great Hair Day</p>
      <p className="text-lg font-bold text-stone-900 leading-tight">Zeitverwaltung</p>
    </div>
    <nav className="flex-1 px-3 space-y-1 overflow-y-auto">
      {NAV.map(n => <button key={n.id} onClick={() => setSeite(n.id)}
        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-full text-[13.5px] font-semibold transition border ${seite === n.id ? "bg-white border-gold-500 text-gold-700" : "border-transparent text-stone-600 hover:bg-white hover:border-stone-200"}`}>
        <span className="text-[17px] w-6 text-center">{n.em}</span><span className="flex-1 text-left">{navLabel(n)}</span>
        {badges[n.id] > 0 && <span className="min-w-[1.25rem] h-5 px-1.5 rounded-full bg-rose-100 text-rose-600 text-[11px] font-bold flex items-center justify-center">{badges[n.id]}</span>}
      </button>)}
    </nav>
    <div className="p-3 border-t border-stone-200">
      <div className="flex items-center gap-2.5 px-2 py-2">
        <Avatar name={user.name} klein />
        <div className="flex-1 min-w-0 leading-tight"><div className="text-sm font-semibold text-stone-900 truncate">{user.name}</div><div className="text-[11px] text-stone-500">{ROLLEN[user.rolle].label}</div></div>
        <div className="hidden lg:block"><Glocke ctx={ctx} oben /></div>
        <button onClick={logout} className="p-1.5 rounded-full text-stone-500 hover:text-gold-700 hover:bg-white" title="Abmelden"><Icon n="abmelden" className="w-4 h-4" /></button>
      </div>
    </div>
  </>;

  return <div className="min-h-screen">
    <aside className="no-print hidden lg:flex fixed inset-y-0 left-0 w-60 bg-stone-100 border-r border-stone-200 flex-col z-30">{navInhalt}</aside>
    {navOffen && <div className="no-print lg:hidden fixed inset-0 z-40 bg-stone-900/45" onClick={() => setNavOffen(false)}>
      <aside className="w-64 h-full bg-stone-100 flex flex-col einblenden" onClick={e => e.stopPropagation()}>{navInhalt}</aside>
    </div>}
    <header className="no-print lg:hidden sticky top-0 z-20 h-14 bg-stone-50/90 backdrop-blur border-b border-stone-200 flex items-center gap-3 px-4">
      <button onClick={() => setNavOffen(true)} className="p-1.5 -ml-1.5 rounded-full text-stone-700 hover:bg-white" aria-label="Menü"><Icon n="menu" /></button>
      <span className="font-bold text-[15px] flex-1">{NAV.find(n => n.id === seite).em} {navLabel(NAV.find(n => n.id === seite))}</span>
      <Glocke ctx={ctx} />
      <Avatar name={user.name} klein />
    </header>
    <main className="lg:ml-60 print-full">
      {!live && <div className="no-print bg-amber-100 border-b border-amber-200 text-amber-800 text-xs px-4 lg:px-8 py-1.5">{db.eigeneDaten ? "Testbetrieb mit deinen Daten – gespeichert nur in diesem Browser auf diesem Gerät, keine Verbindung zur Datenbank." : "Prototyp mit erfundenen Beispieldaten – gespeichert nur in diesem Browser, keine Verbindung zur Datenbank."}</div>}
      <div className="max-w-7xl mx-auto px-4 lg:px-8 py-6 print-full"><Seite ctx={ctx} /></div>
    </main>
    {toastEl}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(LIVE ? <LiveApp /> : <App />);
</script>
</body>
</html>
