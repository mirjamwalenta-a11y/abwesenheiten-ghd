// ─── KALENDER ─────────────────────────────────────────────────────────────────
function Kalender({ ctx }) {
  const { db, sichtbar, user } = ctx;
  const [monat, setMonat] = useState(monatKey(heute()));
  // Teamkalender: alle Aktiven sehen genehmigte Abwesenheiten aller (ohne Art bei Krankenstand für Nicht-Leitung)
  const team = (istLeitung(user) ? sichtbar : db.mitarbeiter).filter(m => m.aktiv || tageImMonat(monat).some(d => beschaeftigt(m, d)));
  const tage = tageImMonat(monat), h = heute();
  const leitung = istLeitung(user);
  const zelle = (m, d) => {
    if (!beschaeftigt(m, d)) return { cls: "bg-stone-100", t: "" };
    const a = abwAm(db, m.id, d), b = abwAntragAm(db, m.id, d);
    const frei = !modellSollMin(db, m, d) || feiertag(d);
    if (a) {
      // Datensparsam: Kolleg/innen sehen nur „abwesend“, nicht ob krank
      const zeigen = leitung || m.id === user.id || a.art === "urlaub";
      const halb = anteil(a) < 1;
      return zeigen ? { cls: `${halb ? ARTEN[a.art].hell : ARTEN[a.art].voll} ${frei ? "opacity-40" : ""}`, t: ARTEN[a.art].kurz + (halb ? "½" : ""), title: ARTEN[a.art].label + (halb ? " (halber Tag)" : "") } : { cls: `bg-stone-400 text-white ${frei ? "opacity-40" : ""}`, t: "A", title: "Abwesend" };
    }
    if (b && (leitung || m.id === user.id)) return { cls: `${ARTEN[b.art].hell} streifen`, t: "?", title: `${ARTEN[b.art].label} beantragt` };
    if (frei) return { cls: "bg-stone-100", t: "" };
    return { cls: "", t: "" };
  };
  return <div className="space-y-5">
    <Seitenkopf titel="Teamkalender" sub="Urlaub, Krankenstand und Abwesenheiten auf einen Blick">
      <MonatWahl monat={monat} setMonat={setMonat} />
    </Seitenkopf>
    <Karte innen="p-0">
      <div className="overflow-x-auto">
        <table className="text-xs border-separate border-spacing-0 w-full">
          <thead><tr>
            <th className="sticky left-0 z-10 bg-white text-left px-3 py-2 font-medium text-stone-500 border-b border-stone-200 min-w-[9rem]">Mitarbeiter/in</th>
            {tage.map(d => { const ft = feiertag(d); return <th key={d} title={ft?.name} className={`px-0 py-1.5 font-medium border-b border-stone-200 min-w-[1.9rem] ${ft ? "text-rose-600" : wd(d) >= 5 ? "text-stone-400" : "text-stone-500"} ${d === h ? "bg-amber-100" : ""}`}>
              <div>{WT[wd(d)].slice(0, 2)}</div><div className="tabular text-stone-800 font-semibold">{parseInt(d.slice(8))}</div></th>; })}
          </tr></thead>
          <tbody>
            {team.map(m => <tr key={m.id}>
              <td className="sticky left-0 z-10 bg-white px-3 py-1.5 border-b border-stone-100 whitespace-nowrap font-medium text-stone-800">{m.name}</td>
              {tage.map(d => { const z = zelle(m, d); return <td key={d} className={`border-b border-l border-stone-100 p-0.5 ${d === h ? "bg-amber-50" : ""}`}>
                <div title={z.title} className={`h-7 rounded flex items-center justify-center font-semibold ${z.cls}`}>{z.t}</div></td>; })}
            </tr>)}
            <tr><td className="sticky left-0 bg-white px-3 py-1.5 text-stone-500">Abwesend</td>
              {tage.map(d => { const n = team.filter(m => abwAm(db, m.id, d) && modellSollMin(db, m, d) && !feiertag(d)).length; return <td key={d} className={`text-center py-1.5 tabular font-medium ${n >= 3 ? "text-rose-700" : "text-stone-500"}`}>{n || ""}</td>; })}</tr>
          </tbody>
        </table>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-2 px-5 py-3 border-t border-stone-100 text-xs text-stone-600">
        {Object.entries(ARTEN).map(([k, a]) => <span key={k} className="inline-flex items-center gap-1.5"><span className={`w-4 h-4 rounded text-[9px] font-bold flex items-center justify-center ${a.voll}`}>{a.kurz}</span>{a.label}</span>)}
        <span className="inline-flex items-center gap-1.5"><span className="w-5 h-4 rounded text-[9px] font-bold flex items-center justify-center bg-indigo-100 text-indigo-800">BS½</span>halber Tag</span>
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-amber-100 streifen" />beantragt</span>
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-stone-100 ring-1 ring-stone-200" />frei / Schließtag / Feiertag</span>
      </div>
    </Karte>
    {!leitung && <p className="text-xs text-stone-500">Bei Kolleg/innen siehst du nur „A“ (abwesend) – der Grund (z. B. Krankenstand) bleibt vertraulich.</p>}
    <Karte titel={`Feiertage ${monat.slice(0, 4)}`} innen="p-0">
      <ul className="grid sm:grid-cols-2 lg:grid-cols-3 text-sm">
        {feiertage(parseInt(monat)).map(f => <li key={f.datum} className={`px-5 py-2 flex justify-between gap-2 border-b border-stone-100 ${f.datum < h ? "text-stone-400" : ""}`}><span>{f.name}</span><span className="tabular">{fmtDk(f.datum)}</span></li>)}
      </ul>
    </Karte>
  </div>;
}

// ─── AUSWERTUNGEN ─────────────────────────────────────────────────────────────
function Auswertungen({ ctx }) {
  const { db, user, sichtbar } = ctx;
  const [ansicht, setAnsicht] = useState("monat");
  const [monat, setMonat] = useState(monatVerschieben(monatKey(heute()), -1));
  const [jahr, setJahr] = useState(new Date().getFullYear());
  const tage = tageImMonat(monat);
  const von = ansicht === "monat" ? tage[0] : `${jahr}-01-01`;
  const bis = ansicht === "monat" ? tage[tage.length - 1] : `${jahr}-12-31`;
  const bisKonto = bis < heute() ? bis : heute();
  const liste = sichtbar.filter(m => tageZw(von, bis).some(d => beschaeftigt(m, d)));
  const zeilen = liste.map(m => {
    const s = summe(db, m, von, bis);
    const uk = urlaubsKonto(db, m, parseInt(von));
    const urlaubZr = db.abwesenheiten.filter(a => a.maId === m.id && a.art === "urlaub" && wirksam(a)).reduce((n, a) => {
      const v = a.von > von ? a.von : von, b = (a.bis || a.von) < bis ? (a.bis || a.von) : bis; return n + (v <= b ? urlaubsTage(db, m, v, b) : 0); }, 0);
    const krank = abwKalendertage(db, m, KRANK_ARTEN, von, bis);
    const sonst = abwKalendertage(db, m, ["pflege", "sonder", "fortbildung", "za", "unbezahlt"], von, bis);
    const ab = ansicht === "monat" ? abschlussVon(db, m.id, monat) : null;
    return { m, s, konto: zeitkonto(db, m, bisKonto), uk, urlaubZr, krank, sonst, ab };
  });
  const sum = k => zeilen.reduce((n, z) => n + k(z), 0);

  function exportieren() {
    const kopf = ["Personalnr", "Name", "Arbeitszeitmodell", "Soll (h)", "Ist (h)", "Abwesenheit angerechnet (h)", "Saldo Zeitraum (h)", "Zeitkonto (h)", ...(db.einstellungen.ueberstunden ? ["Mehrarbeit (h)", "Überstunden (h)"] : []), "Urlaubstage", "Resturlaub", "Krankenstand (KT)", "Sonstige Abwesenheit (KT)"];
    if (ansicht === "monat") kopf.push("Monatsabschluss");
    csvExport(`auswertung_${ansicht === "monat" ? monat : jahr}.csv`, [kopf, ...zeilen.map(z => {
      const r = [z.m.personalnr, z.m.name, modellVon(db, z.m).name, fmtDez(z.s.soll), fmtDez(z.s.ist), fmtDez(z.s.gut), fmtDez(z.s.saldo), fmtDez(z.konto), ...(db.einstellungen.ueberstunden ? [fmtDez(z.s.mehrarbeit), fmtDez(z.s.ueberstunden)] : []), z.urlaubZr, z.uk.rest, z.krank, z.sonst];
      if (ansicht === "monat") r.push(z.ab?.abgeschlossenAm ? `abgeschlossen ${fmtD(z.ab.abgeschlossenAm)}` : "offen");
      return r;
    })]);
  }
  function exportZeiten() {
    const zz = [["Personalnr", "Name", "Datum", "Wochentag", "Beginn", "Ende", "Pause (min)", "Ist (h)", "Soll (h)", "Saldo (h)", "Abwesenheit", "Feiertag", "Hinweise AZG"]];
    liste.forEach(m => tageZw(von, bis < heute() ? bis : heute()).forEach(d => {
      const t = tagInfo(db, m, d); if (!t.z && !t.a && !t.soll) return;
      zz.push([m.personalnr, m.name, fmtD(d), WT[wd(d)], t.z?.beginn || "", t.z?.ende || "", t.z ? t.z.pause : "", fmtDez(t.ist), fmtDez(t.soll), fmtDez(t.saldo), t.a ? ARTEN[t.a.art].label : "", t.ft?.name || "", pruefeTag(db, m, d).map(x => x.text).join(" | ")]);
    }));
    csvExport(`arbeitszeiten_${ansicht === "monat" ? monat : jahr}.csv`, zz);
  }
  const [druck, setDruck] = useState(false);
  const [laedt, setLaedt] = useState(false);
  useEffect(() => {
    if (!druck) return;
    document.body.classList.add("druck-alle");
    const fertig = () => { document.body.classList.remove("druck-alle"); setDruck(false); };
    window.addEventListener("afterprint", fertig);
    const t = setTimeout(() => window.print(), 300);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", fertig); document.body.classList.remove("druck-alle"); };
  }, [druck]);
  const vorbei = monat < monatKey(heute());
  const abschliessbar = zeilen.filter(z => !z.ab?.abgeschlossenAm && (darfVerwalten(user, z.m) || (istAdmin(user) && z.m.id === user.id)));
  const blockiert = z => db.korrekturen.some(k => k.maId === z.m.id && k.status === "offen" && monatKey(k.datum) === monat) || db.zeiten.some(q => q.maId === z.m.id && monatKey(q.datum) === monat && !q.ende);
  const autoImMonat = db.zeiten.filter(q => q.auto?.length && monatKey(q.datum) === monat && liste.some(m => m.id === q.maId)).length;
  function alleAbschliessen() {
    const ok = abschliessbar.filter(z => !blockiert(z));
    ctx.aendern(n => ok.forEach(z => {
      let x = n.abschluesse.find(a => a.maId === z.m.id && a.monat === monat);
      if (!x) { x = { maId: z.m.id, monat }; n.abschluesse.push(x); }
      Object.assign(x, { abgeschlossenAm: heute(), abgeschlossenVon: user.id, saldoMonat: z.s.saldo, kontoStand: z.konto });
    }), `${ok.length} abgeschlossen${abschliessbar.length > ok.length ? ` · ${abschliessbar.length - ok.length} offen (Korrektur/fehlendes Gehen)` : ""}`);
  }
  async function excelHerunterladen() {
    setLaedt(true);
    let X;
    try { X = await ladeXlsx(); } catch (e) { setLaedt(false); alert("Excel konnte nicht geladen werden (keine Internetverbindung?). Es wird stattdessen eine CSV-Datei erstellt."); exportieren(); return; }
    const h2 = m => Math.round((m || 0) / 60 * 100) / 100;
    const zr = ansicht === "monat" ? fmtMonat(monat) : String(jahr);
    const uebersicht = [[`${db.einstellungen.firmenname} · Zeitverwaltung`], [`Zeitraum: ${zr}`], [`Erstellt am ${new Date().toLocaleString("de-AT")} von ${user.name}`], [],
      ["Personalnr", "Name", "Dienstplan", "Soll (h)", "Ist (h)", "Abwesenheit angerechnet (h)", "Saldo (h)", "Zeitkonto (h)", "Urlaubstage", "Resturlaub", "Krankenstand (Kalendertage)", "Sonstige Abwesenheit (Kalendertage)", "Automatisch ergänzte Tage", ...(ansicht === "monat" ? ["Monatsabschluss"] : [])],
      ...zeilen.map(z => [z.m.personalnr, z.m.name, modellVon(db, z.m).name, h2(z.s.soll), h2(z.s.ist), h2(z.s.gut), h2(z.s.saldo), h2(z.konto), z.urlaubZr, z.uk.rest, z.krank, z.sonst,
        db.zeiten.filter(q => q.maId === z.m.id && q.datum >= von && q.datum <= bis && q.auto?.length).length,
        ...(ansicht === "monat" ? [z.ab?.abgeschlossenAm ? `abgeschlossen am ${fmtD(z.ab.abgeschlossenAm)}` : z.ab?.bestaetigtAm ? "bestätigt" : "offen"] : [])])];
    const tageZ = [["Personalnr", "Name", "Datum", "Wochentag", "Beginn", "Ende", "Pause (min)", "Ist (h)", "Soll (h)", "Saldo (h)", "Abwesenheit", "Feiertag", "Automatisch ergänzt", "Hinweise AZG/KJBG"]];
    liste.forEach(m => tageZw(von, bisKonto).forEach(d => {
      if (!beschaeftigt(m, d)) return;
      const t = tagInfo(db, m, d); if (!t.z && !t.a && !t.soll) return;
      tageZ.push([m.personalnr, m.name, fmtD(d), WT[wd(d)], t.z?.beginn || "", t.z?.ende || "", t.z ? t.z.pause : "", h2(t.ist), h2(t.soll), h2(t.saldo), t.a ? ARTEN[t.a.art].label + (anteil(t.a) < 1 ? " (½ Tag)" : "") : "", t.ft?.name || "", (t.z?.auto || []).map(x => AUTO_TEXT[x]).join(", "), pruefeTag(db, m, d).map(x => x.text).join(" | ")]);
    }));
    const abwZ = [["Personalnr", "Name", "Art", "Von", "Bis", "Kalendertage", "Urlaubstage", "Status", "AU-Bestätigung", "Notiz"],
      ...db.abwesenheiten.filter(a => a.status !== "storniert" && liste.some(m => m.id === a.maId) && a.von <= bis && (a.bis || heute()) >= von).sort((a, b) => a.von.localeCompare(b.von)).map(a => {
        const m = db.mitarbeiter.find(x => x.id === a.maId);
        return [m.personalnr, m.name, ARTEN[a.art].label + (anteil(a) < 1 ? " (½ Tag)" : ""), fmtD(a.von), a.bis ? fmtD(a.bis) : "offen", tageZw(a.von, a.bis || heute()).length, a.art === "urlaub" ? urlaubsTage(db, m, a.von, a.bis || a.von) : "", STATUS[a.status]?.label || a.status, KRANK_ARTEN.includes(a.art) ? (a.au ? "ja" : "nein") : "", a.notiz || ""];
      })];
    const protZ = [["Zeitpunkt", "Mitarbeiter/in", "Datum", "Aktion", "Vorher", "Nachher", "Grund", "Durch"],
      ...db.protokoll.filter(q => liste.some(m => m.id === q.maId) && q.datum >= von && q.datum <= bis).map(q => [new Date(q.am).toLocaleString("de-AT"), nameVon(db, q.maId), fmtD(q.datum), q.aktion,
        q.alt ? `${q.alt.beginn}–${q.alt.ende || "…"} (${q.alt.pause} min)` : "", q.neu ? `${q.neu.beginn}–${q.neu.ende} (${q.neu.pause} min)` : "", q.grund || "", nameVon(db, q.von)])];
    const wb = X.utils.book_new();
    const blatt = (rows, name, breiten) => { const ws = X.utils.aoa_to_sheet(rows); ws["!cols"] = breiten.map(w => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
    blatt(uebersicht, "Übersicht", [11, 20, 30, 9, 9, 14, 9, 12, 11, 10, 14, 14, 14, 22]);
    blatt(tageZ, "Arbeitszeiten", [11, 20, 11, 9, 8, 8, 10, 8, 8, 9, 22, 18, 18, 60]);
    blatt(abwZ, "Abwesenheiten", [11, 20, 26, 11, 11, 12, 11, 11, 14, 30]);
    blatt(protZ, "Änderungen", [18, 20, 11, 34, 22, 22, 40, 18]);
    X.writeFile(wb, `Zeitverwaltung_${ansicht === "monat" ? monat : jahr}.xlsx`);
    setLaedt(false);
  }
  const mitUS = db.einstellungen.ueberstunden;
  const zt = (v, vz) => <span className={vz ? (v > 0 ? "text-emerald-700" : v < 0 ? "text-rose-700" : "") : ""}>{fmtH(v, vz)}</span>;

  return <><div className="space-y-5 print-full seite-inhalt">
    <Seitenkopf titel="Auswertungen" sub="Arbeitszeitkonto, Überstunden, Urlaub und Krankenstand">
      <div className="inline-flex rounded-full ring-1 ring-inset ring-stone-200 bg-white p-0.5">
        {[["monat", "Monat"], ["jahr", "Jahr"]].map(([k, l]) => <button key={k} onClick={() => setAnsicht(k)} className={`px-3.5 py-1.5 text-[13px] font-semibold rounded-full ${ansicht === k ? "bg-gold-500 text-white" : "text-stone-600"}`}>{l}</button>)}
      </div>
      {ansicht === "monat" ? <MonatWahl monat={monat} setMonat={setMonat} /> :
        <select className={`${inputKlein}`} value={jahr} onChange={e => setJahr(+e.target.value)}>{[jahr - 1, jahr, jahr + 1].map(j => <option key={j}>{j}</option>)}</select>}
      <Knopf art="sekundaer" icon="download" onClick={excelHerunterladen} disabled={laedt}>{laedt ? "Wird erstellt …" : "Excel"}</Knopf>
      <Knopf art="sekundaer" icon="drucker" onClick={() => window.print()}>Übersicht drucken</Knopf>
    </Seitenkopf>

    {ansicht === "monat" && <section className="now-card rounded-[14px] text-white p-5 no-print">
      <div className="text-[11px] tracking-[.14em] font-bold opacity-90 uppercase">📦 Monatsabschluss {fmtMonat(monat)}</div>
      <div className="mt-2 text-[19px] font-bold">{zeilen.filter(z => z.ab?.abgeschlossenAm).length} von {zeilen.length} abgeschlossen</div>
      <ol className="mt-2 text-[13px] opacity-90 space-y-0.5 list-decimal list-inside">
        <li>Automatisch ergänzte Tage prüfen{autoImMonat ? ` (${autoImMonat} im Monat)` : " – keine"}</li>
        <li>Alle abschließen – danach ist der Monat gesperrt</li>
        <li>Herunterladen und an die Lohnverrechnung schicken</li>
      </ol>
      <div className="mt-4 flex flex-wrap gap-2">
        {istLeitung(user) && <button disabled={!vorbei || !abschliessbar.length} onClick={alleAbschliessen} className="rounded-full font-bold text-sm px-5 py-2.5 bg-white/15 hover:bg-white/25 disabled:opacity-40">🔒 Alle abschließen{abschliessbar.length ? ` (${abschliessbar.length})` : ""}</button>}
        <button onClick={excelHerunterladen} disabled={laedt} className="rounded-full font-bold text-sm px-5 py-2.5 bg-white text-gold-700 hover:bg-stone-50 disabled:opacity-60">⬇️ Excel herunterladen</button>
        <button onClick={() => setDruck(true)} className="rounded-full font-bold text-sm px-5 py-2.5 bg-white text-gold-700 hover:bg-stone-50">🖨️ Arbeitszeitnachweise (PDF)</button>
      </div>
      {!vorbei && <p className="mt-3 text-xs opacity-80">Abschließen geht ab dem 1. des Folgemonats.</p>}
      <p className="mt-3 text-xs opacity-80">Excel: Übersicht, alle Arbeitszeiten pro Tag, Abwesenheiten und Änderungsprotokoll. PDF: pro Person ein Arbeitszeitnachweis mit Unterschriftszeilen – im Druckdialog „Als PDF speichern“ wählen.</p>
    </section>}
    <div className="print-only text-lg font-semibold mb-2">{db.einstellungen.firmenname} · Auswertung {ansicht === "monat" ? fmtMonat(monat) : jahr}</div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
      <Kpi label="Ist-Stunden" wert={fmtH(sum(z => z.s.ist))} sub={`Soll ${fmtH(sum(z => z.s.soll))}`} />
      {mitUS ? <Kpi label="Überstunden" wert={fmtH(sum(z => z.s.ueberstunden))} sub={`+ Mehrarbeit ${fmtH(sum(z => z.s.mehrarbeit))}`} />
        : <Kpi label="Abweichung vom Plan" wert={fmtH(sum(z => z.s.saldo), true)} sub="Summe aller Salden" />}
      <Kpi label="Urlaubstage" wert={sum(z => z.urlaubZr)} sub="im Zeitraum" />
      <Kpi label="Krankenstandstage" wert={sum(z => z.krank)} sub="Kalendertage" />
    </div>

    <Karte innen="p-0" titel={ansicht === "monat" ? <span className="capitalize">Monatsübersicht {fmtMonat(monat)}</span> : `Jahresübersicht ${jahr}`}>
      <Tabelle kopf={["Mitarbeiter/in", { t: "Soll", cls: "text-right" }, { t: "Ist", cls: "text-right" }, { t: "Abw.", cls: "text-right" }, { t: "Saldo", cls: "text-right" }, { t: "Zeitkonto", cls: "text-right" }, ...(mitUS ? [{ t: "Mehrarb.", cls: "text-right" }, { t: "Überst.", cls: "text-right" }] : []), { t: "Urlaub", cls: "text-right" }, { t: "Rest", cls: "text-right" }, { t: "Krank", cls: "text-right" }, { t: "Sonst.", cls: "text-right" }, ...(ansicht === "monat" ? ["Abschluss"] : [])]}
        fuss={<tr className="border-t-2 border-stone-200 font-semibold tabular">
          <td className="px-3 py-2.5">Summe</td>
          <td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.soll))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.ist))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.gut))}</td>
          <td className="px-3 py-2.5 text-right">{zt(sum(z => z.s.saldo), true)}</td><td className="px-3 py-2.5 text-right">{zt(sum(z => z.konto), true)}</td>
          {mitUS && <><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.mehrarbeit))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.ueberstunden))}</td></>}
          <td className="px-3 py-2.5 text-right">{sum(z => z.urlaubZr)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.uk.rest)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.krank)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.sonst)}</td>{ansicht === "monat" && <td />}
        </tr>}>
        {zeilen.map(z => <tr key={z.m.id} className="tabular">
          <td className="px-3 py-2.5 whitespace-nowrap"><div className="font-medium">{z.m.name}</div><div className="text-xs text-stone-500">{modellVon(db, z.m).name}</div></td>
          <td className="px-3 py-2.5 text-right">{fmtH(z.s.soll)}</td>
          <td className="px-3 py-2.5 text-right">{fmtH(z.s.ist)}</td>
          <td className="px-3 py-2.5 text-right text-stone-500">{fmtH(z.s.gut)}</td>
          <td className="px-3 py-2.5 text-right font-medium">{zt(z.s.saldo, true)}</td>
          <td className="px-3 py-2.5 text-right font-medium">{zt(z.konto, true)}</td>
          {mitUS && <><td className="px-3 py-2.5 text-right">{z.s.mehrarbeit ? fmtH(z.s.mehrarbeit) : "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.s.ueberstunden ? fmtH(z.s.ueberstunden) : "–"}</td></>}
          <td className="px-3 py-2.5 text-right">{z.urlaubZr || "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.uk.rest}</td>
          <td className="px-3 py-2.5 text-right">{z.krank || "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.sonst || "–"}</td>
          {ansicht === "monat" && <td className="px-3 py-2.5">{z.ab?.abgeschlossenAm ? <Badge status="genehmigt">Abgeschlossen</Badge> : z.ab?.bestaetigtAm ? <Badge status="gemeldet">Bestätigt</Badge> : <Badge status="offen">Offen</Badge>}</td>}
        </tr>)}
      </Tabelle>
    </Karte>
    <p className="text-xs text-stone-500">
      Saldo = Ist + angerechnete Abwesenheit − Soll.{!mitUS && " Überstunden sind laut Einstellungen nicht vorgesehen (fixer Dienstplan) – ein positiver Saldo heißt: länger gearbeitet als geplant, bitte ausgleichen."}{mitUS && <> Mehrarbeit/Überstunden sind vereinfacht aus positiven Wochensalden berechnet: bei Teilzeit bis zur Normalarbeitszeit ({db.einstellungen.vollzeitWoche} h) Mehrarbeit (Zuschlag {db.einstellungen.zuschlagMehrarbeit} %, entfällt bei Ausgleich im Quartal), darüber Überstunden ({db.einstellungen.zuschlagUeberstunden} %). Durchrechnungszeiträume und KV-Sonderregeln müssen mit der Lohnverrechnung abgestimmt werden.</>}
    </p>
  </div>
  {druck && <DruckNachweise db={db} liste={liste} monat={monat} />}
  </>;
}

// Arbeitszeitnachweise aller Personen eines Monats – je Person eine Seite
function DruckNachweise({ db, liste, monat }) {
  const tage = tageImMonat(monat), bisD = tage[tage.length - 1] < heute() ? tage[tage.length - 1] : heute();
  return <div className="druck-bereich">
    {liste.map((m, idx) => { const sm = summe(db, m, tage[0], tage[tage.length - 1]); const ab = abschlussVon(db, m.id, monat);
      return <div key={m.id} className={idx < liste.length - 1 ? "seitenumbruch" : ""} style={{ fontSize: 10 }}>
        <div className="flex justify-between items-end border-b border-stone-400 pb-1 mb-2">
          <div><div className="text-[9px] uppercase tracking-widest text-stone-500">{db.einstellungen.firmenname} · Arbeitszeitnachweis gem. § 26 AZG</div>
            <div className="text-base font-bold">{m.name} <span className="font-normal text-stone-600">({m.personalnr})</span></div></div>
          <div className="text-right"><div className="text-base font-bold capitalize">{fmtMonat(monat)}</div><div className="text-stone-600">{modellVon(db, m).name}</div></div>
        </div>
        <table className="w-full" style={{ fontSize: 9.5 }}>
          <thead><tr className="text-left border-b border-stone-300"><th className="py-0.5">Tag</th><th>Beginn</th><th>Ende</th><th className="text-right">Pause</th><th className="text-right">Ist</th><th className="text-right">Soll</th><th className="text-right">Saldo</th><th className="pl-3">Vermerk</th></tr></thead>
          <tbody>{tage.map(d => { const t = tagInfo(db, m, d); if (!beschaeftigt(m, d)) return null;
            const vermerk = [t.ft?.name, t.a ? ARTEN[t.a.art].label + (anteil(t.a) < 1 ? " (½)" : "") : null, t.z?.auto?.length ? `auto: ${t.z.auto.map(x => AUTO_TEXT[x]).join(", ")}` : null, t.z?.quelle === "korrektur" || t.z?.quelle === "manuell" ? "korrigiert" : null].filter(Boolean).join(" · ");
            return <tr key={d} className="border-b border-stone-100" style={{ color: !t.soll && !t.z ? "#A59C88" : undefined }}>
              <td className="py-[1px]">{fmtDk(d)}</td><td>{t.z?.beginn || ""}</td><td>{t.z?.ende || ""}</td><td className="text-right">{t.z ? `${t.z.pause}′` : ""}</td>
              <td className="text-right">{t.z ? fmtH(t.ist) : t.gut ? fmtH(t.gut) : ""}</td><td className="text-right">{t.soll ? fmtH(t.soll) : ""}</td>
              <td className="text-right">{t.zaehlt && (t.soll || t.ist) ? fmtH(t.saldo, true) : ""}</td><td className="pl-3">{vermerk}</td></tr>; })}</tbody>
        </table>
        <div className="mt-2 flex gap-6 font-semibold">
          <span>Soll {fmtH(sm.soll)} h</span><span>Ist {fmtH(sm.ist)} h</span><span>Abwesenheit {fmtH(sm.gut)} h</span><span>Saldo {fmtH(sm.saldo, true)} h</span><span>Zeitkonto {fmtH(zeitkonto(db, m, bisD), true)} h</span>
        </div>
        <div className="mt-1 text-stone-600">{ab?.bestaetigtAm ? `Von Mitarbeiter/in bestätigt am ${fmtD(ab.bestaetigtAm)}. ` : ""}{ab?.abgeschlossenAm ? `Abgeschlossen am ${fmtD(ab.abgeschlossenAm)} von ${nameVon(db, ab.abgeschlossenVon)}.` : "Monat noch nicht abgeschlossen."}</div>
        <div className="flex justify-between gap-10 mt-10">
          <div className="flex-1 border-t border-stone-500 pt-1">Datum, Unterschrift Mitarbeiter/in</div>
          <div className="flex-1 border-t border-stone-500 pt-1">Datum, Unterschrift Arbeitgeber/in</div>
        </div>
      </div>; })}
  </div>;
}

// ─── EINSTELLUNGEN ────────────────────────────────────────────────────────────
function Einstellungen({ ctx }) {
  const { db, user, aendern, setDb } = ctx;
  const admin = istAdmin(user);
  const e = db.einstellungen;
  const setE = (k, v) => aendern(n => { n.einstellungen[k] = v; });
  const minFeld = (k, label, hilfe) => <Feld label={label} hilfe={hilfe}>
    <div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e[k] / 60} step="0.5" onChange={ev => setE(k, Math.round(+ev.target.value * 60))} /><span className="text-xs text-stone-500">h</span></div></Feld>;
  const [modellNeu, setModellNeu] = useState(null);
  function modellSpeichern(m, ab) { aendern(n => modellUebernehmen(n, m, ab), `Dienstplan gespeichert${ab > "2000-01-01" ? ` (gültig ab ${fmtD(ab)})` : ""}`); setModellNeu(null); }

  return <div className="space-y-5">
    <Seitenkopf titel="Einstellungen" sub={admin ? "Arbeitszeitmodelle, gesetzliche Grenzen und Firmenregeln" : "Nur lesend – Änderungen durch die Administration"} />
    <Karte titel="Arbeitszeitmodelle / fixe Dienstpläne" aktion={admin && <Knopf klein icon="plus" onClick={() => setModellNeu(mitStunden({ id: uid(), name: "Neuer Dienstplan", plan: (e.oeffnungszeiten || []).map(o => o ? { ...o, p: hm2min(o.e) - hm2min(o.b) > 360 ? 60 : 0 } : null) }))}>Dienstplan</Knopf>} innen="p-0">
      <Tabelle kopf={["Name", ...WT.map(t => ({ t, cls: "text-center" })), { t: "Std./Wo.", cls: "text-right" }, { t: "Personen", cls: "text-right" }, ""]}>
        {db.modelle.map(m => <tr key={m.id}>
          <td className="px-3 py-2.5 font-medium whitespace-nowrap">{m.name}</td>
          {WT.map((_, i) => { const t = planAusModell(m, i); return <td key={i} title={ausserhalbOeffnung(e.oeffnungszeiten, i, t) ? "außerhalb der Öffnungszeiten" : undefined} className={`px-2 py-2.5 text-center tabular text-xs leading-tight ${t ? "" : "text-stone-300"} ${ausserhalbOeffnung(e.oeffnungszeiten, i, t) ? "bg-amber-50 text-amber-800" : ""}`}>{t ? <>{t.b}–{t.e}<div className="text-stone-400">{fmtTage(planStunden(t))} h{t.p ? ` · ${t.p}′` : ""}</div></> : "–"}</td>; })}
          <td className="px-3 py-2.5 text-right tabular font-semibold">{String(wochenStd(m)).replace(".", ",")}</td>
          <td className="px-3 py-2.5 text-right tabular">{db.mitarbeiter.filter(x => x.modellId === m.id && x.aktiv).length}</td>
          <td className="px-3 py-2.5 text-right">{admin && <button onClick={() => setModellNeu({ ...m, plan: WT.map((_, i) => planAusModell(m, i)) })} className="p-1.5 rounded-md text-stone-500 hover:bg-stone-100"><Icon n="stift" className="w-4 h-4" /></button>}</td>
        </tr>)}
      </Tabelle>
      <p className="px-5 py-3 text-xs text-stone-500">Jede Änderung gilt ab einem Datum – vergangene Tage behalten den alten Plan. Einen eigenen Plan für eine Person legst du unter „Mitarbeiter“ an.</p>
    </Karte>

    <Karte titel="Öffnungszeiten Salon">
      <div className="grid md:grid-cols-2 gap-x-10 gap-y-2">
        {WT_LANG.map((t, i) => { const o = e.oeffnungszeiten?.[i]; const setO = v => { const oz = [...(e.oeffnungszeiten || Array(7).fill(null))]; oz[i] = v; setE("oeffnungszeiten", oz); };
          return <div key={i} className="flex items-center gap-2 text-sm">
            <label className="flex items-center gap-2 w-28 shrink-0"><input type="checkbox" disabled={!admin} checked={!!o} onChange={ev => setO(ev.target.checked ? { b: "09:00", e: "18:00" } : null)} /><span className="font-semibold">{t}</span></label>
            {o ? <><input type="time" disabled={!admin} className={`${inputKlein} py-1 px-2 w-32`} value={o.b} onChange={ev => setO({ ...o, b: ev.target.value })} /><span className="text-stone-400">–</span>
              <input type="time" disabled={!admin} className={`${inputKlein} py-1 px-2 w-32`} value={o.e} onChange={ev => setO({ ...o, e: ev.target.value })} /></>
              : <span className="text-stone-400 text-xs">geschlossen</span>}
          </div>; })}
      </div>
      <p className="mt-3 text-xs text-stone-500">Dienstpläne, die außerhalb der Öffnungszeiten liegen, werden markiert. Das Stempel-Tablet zeigt die heutigen Öffnungszeiten.</p>
    </Karte>

    <Karte titel="Automatik & Überstunden">
      <div className="grid md:grid-cols-2 gap-x-8 gap-y-3">
        {[
          ["autoGehen", "Vergessenes „Gehen“ ergänzen", "Dienstende laut Plan eintragen"],
          ["autoPause", "Pause automatisch eintragen", "wenn keine oder zu kurze Pause gestempelt wurde – Dauer laut Plan"],
          ["autoFehltag", "Ganz vergessene Tage ergänzen", "Arbeitstag ohne Stempelung und ohne Abwesenheit = Arbeitszeit laut Plan"],
          ["ueberstunden", "Überstunden / Mehrarbeit vorgesehen", "aus: Auswertungen ohne Überstunden; längere Tage werden als Hinweis markiert"],

          <input type="checkbox" className="mt-1" disabled={!admin} checked={!!e[k]} onChange={ev => setE(k, ev.target.checked)} />
          <span><span className="font-medium">{t}</span><span className="block text-xs text-stone-500">{h}</span></span></label>)}
        <Feld label="Hinweis ab (Minuten über Plan)"><input type="number" className={inputCls} disabled={!admin} value={e.planToleranzMin} onChange={ev => setE("planToleranzMin", +ev.target.value)} /></Feld>
      </div>
      <div className="mt-4"><Hinweis>
        Bei fixer Arbeitszeit reicht nach § 26 AZG, dass der Dienstplan schriftlich festgehalten ist, die Einhaltung jeden Monat bestätigt wird und nur Abweichungen aufgezeichnet werden. Für automatisch eingetragene Pausen braucht es eine schriftliche Vereinbarung über die Pausen (z. B. im Dienstvertrag). Alles Automatische ist mit „auto“ markiert und steht im Protokoll – Mitarbeiter/innen prüfen es beim Monatsabschluss.
      </Hinweis></div>
    </Karte>

    <div className="grid lg:grid-cols-2 gap-5">
      <Karte titel="Gesetzliche Grenzen (AZG / ARG)">
        <div className="grid sm:grid-cols-2 gap-4">
          {minFeld("tagNormalMin", "Tagesnormalarbeitszeit", "§ 3 AZG: 8 h")}
          <Feld label="Wöchentliche Normalarbeitszeit" hilfe="lt. KV prüfen"><div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e.vollzeitWoche} onChange={ev => setE("vollzeitWoche", +ev.target.value)} /><span className="text-xs text-stone-500">h</span></div></Feld>
          {minFeld("pauseAbMin", "Ruhepause ab", "§ 11 AZG: mehr als 6 h")}
          <Feld label="Mindestpause" hilfe="30 min, teilbar in 2×15 oder 3×10 min"><div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e.pauseMin} onChange={ev => setE("pauseMin", +ev.target.value)} /><span className="text-xs text-stone-500">min</span></div></Feld>
          {minFeld("tagWarnMin", "Warnung ab (Tag)", "über 10 h nur mit Überstunden")}
          {minFeld("tagMaxMin", "Tageshöchstarbeitszeit", "§ 9 AZG: 12 h")}
          {minFeld("ruhezeitMin", "Tägliche Ruhezeit", "§ 12 AZG: 11 h")}
          {minFeld("wocheMaxMin", "Wochenhöchstarbeitszeit", "§ 9 AZG: 60 h, Ø 48 h in 17 Wochen")}
        </div>
      </Karte>
      <Karte titel="Lehrlinge & Jugendliche (KJBG)">
        <div className="grid sm:grid-cols-2 gap-4">
          {minFeld("kjbgPauseAbMin", "Ruhepause ab", "§ 15 KJBG: mehr als 4,5 h")}
          {minFeld("kjbgTagMaxMin", "Tageshöchstarbeitszeit", "§ 11 KJBG: 8 h (9 h bei Verteilung)")}
          {minFeld("kjbgWocheMaxMin", "Wochenarbeitszeit", "§ 11 KJBG: 40 h")}
          {minFeld("kjbgRuhezeitMin", "Tägliche Ruhezeit", "§ 16 KJBG: 12 h")}
        </div>
        <div className="mt-5 pt-4 border-t border-stone-100">
          <div className="text-sm font-medium mb-2">Berufsschule – Tage pro Woche</div>
          <div className="grid grid-cols-4 gap-3">{[1, 2, 3, 4].map(lj => <Feld key={lj} label={`${lj}. Lehrjahr`}>
            <input type="number" step="0.5" min="0" max="5" className={inputCls} disabled={!admin} value={e.bsTageJeLehrjahr?.[lj] ?? ""} onChange={ev => setE("bsTageJeLehrjahr", { ...e.bsTageJeLehrjahr, [lj]: +ev.target.value })} /></Feld>)}</div>
          <p className="mt-2 text-xs text-stone-500">Wien: 1. Lehrjahr 1,5 Tage, 2. und 3. Lehrjahr 1 Tag. Berufsschulzeit wird nach KJBG auf die Arbeitszeit angerechnet. Planen unter „Krankenstand → Berufsschule planen“.</p>
        </div>
      </Karte>
      <Karte titel="Urlaub, Zuschläge & Firmenregeln">
        <div className="grid sm:grid-cols-2 gap-4">
          <Feld label="Urlaubsanspruch (5-Tage-Woche)" hilfe="§ 2 UrlG: 25 Arbeitstage, ab 25 Dienstjahren 30"><input type="number" className={inputCls} disabled={!admin} value={e.urlaubBasisTage} onChange={ev => setE("urlaubBasisTage", +ev.target.value)} /></Feld>
          <Feld label="AU-Bestätigung ab Tag" hilfe="Firmenregel / Dienstvertrag"><input type="number" className={inputCls} disabled={!admin} value={e.auAbTag} onChange={ev => setE("auAbTag", +ev.target.value)} /></Feld>
          <Feld label="Überstundenzuschlag %" hilfe="§ 10 AZG: 50 %"><input type="number" className={inputCls} disabled={!admin} value={e.zuschlagUeberstunden} onChange={ev => setE("zuschlagUeberstunden", +ev.target.value)} /></Feld>
          <Feld label="Mehrarbeitszuschlag % (Teilzeit)" hilfe="§ 19d AZG: 25 %"><input type="number" className={inputCls} disabled={!admin} value={e.zuschlagMehrarbeit} onChange={ev => setE("zuschlagMehrarbeit", +ev.target.value)} /></Feld>
          <Feld label="Kollektivvertrag" breit><input className={inputCls} disabled={!admin} value={e.kollektivvertrag} onChange={ev => setE("kollektivvertrag", ev.target.value)} /></Feld>
        </div>
      </Karte>
      <Karte titel="Rollen & Berechtigungen" innen="p-0">
        <Tabelle kopf={["Funktion", { t: "Admin", cls: "text-center" }, { t: "Leitung", cls: "text-center" }, { t: "Team", cls: "text-center" }]}>
          {[
            ["Eigene Zeiten stempeln & ansehen", 1, 1, 1],
            ["Korrektur der eigenen Zeit beantragen", 1, 1, 1],
            ["Zeiten des eigenen Teams ändern (mit Grund)", 1, 1, 0],
            ["Urlaub/Abwesenheit des Teams genehmigen", 1, 1, 0],
            ["Monat abschließen", 1, 1, 0],
            ["Abgeschlossenen Monat wieder öffnen", 1, 0, 0],
            ["Mitarbeiter anlegen, Rollen vergeben", 1, 0, 0],
            ["Einstellungen & Modelle ändern", 1, 0, 0],
            ["Grund einer Abwesenheit von Kolleg/innen sehen", 1, 1, 0],
          ].map(([t, ...r]) => <tr key={t}><td className="px-3 py-2">{t}</td>{r.map((x, i) => <td key={i} className="px-3 py-2 text-center">{x ? <Icon n="haken" className="w-4 h-4 inline text-emerald-600" /> : <span className="text-stone-300">–</span>}</td>)}</tr>)}
        </Tabelle>
        <p className="px-5 py-3 text-xs text-stone-500">Vorgesetzte genehmigen nur für Personen, bei denen sie als Vorgesetzte/r eingetragen sind – nie für sich selbst. In der Live-Version setzt die Datenbank (RLS) das durch.</p>
      </Karte>
    </div>
    {admin && <Karte titel="Demo-Daten">
      <div className="flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
        <p className="text-sm text-stone-600">Alle Daten liegen nur in diesem Browser. Zurücksetzen erzeugt frische, erfundene Beispieldaten.</p>
        <Knopf art="rot" onClick={() => { if (confirm("Alle Demo-Daten in diesem Browser zurücksetzen?")) setDb(demoDaten()); }}>Zurücksetzen</Knopf>
      </div>
    </Karte>}
    {modellNeu && <ModellDialog db={db} neu={!db.modelle.some(x => x.id === modellNeu.id)} modell={modellNeu} oz={e.oeffnungszeiten} onSave={modellSpeichern} onClose={() => setModellNeu(null)} />}
  </div>;
}
function ModellDialog({ db, modell, oz, neu, onSave, onClose }) {
  const [m, setM] = useState(modell);
  const [ab, setAb] = useState(`${monatKey(heute())}-01`);
  const setTag = (i, t) => { const plan = [...m.plan]; plan[i] = t; setM({ ...m, plan }); };
  const summe = m.plan.reduce((s, t) => s + planStunden(t), 0);
  const nutzer = db.mitarbeiter.filter(x => x.modellId === modell.id);
  // Änderungen dürfen nicht in schon abgeschlossene Monate hineinreichen
  const gesperrtAb = !neu && db.abschluesse.some(a => a.abgeschlossenAm && a.monat >= monatKey(ab || "0000") && nutzer.some(x => x.id === a.maId));
  const fehler = !m.name.trim() ? "Bezeichnung fehlt." : !neu && !ab ? "Gültig-ab-Datum fehlt." : gesperrtAb ? "Ab diesem Datum sind schon Monate abgeschlossen – bitte ein späteres Datum wählen (oder den Monat zuerst wieder öffnen)." : null;
  return <Modal breit titel={neu ? "Neuer Dienstplan" : "Dienstplan & Pausen bearbeiten"} onClose={onClose} fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={() => onSave(mitStunden(m), neu ? "2000-01-01" : ab)} disabled={!!fehler}>Speichern</Knopf></>}>
    <div className="space-y-4">
      <div className="grid sm:grid-cols-2 gap-4">
        <Feld label="Bezeichnung"><input className={inputCls} value={m.name} onChange={e => setM({ ...m, name: e.target.value })} /></Feld>
        {!neu && <Feld label="Gültig ab" hilfe="Tage davor bleiben beim alten Plan"><input type="date" className={inputCls} value={ab} onChange={e => setAb(e.target.value)} /></Feld>}
      </div>
      <div className="space-y-1.5">
        {WT_LANG.map((t, i) => { const p = m.plan[i]; return <div key={i} className="flex flex-wrap items-center gap-2">
          <label className="flex items-center gap-2 w-32 text-sm font-semibold"><input type="checkbox" checked={!!p} onChange={e => setTag(i, e.target.checked ? (oz?.[i] ? { b: oz[i].b, e: oz[i].e, p: 60 } : { b: "09:00", e: "18:00", p: 60 }) : null)} />{t}</label>
          {p ? <>
            <input type="time" className={`${inputKlein} py-1.5`} value={p.b} onChange={e => setTag(i, { ...p, b: e.target.value })} />
            <span className="text-stone-400">–</span>
            <input type="time" className={`${inputKlein} py-1.5`} value={p.e} onChange={e => setTag(i, { ...p, e: e.target.value })} />
            <span className="text-xs text-stone-500 ml-1">Pause</span>
            <input type="number" min="0" step="5" className={`${inputKlein} py-1.5 w-16`} value={p.p} onChange={e => setTag(i, { ...p, p: +e.target.value })} />
            <span className="text-xs text-stone-500">min · <b className="text-stone-800">{fmtTage(planStunden(p))} h</b></span>
            {ausserhalbOeffnung(oz, i, p) && <span className="text-xs text-amber-700">außerhalb Öffnungszeit{oz?.[i] ? ` (${oz[i].b}–${oz[i].e})` : " (geschlossen)"}</span>}
          </> : <span className="text-xs text-stone-400">frei</span>}
        </div>; })}
      </div>
      <div className="text-sm">Summe: <b>{fmtTage(summe)} h/Woche</b>{nutzer.length > 0 && <span className="text-stone-500"> · gilt für {nutzer.map(x => x.name.split(" ")[0]).join(", ")}</span>}</div>
      {modell.versionen?.length > 1 && <div className="text-xs text-stone-500">Bisherige Versionen: {modell.versionen.map(v => `ab ${fmtD(v.ab)} (${fmtTage(v.plan.reduce((s, t) => s + planStunden(t), 0))} h)`).join(" · ")}</div>}
      {fehler && <p className="text-xs text-rose-700">{fehler}</p>}
    </div>
  </Modal>;
}

// ─── APP-RAHMEN ───────────────────────────────────────────────────────────────
const NAV = [
  { id: "dashboard",  label: "Dashboard",     em: "🏠" },
  { id: "zeit",       label: "Zeiterfassung", em: "⏱️" },
  { id: "urlaub",     label: "Urlaub",        em: "🌴" },
  { id: "krank",      label: "Krankenstand",  em: "🤒" },
  { id: "mitarbeiter",label: "Mitarbeiter",   em: "👥" },
  { id: "kalender",   label: "Kalender",      em: "📅" },
  { id: "auswertung", label: "Auswertungen",  em: "📊" },
  { id: "einstellung",label: "Einstellungen", em: "⚙️" },
];

function App() {
  const [db, setDb] = useState(ladeDb);
  const [userId, setUserId] = useState(() => { try { return sessionStorage.getItem(SESS_KEY); } catch (e) { return null; } });
  const [seite, setSeiteRoh] = useState("dashboard");
  const [navOffen, setNavOffen] = useState(false);
  const [toast, setToast] = useState(null);
  const [, setTick] = useState(0);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { /* ohne Speicher weiter */ } }, [db]);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);

  const [terminal, setTerminal] = useState(false);
  // Automatik beim Öffnen (live: nächtlicher Server-Job)
  useEffect(() => { const n = JSON.parse(JSON.stringify(db)); if (automatik(n)) setDb(n); }, []);

  // fn darf eine Meldung zurückgeben (z. B. beim Stempeln)
  const aendern = (fn, meldung) => { const n = JSON.parse(JSON.stringify(db)); const r = fn(n); setDb(n); if (meldung || typeof r === "string") setToast(meldung || r); };
  const toastEl = toast && <div className="no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-5 py-3 rounded-full shadow-lg flex items-center gap-2 max-w-[92vw]"><Icon n="haken" className="w-4 h-4 text-emerald-400 shrink-0" />{toast}</div>;
  const user = db.mitarbeiter.find(m => m.id === userId && m.aktiv);
  function login(id) { try { sessionStorage.setItem(SESS_KEY, id); } catch (e) { } setUserId(id); setSeiteRoh("dashboard"); }
  function logout() { try { sessionStorage.removeItem(SESS_KEY); } catch (e) { } setUserId(null); }
  if (terminal) return <>{<Terminal db={db} aendern={aendern} onEnde={() => setTerminal(false)} />}{toastEl}</>;
  if (!user) return <Login db={db} onLogin={login} onTerminal={() => setTerminal(true)} />;

  const setSeite = s => { setSeiteRoh(s); setNavOffen(false); window.scrollTo(0, 0); };
  const ctx = { db, setDb, user, aendern, sichtbar: sichtbareMA(db, user), setSeite };
  const badges = {
    urlaub: db.abwesenheiten.filter(a => a.art === "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    krank: db.abwesenheiten.filter(a => a.art !== "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    zeit: db.korrekturen.filter(k => k.status === "offen" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === k.maId))).length,
  };
  const Seite = { dashboard: Dashboard, zeit: Zeiterfassung, urlaub: Urlaub, krank: Krankenstand, mitarbeiter: Mitarbeiter, kalender: Kalender, auswertung: Auswertungen, einstellung: Einstellungen }[seite];
  const navLabel = n => n.id === "mitarbeiter" && !istLeitung(user) ? "Mein Profil" : n.label;

  const navInhalt = <>
    <div className="px-5 pt-7 pb-5">
      <p className="text-[11px] text-stone-500 uppercase tracking-[.14em] font-semibold">Great Hair Day</p>
      <p className="text-lg font-bold text-stone-900 leading-tight">Zeitverwaltung</p>
    </div>
    <nav className="flex-1 px-3 space-y-1 overflow-y-auto">
      {NAV.map(n => <button key={n.id} onClick={() => setSeite(n.id)}
        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-full text-[13.5px] font-semibold transition border ${seite === n.id ? "bg-white border-gold-500 text-gold-700" : "border-transparent text-stone-600 hover:bg-white hover:border-stone-200"}`}>
        <span className="text-[17px] w-6 text-center">{n.em}</span><span className="flex-1 text-left">{navLabel(n)}</span>
        {badges[n.id] > 0 && <span className="min-w-[1.25rem] h-5 px-1.5 rounded-full bg-rose-100 text-rose-600 text-[11px] font-bold flex items-center justify-center">{badges[n.id]}</span>}
      </button>)}
    </nav>
    <div className="p-3 border-t border-stone-200">
      <div className="flex items-center gap-2.5 px-2 py-2">
        <Avatar name={user.name} klein />
        <div className="flex-1 min-w-0 leading-tight"><div className="text-sm font-semibold text-stone-900 truncate">{user.name}</div><div className="text-[11px] text-stone-500">{ROLLEN[user.rolle].label}</div></div>
        <button onClick={logout} className="p-1.5 rounded-full text-stone-500 hover:text-gold-700 hover:bg-white" title="Abmelden"><Icon n="abmelden" className="w-4 h-4" /></button>
      </div>
    </div>
  </>;

  return <div className="min-h-screen">
    <aside className="no-print hidden lg:flex fixed inset-y-0 left-0 w-60 bg-stone-100 border-r border-stone-200 flex-col z-30">{navInhalt}</aside>
    {navOffen && <div className="no-print lg:hidden fixed inset-0 z-40 bg-stone-900/45" onClick={() => setNavOffen(false)}>
      <aside className="w-64 h-full bg-stone-100 flex flex-col einblenden" onClick={e => e.stopPropagation()}>{navInhalt}</aside>
    </div>}
    <header className="no-print lg:hidden sticky top-0 z-20 h-14 bg-stone-50/90 backdrop-blur border-b border-stone-200 flex items-center gap-3 px-4">
      <button onClick={() => setNavOffen(true)} className="p-1.5 -ml-1.5 rounded-full text-stone-700 hover:bg-white" aria-label="Menü"><Icon n="menu" /></button>
      <span className="font-bold text-[15px] flex-1">{NAV.find(n => n.id === seite).em} {navLabel(NAV.find(n => n.id === seite))}</span>
      <Avatar name={user.name} klein />
    </header>
    <main className="lg:ml-60 print-full">
      <div className="no-print bg-amber-100 border-b border-amber-200 text-amber-800 text-xs px-4 lg:px-8 py-1.5">Prototyp mit erfundenen Beispieldaten – gespeichert nur in diesem Browser, keine Verbindung zur Datenbank.</div>
      <div className="max-w-7xl mx-auto px-4 lg:px-8 py-6 print-full"><Seite ctx={ctx} /></div>
    </main>
    {toastEl}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
