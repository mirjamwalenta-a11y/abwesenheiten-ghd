  const liste = sichtbar.filter(m => (!nurAktiv || m.aktiv) && `${m.name} ${m.personalnr} ${m.abteilung} ${m.funktion}`.toLowerCase().includes(suche.toLowerCase()));
  return <div className="space-y-5">
    <Seitenkopf titel={istLeitung(user) ? "Mitarbeiter" : "Mein Profil"} sub={istLeitung(user) ? `${db.mitarbeiter.filter(m => m.aktiv).length} aktive Mitarbeiter/innen` : "Deine Stammdaten – Änderungen bitte über die Verwaltung"}>
      {istLeitung(user) && <><input className={`${inputKlein} w-48`} placeholder="Suchen …" value={suche} onChange={e => setSuche(e.target.value)} />
        <label className="flex items-center gap-1.5 text-sm text-stone-600"><input type="checkbox" checked={nurAktiv} onChange={e => setNurAktiv(e.target.checked)} />nur aktive</label></>}
      {istAdmin(user) && <Knopf icon="plus" onClick={() => setDialog("neu")}>Neu</Knopf>}
    </Seitenkopf>
    <Karte innen="p-0">
      <Tabelle kopf={["Name", "Pers.-Nr.", "Abteilung", "Eintritt", "Modell", { t: "Std./Wo.", cls: "text-right" }, { t: "Urlaub", cls: "text-right" }, { t: "Zeitkonto", cls: "text-right" }, "Vorgesetzte/r", "Rolle", ""]}>
        {liste.map(m => { const konto = zeitkonto(db, m, heute()); const k = urlaubsKonto(db, m, jahr); return <tr key={m.id} className={m.aktiv ? "" : "text-stone-400"}>
          <td className="px-3 py-2.5"><div className="flex items-center gap-2.5"><Avatar name={m.name} klein /><div><div className="font-medium whitespace-nowrap">{m.name}{m.kjbg && <span className="ml-1.5 text-[10px] font-semibold text-indigo-700 bg-indigo-50 rounded px-1">KJBG</span>}</div><div className="text-xs text-stone-500">{m.funktion}</div></div></div></td>
          <td className="px-3 py-2.5 tabular">{m.personalnr}</td>
          <td className="px-3 py-2.5">{m.abteilung}</td>
          <td className="px-3 py-2.5 tabular whitespace-nowrap">{fmtD(m.eintritt)}</td>
          <td className="px-3 py-2.5 text-xs">{modellVon(db, m).name}</td>
          <td className="px-3 py-2.5 text-right tabular">{wochenStd(modellVon(db, m))}</td>
          <td className="px-3 py-2.5 text-right tabular whitespace-nowrap">{k.rest} / {k.anspruch + k.uebertrag}</td>
          <td className={`px-3 py-2.5 text-right tabular ${konto < 0 ? "text-rose-700" : "text-emerald-700"}`}>{fmtH(konto, true)}</td>
          <td className="px-3 py-2.5 whitespace-nowrap">{m.vorgesetzterId ? nameVon(db, m.vorgesetzterId) : "–"}</td>
          <td className="px-3 py-2.5 text-xs whitespace-nowrap">{m.aktiv ? ROLLEN[m.rolle].label : `ausgetreten ${fmtD(m.austritt)}`}</td>
          <td className="px-3 py-2.5 text-right">{istAdmin(user) && <button onClick={() => setDialog(m)} className="p-1.5 rounded-md text-stone-500 hover:bg-stone-100" title="Bearbeiten"><Icon n="stift" className="w-4 h-4" /></button>}</td>
        </tr>; })}
      </Tabelle>
    </Karte>
    {istAdmin(user) && <p className="text-xs text-stone-500">Ausgetretene werden deaktiviert statt gelöscht – Arbeitszeitaufzeichnungen und Lohnunterlagen müssen aufbewahrt werden (u. a. § 132 BAO: 7 Jahre).</p>}
    {dialog && <MaDialog ctx={ctx} ma={dialog === "neu" ? null : dialog} onClose={() => setDialog(null)} />}
  </div>;
}

// ─── KALENDER ─────────────────────────────────────────────────────────────────
function Kalender({ ctx }) {
  const { db, sichtbar, user } = ctx;
  const [monat, setMonat] = useState(monatKey(heute()));
  // Teamkalender: alle Aktiven sehen genehmigte Abwesenheiten aller (ohne Art bei Krankenstand für Nicht-Leitung)
  const team = (istLeitung(user) ? sichtbar : db.mitarbeiter).filter(m => m.aktiv || tageImMonat(monat).some(d => beschaeftigt(m, d)));
  const tage = tageImMonat(monat), h = heute();
  const leitung = istLeitung(user);
  const zelle = (m, d) => {
    if (!beschaeftigt(m, d)) return { cls: "bg-stone-100", t: "" };
    const a = abwAm(db, m.id, d), b = abwAntragAm(db, m.id, d);
    const frei = !(+modellVon(db, m).tage[wd(d)]) || feiertag(d);
    if (a) {
      // Datensparsam: Kolleg/innen sehen nur „abwesend“, nicht ob krank
      const zeigen = leitung || m.id === user.id || a.art === "urlaub";
      return zeigen ? { cls: `${ARTEN[a.art].voll} ${frei ? "opacity-40" : ""}`, t: ARTEN[a.art].kurz, title: ARTEN[a.art].label } : { cls: `bg-stone-400 text-white ${frei ? "opacity-40" : ""}`, t: "A", title: "Abwesend" };
    }
    if (b && (leitung || m.id === user.id)) return { cls: `${ARTEN[b.art].hell} streifen`, t: "?", title: `${ARTEN[b.art].label} beantragt` };
    if (frei) return { cls: "bg-stone-100", t: "" };
    return { cls: "", t: "" };
  };
  return <div className="space-y-5">
    <Seitenkopf titel="Teamkalender" sub="Urlaub, Krankenstand und Abwesenheiten auf einen Blick">
      <MonatWahl monat={monat} setMonat={setMonat} />
    </Seitenkopf>
    <Karte innen="p-0">
      <div className="overflow-x-auto">
        <table className="text-xs border-separate border-spacing-0 w-full">
          <thead><tr>
            <th className="sticky left-0 z-10 bg-white text-left px-3 py-2 font-medium text-stone-500 border-b border-stone-200 min-w-[9rem]">Mitarbeiter/in</th>
            {tage.map(d => { const ft = feiertag(d); return <th key={d} title={ft?.name} className={`px-0 py-1.5 font-medium border-b border-stone-200 min-w-[1.9rem] ${ft ? "text-rose-600" : wd(d) >= 5 ? "text-stone-400" : "text-stone-500"} ${d === h ? "bg-amber-100" : ""}`}>
              <div>{WT[wd(d)].slice(0, 2)}</div><div className="tabular text-stone-800 font-semibold">{parseInt(d.slice(8))}</div></th>; })}
          </tr></thead>
          <tbody>
            {team.map(m => <tr key={m.id}>
              <td className="sticky left-0 z-10 bg-white px-3 py-1.5 border-b border-stone-100 whitespace-nowrap font-medium text-stone-800">{m.name}</td>
              {tage.map(d => { const z = zelle(m, d); return <td key={d} className={`border-b border-l border-stone-100 p-0.5 ${d === h ? "bg-amber-50" : ""}`}>
                <div title={z.title} className={`h-7 rounded flex items-center justify-center font-semibold ${z.cls}`}>{z.t}</div></td>; })}
            </tr>)}
            <tr><td className="sticky left-0 bg-white px-3 py-1.5 text-stone-500">Abwesend</td>
              {tage.map(d => { const n = team.filter(m => abwAm(db, m.id, d) && +modellVon(db, m).tage[wd(d)] && !feiertag(d)).length; return <td key={d} className={`text-center py-1.5 tabular font-medium ${n >= 3 ? "text-rose-700" : "text-stone-500"}`}>{n || ""}</td>; })}</tr>
          </tbody>
        </table>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-2 px-5 py-3 border-t border-stone-100 text-xs text-stone-600">
        {Object.entries(ARTEN).map(([k, a]) => <span key={k} className="inline-flex items-center gap-1.5"><span className={`w-4 h-4 rounded text-[9px] font-bold flex items-center justify-center ${a.voll}`}>{a.kurz}</span>{a.label}</span>)}
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-amber-100 streifen" />beantragt</span>
        <span className="inline-flex items-center gap-1.5"><span className="w-4 h-4 rounded bg-stone-100 ring-1 ring-stone-200" />frei / Schließtag / Feiertag</span>
      </div>
    </Karte>
    {!leitung && <p className="text-xs text-stone-500">Bei Kolleg/innen siehst du nur „A“ (abwesend) – der Grund (z. B. Krankenstand) bleibt vertraulich.</p>}
    <Karte titel={`Feiertage ${monat.slice(0, 4)}`} innen="p-0">
      <ul className="grid sm:grid-cols-2 lg:grid-cols-3 text-sm">
        {feiertage(parseInt(monat)).map(f => <li key={f.datum} className={`px-5 py-2 flex justify-between gap-2 border-b border-stone-100 ${f.datum < h ? "text-stone-400" : ""}`}><span>{f.name}</span><span className="tabular">{fmtDk(f.datum)}</span></li>)}
      </ul>
    </Karte>
  </div>;
}

// ─── AUSWERTUNGEN ─────────────────────────────────────────────────────────────
function Auswertungen({ ctx }) {
  const { db, user, sichtbar } = ctx;
  const [ansicht, setAnsicht] = useState("monat");
  const [monat, setMonat] = useState(monatVerschieben(monatKey(heute()), -1));
  const [jahr, setJahr] = useState(new Date().getFullYear());
  const tage = tageImMonat(monat);
  const von = ansicht === "monat" ? tage[0] : `${jahr}-01-01`;
  const bis = ansicht === "monat" ? tage[tage.length - 1] : `${jahr}-12-31`;
  const bisKonto = bis < heute() ? bis : heute();
  const liste = sichtbar.filter(m => tageZw(von, bis).some(d => beschaeftigt(m, d)));
  const zeilen = liste.map(m => {
    const s = summe(db, m, von, bis);
    const uk = urlaubsKonto(db, m, parseInt(von));
    const urlaubZr = db.abwesenheiten.filter(a => a.maId === m.id && a.art === "urlaub" && wirksam(a)).reduce((n, a) => {
      const v = a.von > von ? a.von : von, b = (a.bis || a.von) < bis ? (a.bis || a.von) : bis; return n + (v <= b ? urlaubsTage(db, m, v, b) : 0); }, 0);
    const krank = abwKalendertage(db, m, KRANK_ARTEN, von, bis);
    const sonst = abwKalendertage(db, m, ["pflege", "sonder", "fortbildung", "za", "unbezahlt"], von, bis);
    const ab = ansicht === "monat" ? abschlussVon(db, m.id, monat) : null;
    return { m, s, konto: zeitkonto(db, m, bisKonto), uk, urlaubZr, krank, sonst, ab };
  });
  const sum = k => zeilen.reduce((n, z) => n + k(z), 0);

  function exportieren() {
    const kopf = ["Personalnr", "Name", "Arbeitszeitmodell", "Soll (h)", "Ist (h)", "Abwesenheit angerechnet (h)", "Saldo Zeitraum (h)", "Zeitkonto (h)", "Mehrarbeit (h)", "Überstunden (h)", "Urlaubstage", "Resturlaub", "Krankenstand (KT)", "Sonstige Abwesenheit (KT)"];
    if (ansicht === "monat") kopf.push("Monatsabschluss");
    csvExport(`auswertung_${ansicht === "monat" ? monat : jahr}.csv`, [kopf, ...zeilen.map(z => {
      const r = [z.m.personalnr, z.m.name, modellVon(db, z.m).name, fmtDez(z.s.soll), fmtDez(z.s.ist), fmtDez(z.s.gut), fmtDez(z.s.saldo), fmtDez(z.konto), fmtDez(z.s.mehrarbeit), fmtDez(z.s.ueberstunden), z.urlaubZr, z.uk.rest, z.krank, z.sonst];
      if (ansicht === "monat") r.push(z.ab?.abgeschlossenAm ? `abgeschlossen ${fmtD(z.ab.abgeschlossenAm)}` : "offen");
      return r;
    })]);
  }
  function exportZeiten() {
    const zz = [["Personalnr", "Name", "Datum", "Wochentag", "Beginn", "Ende", "Pause (min)", "Ist (h)", "Soll (h)", "Saldo (h)", "Abwesenheit", "Feiertag", "Hinweise AZG"]];
    liste.forEach(m => tageZw(von, bis < heute() ? bis : heute()).forEach(d => {
      const t = tagInfo(db, m, d); if (!t.z && !t.a && !t.soll) return;
      zz.push([m.personalnr, m.name, fmtD(d), WT[wd(d)], t.z?.beginn || "", t.z?.ende || "", t.z ? t.z.pause : "", fmtDez(t.ist), fmtDez(t.soll), fmtDez(t.saldo), t.a ? ARTEN[t.a.art].label : "", t.ft?.name || "", pruefeTag(db, m, d).map(x => x.text).join(" | ")]);
    }));
    csvExport(`arbeitszeiten_${ansicht === "monat" ? monat : jahr}.csv`, zz);
  }
  const zt = (v, vz) => <span className={vz ? (v > 0 ? "text-emerald-700" : v < 0 ? "text-rose-700" : "") : ""}>{fmtH(v, vz)}</span>;

  return <div className="space-y-5 print-full">
    <Seitenkopf titel="Auswertungen" sub="Arbeitszeitkonto, Überstunden, Urlaub und Krankenstand">
      <div className="inline-flex rounded-lg ring-1 ring-inset ring-stone-300 bg-white p-0.5">
        {[["monat", "Monat"], ["jahr", "Jahr"]].map(([k, l]) => <button key={k} onClick={() => setAnsicht(k)} className={`px-3 py-1.5 text-sm rounded-md ${ansicht === k ? "bg-stone-900 text-white" : "text-stone-600"}`}>{l}</button>)}
      </div>
      {ansicht === "monat" ? <MonatWahl monat={monat} setMonat={setMonat} /> :
        <select className={`${inputKlein}`} value={jahr} onChange={e => setJahr(+e.target.value)}>{[jahr - 1, jahr, jahr + 1].map(j => <option key={j}>{j}</option>)}</select>}
      <Knopf art="sekundaer" icon="download" onClick={exportieren}>Excel (CSV)</Knopf>
      <Knopf art="sekundaer" icon="download" onClick={exportZeiten}>Tageswerte (CSV)</Knopf>
      <Knopf art="sekundaer" icon="drucker" onClick={() => window.print()}>PDF</Knopf>
    </Seitenkopf>
    <div className="print-only text-lg font-semibold mb-2">{db.einstellungen.firmenname} · Auswertung {ansicht === "monat" ? fmtMonat(monat) : jahr}</div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
      <Kpi label="Ist-Stunden" wert={fmtH(sum(z => z.s.ist))} sub={`Soll ${fmtH(sum(z => z.s.soll))}`} />
      <Kpi label="Überstunden" wert={fmtH(sum(z => z.s.ueberstunden))} sub={`+ Mehrarbeit ${fmtH(sum(z => z.s.mehrarbeit))}`} />
      <Kpi label="Urlaubstage" wert={sum(z => z.urlaubZr)} sub="im Zeitraum" />
      <Kpi label="Krankenstandstage" wert={sum(z => z.krank)} sub="Kalendertage" />
    </div>

    <Karte innen="p-0" titel={ansicht === "monat" ? <span className="capitalize">Monatsübersicht {fmtMonat(monat)}</span> : `Jahresübersicht ${jahr}`}>
      <Tabelle kopf={["Mitarbeiter/in", { t: "Soll", cls: "text-right" }, { t: "Ist", cls: "text-right" }, { t: "Abw.", cls: "text-right" }, { t: "Saldo", cls: "text-right" }, { t: "Zeitkonto", cls: "text-right" }, { t: "Mehrarb.", cls: "text-right" }, { t: "Überst.", cls: "text-right" }, { t: "Urlaub", cls: "text-right" }, { t: "Rest", cls: "text-right" }, { t: "Krank", cls: "text-right" }, { t: "Sonst.", cls: "text-right" }, ...(ansicht === "monat" ? ["Abschluss"] : [])]}
        fuss={<tr className="border-t-2 border-stone-200 font-semibold tabular">
          <td className="px-3 py-2.5">Summe</td>
          <td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.soll))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.ist))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.gut))}</td>
          <td className="px-3 py-2.5 text-right">{zt(sum(z => z.s.saldo), true)}</td><td className="px-3 py-2.5 text-right">{zt(sum(z => z.konto), true)}</td>
          <td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.mehrarbeit))}</td><td className="px-3 py-2.5 text-right">{fmtH(sum(z => z.s.ueberstunden))}</td>
          <td className="px-3 py-2.5 text-right">{sum(z => z.urlaubZr)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.uk.rest)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.krank)}</td><td className="px-3 py-2.5 text-right">{sum(z => z.sonst)}</td>{ansicht === "monat" && <td />}
        </tr>}>
        {zeilen.map(z => <tr key={z.m.id} className="tabular">
          <td className="px-3 py-2.5 whitespace-nowrap"><div className="font-medium">{z.m.name}</div><div className="text-xs text-stone-500">{modellVon(db, z.m).name}</div></td>
          <td className="px-3 py-2.5 text-right">{fmtH(z.s.soll)}</td>
          <td className="px-3 py-2.5 text-right">{fmtH(z.s.ist)}</td>
          <td className="px-3 py-2.5 text-right text-stone-500">{fmtH(z.s.gut)}</td>
          <td className="px-3 py-2.5 text-right font-medium">{zt(z.s.saldo, true)}</td>
          <td className="px-3 py-2.5 text-right font-medium">{zt(z.konto, true)}</td>
          <td className="px-3 py-2.5 text-right">{z.s.mehrarbeit ? fmtH(z.s.mehrarbeit) : "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.s.ueberstunden ? fmtH(z.s.ueberstunden) : "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.urlaubZr || "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.uk.rest}</td>
          <td className="px-3 py-2.5 text-right">{z.krank || "–"}</td>
          <td className="px-3 py-2.5 text-right">{z.sonst || "–"}</td>
          {ansicht === "monat" && <td className="px-3 py-2.5">{z.ab?.abgeschlossenAm ? <Badge status="genehmigt">Abgeschlossen</Badge> : z.ab?.bestaetigtAm ? <Badge status="gemeldet">Bestätigt</Badge> : <Badge status="offen">Offen</Badge>}</td>}
        </tr>)}
      </Tabelle>
    </Karte>
    <p className="text-xs text-stone-500">
      Saldo = Ist + angerechnete Abwesenheit − Soll. Mehrarbeit/Überstunden sind vereinfacht aus positiven Wochensalden berechnet: bei Teilzeit bis zur Normalarbeitszeit ({db.einstellungen.vollzeitWoche} h) Mehrarbeit (Zuschlag {db.einstellungen.zuschlagMehrarbeit} %, entfällt bei Ausgleich im Quartal), darüber Überstunden ({db.einstellungen.zuschlagUeberstunden} %). Durchrechnungszeiträume und KV-Sonderregeln müssen mit der Lohnverrechnung abgestimmt werden.
    </p>
  </div>;
}

// ─── EINSTELLUNGEN ────────────────────────────────────────────────────────────
function Einstellungen({ ctx }) {
  const { db, user, aendern, setDb } = ctx;
  const admin = istAdmin(user);
  const e = db.einstellungen;
  const setE = (k, v) => aendern(n => { n.einstellungen[k] = v; });
  const minFeld = (k, label, hilfe) => <Feld label={label} hilfe={hilfe}>
    <div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e[k] / 60} step="0.5" onChange={ev => setE(k, Math.round(+ev.target.value * 60))} /><span className="text-xs text-stone-500">h</span></div></Feld>;
  const [modellNeu, setModellNeu] = useState(null);
  function modellSpeichern(m) { aendern(n => { const i = n.modelle.findIndex(x => x.id === m.id); if (i >= 0) n.modelle[i] = m; else n.modelle.push(m); }, "Arbeitszeitmodell gespeichert"); setModellNeu(null); }

  return <div className="space-y-5">
    <Seitenkopf titel="Einstellungen" sub={admin ? "Arbeitszeitmodelle, gesetzliche Grenzen und Firmenregeln" : "Nur lesend – Änderungen durch die Administration"} />
    <Karte titel="Arbeitszeitmodelle" aktion={admin && <Knopf klein icon="plus" onClick={() => setModellNeu({ id: uid(), name: "Neues Modell", tage: [0, 8, 8, 8, 8, 8, 0], beginn: "09:00" })}>Modell</Knopf>} innen="p-0">
      <Tabelle kopf={["Name", ...WT.map(t => ({ t, cls: "text-center" })), { t: "Std./Wo.", cls: "text-right" }, { t: "Personen", cls: "text-right" }, ""]}>
        {db.modelle.map(m => <tr key={m.id}>
          <td className="px-3 py-2.5 font-medium whitespace-nowrap">{m.name}</td>
          {m.tage.map((h, i) => <td key={i} className={`px-2 py-2.5 text-center tabular ${+h ? "" : "text-stone-300"}`}>{+h ? String(h).replace(".", ",") : "–"}</td>)}
          <td className="px-3 py-2.5 text-right tabular font-semibold">{String(wochenStd(m)).replace(".", ",")}</td>
          <td className="px-3 py-2.5 text-right tabular">{db.mitarbeiter.filter(x => x.modellId === m.id && x.aktiv).length}</td>
          <td className="px-3 py-2.5 text-right">{admin && <button onClick={() => setModellNeu({ ...m, tage: [...m.tage] })} className="p-1.5 rounded-md text-stone-500 hover:bg-stone-100"><Icon n="stift" className="w-4 h-4" /></button>}</td>
        </tr>)}
      </Tabelle>
      <p className="px-5 py-3 text-xs text-stone-500">Änderungen an einem Modell wirken rückwirkend auf alle offenen Monate. In der Live-Version bekommt jede Zuordnung ein „gültig ab“-Datum.</p>
    </Karte>

    <div className="grid lg:grid-cols-2 gap-5">
      <Karte titel="Gesetzliche Grenzen (AZG / ARG)">
        <div className="grid sm:grid-cols-2 gap-4">
          {minFeld("tagNormalMin", "Tagesnormalarbeitszeit", "§ 3 AZG: 8 h")}
          <Feld label="Wöchentliche Normalarbeitszeit" hilfe="lt. KV prüfen"><div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e.vollzeitWoche} onChange={ev => setE("vollzeitWoche", +ev.target.value)} /><span className="text-xs text-stone-500">h</span></div></Feld>
          {minFeld("pauseAbMin", "Ruhepause ab", "§ 11 AZG: mehr als 6 h")}
          <Feld label="Mindestpause" hilfe="30 min, teilbar in 2×15 oder 3×10 min"><div className="flex items-center gap-2"><input type="number" className={inputCls} disabled={!admin} value={e.pauseMin} onChange={ev => setE("pauseMin", +ev.target.value)} /><span className="text-xs text-stone-500">min</span></div></Feld>
          {minFeld("tagWarnMin", "Warnung ab (Tag)", "über 10 h nur mit Überstunden")}
          {minFeld("tagMaxMin", "Tageshöchstarbeitszeit", "§ 9 AZG: 12 h")}
          {minFeld("ruhezeitMin", "Tägliche Ruhezeit", "§ 12 AZG: 11 h")}
          {minFeld("wocheMaxMin", "Wochenhöchstarbeitszeit", "§ 9 AZG: 60 h, Ø 48 h in 17 Wochen")}
        </div>
      </Karte>
      <Karte titel="Jugendliche (KJBG)">
        <div className="grid sm:grid-cols-2 gap-4">
          {minFeld("kjbgPauseAbMin", "Ruhepause ab", "§ 15 KJBG: mehr als 4,5 h")}
          {minFeld("kjbgTagMaxMin", "Tageshöchstarbeitszeit", "§ 11 KJBG: 8 h (9 h bei Verteilung)")}
          {minFeld("kjbgWocheMaxMin", "Wochenarbeitszeit", "§ 11 KJBG: 40 h")}
          {minFeld("kjbgRuhezeitMin", "Tägliche Ruhezeit", "§ 16 KJBG: 12 h")}
        </div>
        <p className="mt-4 text-xs text-stone-500">Berufsschulzeit wird nach KJBG auf die Arbeitszeit angerechnet – im Kalender als „Berufsschule“ eintragen, sie wird voll angerechnet.</p>
      </Karte>
      <Karte titel="Urlaub, Zuschläge & Firmenregeln">
        <div className="grid sm:grid-cols-2 gap-4">
          <Feld label="Urlaubsanspruch (5-Tage-Woche)" hilfe="§ 2 UrlG: 25 Arbeitstage, ab 25 Dienstjahren 30"><input type="number" className={inputCls} disabled={!admin} value={e.urlaubBasisTage} onChange={ev => setE("urlaubBasisTage", +ev.target.value)} /></Feld>
          <Feld label="AU-Bestätigung ab Tag" hilfe="Firmenregel / Dienstvertrag"><input type="number" className={inputCls} disabled={!admin} value={e.auAbTag} onChange={ev => setE("auAbTag", +ev.target.value)} /></Feld>
          <Feld label="Überstundenzuschlag %" hilfe="§ 10 AZG: 50 %"><input type="number" className={inputCls} disabled={!admin} value={e.zuschlagUeberstunden} onChange={ev => setE("zuschlagUeberstunden", +ev.target.value)} /></Feld>
          <Feld label="Mehrarbeitszuschlag % (Teilzeit)" hilfe="§ 19d AZG: 25 %"><input type="number" className={inputCls} disabled={!admin} value={e.zuschlagMehrarbeit} onChange={ev => setE("zuschlagMehrarbeit", +ev.target.value)} /></Feld>
          <Feld label="Kollektivvertrag" breit><input className={inputCls} disabled={!admin} value={e.kollektivvertrag} onChange={ev => setE("kollektivvertrag", ev.target.value)} /></Feld>
          <Feld label="Schließtage" breit hilfe="Für die Kalenderdarstellung. Die Sollzeit kommt aus dem Arbeitszeitmodell.">
            <div className="flex flex-wrap gap-1.5">{WT.map((t, i) => { const an = e.schliesstage.includes(i); return <button key={i} disabled={!admin} onClick={() => setE("schliesstage", an ? e.schliesstage.filter(x => x !== i) : [...e.schliesstage, i])} className={`w-10 py-1.5 rounded-md text-sm ring-1 ring-inset ${an ? "bg-stone-900 text-white ring-stone-900" : "bg-white ring-stone-300 text-stone-700"}`}>{t}</button>; })}</div>
          </Feld>
        </div>
      </Karte>
      <Karte titel="Rollen & Berechtigungen" innen="p-0">
        <Tabelle kopf={["Funktion", { t: "Admin", cls: "text-center" }, { t: "Leitung", cls: "text-center" }, { t: "Team", cls: "text-center" }]}>
          {[
            ["Eigene Zeiten stempeln & ansehen", 1, 1, 1],
            ["Korrektur der eigenen Zeit beantragen", 1, 1, 1],
            ["Zeiten des eigenen Teams ändern (mit Grund)", 1, 1, 0],
            ["Urlaub/Abwesenheit des Teams genehmigen", 1, 1, 0],
            ["Monat abschließen", 1, 1, 0],
            ["Abgeschlossenen Monat wieder öffnen", 1, 0, 0],
            ["Mitarbeiter anlegen, Rollen vergeben", 1, 0, 0],
            ["Einstellungen & Modelle ändern", 1, 0, 0],
            ["Grund einer Abwesenheit von Kolleg/innen sehen", 1, 1, 0],
          ].map(([t, ...r]) => <tr key={t}><td className="px-3 py-2">{t}</td>{r.map((x, i) => <td key={i} className="px-3 py-2 text-center">{x ? <Icon n="haken" className="w-4 h-4 inline text-emerald-600" /> : <span className="text-stone-300">–</span>}</td>)}</tr>)}
        </Tabelle>
        <p className="px-5 py-3 text-xs text-stone-500">Vorgesetzte genehmigen nur für Personen, bei denen sie als Vorgesetzte/r eingetragen sind – nie für sich selbst. In der Live-Version setzt die Datenbank (RLS) das durch.</p>
      </Karte>
    </div>
    {admin && <Karte titel="Demo-Daten">
      <div className="flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
        <p className="text-sm text-stone-600">Alle Daten liegen nur in diesem Browser. Zurücksetzen erzeugt frische, erfundene Beispieldaten.</p>
        <Knopf art="rot" onClick={() => { if (confirm("Alle Demo-Daten in diesem Browser zurücksetzen?")) setDb(demoDaten()); }}>Zurücksetzen</Knopf>
      </div>
    </Karte>}
    {modellNeu && <ModellDialog modell={modellNeu} onSave={modellSpeichern} onClose={() => setModellNeu(null)} />}
  </div>;
}
function ModellDialog({ modell, onSave, onClose }) {
  const [m, setM] = useState(modell);
  return <Modal titel="Arbeitszeitmodell" onClose={onClose} fuss={<><Knopf art="sekundaer" onClick={onClose}>Abbrechen</Knopf><Knopf onClick={() => onSave({ ...m, tage: m.tage.map(h => +String(h).replace(",", ".") || 0) })} disabled={!m.name.trim()}>Speichern</Knopf></>}>
    <div className="space-y-4">
      <Feld label="Bezeichnung"><input className={inputCls} value={m.name} onChange={e => setM({ ...m, name: e.target.value })} /></Feld>
      <Feld label="Sollstunden je Wochentag">
        <div className="grid grid-cols-7 gap-1.5">{WT.map((t, i) => <div key={i} className="text-center"><div className="text-xs text-stone-500 mb-1">{t}</div>
          <input className={`${inputCls} px-1 text-center`} value={m.tage[i]} onChange={e => { const tg = [...m.tage]; tg[i] = e.target.value; setM({ ...m, tage: tg }); }} /></div>)}</div>
      </Feld>
      <Feld label="Üblicher Arbeitsbeginn"><input type="time" className={inputCls} value={m.beginn} onChange={e => setM({ ...m, beginn: e.target.value })} /></Feld>
      <div className="text-sm">Summe: <b>{m.tage.reduce((s, h) => s + (+String(h).replace(",", ".") || 0), 0)} h/Woche</b></div>
    </div>
  </Modal>;
}

// ─── APP-RAHMEN ───────────────────────────────────────────────────────────────
const NAV = [
  { id: "dashboard",  label: "Dashboard",     icon: "dashboard" },
  { id: "zeit",       label: "Zeiterfassung", icon: "uhr" },
  { id: "urlaub",     label: "Urlaub",        icon: "sonne" },
  { id: "krank",      label: "Krankenstand",  icon: "kreuz" },
  { id: "mitarbeiter",label: "Mitarbeiter",   icon: "personen" },
  { id: "kalender",   label: "Kalender",      icon: "kalender" },
  { id: "auswertung", label: "Auswertungen",  icon: "balken" },
  { id: "einstellung",label: "Einstellungen", icon: "regler" },
];

function App() {
  const [db, setDb] = useState(ladeDb);
  const [userId, setUserId] = useState(() => { try { return sessionStorage.getItem(SESS_KEY); } catch (e) { return null; } });
  const [seite, setSeiteRoh] = useState("dashboard");
  const [navOffen, setNavOffen] = useState(false);
  const [toast, setToast] = useState(null);
  const [, setTick] = useState(0);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { /* ohne Speicher weiter */ } }, [db]);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);

  const user = db.mitarbeiter.find(m => m.id === userId && m.aktiv);
  function login(id) { try { sessionStorage.setItem(SESS_KEY, id); } catch (e) { } setUserId(id); setSeiteRoh("dashboard"); }
  function logout() { try { sessionStorage.removeItem(SESS_KEY); } catch (e) { } setUserId(null); }
  if (!user) return <Login db={db} onLogin={login} />;

  const setSeite = s => { setSeiteRoh(s); setNavOffen(false); window.scrollTo(0, 0); };
  const aendern = (fn, meldung) => { setDb(prev => { const n = JSON.parse(JSON.stringify(prev)); fn(n); return n; }); if (meldung) setToast(meldung); };
  const ctx = { db, setDb, user, aendern, sichtbar: sichtbareMA(db, user), setSeite };
  const badges = {
    urlaub: db.abwesenheiten.filter(a => a.art === "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    krank: db.abwesenheiten.filter(a => a.art !== "urlaub" && a.status === "beantragt" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === a.maId))).length,
    zeit: db.korrekturen.filter(k => k.status === "offen" && darfVerwalten(user, db.mitarbeiter.find(m => m.id === k.maId))).length,
  };
  const Seite = { dashboard: Dashboard, zeit: Zeiterfassung, urlaub: Urlaub, krank: Krankenstand, mitarbeiter: Mitarbeiter, kalender: Kalender, auswertung: Auswertungen, einstellung: Einstellungen }[seite];
  const navLabel = n => n.id === "mitarbeiter" && !istLeitung(user) ? "Mein Profil" : n.label;

  const navInhalt = <>
    <div className="flex items-center gap-2.5 px-5 h-16 border-b border-white/10">
      <div className="w-8 h-8 rounded-lg bg-white text-stone-900 flex items-center justify-center"><Icon n="uhr" className="w-5 h-5" /></div>
      <div className="leading-tight"><div className="text-sm font-semibold text-white">Zeitverwaltung</div><div className="text-[11px] text-stone-400">{db.einstellungen.firmenname}</div></div>
    </div>
    <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto">
      {NAV.map(n => <button key={n.id} onClick={() => setSeite(n.id)}
        className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition ${seite === n.id ? "bg-white/10 text-white" : "text-stone-400 hover:text-white hover:bg-white/5"}`}>
        <Icon n={n.icon} className="w-[18px] h-[18px]" /><span className="flex-1 text-left">{navLabel(n)}</span>
        {badges[n.id] > 0 && <span className="min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-400 text-stone-900 text-[11px] font-bold flex items-center justify-center">{badges[n.id]}</span>}
      </button>)}
    </nav>
    <div className="p-3 border-t border-white/10">
      <div className="flex items-center gap-2.5 px-2 py-2">
        <Avatar name={user.name} klein />
        <div className="flex-1 min-w-0 leading-tight"><div className="text-sm text-white truncate">{user.name}</div><div className="text-[11px] text-stone-400">{ROLLEN[user.rolle].label}</div></div>
        <button onClick={logout} className="p-1.5 rounded-md text-stone-400 hover:text-white hover:bg-white/10" title="Abmelden"><Icon n="abmelden" className="w-4 h-4" /></button>
      </div>
    </div>
  </>;

  return <div className="min-h-screen">
    <aside className="no-print hidden lg:flex fixed inset-y-0 left-0 w-60 bg-stone-900 flex-col z-30">{navInhalt}</aside>
    {navOffen && <div className="no-print lg:hidden fixed inset-0 z-40 bg-stone-900/50" onClick={() => setNavOffen(false)}>
      <aside className="w-64 h-full bg-stone-900 flex flex-col" onClick={e => e.stopPropagation()}>{navInhalt}</aside>
    </div>}
    <header className="no-print lg:hidden sticky top-0 z-20 h-14 bg-white/90 backdrop-blur border-b border-stone-200 flex items-center gap-3 px-4">
      <button onClick={() => setNavOffen(true)} className="p-1.5 -ml-1.5 rounded-md text-stone-700 hover:bg-stone-100" aria-label="Menü"><Icon n="menu" /></button>
      <span className="font-semibold text-sm flex-1">{navLabel(NAV.find(n => n.id === seite))}</span>
      <Avatar name={user.name} klein />
    </header>
    <main className="lg:ml-60 print-full">
      <div className="no-print bg-amber-50 border-b border-amber-200 text-amber-900 text-xs px-4 lg:px-8 py-1.5">Prototyp mit erfundenen Beispieldaten – gespeichert nur in diesem Browser, keine Verbindung zur Datenbank.</div>
      <div className="max-w-7xl mx-auto px-4 lg:px-8 py-6 print-full"><Seite ctx={ctx} /></div>
    </main>
    {toast && <div className="no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2"><Icon n="haken" className="w-4 h-4 text-emerald-400" />{toast}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
