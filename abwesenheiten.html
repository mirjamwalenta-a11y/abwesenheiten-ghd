    // ─── KONSTANTEN ──────────────────────────────────────────────────────────
    // Österreichische Feiertage automatisch berechnen
    function berechneOsterSonntag(jahr) {
      // Gaußsche Osterformel
      const a = jahr % 19;
      const b = Math.floor(jahr / 100);
      const c = jahr % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const monat = Math.floor((h + l - 7 * m + 114) / 31);
      const tag = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(jahr, monat - 1, tag);
    }

    function berechneFeiertage(jahr) {
      const ostern = berechneOsterSonntag(jahr);
      function addTage(datum, tage) {
        const d = new Date(datum);
        d.setDate(d.getDate() + tage);
        return datumZuStr(new Date(d.setDate(d.getDate())));
      }
      function addT(tage) {
        const d = new Date(ostern);
        d.setDate(d.getDate() + tage);
        return datumZuStr(d);
      }
      function fix(m, t) {
        return `${jahr}-${String(m).padStart(2,"0")}-${String(t).padStart(2,"0")}`;
      }
      return [
        { datum: fix(1,1),        name: "Neujahr" },
        { datum: fix(1,6),        name: "Heilige Drei Könige" },
        { datum: addT(1),         name: "Ostermontag" },
        { datum: fix(5,1),        name: "Staatsfeiertag" },
        { datum: addT(39),        name: "Christi Himmelfahrt" },
        { datum: addT(50),        name: "Pfingstmontag" },
        { datum: addT(60),        name: "Fronleichnam" },
        { datum: fix(8,15),       name: "Mariä Himmelfahrt" },
        { datum: fix(10,26),      name: "Nationalfeiertag" },
        { datum: fix(11,1),       name: "Allerheiligen" },
        { datum: fix(12,8),       name: "Mariä Empfängnis" },
        { datum: fix(12,25),      name: "Weihnachten" },
        { datum: fix(12,26),      name: "Stephanitag" },
      ].sort((a,b) => a.datum.localeCompare(b.datum));
    }

    const _aktuellesJahr = new Date().getFullYear();
    const FEIERTAGE_CACHE = {};
    [_aktuellesJahr - 1, _aktuellesJahr, _aktuellesJahr + 1].forEach(j => {
      FEIERTAGE_CACHE[j] = berechneFeiertage(j);
    });

    function istFeiertag(datum) {
      const jahr = parseInt(datum.substring(0,4));
      if (!FEIERTAGE_CACHE[jahr]) FEIERTAGE_CACHE[jahr] = berechneFeiertage(jahr);
      return FEIERTAGE_CACHE[jahr].some(f => f.datum === datum);
    }

    function getFeiertagName(datum) {
      const jahr = parseInt(datum.substring(0,4));
      if (!FEIERTAGE_CACHE[jahr]) FEIERTAGE_CACHE[jahr] = berechneFeiertage(jahr);
      return FEIERTAGE_CACHE[jahr].find(f => f.datum === datum)?.name || "Feiertag";
    }

    function getFeiertageListe(jahr) {
      if (!FEIERTAGE_CACHE[jahr]) FEIERTAGE_CACHE[jahr] = berechneFeiertage(jahr);
      return FEIERTAGE_CACHE[jahr];
    }

    const FEIERTAGE_2025 = berechneFeiertage(2025).map(f => f.datum);
    const ANFRAGE_TYPEN_MITARBEITER = [
      { id: "urlaub",   label: "Urlaub",              icon: "🌴", color: "bg-emerald-100 text-emerald-800 border-emerald-200" },

    const ANFRAGE_TYPEN_INHABERIN = [

    // ─── HILFSFUNKTIONEN ─────────────────────────────────────────────────────
    function parseDatum(str) { return new Date(str + "T00:00:00"); }
    function formatDatum(str) {
      return parseDatum(str).toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit", year: "numeric" });
    }
    function formatMonat(year, month) {
      return new Date(year, month, 1).toLocaleDateString("de-AT", { month: "long", year: "numeric" });
    }
    function datumZuStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function tageImBereich(von, bis) {
      const tage = [];
      for (let d = parseDatum(von); d <= parseDatum(bis); d.setDate(d.getDate()+1))
        tage.push(datumZuStr(new Date(d)));
      return tage;
    }
    function arbeitstage(von, bis, schliesztage) {
      return tageImBereich(von, bis).filter(d => {
        const day = parseDatum(d).getDay();
        return day !== 0 && !istFeiertag(d) && !schliesztage.includes(d);
      });
    }
    function istFixeSperre(datum) {
      const d = parseDatum(datum), m = d.getMonth()+1, day = d.getDate();
      return m === 12 && day >= 1 && day <= 24;
    }
    function istSperre(datum, sperrzeiten) {
      if (istFixeSperre(datum)) return true;
      if (!sperrzeiten) return false;
      return sperrzeiten.some(s => datum >= s.von && datum <= s.bis);
    }
    function getTypConfig(id) {
      return ANFRAGE_TYPEN_INHABERIN.find(t => t.id === id);
    }
    function formatZeitraum(von, bis) {
      return von === bis ? formatDatum(von) : `${formatDatum(von)} – ${formatDatum(bis)}`;
    }
    function heute() { return datumZuStr(new Date()); }

    function LoginScreen({ team, onLogin }) {
      const [selected, setSelected] = useState(null);
      const [pin, setPin] = useState("");
      const [fehler, setFehler] = useState(false);

      function handlePinTaste(val) {
        if (val === "del") { setPin(p => p.slice(0,-1)); setFehler(false); return; }
        const neu = pin + val;
        if (neu.length > 4) return;
        setPin(neu); setFehler(false);
        if (neu.length === 4) {
          if (selected.pin === neu) { setTimeout(() => onLogin(selected), 150); }

      if (!selected) return (

                  <span className="ml-auto text-stone-300 text-lg">›</span>
                </button>

            </div>

      return (

              ))}

            {fehler && <p className="text-center text-rose-500 text-sm mb-4">Falscher PIN.</p>}
            <div className="grid grid-cols-3 gap-3 max-w-xs mx-auto w-full">
              {["1","2","3","4","5","6","7","8","9","","0","del"].map((key, i) => (

                  className={`h-14 rounded-2xl text-xl font-semibold transition-all active:scale-95 ${key === "del" ? "text-stone-500 hover:bg-stone-100" : "bg-white border border-stone-200 text-stone-900 hover:border-stone-400 hover:shadow-sm"}`}>

    // ─── ERÖFFNUNGSBUCHUNG ────────────────────────────────────────────────────
    function EroeffnungsbuchungScreen({ team, onSave, onSkip }) {
      const mitarbeitende = team.filter(p => p.role === "employee");
      const [werte, setWerte] = useState(Object.fromEntries(mitarbeitende.map(p => [p.id, String(p.urlaub_verbraucht)])));

      async function handleSave() {
        setSaving(true);
        try {
          for (const p of mitarbeitende) {
            await api.updatePerson(p.id, { urlaub_verbraucht: parseInt(werte[p.id], 10) || 0 });
          }
          onSave();
        } catch(e) { alert("Fehler beim Speichern: " + e.message); setSaving(false); }
      }

      return (
        <div className="px-4 py-8 flex flex-col gap-6 min-h-screen bg-stone-50">
          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium mb-1">Ersteinrichtung</p>
            <h1 className="text-2xl font-bold text-stone-900">Urlaubsstände eintragen</h1>
            <p className="text-stone-500 text-sm mt-2">Wie viele Urlaubstage hat jede Person bereits verbraucht? Das passiert nur einmal.</p>
          </div>
          <div className="flex flex-col gap-3">
            {mitarbeitende.map(p => (
              <div key={p.id} className="bg-white border border-stone-200 rounded-2xl px-4 py-4 flex items-center gap-4">

                <div className="flex-1">
                  <p className="font-semibold text-stone-800 text-sm">{p.name}</p>
                  <p className="text-xs text-stone-400">Anspruch: {p.urlaub_anspruch} Tage</p>
                </div>
                <div className="flex items-center gap-2">
                  <input type="number" min="0" max={p.urlaub_anspruch} value={werte[p.id]}
                    onChange={e => setWerte(w => ({ ...w, [p.id]: e.target.value }))}
                    className="w-16 text-center border border-stone-300 rounded-xl py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600" />
                  <span className="text-xs text-stone-400">Tage</span>
                </div>
              </div>
            ))}

          <div className="flex flex-col gap-2 pt-2">
            <button onClick={handleSave} disabled={saving}
              className="w-full bg-stone-900 text-white rounded-2xl py-4 font-semibold hover:bg-stone-800 transition-colors disabled:opacity-50">
              {saving ? "Wird gespeichert…" : "Speichern und starten"}
            </button>
            <button onClick={onSkip} className="w-full text-stone-400 text-sm py-2">Überspringen</button>
          </div>
        </div>
      );
    }

    // ─── EINSTELLUNGEN ────────────────────────────────────────────────────────
    // ─── Hilfsfunktionen Eintrittsdatum ─────────────────────────────────────
    function naechstesUrlaubsdatum(eintrittsdatum) {
      if (!eintrittsdatum) return null;
      const heute2 = new Date();
      const eintritt = new Date(eintrittsdatum + "T00:00:00");
      let naechstes = new Date(heute2.getFullYear(), eintritt.getMonth(), eintritt.getDate());
      if (naechstes <= heute2) naechstes.setFullYear(naechstes.getFullYear() + 1);
      return naechstes;
    }
    function tagesBis(datum) {
      if (!datum) return null;
      return Math.ceil((datum - new Date()) / (1000 * 60 * 60 * 24));
    }

    function PersonenKarte({ person, onUpdate }) {
      const [anspruch, setAnspruch] = useState(String(person.urlaub_anspruch));
      const [verbraucht, setVerbraucht] = useState(String(person.urlaub_verbraucht));
      const [eintrittsdatum, setEintrittsdatum] = useState(person.eintrittsdatum || "");
      const [saved, setSaved] = useState(false);
      const [saving, setSaving] = useState(false);

      const naechstes = naechstesUrlaubsdatum(eintrittsdatum);
      const tage = tagesBis(naechstes);

      async function handleSave() {
        setSaving(true);
        try {
          await api.updatePerson(person.id, { urlaub_anspruch: parseInt(anspruch)||0, urlaub_verbraucht: parseInt(verbraucht)||0, eintrittsdatum: eintrittsdatum || null });
          onUpdate({ urlaub_anspruch: parseInt(anspruch)||0, urlaub_verbraucht: parseInt(verbraucht)||0, eintrittsdatum: eintrittsdatum || null });
          setSaved(true); setTimeout(() => setSaved(false), 2000);
        } catch(e) { alert("Fehler: " + e.message); }
        setSaving(false);
      }

      return (
        <div className="bg-white border border-stone-200 rounded-2xl px-4 py-4 flex flex-col gap-3">
          <div className="flex items-center gap-3">
            <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{person.name[0]}</span>
            <p className="font-semibold text-stone-800">{person.name}</p>
          </div>
          <div className="flex-1">
            <p className="text-xs text-stone-400 mb-1">Eintrittsdatum</p>
            <input type="date" value={eintrittsdatum} onChange={e => { setEintrittsdatum(e.target.value); setSaved(false); }}
              className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 focus:outline-none focus:border-stone-600" />
          </div>
          {naechstes && (
            <div className={`rounded-xl px-3 py-2 ${tage <= 30 ? "bg-emerald-50 border border-emerald-200" : "bg-stone-50"}`}>
              <p className="text-xs text-stone-500">Nächster Urlaubsanspruch: <span className="font-semibold text-stone-800">{naechstes.toLocaleDateString("de-AT")}</span></p>
              <p className={`text-xs font-semibold mt-0.5 ${tage <= 30 ? "text-emerald-700" : "text-stone-400"}`}>
                {tage <= 0 ? "Heute fällig!" : `in ${tage} Tagen`}
              </p>
            </div>
          )}
          <div className="flex gap-3">
            <div className="flex-1">
              <p className="text-xs text-stone-400 mb-1">Jahresanspruch</p>
              <input type="number" min="0" value={anspruch} onChange={e => { setAnspruch(e.target.value); setSaved(false); }}
                className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600" />
            </div>
            <div className="flex-1">
              <p className="text-xs text-stone-400 mb-1">Verbraucht</p>
              <input type="number" min="0" value={verbraucht} onChange={e => { setVerbraucht(e.target.value); setSaved(false); }}
                className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600" />
            </div>
            <div className="flex items-end">
              <button onClick={handleSave} disabled={saving}
                className={`rounded-xl px-3 py-2 text-sm font-semibold transition-colors ${saved ? "bg-emerald-100 text-emerald-700" : "bg-stone-900 text-white hover:bg-stone-800"}`}>
                {saved ? "✓" : saving ? "…" : "→"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Einstellungen({ team, setTeam, schliesztage, setSchliesztage, warnschwelle, setWarnschwelle, setWunschLabel, sperrzeiten, setSperrzeiten }) {
      const [tab, setTab] = useState("schliesztage");
      const [neuerTag, setNeuerTag] = useState("");
      const [tagFehler, setTagFehler] = useState("");
      const [schwelleInput, setSchwelleInput] = useState(String(warnschwelle));
      const [schwelleSaved, setSchwelleSaved] = useState(false);
      const [wunschInput, setWunschInput] = useState(wunschLabel);
      const [wunschSaved, setWunschSaved] = useState(false);
      const [sperrVon, setSperrVon] = useState("");
      const [sperrBis, setSperrBis] = useState("");
      const [sperrName, setSperrName] = useState("");
      const [sperrFehler, setSperrFehler] = useState("");

      async function handleWunschSave() {
        if (!wunschInput.trim()) return;
        try {
          await api.setEinstellung("wunsch_label", wunschInput.trim());
          setWunschLabel(wunschInput.trim());
          setWunschSaved(true); setTimeout(() => setWunschSaved(false), 2000);
        } catch(e) { alert("Fehler: " + e.message); }
      }

      async function handleSperrHinzu() {
        setSperrFehler("");
        if (!sperrVon || !sperrBis) { setSperrFehler("Bitte Von und Bis ausfüllen."); return; }
        if (sperrVon > sperrBis) { setSperrFehler("Von muss vor Bis liegen."); return; }
        const neu = [...sperrzeiten, { von: sperrVon, bis: sperrBis, bezeichnung: sperrName || "Urlaubssperre" }];
        try {
          await api.setEinstellung("sperrzeiten", JSON.stringify(neu));
          setSperrzeiten(neu); setSperrVon(""); setSperrBis(""); setSperrName("");
        } catch(e) { alert("Fehler: " + e.message); }
      }

      async function handleSperrLoeschen(idx) {
        const neu = sperrzeiten.filter((_, i) => i !== idx);
        try {
          await api.setEinstellung("sperrzeiten", JSON.stringify(neu));
          setSperrzeiten(neu);
        } catch(e) { alert("Fehler: " + e.message); }
      }

      async function handleHinzu() {
        setTagFehler("");
        if (!neuerTag) return;
        if (schliesztage.includes(neuerTag)) { setTagFehler("Bereits eingetragen."); return; }
        if (istFeiertag(neuerTag)) { setTagFehler("Ist ein gesetzlicher Feiertag."); return; }
        const neu = [...schliesztage, neuerTag].sort();
        try {
          await api.setEinstellung("schliesztage", JSON.stringify(neu));
          setSchliesztage(neu); setNeuerTag("");
        } catch(e) { alert("Fehler: " + e.message); }
      }

      async function handleLoeschen(datum) {
        const neu = schliesztage.filter(d => d !== datum);
        try {
          await api.setEinstellung("schliesztage", JSON.stringify(neu));
          setSchliesztage(neu);
        } catch(e) { alert("Fehler: " + e.message); }
      }

      async function handleSchwelleSave() {
        const n = parseInt(schwelleInput, 10);
        if (isNaN(n) || n < 0) return;
        try {
          await api.setEinstellung("warnschwelle", String(n));
          setWarnschwelle(n); setSchwelleSaved(true); setTimeout(() => setSchwelleSaved(false), 2000);
        } catch(e) { alert("Fehler: " + e.message); }
      }

      return (

          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Inhaberin</p>
            <h2 className="text-2xl font-bold text-stone-900">Einstellungen</h2>

          <div className="flex bg-stone-100 rounded-xl p-1 gap-1 flex-wrap">
            {[{id:"schliesztage",label:"Schließtage"},{id:"sperrzeiten",label:"Sperrzeiten"},{id:"warnschwelle",label:"Resturlaub"},{id:"personen",label:"Personen"}].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex-1 py-2 text-xs font-medium rounded-lg transition-all min-w-[60px] ${tab === t.id ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"}`}>
                {t.label}

          {tab === "schliesztage" && (

              <div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-3">
                <p className="text-xs font-medium text-stone-400 uppercase tracking-widest">Neuer Schließtag</p>

                  <input type="date" value={neuerTag} onChange={e => { setNeuerTag(e.target.value); setTagFehler(""); }}

              <div className="bg-stone-100 rounded-xl px-4 py-2.5">

              </div>
              <div className="flex flex-col gap-2">
                <p className="text-xs font-medium text-stone-400 uppercase tracking-widest px-1">Eingetragene Schließtage</p>
                {schliesztage.length === 0 ? <p className="text-stone-400 text-sm px-1">Keine eingetragen.</p> :
                  schliesztage.map(d => (
                    <div key={d} className="bg-white border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
                      <p className="text-sm font-medium text-stone-800">{formatDatum(d)}</p>
                      <button onClick={() => handleLoeschen(d)} className="text-rose-400 hover:text-rose-600 px-2">✕</button>

                {getFeiertageListe(new Date().getFullYear()).map(f => (

                    <p className="text-sm font-medium text-stone-700">{f.name}</p>
                    <p className="text-xs text-stone-400">{formatDatum(f.datum)}</p>

          {tab === "warnschwelle" && (
            <div className="flex flex-col gap-4">

                <div>

                </div>
                <div className="flex items-center gap-3">
                  <input type="number" min="0" value={schwelleInput} onChange={e => { setSchwelleInput(e.target.value); setSchwelleSaved(false); }}
                    className="w-20 text-center border border-stone-300 rounded-xl py-2.5 text-lg font-bold text-stone-900 focus:outline-none focus:border-stone-600" />
                  <span className="text-stone-500 text-sm">Tage</span>
                  <button onClick={handleSchwelleSave}
                    className={`ml-auto rounded-xl px-4 py-2.5 text-sm font-semibold transition-colors ${schwelleSaved ? "bg-emerald-100 text-emerald-700" : "bg-stone-900 text-white hover:bg-stone-800"}`}>
                    {schwelleSaved ? "✓ Gespeichert" : "Speichern"}
                  </button>
                </div>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
                <p className="text-xs text-amber-700">Aktuell: Warnung ab <span className="font-bold">{warnschwelle} Tagen</span> Resturlaub offen.</p>
              </div>
            </div>
          )}

          {tab === "sperrzeiten" && (
            <div className="flex flex-col gap-4">
              <div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-3">
                <p className="text-xs font-medium text-stone-400 uppercase tracking-widest">Neue Urlaubssperre</p>
                <input type="text" placeholder="Bezeichnung (z.B. Sommersperre)" value={sperrName}
                  onChange={e => setSperrName(e.target.value)}
                  className="border border-stone-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-stone-600" />
                <div className="flex gap-2">
                  <div className="flex-1">
                    <p className="text-xs text-stone-400 mb-1">Von</p>
                    <input type="date" value={sperrVon} onChange={e => { setSperrVon(e.target.value); setSperrFehler(""); }}
                      className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-stone-600" />
                  </div>
                  <div className="flex-1">
                    <p className="text-xs text-stone-400 mb-1">Bis</p>
                    <input type="date" value={sperrBis} onChange={e => { setSperrBis(e.target.value); setSperrFehler(""); }}
                      className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-stone-600" />
                  </div>
                </div>
                {sperrFehler && <p className="text-xs text-rose-500">{sperrFehler}</p>}
                <button onClick={handleSperrHinzu} className="bg-stone-900 text-white rounded-xl py-2.5 text-sm font-semibold">+ Sperre hinzufügen</button>
              </div>
              <div className="bg-stone-100 rounded-xl px-4 py-2.5">
                <p className="text-xs text-stone-400">Urlaubssperre 1.12.–24.12. ist immer aktiv.</p>
              </div>
              <div className="flex flex-col gap-2">
                <p className="text-xs font-medium text-stone-400 uppercase tracking-widest px-1">Aktive Sperrzeiten</p>
                {sperrzeiten.length === 0 ? <p className="text-stone-400 text-sm px-1">Keine eingetragen.</p> :
                  sperrzeiten.map((s, i) => (
                    <div key={i} className="bg-white border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
                      <div>
                        <p className="text-sm font-medium text-stone-800">{s.bezeichnung}</p>
                        <p className="text-xs text-stone-400">{formatDatum(s.von)} – {formatDatum(s.bis)}</p>
                      </div>
                      <button onClick={() => handleSperrLoeschen(i)} className="text-rose-400 hover:text-rose-600 px-2">✕</button>
                    </div>
                  ))
                }
              </div>
            </div>
          )}

          {tab === "personen" && (
            <div className="flex flex-col gap-3">
              <p className="text-xs text-stone-400 px-1">Urlaubstage und Jahresanspruch anpassen.</p>
              {team.filter(p => p.role === "employee").map(p => (
                <PersonenKarte key={p.id} person={p} onUpdate={updates => setTeam(prev => prev.map(x => x.id === p.id ? { ...x, ...updates } : x))} />
              ))}
            </div>
          )}
        </div>
      );
    }

            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Übersicht</p>

          </div>
          <div className="bg-white rounded-2xl border border-stone-200 p-5">
            <div className="flex items-center justify-between mb-4">
              <p className="text-xs font-medium text-stone-400 uppercase tracking-widest">Offene Anfragen</p>

              <div className="flex flex-col gap-2">

                  <div key={a.id} className="flex items-center gap-3">
                    <span className="w-7 h-7 rounded-full bg-stone-100 text-stone-700 text-xs font-bold flex items-center justify-center flex-shrink-0">
                      {team.find(p=>p.id===a.person_id)?.name[0]}

                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-stone-800 truncate">{team.find(p=>p.id===a.person_id)?.name}</p>
                      <p className="text-xs text-stone-400">{getTypConfig(a.typ)?.label} · {formatZeitraum(a.von, a.bis)}</p>

    // ─── ANFRAGE FLOW ─────────────────────────────────────────────────────────
    function AnfrageFlow({ screen, setScreen, anfrage, setAnfrage, genehmigteUrlaube, schliesztage, sperrzeiten, isOwner, team, currentUser, onSubmit, onAbbrechen }) {
      const [selectedStart, setSelectedStart] = useState(null);
      const [calMonat, setCalMonat] = useState({ year: new Date().getFullYear(), month: new Date().getMonth() });
      const [saving, setSaving] = useState(false);

      function getBlockInfo(datum) {
        if (anfrage.typ !== "urlaub") return null;
        if (istSperre(datum, sperrzeiten)) return "sperre";
        if (istFeiertag(datum)) return "feiertag";
        if (schliesztage.includes(datum)) return "schliesztag";
        for (const u of genehmigteUrlaube) {
          if (tageImBereich(u.von, u.bis).includes(datum)) return "belegt";
        }
        return null;
      }

      function handleDayTap(datum) {
        if (getBlockInfo(datum) !== null) return;
        if (!selectedStart) {
          setSelectedStart(datum); setAnfrage(a => ({ ...a, von: datum, bis: datum }));
        } else {
          const start = selectedStart < datum ? selectedStart : datum;
          const end   = selectedStart < datum ? datum : selectedStart;
          if (anfrage.typ === "urlaub" && tageImBereich(start, end).some(d => getBlockInfo(d) !== null)) return;
          setAnfrage(a => ({ ...a, von: start, bis: end })); setSelectedStart(null);
        }
      }

      const blockHinweis = useMemo(() => {
        if (anfrage.typ !== "urlaub" || !anfrage.von) return null;
        const tage = tageImBereich(anfrage.von, anfrage.bis);
        if (tage.some(d => istSperre(d, sperrzeiten))) return "sperre";
        if (tage.some(d => genehmigteUrlaube.some(u => tageImBereich(u.von, u.bis).includes(d)))) return "belegt";
        return null;
      }, [anfrage, genehmigteUrlaube]);

      const anzahlTage = anfrage.von && anfrage.bis
        ? (anfrage.typ === "urlaub" ? arbeitstage(anfrage.von, anfrage.bis, schliesztage).length
           : tageImBereich(anfrage.von, anfrage.bis).filter(d => parseDatum(d).getDay() !== 0).length) : 0;

      async function handleSubmit() {
        setSaving(true);
        try { await onSubmit(anfrage.typ, anfrage.von, anfrage.bis); }
        catch(e) { alert("Fehler: " + e.message); setSaving(false); }
      }

      if (screen === "typ") return (
        <div className="px-4 py-6 flex flex-col gap-6 min-h-screen">
          <div className="flex items-center gap-3">
            <button onClick={onAbbrechen} className="text-stone-400 hover:text-stone-700 text-xl">‹</button>
            <div>
              <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Neue Anfrage</p>
              <h2 className="text-xl font-bold text-stone-900">Art der Abwesenheit</h2>
            </div>
          </div>
          {isOwner && (
            <div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-2">
              <p className="text-xs font-medium text-stone-400 uppercase tracking-widest mb-1">Für wen?</p>
              <div className="flex flex-wrap gap-2">
                {team.filter(p => p.role === "employee").map(p => (
                  <button key={p.id}
                    onClick={() => setAnfrage(a => ({ ...a, fuerPerson: p.id }))}
                    className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-sm font-medium transition-all ${anfrage.fuerPerson === p.id ? "bg-stone-900 text-white border-stone-900" : "bg-white text-stone-700 border-stone-200 hover:border-stone-400"}`}>
                    <span className="w-6 h-6 rounded-full bg-stone-200 text-stone-700 text-xs font-bold flex items-center justify-center flex-shrink-0" style={{background: anfrage.fuerPerson === p.id ? "rgba(255,255,255,0.2)" : ""}}>{p.name[0]}</span>
                    {p.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          <div className="flex flex-col gap-3">
            {getAnfrageTypen(isOwner).map(typ => (
              <button key={typ.id}
                onClick={() => {
                  const personId = isOwner ? (anfrage.fuerPerson || team.filter(p=>p.role==="employee")[0]?.id) : currentUser.id;
                  setAnfrage(a => ({ ...a, typ: typ.id, fuerPerson: personId }));
                  setScreen("datum");
                }}
                disabled={isOwner && !anfrage.fuerPerson && typ.id === "sonstige"}
                className={`bg-white border border-stone-200 rounded-2xl px-5 py-4 flex items-center gap-4 hover:border-stone-400 hover:shadow-sm transition-all text-left ${isOwner && !anfrage.fuerPerson && typ.id === "sonstige" ? "opacity-40 cursor-not-allowed" : ""}`}>
                <span className="text-2xl">{typ.icon}</span>
                <div className="flex-1">
                  <span className="font-semibold text-stone-800">{typ.label}</span>
                  {typ.id === "sonstige" && isOwner && !anfrage.fuerPerson && <p className="text-xs text-stone-400">Erst Person auswählen</p>}
                </div>
                <span className="ml-auto text-stone-300 text-lg">›</span>
              </button>
            ))}
          </div>
        </div>
      );

      if (screen === "datum") {
        const { year, month } = calMonat;
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const offset = firstDay === 0 ? 6 : firstDay - 1;
        const days = Array.from({ length: daysInMonth }, (_, i) => datumZuStr(new Date(year, month, i+1)));
        const typc = getTypConfig(anfrage.typ);
        return (
          <div className="px-4 py-6 flex flex-col gap-5 min-h-screen">
            <div className="flex items-center gap-3">
              <button onClick={() => setScreen("typ")} className="text-stone-400 hover:text-stone-700 text-xl">‹</button>
              <div>
                <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">{typc?.icon} {typc?.label}</p>
                <h2 className="text-xl font-bold text-stone-900">Zeitraum wählen</h2>
              </div>
            </div>
            {anfrage.typ === "urlaub" && (
              <div className="bg-stone-100 rounded-xl px-4 py-3">
                <p className="text-xs text-stone-400">· Urlaubssperre 1.12.–24.12. · Samstag zählt · Feiertage/Schließtage zählen nicht</p>
              </div>
            )}
            <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden">
              <div className="flex items-center justify-between px-4 py-3 border-b border-stone-100">
                <button onClick={() => setCalMonat(m => m.month === 0 ? { year: m.year-1, month: 11 } : { ...m, month: m.month-1 })} className="text-stone-400 px-2">‹</button>
                <p className="text-sm font-semibold text-stone-800">{formatMonat(year, month)}</p>
                <button onClick={() => setCalMonat(m => m.month === 11 ? { year: m.year+1, month: 0 } : { ...m, month: m.month+1 })} className="text-stone-400 px-2">›</button>
              </div>
              <div className="grid grid-cols-7 px-3 py-2">
                {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d => <div key={d} className="text-center text-xs font-medium text-stone-400 py-1">{d}</div>)}
                {Array.from({ length: offset }, (_, i) => <div key={`e${i}`} />)}
                {days.map(datum => {
                  const blockInfo = getBlockInfo(datum);
                  const isSunday = parseDatum(datum).getDay() === 0;
                  const isSelected = anfrage.von && anfrage.bis && datum >= anfrage.von && datum <= anfrage.bis;
                  let cls = "flex items-center justify-center text-xs h-9 rounded-lg mx-0.5 my-0.5 transition-colors ";
                  if (isSunday) cls += "text-stone-200 ";
                  else if (blockInfo === "sperre") cls += "bg-rose-50 text-rose-300 cursor-not-allowed ";
                  else if (blockInfo === "belegt") cls += "bg-stone-100 text-stone-300 cursor-not-allowed ";
                  else if (blockInfo === "feiertag" || blockInfo === "schliesztag") cls += "text-stone-300 cursor-not-allowed ";
                  else if (isSelected) cls += "bg-stone-900 text-white font-semibold cursor-pointer ";
                  else cls += "text-stone-700 hover:bg-stone-100 cursor-pointer ";
                  return <button key={datum} onClick={() => !isSunday && handleDayTap(datum)} className={cls} disabled={blockInfo !== null || isSunday}>{parseDatum(datum).getDate()}</button>;
                })}
              </div>
              <div className="px-4 py-2 border-t border-stone-100 flex gap-3 flex-wrap">
                <span className="flex items-center gap-1 text-xs text-stone-400"><span className="w-3 h-3 rounded-sm bg-stone-900 inline-block"/>Gewählt</span>
                {anfrage.typ === "urlaub" && <span className="flex items-center gap-1 text-xs text-stone-400"><span className="w-3 h-3 rounded-sm bg-rose-100 inline-block"/>Urlaubssperre</span>}
              </div>
            </div>
            {blockHinweis === "belegt" && <div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3"><p className="text-sm text-rose-700 font-medium">In diesem Zeitraum ist bereits Urlaub bestätigt.</p></div>}
            {blockHinweis === "sperre" && <div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3"><p className="text-sm text-rose-700 font-medium">Urlaubssperre aktiv (1.12.–24.12.).</p></div>}
            {anfrage.von && !blockHinweis && (
              <div className="bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
                <div>
                  <p className="text-xs text-stone-400">Gewählt</p>
                  <p className="text-sm font-semibold text-stone-800">{formatZeitraum(anfrage.von, anfrage.bis)}</p>
                  {anzahlTage > 0 && <p className="text-xs text-stone-400">{anzahlTage} {anfrage.typ === "urlaub" ? "Urlaubstag" : "Tag"}{anzahlTage !== 1 ? "e" : ""}</p>}
                </div>
                <button onClick={() => anfrage.von === anfrage.bis ? handleSubmit() : setScreen("zusammenfassung")}
                  className="bg-stone-900 text-white rounded-xl px-5 py-2.5 text-sm font-semibold hover:bg-stone-800 transition-colors">
                  {anfrage.von === anfrage.bis ? "Anfragen" : "Weiter →"}
                </button>
              </div>
            )}
          </div>
        );
      }

      if (screen === "zusammenfassung") {
        const typc = getTypConfig(anfrage.typ);
        return (
          <div className="px-4 py-6 flex flex-col gap-6 min-h-screen">
            <div className="flex items-center gap-3">
              <button onClick={() => setScreen("datum")} className="text-stone-400 hover:text-stone-700 text-xl">‹</button>
              <div>
                <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Zusammenfassung</p>
                <h2 className="text-xl font-bold text-stone-900">Anfrage bestätigen</h2>
              </div>
            </div>
            <div className="bg-white border border-stone-200 rounded-2xl p-5 flex flex-col gap-4">
              <div className="flex items-center gap-3 pb-4 border-b border-stone-100">
                <span className="text-3xl">{typc?.icon}</span>
                <p className="font-semibold text-stone-800 text-lg">{typc?.label}</p>
              </div>
              {isOwner && anfrage.fuerPerson && (
                <div className="flex justify-between">
                  <p className="text-sm text-stone-400">Für</p>
                  <p className="text-sm font-semibold text-stone-800">{team.find(p=>p.id===anfrage.fuerPerson)?.name}</p>
                </div>
              )}
              <div className="flex justify-between"><p className="text-sm text-stone-400">Von</p><p className="text-sm font-semibold text-stone-800">{formatDatum(anfrage.von)}</p></div>
              <div className="flex justify-between"><p className="text-sm text-stone-400">Bis</p><p className="text-sm font-semibold text-stone-800">{formatDatum(anfrage.bis)}</p></div>
              {anfrage.typ === "urlaub" && (
                <div className="flex justify-between pt-3 border-t border-stone-100">
                  <p className="text-sm text-stone-400">Urlaubstage</p>
                  <p className="text-sm font-bold text-stone-900">{anzahlTage} Tage</p>
                </div>
              )}
            </div>
            <button onClick={handleSubmit} disabled={saving}
              className="w-full bg-stone-900 text-white rounded-2xl py-4 font-semibold hover:bg-stone-800 transition-colors disabled:opacity-50">
              {saving ? "Wird gespeichert…" : "Anfrage absenden"}
            </button>
            <button onClick={onAbbrechen} className="text-center text-sm text-stone-400 underline underline-offset-2">Abbrechen</button>
          </div>
        );
      }
      return null;
    }

    // ─── TEAMKALENDER ─────────────────────────────────────────────────────────
    function Teamkalender({ anfragen, team, monat, setMonat, schliesztage }) {
      const { year, month } = monat;
      const genehmigt = anfragen.filter(a => a.status === "genehmigt");
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const offset = firstDay === 0 ? 6 : firstDay - 1;
      const days = Array.from({ length: daysInMonth }, (_, i) => ({ datum: datumZuStr(new Date(year, month, i+1)), day: i+1, dow: new Date(year, month, i+1).getDay() }));
      const FARBEN = { urlaub:"bg-emerald-100 text-emerald-800", wunsch:"bg-sky-100 text-sky-800", sonstige:"bg-violet-100 text-violet-800", feiertag:"bg-amber-100 text-amber-700", schliesztag:"bg-rose-100 text-rose-700" };

      function getEintraege(datum) {
        if (istFeiertag(datum)) return [{ typ:"feiertag", label:"Feiertag" }];
        if (schliesztage.includes(datum)) return [{ typ:"schliesztag", label:"Schließtag" }];
        return genehmigt.filter(a => tageImBereich(a.von, a.bis).includes(datum))
          .map(a => ({ typ: a.typ, label: team.find(p => p.id === a.person_id)?.name || a.person_id }));
      }

      return (
        <div className="px-4 py-6 flex flex-col gap-4">
          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Team</p>
            <h2 className="text-2xl font-bold text-stone-900">Kalender</h2>
          </div>
          <div className="flex items-center justify-between bg-white border border-stone-200 rounded-xl px-4 py-2.5">
            <button onClick={() => setMonat(m => m.month === 0 ? { year: m.year-1, month: 11 } : { ...m, month: m.month-1 })} className="text-stone-400 px-2">‹</button>
            <p className="text-sm font-semibold text-stone-800">{formatMonat(year, month)}</p>
            <button onClick={() => setMonat(m => m.month === 11 ? { year: m.year+1, month: 0 } : { ...m, month: m.month+1 })} className="text-stone-400 px-2">›</button>
          </div>
          <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden">
            <div className="grid grid-cols-7 border-b border-stone-100">
              {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d => <div key={d} className="text-center text-xs font-medium text-stone-400 py-2">{d}</div>)}
            </div>
            <div className="grid grid-cols-7">
              {Array.from({ length: offset }, (_, i) => <div key={`e${i}`} className="min-h-[60px] border-r border-b border-stone-50" />)}
              {days.map(({ datum, day, dow }) => {
                const eintraege = getEintraege(datum);
                return (
                  <div key={datum} className={`min-h-[60px] border-r border-b border-stone-50 p-1 ${dow === 0 ? "bg-stone-50" : ""}`}>
                    <p className={`text-xs font-medium mb-1 ${dow === 0 ? "text-stone-300" : "text-stone-500"}`}>{day}</p>
                    <div className="flex flex-col gap-0.5">
                      {eintraege.map((e, i) => (
                        <span key={i} className={`font-medium px-1 py-0.5 rounded truncate block ${FARBEN[e.typ] || "bg-stone-100 text-stone-600"}`} style={{fontSize:"9px"}}>{e.label}</span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="flex flex-wrap gap-2">
            {[["urlaub","Urlaub"],["wunsch","Freier Wunsch"],["sonstige","Sonstige"],["feiertag","Feiertag"],["schliesztag","Schließtag"]].map(([typ, label]) => (
              <span key={typ} className={`font-medium px-2 py-1 rounded-full ${FARBEN[typ]}`} style={{fontSize:"10px"}}>{label}</span>
            ))}
          </div>
        </div>
      );
    }

    // ─── MEINE ANFRAGEN ───────────────────────────────────────────────────────
    function MeineAnfragen({ anfragen, onNeueAnfrage }) {
      const sorted = [...anfragen].sort((a,b) => b.erstellt.localeCompare(a.erstellt));
      return (
        <div className="px-4 py-6 flex flex-col gap-4">
          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Übersicht</p>
            <h2 className="text-2xl font-bold text-stone-900">Meine Anfragen</h2>
          </div>
          {sorted.length === 0 ? (
            <div className="text-center py-12">
              <p className="text-stone-400 text-sm">Noch keine Anfragen gestellt.</p>
              <button onClick={onNeueAnfrage} className="mt-4 bg-stone-900 text-white rounded-xl px-5 py-2.5 text-sm font-semibold">+ Erste Anfrage stellen</button>
            </div>
          ) : (
            <>
              <div className="flex flex-col gap-2">{sorted.map(a => <AnfrageKarte key={a.id} anfrage={a} showDate />)}</div>
              <button onClick={onNeueAnfrage} className="w-full border-2 border-dashed border-stone-200 rounded-2xl py-4 text-sm font-medium text-stone-400 hover:border-stone-400 hover:text-stone-600 transition-colors">+ Neue Anfrage stellen</button>
            </>
          )}
        </div>
      );
    }

    // ─── ANFRAGEN ÜBERSICHT (INHABERIN) ──────────────────────────────────────
    function AnfragenUebersicht({ anfragen, tab, setTab, onEntscheid, schliesztage, team }) {
      const offen    = anfragen.filter(a => a.status === "ausstehend").sort((a,b) => a.erstellt.localeCompare(b.erstellt));
      const erledigt = anfragen.filter(a => a.status !== "ausstehend").sort((a,b) => b.erstellt.localeCompare(a.erstellt));
      const [deciding, setDeciding] = useState(null);

      async function handleEntscheid(id, status) {
        setDeciding(id);
        try { await onEntscheid(id, status); }
        catch(e) { alert("Fehler: " + e.message); }
        setDeciding(null);
      }

      return (
        <div className="px-4 py-6 flex flex-col gap-4">
          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Verwaltung</p>
            <h2 className="text-2xl font-bold text-stone-900">Anfragen</h2>
          </div>
          <div className="flex bg-stone-100 rounded-xl p-1">
            {[{id:"offen",label:`Offen${offen.length > 0 ? ` (${offen.length})` : ""}`},{id:"erledigt",label:"Erledigt"}].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${tab === t.id ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"}`}>
                {t.label}
              </button>
            ))}
          </div>
          {tab === "offen" && (
            offen.length === 0 ? <div className="text-center py-12"><p className="text-stone-400 text-sm">Keine offenen Anfragen. ✓</p></div> :
            <div className="flex flex-col gap-3">
              {offen.map(a => (
                <div key={a.id} className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-3">
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex items-center gap-3">
                      <span className="w-8 h-8 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center flex-shrink-0">
                        {team.find(p=>p.id===a.person_id)?.name[0]}
                      </span>
                      <div>
                        <p className="font-semibold text-stone-800 text-sm">{team.find(p=>p.id===a.person_id)?.name}</p>
                        <p className="text-xs text-stone-400">eingereicht {formatDatum(a.erstellt)}</p>
                      </div>
                    </div>
                    <span className={`text-xs font-medium px-2 py-1 rounded-full border ${getTypConfig(a.typ)?.color}`}>{getTypConfig(a.typ)?.icon} {getTypConfig(a.typ)?.label}</span>
                  </div>
                  <div className="bg-stone-50 rounded-xl px-3 py-2.5">
                    <p className="text-sm font-medium text-stone-800">{formatZeitraum(a.von, a.bis)}</p>
                    {a.typ === "urlaub" && <p className="text-xs text-stone-400">{arbeitstage(a.von, a.bis, schliesztage).length} Urlaubstage</p>}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => handleEntscheid(a.id, "genehmigt")} disabled={deciding === a.id}
                      className="flex-1 bg-emerald-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50">
                      {deciding === a.id ? "…" : "Genehmigen ✓"}
                    </button>
                    <button onClick={() => handleEntscheid(a.id, "abgelehnt")} disabled={deciding === a.id}
                      className="flex-1 border border-rose-200 text-rose-600 rounded-xl py-2.5 text-sm font-semibold hover:bg-rose-50 transition-colors disabled:opacity-50">
                      {deciding === a.id ? "…" : "Ablehnen ✗"}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
          {tab === "erledigt" && (
            erledigt.length === 0 ? <p className="text-stone-400 text-sm text-center py-12">Noch keine erledigten Anfragen.</p> :
            <div className="flex flex-col gap-2">
              {erledigt.map(a => (
                <div key={a.id} className={`bg-white border border-stone-200 rounded-2xl p-4 border-l-4 ${STATUS_CONFIG[a.status]?.border}`}>
                  <div className="flex items-center justify-between gap-2 mb-2">
                    <p className="font-semibold text-stone-800 text-sm">{team.find(p=>p.id===a.person_id)?.name}</p>
                    <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${STATUS_CONFIG[a.status]?.bg} ${STATUS_CONFIG[a.status]?.text}`}>{STATUS_CONFIG[a.status]?.label}</span>
                  </div>
                  <p className="text-xs text-stone-500">{getTypConfig(a.typ)?.icon} {getTypConfig(a.typ)?.label} · {formatZeitraum(a.von, a.bis)}</p>
                  <p className="text-xs text-stone-400 mt-1">Eingereicht {formatDatum(a.erstellt)}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── URLAUBSSTÄNDE ────────────────────────────────────────────────────────
    function Urlaubsstaende({ team, warnschwelle }) {
      return (
        <div className="px-4 py-6 flex flex-col gap-4">
          <div>
            <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Übersicht</p>
            <h2 className="text-2xl font-bold text-stone-900">Urlaubsstände 2025</h2>
          </div>
          <div className="flex flex-col gap-3">
            {team.filter(p => p.role === "employee").map(p => {
              const offen = p.urlaub_anspruch - p.urlaub_verbraucht;
              const istWarnung = offen > warnschwelle;
              const prozent = Math.min((p.urlaub_verbraucht / p.urlaub_anspruch) * 100, 100);
              return (
                <div key={p.id} className={`bg-white border rounded-2xl p-5 ${istWarnung ? "border-amber-300 bg-amber-50" : "border-stone-200"}`}>
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-3">
                      <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{p.name[0]}</span>
                      <p className="font-semibold text-stone-800">{p.name}</p>
                    </div>
                    {istWarnung && <span className="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">{offen} Tage offen</span>}
                  </div>
                  <div className="flex gap-4 mb-3">
                    {[{val:p.urlaub_verbraucht,label:"verbraucht",color:"text-stone-900"},{val:offen,label:"offen",color:istWarnung?"text-amber-600":"text-emerald-600"},{val:p.urlaub_anspruch,label:"gesamt",color:"text-stone-400"}].map((item,i) => (
                      <div key={i} className="flex-1 text-center">
                        <p className={`text-xl font-bold ${item.color}`}>{item.val}</p>
                        <p className="text-stone-400 uppercase tracking-wide" style={{fontSize:"10px"}}>{item.label}</p>
                      </div>
                    ))}
                  </div>
                  <div className={`rounded-full h-1.5 overflow-hidden ${istWarnung ? "bg-amber-200" : "bg-stone-100"}`}>
                    <div className={`h-full rounded-full transition-all ${istWarnung ? "bg-amber-500" : "bg-stone-800"}`} style={{width:`${prozent}%`}} />
                  </div>
                </div>
              );
            })}
          </div>
          <p className="text-xs text-stone-400 text-center">Warnung ab {warnschwelle} Tagen Resturlaub offen</p>
        </div>
      );
    }

    // ─── ANFRAGE KARTE ────────────────────────────────────────────────────────
    function AnfrageKarte({ anfrage, showDate }) {
      const typc = getTypConfig(anfrage.typ);
      const status = STATUS_CONFIG[anfrage.status];
      return (
        <div className={`bg-white border border-stone-200 rounded-2xl px-4 py-3.5 border-l-4 ${status.border}`}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <p className="text-sm font-semibold text-stone-800">{typc?.icon} {typc?.label}</p>
            <span className={`font-bold uppercase px-2 py-0.5 rounded-full ${status.bg} ${status.text}`} style={{fontSize:"10px"}}>{status.label}</span>
          </div>
          <p className="text-xs text-stone-500">{formatZeitraum(anfrage.von, anfrage.bis)}</p>
          {showDate && <p className="text-stone-300 mt-1" style={{fontSize:"10px"}}>Eingereicht {formatDatum(anfrage.erstellt)}</p>}
        </div>
      );
    }

    // ─── HAUPT APP ────────────────────────────────────────────────────────────
    function App() {
      const [ladeStatus, setLadeStatus] = useState("start"); // start | laden | bereit | fehler
      const [currentUser, setCurrentUser] = useState(null);
      const [team, setTeam] = useState([]);
      const [anfragen, setAnfragen] = useState([]);
      const [schliesztage, setSchliesztage] = useState([]);
      const [warnschwelle, setWarnschwelle] = useState(10);
      const [wunschLabel, setWunschLabel] = useState("Freier Wunsch");
      const [sperrzeiten, setSperrzeiten] = useState([]); // [{von, bis, bezeichnung}]
      const [screen, setScreen] = useState("home");
      const [anfrageScreen, setAnfrageScreen] = useState(null);
      const [neueAnfrage, setNeueAnfrage] = useState({ typ: null, von: null, bis: null });
      const [kalenderMonat, setKalenderMonat] = useState({ year: new Date().getFullYear(), month: new Date().getMonth() });
      const [archivTab, setArchivTab] = useState("offen");
      const [ersterStart, setErsterStart] = useState(false);

      // Daten laden
      async function ladeDaten(silent = false) {
        if (!silent) setLadeStatus("laden");
        try {
          const [teamData, anfragenData, einstellungenData] = await Promise.all([
            api.getTeam(),
            api.getAnfragen(),
            api.getEinstellungen(),
          ]);
          setTeam(teamData || []);
          setAnfragen(anfragenData || []);
          const sz = einstellungenData?.find(e => e.schluessel === "schliesztage");
          const ws = einstellungenData?.find(e => e.schluessel === "warnschwelle");
          const eroeff = einstellungenData?.find(e => e.schluessel === "eroeffnung_erledigt");
          const wl = einstellungenData?.find(e => e.schluessel === "wunsch_label");
          const spz = einstellungenData?.find(e => e.schluessel === "sperrzeiten");
          if (sz) setSchliesztage(JSON.parse(sz.wert));
          if (ws) setWarnschwelle(parseInt(ws.wert, 10));
          if (wl) setWunschLabel(wl.wert);
          if (spz) setSperrzeiten(JSON.parse(spz.wert));
          if (!eroeff) setErsterStart(true);
          setLadeStatus("bereit");
        } catch(e) {
          console.error(e);
          if (!silent) setLadeStatus("fehler");
        }
      }

      useEffect(() => {
        ladeDaten();
        // Auto-Refresh alle 30 Sekunden (silent = kein Lade-Screen)
        const interval = setInterval(() => ladeDaten(true), 30000);
        return () => clearInterval(interval);
      }, []);

      async function handleLogin(person) {
        setCurrentUser(person);
        setScreen("home");
      }

      async function handleAnfrageStellen(typ, von, bis, fuerPerson) {
        const personId = fuerPerson || currentUser.id;
        const neu = await api.addAnfrage({ person_id: personId, typ, von, bis, status: "ausstehend", erstellt: heute() });
        setAnfragen(prev => [...prev, neu[0]]);
        setAnfrageScreen(null);
        setNeueAnfrage({ typ: null, von: null, bis: null });
        setScreen("meine-anfragen");
      }

      async function handleEntscheid(id, status) {
        await api.updateAnfrage(id, { status });
        setAnfragen(prev => prev.map(a => a.id === id ? { ...a, status } : a));
      }

      async function handleEroeffnungFertig() {
        await api.setEinstellung("eroeffnung_erledigt", "true");
        setErsterStart(false);
        // Team neu laden
        const teamData = await api.getTeam();
        setTeam(teamData || []);
      }

      if (ladeStatus === "start" || ladeStatus === "laden") return <AppShell><LadeScreen text="Verbinde mit Supabase…" /></AppShell>;
      if (ladeStatus === "fehler") return (
        <AppShell>
          <div className="min-h-screen flex flex-col items-center justify-center gap-4 px-6 text-center">
            <p className="text-2xl">⚠️</p>
            <p className="text-stone-700 font-semibold">Verbindungsfehler</p>
            <p className="text-stone-400 text-sm">Supabase konnte nicht erreicht werden.</p>
            <button onClick={ladeDaten} className="bg-stone-900 text-white rounded-xl px-5 py-2.5 text-sm font-semibold mt-2">Nochmal versuchen</button>
          </div>
        </AppShell>
      );

      if (!currentUser) return <LoginScreen team={team} onLogin={handleLogin} />;

      if (currentUser.role === "owner" && ersterStart) {
        return (
          <AppShell>
            <EroeffnungsbuchungScreen team={team} onSave={handleEroeffnungFertig} onSkip={handleEroeffnungFertig} />
          </AppShell>
        );
      }

      const isOwner = currentUser.role === "owner";
      const personData = team.find(p => p.id === currentUser.id);
      const eigeneAnfragen = anfragen.filter(a => a.person_id === currentUser.id);
      const offeneAnfragen = anfragen.filter(a => a.status === "ausstehend");
      const genehmigteUrlaube = anfragen.filter(a => a.typ === "urlaub" && a.status === "genehmigt");

      const navItems = isOwner
        ? [{id:"home",label:"Home",icon:"⌂"},{id:"kalender",label:"Kalender",icon:"◫"},{id:"anfragen",label:"Anfragen",icon:"◎",badge:offeneAnfragen.length},{id:"urlaubsstaende",label:"Urlaub",icon:"▦"}]
        : [{id:"home",label:"Home",icon:"⌂"},{id:"kalender",label:"Kalender",icon:"◫"},{id:"meine-anfragen",label:"Anfragen",icon:"◎"}];

      if (anfrageScreen) return (
        <AppShell>
          <AnfrageFlow screen={anfrageScreen} setScreen={setAnfrageScreen} anfrage={neueAnfrage} setAnfrage={setNeueAnfrage}
            genehmigteUrlaube={genehmigteUrlaube} schliesztage={schliesztage} onSubmit={handleAnfrageStellen}
            onAbbrechen={() => { setAnfrageScreen(null); setNeueAnfrage({ typ: null, von: null, bis: null }); }} />
        </AppShell>
      );

      return (
        <AppShell>
          <div className="flex flex-col min-h-screen bg-stone-50">
            <header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
              <div>
                <p className="text-xs text-stone-400 uppercase tracking-widest font-medium">Great Hair Day</p>
                <p className="text-sm font-semibold text-stone-800">{currentUser.name}</p>
              </div>
              <div className="flex items-center gap-2">
                {isOwner && <button onClick={() => setScreen("einstellungen")} className="text-xs text-stone-400 hover:text-stone-700 px-2 py-1 rounded">⚙ Einstellungen</button>}
                <button onClick={() => { setCurrentUser(null); setScreen("home"); }} className="text-xs text-stone-400 hover:text-stone-600 px-2 py-1 rounded">Abmelden</button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto pb-24">
              {screen === "home" && isOwner && <HomeInhaberin anfragen={anfragen} team={team} warnschwelle={warnschwelle} onNavigate={setScreen} />}
              {screen === "home" && !isOwner && <HomeMitarbeiter person={personData} eigeneAnfragen={eigeneAnfragen} onNeueAnfrage={() => setAnfrageScreen("typ")} onNavigate={setScreen} />}
              {screen === "kalender" && <Teamkalender anfragen={anfragen} team={team} monat={kalenderMonat} setMonat={setKalenderMonat} schliesztage={schliesztage} />}
              {screen === "meine-anfragen" && <MeineAnfragen anfragen={eigeneAnfragen} onNeueAnfrage={() => setAnfrageScreen("typ")} />}
              {screen === "anfragen" && isOwner && <AnfragenUebersicht anfragen={anfragen} tab={archivTab} setTab={setArchivTab} onEntscheid={handleEntscheid} schliesztage={schliesztage} team={team} />}
              {screen === "urlaubsstaende" && isOwner && <Urlaubsstaende team={team} warnschwelle={warnschwelle} />}
              {screen === "einstellungen" && isOwner && <Einstellungen team={team} setTeam={setTeam} schliesztage={schliesztage} setSchliesztage={setSchliesztage} warnschwelle={warnschwelle} setWarnschwelle={setWarnschwelle} setWunschLabel={setWunschLabel} sperrzeiten={sperrzeiten} setSperrzeiten={setSperrzeiten} />}
            </main>

            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-stone-200 flex z-10">
              {navItems.map(item => (
                <button key={item.id} onClick={() => setScreen(item.id)}
                  className={`flex-1 flex flex-col items-center py-3 gap-0.5 relative transition-colors ${screen === item.id ? "text-stone-900" : "text-stone-400"}`}>
                  <span className="text-lg leading-none">{item.icon}</span>
                  <span style={{fontSize:"10px"}} className="font-medium">{item.label}</span>
                  {item.badge > 0 && <span className="absolute top-2 right-1/4 translate-x-2 bg-rose-500 text-white font-bold rounded-full w-4 h-4 flex items-center justify-center" style={{fontSize:"9px"}}>{item.badge}</span>}
                  {screen === item.id && <span className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-stone-800 rounded-t-full" />}
                </button>
              ))}
            </nav>
          </div>
        </AppShell>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
