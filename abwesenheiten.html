// ─── ÖSTERREICH FEIERTAGE ─────────────────────────────────────────────────────
function ostern(j) {
  const a=j%19,b=Math.floor(j/100),c=j%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
        g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),ta=((h+l-7*m+114)%31)+1;
  return new Date(j, mo-1, ta);
}

function feiertageJahr(j) {
  const o = ostern(j);
  const add = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const fix = (m,t) => `${j}-${String(m).padStart(2,"0")}-${String(t).padStart(2,"0")}`;
  return [
    { datum: fix(1,1),      name: "Neujahr" },
    { datum: fix(1,6),      name: "Heilige Drei Könige" },
    { datum: fmt(add(o,1)), name: "Ostermontag" },
    { datum: fix(5,1),      name: "Staatsfeiertag" },
    { datum: fmt(add(o,39)),name: "Christi Himmelfahrt" },
    { datum: fmt(add(o,50)),name: "Pfingstmontag" },
    { datum: fmt(add(o,60)),name: "Fronleichnam" },
    { datum: fix(8,15),     name: "Mariä Himmelfahrt" },
    { datum: fix(10,26),    name: "Nationalfeiertag" },
    { datum: fix(11,1),     name: "Allerheiligen" },
    { datum: fix(12,8),     name: "Mariä Empfängnis" },
    { datum: fix(12,25),    name: "Weihnachten" },
    { datum: fix(12,26),    name: "Stephanitag" },
  ].sort((a,b) => a.datum.localeCompare(b.datum));
}

const FT_CACHE = {};
function getFeiertage(j) { if (!FT_CACHE[j]) FT_CACHE[j]=feiertageJahr(j); return FT_CACHE[j]; }
function istFeiertag(d) { const j=parseInt(d); return getFeiertage(j).some(f=>f.datum===d); }
function feiertagName(d) { const j=parseInt(d); return getFeiertage(j).find(f=>f.datum===d)?.name||"Feiertag"; }

// ─── HILFSFUNKTIONEN ──────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,"0");
function datStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseD(s) { return new Date(s+"T00:00:00"); }
function fmtD(s) { return parseD(s).toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtM(y,m) { return new Date(y,m,1).toLocaleDateString("de-AT",{month:"long",year:"numeric"}); }
function fmtZ(v,b) { return v===b ? fmtD(v) : `${fmtD(v)} – ${fmtD(b)}`; }
function heute() { return datStr(new Date()); }

function tageZw(v,b) {
  const t=[];
  for (let d=parseD(v); d<=parseD(b); d.setDate(d.getDate()+1)) t.push(datStr(new Date(d)));
  return t;
}
function arbeitstage(v,b,sz) {
  return tageZw(v,b).filter(d => parseD(d).getDay()!==0 && !istFeiertag(d) && !sz.includes(d));
}
function istSperre(d, fixSperre, sperrzeiten) {
  const dt=parseD(d), m=dt.getMonth()+1, t=dt.getDate();
  if (m===12 && t>=1 && t<=24) return true;
  if (!fixSperre) return false;
  return sperrzeiten.some(s => d>=s.von && d<=s.bis);
}

function naechstesJubilaeum(eintrittsdatum) {
  if (!eintrittsdatum) return null;
  const h=new Date(), e=parseD(eintrittsdatum);
  let n=new Date(h.getFullYear(), e.getMonth(), e.getDate());
  if (n<=h) n.setFullYear(n.getFullYear()+1);
  return n;
}

  function tapPin(v) {
    if (v==="del") { setPin(p=>p.slice(0,-1)); setErr(false); return; }
    const n = pin+v; if (n.length>4) return;
    setPin(n); setErr(false);
    if (n.length===4) {
      if (sel.pin===n) { setTimeout(()=>onLogin(sel),150); }
      else { setTimeout(()=>{ setPin(""); setErr(true); },400); }
    }
  }

  if (!sel) return (
    <Shell><div className="flex flex-col justify-center min-h-screen px-6 py-12">
      <div className="mb-10">
        <p className="text-xs text-stone-400 uppercase tracking-widest mb-1">Great Hair Day</p>
        <h1 className="text-2xl font-bold text-stone-900">Abwesenheiten</h1>
        <p className="text-stone-500 text-sm mt-1">Wer bist du?</p>
      </div>
      <div className="flex flex-col gap-3">
        {team.map(p=>(
          <button key={p.id} onClick={()=>{setSel(p);setPin("");setErr(false);}}
            className="flex items-center gap-4 bg-white border border-stone-200 rounded-xl px-4 py-3.5 text-left hover:border-stone-400 hover:shadow-sm transition-all">
            <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{p.name[0]}</span>
            <div><p className="font-semibold text-stone-900 text-sm">{p.name}</p>
            <p className="text-xs text-stone-400">{p.role==="owner"?"Inhaberin":"Mitarbeiter:in"}</p></div>
            <span className="ml-auto text-stone-300 text-lg">›</span>
          </button>
        ))}
      </div>
      <p className="text-center text-xs text-stone-300 mt-8">Great Hair Day Wien</p>
    </div></Shell>
  );

  return (
    <Shell><div className="flex flex-col justify-center min-h-screen px-6 py-12">
      <button onClick={()=>setSel(null)} className="text-stone-400 text-sm mb-8 self-start">‹ Zurück</button>
      <div className="flex flex-col items-center mb-10">
        <span className="w-16 h-16 rounded-full bg-stone-900 text-white text-2xl font-bold flex items-center justify-center mb-4">{sel.name[0]}</span>
        <p className="text-xl font-bold text-stone-900">{sel.name}</p>
        <p className="text-stone-400 text-sm mt-1">PIN eingeben</p>
      </div>
      <div className="flex justify-center gap-4 mb-8">
        {[0,1,2,3].map(i=>(
          <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all ${err?"border-rose-400 bg-rose-400":i<pin.length?"border-stone-900 bg-stone-900":"border-stone-300"}`}/>
        ))}
      </div>
      {err && <p className="text-center text-rose-500 text-sm mb-4">Falscher PIN.</p>}
      <div className="grid grid-cols-3 gap-3 max-w-xs mx-auto w-full">
        {["1","2","3","4","5","6","7","8","9","","0","del"].map((k,i)=>(
          k===""?<div key={i}/>:
          <button key={i} onClick={()=>tapPin(k)}
            className={`h-14 rounded-2xl text-xl font-semibold transition-all active:scale-95 ${k==="del"?"text-stone-500 hover:bg-stone-100":"bg-white border border-stone-200 text-stone-900 hover:border-stone-400"}`}>
            {k==="del"?"⌫":k}
          </button>
        ))}
      </div>
    </div></Shell>
  );
}

// ─── ERÖFFNUNGSBUCHUNG ────────────────────────────────────────────────────────
function Eroeffnung({team, onDone}) {
  const ma = team.filter(p=>p.role==="employee");
  const [w, setW] = useState(Object.fromEntries(ma.map(p=>[p.id,String(p.urlaub_verbraucht||0)])));
  const [saving, setSaving] = useState(false);

  async function save() {
    setSaving(true);
    try {
      for (const p of ma) await api.updatePerson(p.id, {urlaub_verbraucht: parseInt(w[p.id])||0});
      await api.setEinstellung("eroeffnung_erledigt","true");
      onDone();
    } catch(e) { alert("Fehler: "+e.message); setSaving(false); }
  }

  return <div className="px-4 py-8 flex flex-col gap-6 min-h-screen">
    <div>
      <p className="text-xs text-stone-400 uppercase tracking-widest mb-1">Ersteinrichtung</p>
      <h1 className="text-2xl font-bold text-stone-900">Urlaubsstände eintragen</h1>
      <p className="text-stone-500 text-sm mt-2">Wie viele Urlaubstage hat jede Person heuer bereits verbraucht?</p>
    </div>
    <div className="flex flex-col gap-3">
      {ma.map(p=>(
        <div key={p.id} className="bg-white border border-stone-200 rounded-2xl px-4 py-4 flex items-center gap-4">
          <span className="w-10 h-10 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{p.name[0]}</span>
          <div className="flex-1"><p className="font-semibold text-stone-800 text-sm">{p.name}</p>
          <p className="text-xs text-stone-400">Anspruch: {p.urlaub_anspruch} Tage</p></div>
          <div className="flex items-center gap-2">
            <input type="number" min="0" max={p.urlaub_anspruch} value={w[p.id]}
              onChange={e=>setW(x=>({...x,[p.id]:e.target.value}))}
              className="w-16 text-center border border-stone-300 rounded-xl py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600"/>
            <span className="text-xs text-stone-400">Tage</span>
          </div>
        </div>
      ))}
    </div>
    <div className="flex flex-col gap-2 pt-2">
      <button onClick={save} disabled={saving}
        className="w-full bg-stone-900 text-white rounded-2xl py-4 font-semibold hover:bg-stone-800 transition-colors disabled:opacity-50">
        {saving?"Wird gespeichert…":"Speichern und starten"}
      </button>
      <button onClick={async()=>{await api.setEinstellung("eroeffnung_erledigt","true");onDone();}}
        className="w-full text-stone-400 text-sm py-2">Überspringen</button>
    </div>
  </div>;
}

// ─── ANFRAGE FLOW ─────────────────────────────────────────────────────────────
function AnfrageFlow({anfrage, setAnfrage, screen, setScreen, genehmigteUrlaube, schliesztage, sperrzeiten, isOwner, team, currentUser, onSubmit, onAbbrechen}) {
  const [calM, setCalM] = useState({y:new Date().getFullYear(), m:new Date().getMonth()});
  const [saving, setSaving] = useState(false);
  const [selStart, setSelStart] = useState(null);

  const typen = isOwner ? TYPEN_OW : TYPEN_MA;

  function blockInfo(d) {
    if (anfrage.typ!=="urlaub") return null;
    if (istFeiertag(d)) return "feiertag";
    if (schliesztage.includes(d)) return "schliesztag";
    if (istSperre(d, true, sperrzeiten)) return "sperre";
    if (genehmigteUrlaube.some(u=>tageZw(u.von,u.bis).includes(d))) return "belegt";
    return null;
  }

  function tapDay(d) {
    if (blockInfo(d)) return;
    if (parseD(d).getDay()===0) return;
    if (!selStart) {
      setSelStart(d); setAnfrage(a=>({...a,von:d,bis:d}));
    } else {
      const v=selStart<d?selStart:d, b=selStart<d?d:selStart;
      if (anfrage.typ==="urlaub" && tageZw(v,b).some(x=>blockInfo(x))) return;
      setAnfrage(a=>({...a,von:v,bis:b})); setSelStart(null);
    }
  }

  const hinweis = useMemo(()=>{
    if (anfrage.typ!=="urlaub"||!anfrage.von) return null;
    const t=tageZw(anfrage.von,anfrage.bis);
    if (t.some(d=>istSperre(d,true,sperrzeiten))) return "sperre";
    if (t.some(d=>genehmigteUrlaube.some(u=>tageZw(u.von,u.bis).includes(d)))) return "belegt";
    return null;
  },[anfrage,genehmigteUrlaube,sperrzeiten]);

  const anzahl = anfrage.von&&anfrage.bis
    ? (anfrage.typ==="urlaub"?arbeitstage(anfrage.von,anfrage.bis,schliesztage).length
      :tageZw(anfrage.von,anfrage.bis).filter(d=>parseD(d).getDay()!==0).length)
    : 0;

  async function submit() {
    setSaving(true);
    try {
      const pid = isOwner ? (anfrage.fuerPerson||currentUser.id) : currentUser.id;
      await onSubmit(anfrage.typ, anfrage.von, anfrage.bis, pid);
    } catch(e) { alert("Fehler: "+e.message); setSaving(false); }
  }

  if (screen==="typ") return (
    <div className="px-4 py-6 flex flex-col gap-6 min-h-screen">
      <div className="flex items-center gap-3">
        <button onClick={onAbbrechen} className="text-stone-400 text-xl">‹</button>
        <div><p className="text-xs text-stone-400 uppercase tracking-widest">Neue Anfrage</p>
        <h2 className="text-xl font-bold text-stone-900">Art der Abwesenheit</h2></div>
      </div>
      {isOwner&&<div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-2">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest mb-1">Für wen?</p>
        <div className="flex flex-wrap gap-2">
          {team.map(p=>(
            <button key={p.id} onClick={()=>setAnfrage(a=>({...a,fuerPerson:p.id}))}
              className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-sm font-medium transition-all ${anfrage.fuerPerson===p.id?"bg-stone-900 text-white border-stone-900":"bg-white text-stone-700 border-stone-200 hover:border-stone-400"}`}>
              <span className="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-xs font-bold">{p.name[0]}</span>
              {p.name}{p.role==="owner"?" (ich)":""}
            </button>
          ))}
        </div>
      </div>}
      <div className="flex flex-col gap-3">
        {typen.map(typ=>(
          <button key={typ.id}
            onClick={()=>{ setAnfrage(a=>({...a,typ:typ.id})); setScreen("datum"); }}
            disabled={isOwner&&typ.id==="sonstige"&&!anfrage.fuerPerson}
            className={`bg-white border border-stone-200 rounded-2xl px-5 py-4 flex items-center gap-4 hover:border-stone-400 hover:shadow-sm transition-all text-left ${isOwner&&typ.id==="sonstige"&&!anfrage.fuerPerson?"opacity-40 cursor-not-allowed":""}`}>
            <span className="text-2xl">{typ.icon}</span>
            <div className="flex-1">
              <p className="font-semibold text-stone-800">{typ.label}</p>
              {isOwner&&typ.id==="sonstige"&&!anfrage.fuerPerson&&<p className="text-xs text-stone-400">Erst Person auswählen</p>}
            </div>
            <span className="text-stone-300 text-lg">›</span>
          </button>
        ))}
      </div>
    </div>
  );

  if (screen==="datum") {
    const {y,m} = calM;
    const fd=new Date(y,m,1).getDay(), dm=new Date(y,m+1,0).getDate(), off=fd===0?6:fd-1;
    const days=Array.from({length:dm},(_,i)=>datStr(new Date(y,m,i+1)));
    const typc=getTyp(anfrage.typ);
    return (
      <div className="px-4 py-6 flex flex-col gap-5 min-h-screen">
        <div className="flex items-center gap-3">
          <button onClick={()=>setScreen("typ")} className="text-stone-400 text-xl">‹</button>
          <div><p className="text-xs text-stone-400 uppercase tracking-widest">{typc?.icon} {typc?.label}</p>
          <h2 className="text-xl font-bold text-stone-900">Zeitraum wählen</h2></div>
        </div>
        {anfrage.typ==="urlaub"&&<div className="bg-stone-100 rounded-xl px-4 py-3">
          <p className="text-xs text-stone-400">· Urlaubssperre 1.12.–24.12. · Samstag zählt · Feiertage/Schließtage zählen nicht</p>
        </div>}
        <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden">
          <div className="flex items-center justify-between px-4 py-3 border-b border-stone-100">
            <button onClick={()=>setCalM(x=>x.m===0?{y:x.y-1,m:11}:{...x,m:x.m-1})} className="text-stone-400 px-2">‹</button>
            <p className="text-sm font-semibold text-stone-800">{fmtM(y,m)}</p>
            <button onClick={()=>setCalM(x=>x.m===11?{y:x.y+1,m:0}:{...x,m:x.m+1})} className="text-stone-400 px-2">›</button>
          </div>
          <div className="grid grid-cols-7 px-3 py-2">
            {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=><div key={d} className="text-center text-xs font-medium text-stone-400 py-1">{d}</div>)}
            {Array.from({length:off},(_,i)=><div key={"e"+i}/>)}
            {days.map(d=>{
              const bi=blockInfo(d), isSun=parseD(d).getDay()===0;
              const isSel=anfrage.von&&anfrage.bis&&d>=anfrage.von&&d<=anfrage.bis;
              let cls="flex items-center justify-center text-xs h-9 rounded-lg mx-0.5 my-0.5 transition-colors ";
              if (isSun) cls+="text-stone-200 ";
              else if (bi==="sperre") cls+="bg-rose-50 text-rose-300 cursor-not-allowed ";
              else if (bi==="belegt") cls+="bg-stone-100 text-stone-300 cursor-not-allowed ";
              else if (bi==="feiertag"||bi==="schliesztag") cls+="text-stone-300 cursor-not-allowed ";
              else if (isSel) cls+="bg-stone-900 text-white font-semibold cursor-pointer ";
              else cls+="text-stone-700 hover:bg-stone-100 cursor-pointer ";
              return <button key={d} onClick={()=>!isSun&&tapDay(d)} className={cls} disabled={!!bi||isSun}>{parseD(d).getDate()}</button>;
            })}
          </div>
          <div className="px-4 py-2 border-t border-stone-100 flex gap-3 flex-wrap">
            <span className="flex items-center gap-1 text-xs text-stone-400"><span className="w-3 h-3 rounded-sm bg-stone-900 inline-block"/>Gewählt</span>
            {anfrage.typ==="urlaub"&&<span className="flex items-center gap-1 text-xs text-stone-400"><span className="w-3 h-3 rounded-sm bg-rose-100 inline-block"/>Sperre</span>}
          </div>
        </div>
        {hinweis==="belegt"&&<div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3"><p className="text-sm text-rose-700 font-medium">In diesem Zeitraum ist bereits Urlaub bestätigt.</p></div>}
        {hinweis==="sperre"&&<div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3"><p className="text-sm text-rose-700 font-medium">Urlaubssperre aktiv.</p></div>}
        {anfrage.von&&!hinweis&&(
          <div className="bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
            <div>
              <p className="text-xs text-stone-400">Gewählt</p>
              <p className="text-sm font-semibold text-stone-800">{fmtZ(anfrage.von,anfrage.bis)}</p>
              {anzahl>0&&<p className="text-xs text-stone-400">{anzahl} {anfrage.typ==="urlaub"?"Urlaubstag":"Tag"}{anzahl!==1?"e":""}</p>}
            </div>
            <button onClick={()=>setScreen("zusammenfassung")}
              className="bg-stone-900 text-white rounded-xl px-5 py-2.5 text-sm font-semibold hover:bg-stone-800 transition-colors">
              Weiter →
            </button>
          </div>
        )}
      </div>
    );
  }

  if (screen==="zusammenfassung") {
    const typc=getTyp(anfrage.typ);
    return (
      <div className="px-4 py-6 flex flex-col gap-6 min-h-screen">
        <div className="flex items-center gap-3">
          <button onClick={()=>setScreen("datum")} className="text-stone-400 text-xl">‹</button>
          <div><p className="text-xs text-stone-400 uppercase tracking-widest">Zusammenfassung</p>
          <h2 className="text-xl font-bold text-stone-900">Anfrage bestätigen</h2></div>
        </div>
        <div className="bg-white border border-stone-200 rounded-2xl p-5 flex flex-col gap-4">
          <div className="flex items-center gap-3 pb-4 border-b border-stone-100">
            <span className="text-3xl">{typc?.icon}</span>
            <p className="font-semibold text-stone-800 text-lg">{typc?.label}</p>
          </div>
          {isOwner&&anfrage.fuerPerson&&<div className="flex justify-between">

        {isOwner ? (
          <div className="flex flex-col gap-2">
            <button onClick={async()=>{setSaving(true);try{const pid=anfrage.fuerPerson||currentUser.id;await onSubmit(anfrage.typ,anfrage.von,anfrage.bis,pid,true);}catch(e){alert("Fehler: "+e.message);setSaving(false);}}}
              disabled={saving}
              className="w-full bg-stone-900 text-white rounded-2xl py-4 font-semibold hover:bg-stone-800 transition-colors disabled:opacity-50">
              {saving?"Wird gespeichert…":"✓ Direkt eintragen (genehmigt)"}
            </button>
            <button onClick={submit} disabled={saving}
              className="w-full border border-stone-300 text-stone-700 rounded-2xl py-3 font-medium hover:bg-stone-100 transition-colors disabled:opacity-50">
              Als Anfrage einreichen (ausstehend)
            </button>
            <button onClick={onAbbrechen} className="text-center text-sm text-stone-400 underline pt-1">Abbrechen</button>
          </div>
        ) : (
          <>
            <button onClick={submit} disabled={saving}
              className="w-full bg-stone-900 text-white rounded-2xl py-4 font-semibold hover:bg-stone-800 transition-colors disabled:opacity-50">
              {saving?"Wird gespeichert…":"Anfrage absenden"}
            </button>
            <button onClick={onAbbrechen} className="text-center text-sm text-stone-400 underline">Abbrechen</button>
          </>
        )}
      </div>
    );
  }
  return null;
}

// ─── TEAMKALENDER ─────────────────────────────────────────────────────────────
function Kalender({anfragen, team, monat, setMonat, schliesztage}) {
  const {y,m}=monat;
  const gen=anfragen.filter(a=>a.status==="genehmigt");
  const fd=new Date(y,m,1).getDay(), dm=new Date(y,m+1,0).getDate(), off=fd===0?6:fd-1;
  const days=Array.from({length:dm},(_,i)=>({d:datStr(new Date(y,m,i+1)),n:i+1,dow:new Date(y,m,i+1).getDay()}));
  const FARBEN={urlaub:"bg-emerald-100 text-emerald-800",sonstige:"bg-violet-100 text-violet-800",feiertag:"bg-amber-100 text-amber-700",schliesztag:"bg-rose-100 text-rose-700"};

  function eintraege(datum) {
    if (istFeiertag(datum)) return [{typ:"feiertag",label:feiertagName(datum)}];
    if (schliesztage.includes(datum)) return [{typ:"schliesztag",label:"Schließtag"}];
    return gen.filter(a=>tageZw(a.von,a.bis).includes(datum)).map(a=>({typ:a.typ,label:team.find(p=>p.id===a.person_id)?.name||a.person_id}));
  }

  return <div className="px-4 py-6 flex flex-col gap-4">
    <div><p className="text-xs text-stone-400 uppercase tracking-widest">Team</p>
    <h2 className="text-2xl font-bold text-stone-900">Kalender</h2></div>
    <div className="flex items-center justify-between bg-white border border-stone-200 rounded-xl px-4 py-2.5">
      <button onClick={()=>setMonat(x=>x.m===0?{y:x.y-1,m:11}:{...x,m:x.m-1})} className="text-stone-400 px-2">‹</button>
      <p className="text-sm font-semibold text-stone-800">{fmtM(y,m)}</p>
      <button onClick={()=>setMonat(x=>x.m===11?{y:x.y+1,m:0}:{...x,m:x.m+1})} className="text-stone-400 px-2">›</button>
    </div>
    <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden">
      <div className="grid grid-cols-7 border-b border-stone-100">
        {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=><div key={d} className="text-center text-xs font-medium text-stone-400 py-2">{d}</div>)}
      </div>
      <div className="grid grid-cols-7">
        {Array.from({length:off},(_,i)=><div key={"e"+i} className="min-h-[60px] border-r border-b border-stone-50"/>)}
        {days.map(({d,n,dow})=>(
          <div key={d} className={`min-h-[60px] border-r border-b border-stone-50 p-1 ${dow===0?"bg-stone-50":""}`}>
            <p className={`text-xs font-medium mb-1 ${dow===0?"text-stone-300":"text-stone-500"}`}>{n}</p>
            <div className="flex flex-col gap-0.5">
              {eintraege(d).map((e,i)=>(
                <span key={i} className={`font-medium px-1 py-0.5 rounded truncate block ${FARBEN[e.typ]||"bg-stone-100 text-stone-600"}`} style={{fontSize:"9px"}}>{e.label}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
    <div className="flex flex-wrap gap-2">
      {[["urlaub","Urlaub"],["sonstige","Sonstige Abw."],["feiertag","Feiertag"],["schliesztag","Schließtag"]].map(([t,l])=>(
        <span key={t} className={`text-xs font-medium px-2 py-1 rounded-full ${FARBEN[t]}`}>{l}</span>
      ))}
    </div>
  </div>;
}

              className="flex-1 border border-rose-200 text-rose-600 rounded-xl py-2.5 text-sm font-semibold hover:bg-rose-50 transition-colors disabled:opacity-50">

          <div className="flex items-center justify-between mb-3">

              <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{p.name[0]}</span>

            </div>
            {warn&&<span className="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">{offen} Tage offen</span>}
          </div>
          <div className="flex gap-4 mb-3">
            {[{v:p.urlaub_verbraucht,l:"verbraucht",c:"text-stone-900"},{v:offen,l:"offen",c:warn?"text-amber-600":"text-emerald-600"},{v:p.urlaub_anspruch,l:"gesamt",c:"text-stone-400"}].map((x,i)=>(
              <div key={i} className="flex-1 text-center">
                <p className={`text-xl font-bold ${x.c}`}>{x.v}</p>

// ─── EINSTELLUNGEN ────────────────────────────────────────────────────────────
function PersonKarte({person, onUpdate}) {
  const [anspruch, setAnspruch] = useState(String(person.urlaub_anspruch));
  const [verbraucht, setVerbraucht] = useState(String(person.urlaub_verbraucht));
  const [eintritt, setEintritt] = useState(person.eintrittsdatum||"");
  const [pin, setPin] = useState("");
  const [saved, setSaved] = useState(false);
  const [saving, setSaving] = useState(false);
  const nxt = naechstesJubilaeum(eintritt);
  const tage = nxt ? Math.ceil((nxt-new Date())/(1000*60*60*24)) : null;

  async function save() {
    setSaving(true);
    try {
      const d = { urlaub_anspruch: parseInt(anspruch)||0, urlaub_verbraucht: parseInt(verbraucht)||0, eintrittsdatum: eintritt||null };
      if (pin.length===4) d.pin = pin;
      await api.updatePerson(person.id, d);
      onUpdate(d);
      if (pin.length===4) setPin("");
      setSaved(true); setTimeout(()=>setSaved(false),2000);
    } catch(e) { alert("Fehler: "+e.message); }
    setSaving(false);
  }

  return <div className="bg-white border border-stone-200 rounded-2xl px-4 py-4 flex flex-col gap-3">
    <div className="flex items-center gap-3">
      <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{person.name[0]}</span>
      <p className="font-semibold text-stone-800">{person.name}</p>
    </div>
    <div className="flex gap-3">
      <div className="flex-1">
        <p className="text-xs text-stone-400 mb-1">Eintrittsdatum</p>
        <input type="date" value={eintritt} onChange={e=>{setEintritt(e.target.value);setSaved(false);}}
          className="w-full border border-stone-200 rounded-xl px-2 py-2 text-sm text-stone-900 focus:outline-none focus:border-stone-600"/>
      </div>
      <div className="flex-1">
        <p className="text-xs text-stone-400 mb-1">Neuer PIN</p>
        <input type="password" maxLength={4} value={pin} placeholder="••••"
          onChange={e=>{setPin(e.target.value.replace(/[^0-9]/g,""));setSaved(false);}}
          className="w-full border border-stone-200 rounded-xl px-2 py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600"/>
      </div>
    </div>
    {nxt&&<div className={`rounded-xl px-3 py-2 ${tage<=30?"bg-emerald-50 border border-emerald-200":"bg-stone-50"}`}>
      <p className="text-xs text-stone-500">Nächster Urlaubsanspruch: <span className="font-semibold">{nxt.toLocaleDateString("de-AT")}</span></p>
      <p className={`text-xs font-semibold mt-0.5 ${tage<=0?"text-emerald-700 font-bold":tage<=30?"text-emerald-600":"text-stone-400"}`}>
        {tage<=0?"Heute fällig!":`in ${tage} Tagen`}
      </p>
    </div>}
    <div className="flex gap-3">
      <div className="flex-1">
        <p className="text-xs text-stone-400 mb-1">Jahresanspruch</p>
        <input type="number" min="0" value={anspruch} onChange={e=>{setAnspruch(e.target.value);setSaved(false);}}
          className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600"/>
      </div>
      <div className="flex-1">
        <p className="text-xs text-stone-400 mb-1">Verbraucht</p>
        <input type="number" min="0" value={verbraucht} onChange={e=>{setVerbraucht(e.target.value);setSaved(false);}}
          className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-600"/>
      </div>
      <div className="flex items-end">
        <button onClick={save} disabled={saving}
          className={`rounded-xl px-3 py-2 text-sm font-semibold transition-colors ${saved?"bg-emerald-100 text-emerald-700":"bg-stone-900 text-white hover:bg-stone-800"}`}>
          {saved?"✓":saving?"…":"→"}
        </button>
      </div>
    </div>
  </div>;
}

      <button onClick={()=>{setOpen(false);setName("");setPin("");}} className="flex-1 border border-stone-200 rounded-xl py-2.5 text-sm font-medium text-stone-500 hover:bg-stone-50">Abbrechen</button>
      <button onClick={save} disabled={saving} className="flex-1 bg-stone-900 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-stone-800 disabled:opacity-50">
        {saving?"Wird gespeichert…":"Hinzufügen"}
      </button>
    </div>
  </div>;
}

function Einstellungen({team, setTeam, schliesztage, setSchliesztage, warnschwelle, setWarnschwelle, sperrzeiten, setSperrzeiten}) {
  const [tab, setTab] = useState("personen");
  const [neuTag, setNeuTag] = useState("");
  const [tagErr, setTagErr] = useState("");
  const [schwelle, setSchwelle] = useState(String(warnschwelle));
  const [schwSaved, setSchwSaved] = useState(false);
  const [spVon, setSpVon] = useState(""); const [spBis, setSpBis] = useState(""); const [spName, setSpName] = useState(""); const [spErr, setSpErr] = useState("");

  async function addTag() {
    setTagErr("");
    if (!neuTag) return;
    if (schliesztage.includes(neuTag)) { setTagErr("Bereits eingetragen."); return; }
    if (istFeiertag(neuTag)) { setTagErr("Ist ein gesetzlicher Feiertag."); return; }
    const neu=[...schliesztage,neuTag].sort();
    try { await api.setEinstellung("schliesztage",JSON.stringify(neu)); setSchliesztage(neu); setNeuTag(""); }
    catch(e) { alert("Fehler: "+e.message); }
  }

  async function delTag(d) {
    const neu=schliesztage.filter(x=>x!==d);
    try { await api.setEinstellung("schliesztage",JSON.stringify(neu)); setSchliesztage(neu); }
    catch(e) { alert("Fehler: "+e.message); }
  }

  async function saveSchwelle() {
    const n=parseInt(schwelle,10);
    if (isNaN(n)||n<0) return;
    try { await api.setEinstellung("warnschwelle",String(n)); setWarnschwelle(n); setSchwSaved(true); setTimeout(()=>setSchwSaved(false),2000); }
    catch(e) { alert("Fehler: "+e.message); }
  }

  async function addSperre() {
    setSpErr("");
    if (!spVon||!spBis) { setSpErr("Bitte Von und Bis ausfüllen."); return; }
    if (spVon>spBis) { setSpErr("Von muss vor Bis liegen."); return; }
    const neu=[...sperrzeiten,{von:spVon,bis:spBis,bezeichnung:spName||"Urlaubssperre"}];
    try { await api.setEinstellung("sperrzeiten",JSON.stringify(neu)); setSperrzeiten(neu); setSpVon(""); setSpBis(""); setSpName(""); }
    catch(e) { alert("Fehler: "+e.message); }
  }

  async function delSperre(i) {
    const neu=sperrzeiten.filter((_,j)=>j!==i);
    try { await api.setEinstellung("sperrzeiten",JSON.stringify(neu)); setSperrzeiten(neu); }
    catch(e) { alert("Fehler: "+e.message); }
  }

  const tabs=[{id:"personen",l:"Personen"},{id:"schliesztage",l:"Schließtage"},{id:"sperrzeiten",l:"Sperrzeiten"},{id:"warnschwelle",l:"Resturlaub"}];

  return <div className="px-4 py-6 flex flex-col gap-4">
    <div><p className="text-xs text-stone-400 uppercase tracking-widest">Inhaberin</p>
    <h2 className="text-2xl font-bold text-stone-900">Einstellungen</h2></div>
    <div className="flex bg-stone-100 rounded-xl p-1 gap-1">
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          className={`flex-1 py-2 text-xs font-medium rounded-lg transition-all ${tab===t.id?"bg-white text-stone-900 shadow-sm":"text-stone-500"}`}>
          {t.l}
        </button>
      ))}
    </div>

    {tab==="personen"&&<div className="flex flex-col gap-3">
      <p className="text-xs text-stone-400 px-1">PIN, Eintrittsdatum und Urlaubstage anpassen. Mitarbeitende hinzufügen oder entfernen.</p>

      {/* Inhaberin eigener PIN */}
      {team.filter(p=>p.role==="owner").map(p=>(
        <div key={p.id} className="bg-white border border-stone-200 rounded-2xl px-4 py-4 flex flex-col gap-3">
          <div className="flex items-center gap-3">
            <span className="w-9 h-9 rounded-full bg-stone-900 text-white text-sm font-bold flex items-center justify-center">{p.name[0]}</span>
            <div><p className="font-semibold text-stone-800">{p.name}</p>
            <p className="text-xs text-stone-400">Inhaberin</p></div>
          </div>
          <OwnerPinKarte person={p} onUpdate={u=>setTeam(prev=>prev.map(x=>x.id===p.id?{...x,...u}:x))}/>
        </div>
      ))}

      <div className="flex items-center gap-2 pt-2">
        <div className="flex-1 h-px bg-stone-200"/>
        <p className="text-xs text-stone-400 uppercase tracking-widest">Mitarbeitende</p>
        <div className="flex-1 h-px bg-stone-200"/>
      </div>

      {team.filter(p=>p.role==="employee").map(p=>(
        <div key={p.id} className="relative">
          <PersonKarte person={p} onUpdate={u=>setTeam(prev=>prev.map(x=>x.id===p.id?{...x,...u}:x))}/>
          <button onClick={async()=>{
            if (!confirm(`${p.name} wirklich löschen? Alle Anfragen dieser Person bleiben erhalten.`)) return;
            try { await api.deletePerson(p.id); setTeam(prev=>prev.filter(x=>x.id!==p.id)); }
            catch(e) { alert("Fehler: "+e.message); }
          }} className="absolute top-4 right-4 text-xs text-rose-400 hover:text-rose-600 font-medium">Löschen</button>
        </div>
      ))}

      <NeueMitarbeiterinKarte onAdd={async(d)=>{
        try {
          const r = await api.addPerson(d);
          setTeam(prev=>[...prev, r[0]]);
        } catch(e) { alert("Fehler: "+e.message); }
      }}/>
    </div>}

    {tab==="schliesztage"&&<div className="flex flex-col gap-4">
      <div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-3">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest">Neuer Schließtag</p>
        <div className="flex gap-2">
          <input type="date" value={neuTag} onChange={e=>{setNeuTag(e.target.value);setTagErr("");}}
            className="flex-1 border border-stone-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-stone-600"/>
          <button onClick={addTag} className="bg-stone-900 text-white rounded-xl px-4 py-2.5 text-sm font-semibold">+</button>
        </div>
        {tagErr&&<p className="text-xs text-rose-500">{tagErr}</p>}
      </div>
      <div className="bg-stone-100 rounded-xl px-4 py-2.5">
        <p className="text-xs text-stone-400">Urlaubssperre 1.12.–24.12. ist fest hinterlegt.</p>
      </div>
      <div className="flex flex-col gap-2">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest px-1">Eingetragene Schließtage</p>
        {schliesztage.length===0?<p className="text-stone-400 text-sm px-1">Keine eingetragen.</p>:
          schliesztage.map(d=>(
            <div key={d} className="bg-white border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
              <p className="text-sm font-medium text-stone-800">{fmtD(d)}</p>
              <button onClick={()=>delTag(d)} className="text-rose-400 hover:text-rose-600 px-2">✕</button>
            </div>
          ))
        }
      </div>
      <div className="flex flex-col gap-2">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest px-1">Gesetzliche Feiertage Österreich</p>
        {getFeiertage(new Date().getFullYear()).map(f=>(
          <div key={f.datum} className="bg-stone-50 border border-stone-100 rounded-xl px-4 py-2.5 flex items-center justify-between">
            <p className="text-sm font-medium text-stone-700">{f.name}</p>
            <p className="text-xs text-stone-400">{fmtD(f.datum)}</p>
          </div>
        ))}
        <p className="text-xs text-stone-300 px-1">Automatisch berechnet für {new Date().getFullYear()}</p>
      </div>
    </div>}

    {tab==="sperrzeiten"&&<div className="flex flex-col gap-4">
      <div className="bg-white border border-stone-200 rounded-2xl p-4 flex flex-col gap-3">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest">Neue Urlaubssperre</p>
        <input type="text" placeholder="Bezeichnung (z.B. Sommersperre)" value={spName} onChange={e=>setSpName(e.target.value)}
          className="border border-stone-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-stone-600"/>
        <div className="flex gap-2">
          <div className="flex-1"><p className="text-xs text-stone-400 mb-1">Von</p>
            <input type="date" value={spVon} onChange={e=>{setSpVon(e.target.value);setSpErr("");}}
              className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-stone-600"/></div>
          <div className="flex-1"><p className="text-xs text-stone-400 mb-1">Bis</p>
            <input type="date" value={spBis} onChange={e=>{setSpBis(e.target.value);setSpErr("");}}
              className="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-stone-600"/></div>
        </div>
        {spErr&&<p className="text-xs text-rose-500">{spErr}</p>}
        <button onClick={addSperre} className="bg-stone-900 text-white rounded-xl py-2.5 text-sm font-semibold">+ Hinzufügen</button>
      </div>
      <div className="bg-stone-100 rounded-xl px-4 py-2.5">
        <p className="text-xs text-stone-400">Urlaubssperre 1.12.–24.12. ist immer aktiv.</p>
      </div>
      <div className="flex flex-col gap-2">
        <p className="text-xs font-medium text-stone-400 uppercase tracking-widest px-1">Aktive Sperrzeiten</p>
        {sperrzeiten.length===0?<p className="text-stone-400 text-sm px-1">Keine eingetragen.</p>:
          sperrzeiten.map((s,i)=>(
            <div key={i} className="bg-white border border-stone-200 rounded-xl px-4 py-3 flex items-center justify-between">
              <div><p className="text-sm font-medium text-stone-800">{s.bezeichnung}</p>
              <p className="text-xs text-stone-400">{fmtD(s.von)} – {fmtD(s.bis)}</p></div>
              <button onClick={()=>delSperre(i)} className="text-rose-400 hover:text-rose-600 px-2">✕</button>
            </div>
          ))
        }
      </div>
    </div>}

    {tab==="warnschwelle"&&<div className="flex flex-col gap-4">
      <div className="bg-white border border-stone-200 rounded-2xl p-5 flex flex-col gap-4">
        <div>
          <p className="text-xs font-medium text-stone-400 uppercase tracking-widest mb-1">Resturlaub-Warnschwelle</p>
          <p className="text-stone-500 text-sm">Ab wie vielen offenen Tagen soll eine Warnung erscheinen?</p>
        </div>
        <div className="flex items-center gap-3">
          <input type="number" min="0" value={schwelle} onChange={e=>{setSchwelle(e.target.value);setSchwSaved(false);}}
            className="w-20 text-center border border-stone-300 rounded-xl py-2.5 text-lg font-bold text-stone-900 focus:outline-none focus:border-stone-600"/>
          <span className="text-stone-500 text-sm">Tage</span>
          <button onClick={saveSchwelle}
            className={`ml-auto rounded-xl px-4 py-2.5 text-sm font-semibold transition-colors ${schwSaved?"bg-emerald-100 text-emerald-700":"bg-stone-900 text-white hover:bg-stone-800"}`}>
            {schwSaved?"✓ Gespeichert":"Speichern"}
          </button>
        </div>
      </div>
      <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
        <p className="text-xs text-amber-700">Aktuell: Warnung ab <span className="font-bold">{warnschwelle} Tagen</span> offen.</p>
      </div>
    </div>}
  </div>;
}

// ─── ANFRAGE KARTE ────────────────────────────────────────────────────────────
function AnfrageKarte({anfrage, showDate}) {
  const typc=getTyp(anfrage.typ), st=STATUS[anfrage.status];
  return <div className={`bg-white border border-stone-200 rounded-2xl px-4 py-3.5 border-l-4 ${st.border}`}>
    <div className="flex items-start justify-between gap-2 mb-1">
      <p className="text-sm font-semibold text-stone-800">{typc?.icon} {typc?.label}</p>
      <span className={`font-bold uppercase px-2 py-0.5 rounded-full ${st.bg} ${st.text}`} style={{fontSize:"10px"}}>{st.label}</span>
    </div>
    <p className="text-xs text-stone-500">{fmtZ(anfrage.von,anfrage.bis)}</p>
    {showDate&&<p className="text-stone-300 mt-1" style={{fontSize:"10px"}}>Eingereicht {fmtD(anfrage.erstellt)}</p>}
  </div>;
}

// ─── HAUPT APP ────────────────────────────────────────────────────────────────
function App() {
  const [ladeStatus, setLadeStatus] = useState("laden");
  const [user, setUser] = useState(null);
  const [team, setTeam] = useState([]);
  const [anfragen, setAnfragen] = useState([]);
  const [schliesztage, setSchliesztage] = useState([]);
  const [warnschwelle, setWarnschwelle] = useState(10);
  const [sperrzeiten, setSperrzeiten] = useState([]);
  const [screen, setScreen] = useState("home");
  const [anfrageScreen, setAnfrageScreen] = useState(null);
  const [neueAnfrage, setNeueAnfrage] = useState({typ:null,von:null,bis:null,fuerPerson:null});
  const [kalM, setKalM] = useState({y:new Date().getFullYear(),m:new Date().getMonth()});
  const [ersterStart, setErsterStart] = useState(false);

  async function laden(silent=false) {
    if (!silent) setLadeStatus("laden");
    try {
      const [t,a,e] = await Promise.all([api.getTeam(), api.getAnfragen(), api.getEinstellungen()]);
      setTeam(t||[]);
      setAnfragen(a||[]);
      const sz=e?.find(x=>x.schluessel==="schliesztage");
      const ws=e?.find(x=>x.schluessel==="warnschwelle");
      const spz=e?.find(x=>x.schluessel==="sperrzeiten");
      const er=e?.find(x=>x.schluessel==="eroeffnung_erledigt");
      if (sz) setSchliesztage(JSON.parse(sz.wert));
      if (ws) setWarnschwelle(parseInt(ws.wert,10));
      if (spz) setSperrzeiten(JSON.parse(spz.wert));
      if (!er) setErsterStart(true);
      setLadeStatus("bereit");
    } catch(e) { console.error(e); if (!silent) setLadeStatus("fehler"); }
  }

  useEffect(()=>{ laden(); const t=setInterval(()=>laden(true),30000); return ()=>clearInterval(t); },[]);

  if (ladeStatus==="laden") return <Shell><Lade text="Verbinde…"/></Shell>;
  if (ladeStatus==="fehler") return <Shell><div className="min-h-screen flex flex-col items-center justify-center gap-4 px-6 text-center">
    <p className="text-2xl">⚠️</p><p className="text-stone-700 font-semibold">Verbindungsfehler</p>
    <p className="text-stone-400 text-sm">Supabase konnte nicht erreicht werden.</p>
    <button onClick={laden} className="bg-stone-900 text-white rounded-xl px-5 py-2.5 text-sm font-semibold mt-2">Nochmal versuchen</button>
  </div></Shell>;

  if (!user) return <Login team={team} onLogin={setUser}/>;

  if (user.role==="owner"&&ersterStart) return <Shell>
    <Eroeffnung team={team} onDone={async()=>{ setErsterStart(false); const t=await api.getTeam(); setTeam(t||[]); }}/>
  </Shell>;

  const isOwner = user.role==="owner";
  const meinAnfragen = anfragen.filter(a=>a.person_id===user.id);
  const offeneAnfragen = anfragen.filter(a=>a.status==="ausstehend");
  const genehmigteUrlaube = anfragen.filter(a=>a.typ==="urlaub"&&a.status==="genehmigt");

  async function handleAnfrage(typ, von, bis, pid, directApprove) {
    const personId = pid || user.id;
    const status = (isOwner && directApprove) ? "genehmigt" : "ausstehend";
    const neu = await api.addAnfrage({person_id:personId, typ, von, bis, status, erstellt:heute()});
    setAnfragen(prev=>[...prev, neu[0]]);
    setAnfrageScreen(null);
    setNeueAnfrage({typ:null,von:null,bis:null,fuerPerson:null});
    // Nach dem direkten Eintrag: Inhaberin bleibt auf Home/Kalender
    setScreen(isOwner && directApprove ? "kalender" : "meine-anfragen");
  }

  async function handleEntscheid(id, status) {
    await api.updateAnfrage(id, {status});
    setAnfragen(prev=>prev.map(a=>a.id===id?{...a,status}:a));
  }

  const navItems = isOwner
    ? [{id:"home",l:"Home",i:"⌂"},{id:"kalender",l:"Kalender",i:"◫"},{id:"anfragen",l:"Anfragen",i:"◎",b:offeneAnfragen.length},{id:"urlaubsstaende",l:"Urlaub",i:"▦"}]
    : [{id:"home",l:"Home",i:"⌂"},{id:"kalender",l:"Kalender",i:"◫"},{id:"meine-anfragen",l:"Anfragen",i:"◎"}];

  if (anfrageScreen) return <Shell>
    <AnfrageFlow
      anfrage={neueAnfrage} setAnfrage={setNeueAnfrage}
      screen={anfrageScreen} setScreen={setAnfrageScreen}
      genehmigteUrlaube={genehmigteUrlaube} schliesztage={schliesztage} sperrzeiten={sperrzeiten}
      isOwner={isOwner} team={team} currentUser={user}
      onSubmit={handleAnfrage}
      onAbbrechen={()=>{ setAnfrageScreen(null); setNeueAnfrage({typ:null,von:null,bis:null,fuerPerson:null}); }}
    />
  </Shell>;

  return <Shell>
    <div className="flex flex-col min-h-screen bg-stone-50">
      <header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
        <div>
          <p className="text-xs text-stone-400 uppercase tracking-widest">Great Hair Day</p>
          <p className="text-sm font-semibold text-stone-800">{user.name}</p>
        </div>
        <div className="flex items-center gap-2">
          {isOwner&&<button onClick={()=>setScreen("einstellungen")} className="text-xs text-stone-400 hover:text-stone-700 px-2 py-1">⚙ Einstellungen</button>}
          <button onClick={()=>{setUser(null);setScreen("home");}} className="text-xs text-stone-400 hover:text-stone-600 px-2 py-1">Abmelden</button>
        </div>
      </header>

      <main className="flex-1 overflow-y-auto pb-24">
        {screen==="home"&&isOwner&&<HomeInhaberin anfragen={anfragen} team={team} warnschwelle={warnschwelle} onNav={(s)=>{
          if (s==="neu-anfrage") { setNeueAnfrage({typ:null,von:null,bis:null,fuerPerson:null}); setAnfrageScreen("typ"); }
          else setScreen(s);
        }}/>}
        {screen==="home"&&!isOwner&&<HomeMitarbeiter person={team.find(p=>p.id===user.id)} anfragen={meinAnfragen} onNeu={()=>{setNeueAnfrage({typ:null,von:null,bis:null,fuerPerson:null});setAnfrageScreen("typ");}} onNav={setScreen}/>}
        {screen==="kalender"&&<Kalender anfragen={anfragen} team={team} monat={kalM} setMonat={setKalM} schliesztage={schliesztage}/>}
        {screen==="meine-anfragen"&&<MeineAnfragen anfragen={meinAnfragen} onNeu={()=>{setNeueAnfrage({typ:null,von:null,bis:null,fuerPerson:null});setAnfrageScreen("typ");}}/>}
        {screen==="anfragen"&&isOwner&&<AnfragenOw anfragen={anfragen} team={team} schliesztage={schliesztage} onEntscheid={handleEntscheid}/>}
        {screen==="urlaubsstaende"&&isOwner&&<Urlaubsstaende team={team} warnschwelle={warnschwelle}/>}
        {screen==="einstellungen"&&isOwner&&<Einstellungen team={team} setTeam={setTeam} schliesztage={schliesztage} setSchliesztage={setSchliesztage} warnschwelle={warnschwelle} setWarnschwelle={setWarnschwelle} sperrzeiten={sperrzeiten} setSperrzeiten={setSperrzeiten}/>}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-stone-200 flex z-10">
        {navItems.map(x=>(
          <button key={x.id} onClick={()=>setScreen(x.id)}
            className={`flex-1 flex flex-col items-center py-3 gap-0.5 relative transition-colors ${screen===x.id?"text-stone-900":"text-stone-400"}`}>
            <span className="text-lg leading-none">{x.i}</span>
            <span style={{fontSize:"10px"}} className="font-medium">{x.l}</span>
            {x.b>0&&<span className="absolute top-2 right-1/4 translate-x-2 bg-rose-500 text-white font-bold rounded-full w-4 h-4 flex items-center justify-center" style={{fontSize:"9px"}}>{x.b}</span>}
            {screen===x.id&&<span className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-stone-800 rounded-t-full"/>}
          </button>
        ))}
      </nav>
    </div>
  </Shell>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
