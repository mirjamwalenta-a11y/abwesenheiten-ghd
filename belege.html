<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SB_URL = 'https://lpuxvvfrrcnbuzafscyk.supabase.co';
const INVITE_CODE = 'GREATHAIR2026'; // <-- hier Code ändern um Zugang zu sperren
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwdXh2dmZycmNuYnV6YWZzY3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODIxNDcsImV4cCI6MjEwMDI1ODE0N30.6VZUmmXj_x3Q8J55s_tbOHcW5-U5OXllGoEBhypaVfI';
const MONATE=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DEFAULT_KATS=[
  {id:'k1',icon:'🛒',label:'Einkauf & Material'},
  {id:'k2',icon:'🏠',label:'Miete & Betriebskosten'},
  {id:'k3',icon:'👥',label:'Personal & Lohn'},
  {id:'k4',icon:'🔧',label:'Geräte & Werkzeug'},
  {id:'k5',icon:'📱',label:'Marketing & Website'},
  {id:'k6',icon:'📋',label:'Versicherung & Steuer'},
  {id:'k7',icon:'📦',label:'Sonstiges'},
];

// ── Supabase REST helpers ────────────────────────────────────────────────────
function sbHeaders(token){
  const h={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY)};
  return h;
}
async function sbPost(path,body,token){
  let r=await fetch(SB_URL+path,{method:'POST',headers:sbHeaders(token),body:JSON.stringify(body)});
  if(r.status===401&&token){try{await refreshToken();r=await fetch(SB_URL+path,{method:'POST',headers:sbHeaders(S.token),body:JSON.stringify(body)});}catch(e){S.screen='auth';render();throw e;}}
  return r.json();
}
async function sbGet(path,token){
  let r=await fetch(SB_URL+path,{headers:{...sbHeaders(token),'Accept':'application/json'}});
  if(r.status===401){try{await refreshToken();r=await fetch(SB_URL+path,{headers:{...sbHeaders(S.token),'Accept':'application/json'}});}catch(e){S.screen='auth';render();throw e;}}
  return r.json();
}
async function sbPatch(path,body,token){
  let r=await fetch(SB_URL+path,{method:'PATCH',headers:{...sbHeaders(token),'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(r.status===401){try{await refreshToken();r=await fetch(SB_URL+path,{method:'PATCH',headers:{...sbHeaders(S.token),'Prefer':'return=representation'},body:JSON.stringify(body)});}catch(e){S.screen='auth';render();throw e;}}
  return r.json();
}
async function sbDelete(path,token){
  let r=await fetch(SB_URL+path,{method:'DELETE',headers:sbHeaders(token)});
  if(r.status===401){try{await refreshToken();r=await fetch(SB_URL+path,{method:'DELETE',headers:sbHeaders(S.token)});}catch(e){S.screen='auth';render();throw e;}}
  if(!r.ok){
    let msg='Löschen fehlgeschlagen (HTTP '+r.status+')';
    try{const j=await r.json();msg=j.message||j.error||msg;}catch(e){}
    throw new Error(msg);
  }
}

// Auth
async function signUp(email,password){
  const d=await sbPost('/auth/v1/signup',{email,password});
  if(d.error)throw new Error(d.error.message||d.msg||'Fehler');
  return d;
}
async function signIn(email,password){
  const d=await sbPost('/auth/v1/token?grant_type=password',{email,password});
  if(d.error)throw new Error(d.error.message||d.msg||'Fehler');
  if(d.refresh_token)try{localStorage.setItem('sb_refresh',d.refresh_token);}catch(e){}
  return d;
}
async function refreshToken(){
  const rt=localStorage.getItem('sb_refresh');
  if(!rt)throw new Error('Kein Refresh-Token');
  const d=await sbPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:rt});
  if(d.error)throw new Error(d.error.message||'Token abgelaufen');
  S.token=d.access_token;
  if(d.refresh_token)try{localStorage.setItem('sb_refresh',d.refresh_token);}catch(e){}
  saveLocal();
  return d;
}
async function signOut(token){
  await sbPost('/auth/v1/logout',{},token);
}

// ── State ─────────────────────────────────────────────────────────────────────
let S={
  screen:'loading',
  token:null,userId:null,
  profile:null,
  pinInput:'',pinError:'',
  belege:[],
  ansicht:'dashboard',
  monat:getMonat(),
  editId:null,editData:{},
  manuell:emptyM(),
  loading:false,
  apiKey:'',showKeyInput:false,
  authMode:'login',
  authEmail:'',authPass:'',authName:'',authErr:'',
  draft:null,
  tipps:null,tippsDatum:null,tippsLoading:false,
  bulkQueue:[],bulkTotal:0,bulkDone:0,bulkFehler:[],bulkModus:false,
};

function emptyM(){return{datum:'',betrag:'',art:'ausgabe',lieferant:'',kategorie:'',beschreibung:''};}
function getMonat(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mL(k){if(!k)return'';const[y,m]=k.split('-');return MONATE[parseInt(m)-1]+' '+y;}
function eur(n){return(n||0).toLocaleString('de-AT',{style:'currency',currency:'EUR'});}
function kk(id){const kats=S.profile?.kategorien||DEFAULT_KATS;return kats.find(k=>k.id===id)||kats[kats.length-1];}

// ── Storage ────────────────────────────────────────────────────────────────────
function saveLocal(){
  try{
    if(S.token){localStorage.setItem('sb_token',S.token);sessionStorage.setItem('sb_token',S.token);}
    if(S.userId){localStorage.setItem('sb_uid',S.userId);sessionStorage.setItem('sb_uid',S.userId);}
    if(S.apiKey)localStorage.setItem('sb_apikey',S.apiKey);
  }catch(e){}
}
function loadLocal(){
  try{
    // sessionStorage first (survives tab refresh), then localStorage
    S.token=sessionStorage.getItem('sb_token')||localStorage.getItem('sb_token');
    S.userId=sessionStorage.getItem('sb_uid')||localStorage.getItem('sb_uid');
    S.apiKey=localStorage.getItem('sb_apikey')||'';
    const cachedTipps=JSON.parse(localStorage.getItem('sb_tipps')||'null');
    if(cachedTipps){S.tipps=cachedTipps.tipps;S.tippsDatum=cachedTipps.datum;}
  }catch(e){}
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let tTimer;
function toast(msg,type='ok'){
  clearTimeout(tTimer);
  let t=document.querySelector('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast'+(type==='err'?' err':'');t.textContent=msg;
  document.body.appendChild(t);tTimer=setTimeout(()=>t.remove(),3200);
}

// ── API calls ─────────────────────────────────────────────────────────────────
async function loadProfile(){
  const d=await sbGet('/rest/v1/profiles?id=eq.'+S.userId+'&select=*',S.token);
  if(Array.isArray(d)&&d.length>0){S.profile=d[0];return true;}
  return false;
}
async function upsertProfile(data){
  const body={id:S.userId,name:data.name,pin:data.pin,emoji:data.emoji,kategorien:data.kategorien};
  const r=await fetch(SB_URL+'/rest/v1/profiles',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey':SB_KEY,
      'Authorization':'Bearer '+S.token,
      'Prefer':'resolution=merge-duplicates,return=representation'
    },
    body:JSON.stringify(body)
  });
  const result=await r.json();
  if(!r.ok){
    console.error('Profil-Fehler:',result);
    throw new Error(result.message||result.error||'Profil konnte nicht gespeichert werden');
  }
  return result;
}
async function loadBelege(){
  const d=await sbGet('/rest/v1/belege_neu?user_id=eq.'+S.userId+'&order=erfasst.desc&select=*',S.token);
  // id konsequent als String behandeln: Supabase liefert die id (bigint) als JS-Zahl zurück,
  // während onclick-Handler im HTML sie immer als String einbetten ('...'+b.id+'...'). Ein
  // strikter Vergleich (===) zwischen Zahl und String schlägt sonst IMMER fehl — dadurch
  // lassen sich Belege weder bearbeiten (Bearbeiten-Button reagiert nicht) noch aus der
  // Liste entfernen (Löschen wirkt lokal, bis zum nächsten Neuladen).
  if(Array.isArray(d))S.belege=d.map(b=>({...b,id:String(b.id)}));
  syncOsAufgaben();
}
async function insertBeleg(b){
  const payload={
    user_id:S.userId,
    datum:b.datum,
    betrag:b.betrag,
    netto:b.netto||null,
    ust_betrag:b.ust_betrag||null,
    ust_satz:b.ust_satz||null,
    art:b.art,
    lieferant:b.lieferant,
    uid_lieferant:b.uid_lieferant||null,
    rechnungsnummer:b.rechnungsnummer||null,
    kategorie:b.kategorie,
    beschreibung:b.beschreibung,
    monat:b.monat,

// ── PDF Text Extraktion ────────────────────────────────────────────────────────
async function extractPdfText(file){
  try{
    if(typeof pdfjsLib==='undefined')return null;
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    let fullText='';
    const seiten=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const tc=await page.getTextContent();
      fullText+=pdfLeseReihenfolge(tc)+'\n';
      seiten.push(page);
    }
    // Gescannte/abfotografierte Rechnungen, die als PDF gespeichert wurden, haben KEINE eingebettete
    // Textebene — pdf.js liefert dann so gut wie nichts zurück (leere Seite laut Content-Stream, obwohl
    // ein Bild drauf ist). Ohne diesen Fallback läuft die komplette Erkennung ins Leere. Deshalb in dem
    // Fall die ersten Seiten als Bild rendern und wie ein Foto per Tesseract OCR auslesen.
    if(fullText.trim().length<25&&typeof Tesseract!=='undefined'){
      let ocrText='';
      for(const page of seiten.slice(0,3)){
        try{
          const vp=page.getViewport({scale:2.2});
          const canvas=document.createElement('canvas');
          canvas.width=vp.width;canvas.height=vp.height;
          await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
          const t=await ocrCanvas(vorverarbeiteCanvas(canvas));
          if(t)ocrText+=t+'\n';
        }catch(e){console.warn('PDF-OCR Seitenfehler:',e);}
      }
      if(ocrText.trim().length>fullText.trim().length)fullText=ocrText;
    }
    return fullText;
  }catch(e){console.warn('PDF.js Fehler:',e);return null;}
}
// Rekonstruiert die visuelle Lesereihenfolge (oben→unten, links→rechts) aus den PDF-Textfragmenten.
// pdf.js liefert die Items standardmäßig in der Reihenfolge des PDF-Content-Streams — bei mehrspaltigen
// Layouts (z.B. Rechnungskopf mit Adresse links / Belegdaten rechts) entspricht das NICHT der visuellen
// Lesereihenfolge und OHNE Zeilenumbrüche landet der komplette Seiteninhalt als ein einziger Textblock.
// Das verwirrt jede label-basierte Erkennung (Datum, Betrag, Lieferant) massiv.
function pdfLeseReihenfolge(tc){
  const items=(tc.items||[]).filter(it=>it.str!==undefined&&it.str!=='');
  if(!items.length)return '';
  const pos=items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]}));
  const TOLERANZ=3; // px Toleranz für Items auf derselben visuellen Zeile
  const zeilen=[];
  for(const it of pos){
    let zeile=zeilen.find(z=>Math.abs(z.y-it.y)<=TOLERANZ);
    if(!zeile){zeile={y:it.y,items:[]};zeilen.push(zeile);}
    zeile.items.push(it);
  }
  // PDF-Y-Koordinate wächst nach oben → für Lesereihenfolge absteigend sortieren
  zeilen.sort((a,b)=>b.y-a.y);
  return zeilen.map(z=>z.items.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
}
// ── Lokale Analyse (ohne API-Key) ──────────────────────────────────────────────
function analyzeLokal(text,filename){
  const kats=S.profile?.kategorien||DEFAULT_KATS;
  let betrag=0;
  // OCR-Normalisierung: häufige Erkennungsfehler korrigieren
  // Semikolon zwischen Ziffern → Komma (z.B. "15; 22" → "15,22")
  text=text.replace(/(\d)\s*;\s*(\d{2})\b/g,'$1,$2');
  // Leerzeichen zwischen Ziffern vor 2-Stellen → Komma ("15 22" → nur wenn plausibel)
  // Punkt als Tausendertrenner vor Kommazahl schützen
  function parseVal(s){return parseFloat(s.replace(/[\s.]/g,'').replace(',','.'));}
  function allM(re,txt){return[...txt.matchAll(new RegExp(re,'ig'))];}
  const NR='\\d{1,3}(?:[.\\s]\\d{3})*,\\d{2}|\\d{1,6},\\d{2}';

  // ── BETRAG: Strategie mit Prioritäten ─────────────────────────────────────
  // P1: Supermarkt-spezifisch: "HOFER PREIS", "SPAR PREIS", "REWE PREIS" etc.
  //     = tatsächlicher Kassenbetrag NACH allen Rabatten
  // P1: Supermarkt "HOFER PREIS X,XX" - nimm den Wert direkt nach dem Keyword (ersten Treffer)
  //     Wichtig: [^\d]{0,8} kurz halten damit nicht MwSt-Zeile weiter unten matcht
  const superPreisM=allM('(?:hofer|spar|billa|merkur|penny|lidl|aldi|rewe|eurospar|interspar)\\s+preis\\s{0,8}('+NR+')',text);
  if(superPreisM.length){const v=parseVal(superPreisM[0][1]);if(v>0&&v<1000000)betrag=v;}
  // P1b: Auch "HOFER PREIS" gefolgt von Zeile mit EUR-Betrag
  if(!betrag){
    const lines=text.split(/\n/);
    for(let i=0;i<lines.length-1;i++){
      if(/(?:hofer|spar|billa|merkur|penny|lidl|aldi|rewe|eurospar|interspar)\s+preis/i.test(lines[i])){
        // Betrag auf gleicher oder nächster Zeile suchen
        const combined=(lines[i]+'\n'+(lines[i+1]||''));
        const m=combined.match(new RegExp('(\\d{1,6},\\d{2})'));
        if(m){const v=parseVal(m[1]);if(v>0&&v<1000000){betrag=v;break;}}
      }
    }
  }

  // P1c: Generisches Label "Betrag:" als eigenes Feld (typisch bei Telekom-/Energie-/Versicherungsrechnungen,
  //      z.B. "Betrag:                    113,78"). Nicht "MwSt-Betrag"/"USt-Betrag"/"Nettobetrag" (ein Wort davor).
  if(!betrag){
    const lines=text.split(/\n/);
    for(let i=0;i<lines.length;i++){
      const zl=lines[i].trim();
      if(/^betrag\s*:?\s*$/i.test(zl)){
        const next=(lines[i+1]||'').trim();
        const m=next.match(new RegExp('^('+NR+')'));
        if(m){const v=parseVal(m[1]);if(v>0&&v<1000000){betrag=v;break;}}
        continue;
      }
      const m2=zl.match(new RegExp('^betrag\\s*:?\\s+('+NR+')\\s*$','i'));
      if(m2){const v=parseVal(m2[1]);if(v>0&&v<1000000){betrag=v;break;}}
    }
  }

  // P2: Starke Endbetrag-Keywords (nach Rabatten)
  if(!betrag){
    // P2: Starke Endbetrag-Keywords — nur positive Beträge, MwSt-Zeilen ausschließen
    // Zeilen mit negativem Vorzeichen oder MwSt-Kontext überspringen
    const textOhneMwst=text.split(/\n/).filter(z=>{
      const zl=z.toLowerCase();
      // MwSt-Zeilen raus: "MwSt-Satz", "20,00%", "Nettobetr"
      if(/mwst.satz|nettobetr|\d+,00%\s+\d|steuer.satz/i.test(z))return false;
      // Rückgeld-Zeilen raus
      if(/r.ckgeld|wechselgeld|change/i.test(z))return false;
      // Negative Beträge raus (Zeile enthält "-" direkt vor Zahl)
      if(/[-–]\s*\d{1,3},\d{2}/.test(z)&&!/hofer|spar|billa|summe|gesamt|endbetrag|betrag/i.test(z))return false;
      return true;
    }).join('\n');
    const endM=allM('(?:rechnungsendbetrag|gesamtbetrag\\s+inkl|gesamt\\s*inkl|zu\\s+zahlen(?:der\\s+betrag)?|zahlbetrag|endbetrag|total\\s+inkl|betrag\\s+in\\s+eur\\s+inkl|summe\\s+inkl|bar\\s*bezahlt|betrag\\s+eur|betrag\\s+dankend)[^\\d]{0,30}('+NR+')',textOhneMwst);
    if(endM.length){const v=parseVal(endM[endM.length-1][1]);if(v>0&&v<1000000)betrag=v;}
  }

  // P3: Kassabon-Muster: letzter EUR-Betrag vor QR-Code oder Danke-Zeile
  if(!betrag){
    const lines=text.split(/\n/);
    const stopIdx=lines.findIndex(l=>/qr|danke|thank|kassa.?nr|bon.?nr|beleg.?nr|bediener|payback|pavback|punktestand/i.test(l));
    const relevant=(stopIdx>0?lines.slice(0,stopIdx):lines).slice().reverse();
    for(const z of relevant){
      if(/mwst.satz|nettobetr|\d+,00%|r.ckgeld|wechselgeld/i.test(z))continue;
      if(/[-–]\s*\d{1,3},\d{2}/.test(z))continue;
      const m=z.match(new RegExp('('+NR+')\\s*(?:EUR|€)?\\s*$'));
      if(m){const v=parseVal(m[1]);if(v>0&&v<1000000){betrag=v;break;}}
    }
  }

  // P4: Brutto/Gesamt-Keywords
  if(!betrag){
    const bM=allM('(?:gesamtbetrag|bruttobetrag|rechnungsbetrag|summe\\s+brutto|betrag\\s+inkl)[^\\d]{0,30}('+NR+')',text);
    if(bM.length){const v=parseVal(bM[bM.length-1][1]);if(v>0&&v<1000000)betrag=v;}
  }

  // P5: Zeile mit Gesamt/Total/Summe -> kleinsten plausiblen Wert (nach Rabatten)
  if(!betrag){
    const vs=[];
    for(const zeile of text.split(/\n/)){
      const aM=allM('(?:gesamt|total|summe|betrag|brutto|endbetrag)[^\\d]{0,20}('+NR+')',zeile);
      if(!aM.length)continue;
      const alleZahlen=[...zeile.matchAll(new RegExp(NR,'ig'))].map(m=>parseVal(m[0])).filter(v=>v>0&&v<1000000);
      // Nimm kleinsten Wert (= nach Rabatten), nicht größten
      if(alleZahlen.length)vs.push(Math.min(...alleZahlen));
    }
    if(vs.length)betrag=Math.max(...vs);
  }

  // P6: EUR/€ Werte -> letzten plausiblen nehmen
  if(!betrag){
    const eM1=allM('('+NR+')\\s*(?:EUR|€)',text);
    const eM2=allM('(?:EUR|€)\\s*('+NR+')',text);
    const vs=[...eM1,...eM2].map(m=>parseVal(m[1])).filter(v=>v>0&&v<1000000);
    if(vs.length)betrag=vs[vs.length-1]; // letzter Wert (= Endbetrag) statt größter
  }

  // P7: Fallback -> größte Kommazahl
  if(!betrag){
    const vs=[...text.matchAll(new RegExp(NR,'g'))].map(m=>parseVal(m[0])).filter(v=>v>0&&v<1000000);
    if(vs.length)betrag=Math.max(...vs);
  }

  // ── DATUM: Belegdatum bevorzugen ─────────────────────────────────────────
  // WICHTIG: "gefunden"-Status über ein eigenes Flag tracken, NICHT über einen Vergleich
  // mit dem heutigen Datum — sonst hält der Code ein korrekt erkanntes Datum fälschlich für
  // "nicht gefunden", wenn der Beleg zufällig von heute ist, und sucht munter weiter.
  let datum=new Date().toISOString().split('T')[0];
  let datumGefunden=false;
  const MONATSMAP={'januar':1,'jänner':1,'january':1,'jan':1,'februar':2,'february':2,'feb':2,'märz':3,'maerz':3,'march':3,'mar':3,'mär':3,'april':4,'apr':4,'mai':5,'may':5,'juni':6,'june':6,'jun':6,'juli':7,'july':7,'jul':7,'august':8,'aug':8,'september':9,'sep':9,'sept':9,'oktober':10,'october':10,'oct':10,'okt':10,'november':11,'nov':11,'dezember':12,'december':12,'dec':12,'dez':12};
  function expandYear(y){const n=parseInt(y);return n<100?(n<50?2000+n:1900+n):n;}
  function parseDatum(str){
    if(!str)return null;
    // "22. Juli 2026" / "22. JULI 2026" / "22 Juli 26"
    const mL=str.match(/(\d{1,2})\.?\s+([a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df]{3,})\.?\s+(\d{2,4})/);
    if(mL){const mo=MONATSMAP[mL[2].toLowerCase()];if(mo){const y=expandYear(mL[3]);return y+'-'+String(mo).padStart(2,'0')+'-'+mL[1].padStart(2,'0');}}
    // DD.MM.YY oder DD.MM.YYYY - NICHT gefolgt von weiteren Ziffern (Uhrzeit vermeiden)
    const mN=str.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})(?!\d)/);
    if(mN){
      const d=parseInt(mN[1]),mo=parseInt(mN[2]),y=expandYear(mN[3]);
      // Plausibilitätsprüfung: Tag 1-31, Monat 1-12
      if(d>=1&&d<=31&&mo>=1&&mo<=12){return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
    }
    return null;
  }
  const DATUM_PATTERN='\\d{1,2}[.\\-\\/]\\d{1,2}[.\\-\\/]\\d{2,4}|\\d{1,2}\\.?\\s+[a-zA-Z\\u00e4\\u00f6\\u00fc\\u00c4\\u00d6\\u00dc\\u00df]{3,}\\.?\\s+\\d{2,4}';
  // D1a: "Belegdatum" höchste Priorität (eindeutigstes Label auf Rechnungen), Wert muss direkt danach stehen
  const belegdatumM=text.match(new RegExp('belegdatum\\s*:?\\s{0,4}('+DATUM_PATTERN+')','i'));
  if(belegdatumM){const d=parseDatum(belegdatumM[1]);if(d){datum=d;datumGefunden=true;}}
  // D1b: weitere Labels "BEZAHLT AM", "Rechnungsdatum:", "Datum:" etc. — Wert muss direkt danach stehen
  //      (enges Fenster, damit nicht versehentlich ein unabhängiger Zeitraum/Datum weiter hinten im Text matcht)
  if(!datumGefunden){
    const labelRe=new RegExp('(?:bezahlt\\s+am|rechnungsdatum|ausstellungsdatum|datum|vom)\\s*:?\\s{0,4}('+DATUM_PATTERN+')','i');
    const labelM=text.match(labelRe);
    if(labelM){const d=parseDatum(labelM[1]);if(d){datum=d;datumGefunden=true;}}
  }
  // D2: Kassabon — suche in 2. Texthälfte (nach Artikelliste)
  if(!datumGefunden){
    const zeilen=text.split(/\n/);
    const mitte=Math.floor(zeilen.length/2);
    const zweiteHaelfte=zeilen.slice(mitte).join('\n');
    // Erst langen Monatsnamen, dann numerisch
    const d2lang=zweiteHaelfte.match(/\d{1,2}\.?\s+[a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df]{3,}\s+\d{2,4}/);
    const d2num=zweiteHaelfte.match(/\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{2,4}(?!\d)/);
    const d2=parseDatum(d2lang?d2lang[0]:(d2num?d2num[0]:null));
    if(d2){datum=d2;datumGefunden=true;}
  }
  // D3: Ganzes Dokument — alle Datumsformate sammeln, bestes wählen
  if(!datumGefunden){
    const allD=[...text.matchAll(/\d{1,2}\.?\s+[a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df]{3,}\s+\d{2,4}|\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{2,4}(?!\d)/g)];
    // Nimm letztes gültiges Datum (= oft Druck-/Belegdatum am Ende)
    for(let i=allD.length-1;i>=0;i--){const d=parseDatum(allD[i][0]);if(d){datum=d;datumGefunden=true;break;}}
  }

  // ── LIEFERANT: intelligent aus Text extrahieren ───────────────────────────
  function extrahiereLieferant(text, filename){
    const zeilen=text.split(/\n/).map(z=>z.trim());

    // 1) Bekannte Ketten direkt erkennen (Priorität)
    const bekannte=[
      // CWS Hygiene vor der Post-Erkennung prüfen: CWS-Rechnungen erwähnen "Österreichische Post AG"
      // nur beiläufig als Versandart ("Eco Brief") — ohne diese Priorität würde die eigentliche
      // Lieferantin (CWS) fälschlich durch die Post ersetzt.
      {r:/\bcws\s+hygiene\b/i,n:'CWS Hygiene Österreich GmbH'},
      {r:/\bkao\s+austria\b|\bgoldwell\b/i,n:'Kao Austria Handelsgesellschaft mbH (Goldwell)'},
      {r:/\bhofer\b/i,n:'Hofer KG'},
      {r:/\bspar\b/i,n:'SPAR'},
      {r:/\bbilla\b/i,n:'BILLA'},
      {r:/\bmerkur\b/i,n:'Merkur'},
      {r:/\bpenny\b/i,n:'Penny'},
      {r:/\blidl\b/i,n:'Lidl'},
      {r:/\baldi\b/i,n:'Aldi'},
      {r:/\beurospar\b/i,n:'EUROSPAR'},
      {r:/\binterspar\b/i,n:'INTERSPAR'},
      {r:/\bdm\s+drogerie|\bdrogerie\s+markt\b/i,n:'dm Drogerie'},
      {r:/\brossman[n]?\b/i,n:'Rossmann'},
      {r:/\bmüller\b/i,n:'Müller'},
      {r:/\bpost\s+ag|\bpost\.at\b/i,n:'Österreichische Post'},
      {r:/\bwien\s+energie\b/i,n:'Wien Energie'},
      {r:/\baustria\s+email\b/i,n:'Austria Email'},
      {r:/\bscissors|sciss/i,n:'Scissors'},
      {r:/\bwella\b/i,n:'Wella'},
      {r:/l.?or.?al/i,n:"L'Oréal"},
      {r:/\bschwarzkopf\b/i,n:'Schwarzkopf'},
      {r:/\bmagenta\b|\bt-mobile\b/i,n:'Magenta Telekom'},
      {r:/\ba1\s*telekom|\ba1\.net\b/i,n:'A1 Telekom'},
      {r:/\bdrei\b\s*(?:at|austria)?\s*rechnung|\bhutchison\s+drei\b/i,n:'Drei (3)'},
      {r:/\bkelag\b/i,n:'Kelag'},
      {r:/\bevn\b/i,n:'EVN'},
      {r:/\bsvs\b|\bsozialversicherung\s+der\s+selbst/i,n:'SVS'},
    ];
    for(const {r,n} of bekannte){if(r.test(text))return{name:n,sicher:true};}

    // 1b) Generisches Rechnungskopf-Muster "Ihre <Anbieter> Rechnung" (häufig bei Telekom/Energie/Versicherung)
    const titelM=text.match(/ihre\s+([a-zA-ZäöüÄÖÜß0-9&.\-]{2,25})\s+rechnung/i);
    if(titelM)return{name:titelM[1].trim(),sicher:true};

    // 2) Erste nicht-leere Zeile die wie ein Firmenname aussieht
    //    (keine reine Zahl, kein Datum, nicht zu kurz, nicht zu lang)
    const skipRe=/^[\d\s.,€*#\/\-:]+$|^\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{4}|^(quittung|rechnung|kassabon|kassenbon|bon|kassa|beleg|datum|tel|fax|uid|atu|dvr|iban|bic|seite|nummer|rechnungsadresse|wiederholungsdruck)/i;
    for(const z of zeilen.slice(0,8)){
      if(z.length>=3&&z.length<=50&&!skipRe.test(z)&&/[a-zA-ZäöüÄÖÜß]/.test(z)){
        return{name:z,sicher:true};
      }
    }

    // 3) Fallback: Dateiname ohne Endung — UNSICHER, da nur geraten
    return{name:filename.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ').substring(0,50),sicher:false};
  }

  const lieferantErg=extrahiereLieferant(text,filename);
  const lieferant=lieferantErg.name;

  // ── KATEGORIE ─────────────────────────────────────────────────────────────
  const tl=text.toLowerCase();
  let kategorie=kats[kats.length-1].id;
  const katMap=[
    {k:'strom|energie|gas|wasser|heizung',id:'betriebskosten'},
    {k:'loreal|schwarzkopf|wella|einkauf|material|bestellung|farb|produkt|hofer|spar|billa',id:'einkauf'},
    {k:'miete|miet|pacht',id:'betriebskosten'},
    {k:'steuer|finanzamt|sv|sozialversicherung',id:'sonstiges'},
    {k:'gehalt|lohn|personal',id:'personal'},
    {k:'telefon|internet|it|software',id:'sonstiges'},
  ];
  for(const {k,id} of katMap){if(new RegExp(k).test(tl)){const found=kats.find(x=>x.id===id);if(found){kategorie=found.id;break;}}}

  // ── MwSt / Netto: lokale Bestwert-Schätzung (ohne KI) ─────────────────────
  let ust_satz=null,ust_betrag=null,netto=null;
  // USt-Satz: "20% MwSt", "MwSt 20%", "USt-Satz: 20%", "inkl. 20,00% USt", "USt Total (Rechnung) 20 %" (Telekom-Sammelrechnungen),
  // "Mehrwertsteuer 20,000 %" (ausgeschrieben statt abgekürzt, z.T. mit 3 Nachkommastellen, z.B. Lieferantenrechnungen)
  const satzM=text.match(/(\d{1,2}(?:,\d{1,3})?)\s?%\s*(?:mwst|ust|mehrwertsteuer)\b/i)||text.match(/\b(?:mwst|ust|mehrwertsteuer)[-\s]?satz\b[\s.:%-]{0,8}(\d{1,2}(?:,\d{1,3})?)\s?%?/i)||text.match(/\b(?:mwst|ust|mehrwertsteuer)\s*total\b[^%\d]{0,20}(\d{1,2}(?:,\d{1,3})?)\s?%/i)||text.match(/\b(?:mwst|ust|mehrwertsteuer)[\s.:%-]{0,12}(\d{1,2}(?:,\d{1,3})?)\s?%/i);
  if(satzM){const s=Math.round(parseFloat(satzM[1].replace(',','.')));if([0,10,13,20].includes(s))ust_satz=s;}
  // USt-Betrag: "MwSt-Betrag 15,23", "davon USt 15,23", "enthaltene MwSt 15,23", "Gesamte MwSt.: 24,32" (Werkstatt-/Vereinsrechnungen), "USt Total (Rechnung) 20 % 18,96" (Telekom-Sammelrechnungen)
  const ustBetragM=allM('(?:mwst[- ]?betrag|ust[- ]?betrag|mehrwertsteuer[- ]?betrag|davon\\s+(?:mwst|ust|mehrwertsteuer)|(?:enthaltene|gesamte)[nr]?\\s+(?:mwst|ust|mehrwertsteuer)|(?:mwst|ust|mehrwertsteuer)\\s+(?:betrag|von)|(?:mwst|ust|mehrwertsteuer)\\s*total[^%\\d]{0,20}\\d{1,2}(?:,\\d{1,3})?\\s?%)[^\\d]{0,20}('+NR+')',text);
  if(ustBetragM.length){const v=parseVal(ustBetragM[ustBetragM.length-1][1]);if(v>0&&v<100000)ust_betrag=v;}
  // Netto: "Nettobetrag 76,15", "Netto: 76,15", "Summe netto 76,15", "Betrag in EUR exkl. USt. 94,82" (Telekom-Sammelrechnungen),
  // "Summe Positionen 733,50" (Warenrechnungen, Nettosumme vor MwSt-Zeile)
  const nettoM=allM('(?:nettobetrag|netto[- ]?summe|summe\\s+netto|summe\\s+positionen|betrag\\s+netto|betrag\\s+in\\s+eur\\s+exkl\\.?\\s*ust\\.?|summe\\s+exkl\\.?\\s*ust\\.?|\\bnetto)[^\\d]{0,20}('+NR+')',text);
  if(nettoM.length){const v=parseVal(nettoM[nettoM.length-1][1]);if(v>0&&v<1000000)netto=v;}
  // Fehlenden Wert ableiten, sofern der Bruttobetrag bekannt ist
  if(betrag>0){
    if(ust_satz!=null&&netto==null&&ust_betrag==null){
      netto=Math.round((betrag/(1+ust_satz/100))*100)/100;
      ust_betrag=Math.round((betrag-netto)*100)/100;
    }else if(netto!=null&&ust_betrag==null&&netto<=betrag){
      ust_betrag=Math.round((betrag-netto)*100)/100;
    }else if(ust_betrag!=null&&netto==null&&ust_betrag<=betrag){
      netto=Math.round((betrag-ust_betrag)*100)/100;
    }
    // USt-Satz nachträglich aus Netto + USt-Betrag ableiten, falls kein Prozentsatz im Text gefunden wurde
    // (z.B. wenn nur "Gesamte MwSt.: 24,32" ohne eigene %-Angabe im Fließtext steht)
    if(ust_satz==null&&netto!=null&&netto>0&&ust_betrag!=null){
      const abgeleiteterSatz=Math.round((ust_betrag/netto)*100);
      if([0,10,13,20].includes(abgeleiteterSatz))ust_satz=abgeleiteterSatz;
    }
  }

  // ── UID-Nummer des Ausstellers (österr. Format ATUxxxxxxxx) ────────────────
  // Auf vielen Lieferantenrechnungen steht NEBEN der UID des Ausstellers auch die eigene UID der
  // Kundin (z.B. "Kunden USt-IdNr.", "Ihre Steuernr.") — die steht oft weiter oben im Dokument und
  // würde bei einer simplen "ersten Treffer"-Suche fälschlich als Lieferanten-UID übernommen werden.
  // Deshalb Treffer in der Nähe solcher "eigene UID"-Label ausschließen.
  function extrahiereLieferantenUID(txt){
    const alle=[...txt.matchAll(/\bATU\s?\d{8}\b/gi)];
    if(!alle.length)return null;
    const eigeneUidKontext=/(kunden|ihre\s+steuernr|ihre\s+uid|ihre\s+ust[- ]?id|debitor)/i;
    const kandidaten=alle.filter(m=>!eigeneUidKontext.test(txt.substring(Math.max(0,m.index-30),m.index)));
    const treffer=(kandidaten.length?kandidaten:alle)[0];
    return treffer[0].replace(/\s/g,'').toUpperCase();
  }
  const uid_lieferant=extrahiereLieferantenUID(text);

  // ── Rechnungs-/Belegnummer ──────────────────────────────────────────────────
  // Nur Treffer akzeptieren, die auch tatsächlich wie eine Nummer aussehen (mind. 3 Ziffern) —
  // sonst kann bei mehrspaltigen Kopf-/Fußzeilen (z.B. "Beleg-Nr." gefolgt vom Spaltenkopf "Seite"
  // in der nächsten Spalte) versehentlich ein reines Label statt der echten Nummer erfasst werden.
  const rnKandidaten=allM('(?:rechnungs?-?nr\\.?|rechnungsnummer|beleg-?nr\\.?|belegnummer|re-?nr\\.?)\\s*:?\\s*([A-Za-z0-9\\/\\-.]{3,25})',text);
  const rnTreffer=rnKandidaten.find(m=>(m[1].match(/\d/g)||[]).length>=3);
  let rechnungsnummer=rnTreffer?rnTreffer[1].trim():null;
  // Generisches "Nummer/Datum"-Layout (häufig bei Lieferantenrechnungen im SAP-Stil): Label-Zeile
  // "Nummer/Datum", in der Zeile direkt danach "<Rechnungsnummer> / <Datum>"
  if(!rechnungsnummer){
    const zeilen=text.split(/\n/);
    for(let i=0;i<zeilen.length-1;i++){
      if(/^nummer\s*\/\s*datum\s*$/i.test(zeilen[i].trim())){
        const m=zeilen[i+1].trim().match(/^(\d{4,15})\s*\/\s*\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{2,4}/);
        if(m){rechnungsnummer=m[1];break;}
      }
    }
  }

  // ── Vorsteuer & Steuer-Ampel: einfache Plausibilitätsprüfung ────────────────
  // (österr. Kleinbetragsrechnung bis 400€ inkl. USt: vereinfachte Angaben reichen,
  // keine Ausstellerin-UID nötig; darüber braucht es UID + Rechnungsnummer für den
  // vollen Vorsteuerabzug)
  const KLEINBETRAG=400;
  const hatUst=ust_satz!=null||ust_betrag!=null;
  let vorsteuer_moeglich='unklar';
  if(ust_satz===0){
    vorsteuer_moeglich='nein';
  }else if(hatUst&&(uid_lieferant||betrag<=KLEINBETRAG)){
    vorsteuer_moeglich='ja';
  }else if(!hatUst&&betrag>0){
    vorsteuer_moeglich='unklar';
  }

  let steuer_ampel='gelb';
  // Grün nur, wenn wirklich alles Wesentliche erkannt wurde — inkl. USt-Info (sonst zu optimistisch)
  const vollstaendigGenug=betrag>0&&datumGefunden&&lieferantErg.sicher&&hatUst&&(uid_lieferant||betrag<=KLEINBETRAG);
  const kritischeLuecke=betrag<=0||!lieferantErg.sicher||(betrag>KLEINBETRAG&&!uid_lieferant&&!hatUst);
  if(vollstaendigGenug){
    steuer_ampel='gruen';
  }else if(kritischeLuecke){
    steuer_ampel='rot';
  }

  return{datum,betrag,netto,ust_betrag,ust_satz,art:'ausgabe',lieferant:lieferant.substring(0,60),uid_lieferant,rechnungsnummer,vorsteuer_moeglich,steuer_ampel,kategorie,beschreibung:filename.replace(/\.[^.]+$/,'').substring(0,60)};
}

Regeln:

- betrieblicher_anteil: Prozentzahl (z.B. 50) nur wenn betrieblich="gemischt", sonst null
- vorsteuer_moeglich: "ja" wenn Rechnung mit USt-Ausweis und betriebliche Nutzung, "nein" wenn Kassabon ohne UID-Ausweis oder eindeutig privat, "unklar" wenn nicht sicher beurteilbar
- ist_anlage: true wenn Einzelwert voraussichtlich über 1000 EUR und längerfristig nutzbar (Geräte, Maschinen, Einrichtung), sonst false
- ki_confidence: Gesamtsicherheit für diesen Beleg von 0.00 bis 1.00 (1.00 = alle Felder eindeutig erkannt)
- steuer_ampel: "gruen" wenn Rechnung vollständig und steuerlich klar, "gelb" wenn Felder fehlen oder Beurteilung unsicher, "rot" wenn wichtige Pflichtangaben fehlen oder steuerlich problematisch

Datei: ${filename}
Belegtext:
${text.substring(0,3000)}`;

  const r=await fetch(SB_URL+'/functions/v1/rapid-function',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
  if(!r.ok){const e=await r.json();console.error('Claude API Fehler:',e);throw new Error(e.error?.message||'API Fehler');}

// ── Steuertipps (unverbindliche Diskussionspunkte fürs Steuerberater-Gespräch) ─
// Aggregiert NUR Summen/Zählungen aus den bereits im Browser geladenen Belegen (S.belege) —
// dafür ist kein zusätzlicher Datenbank-Zugriff nötig, es werden keine Einzelbelege an eine
// KI geschickt, sondern höchstens anonymisierte Kennzahlen (falls ein API-Key hinterlegt ist).
function berechneTippsKontext(){
  const heute=new Date();
  const zwoelfMonateAb=new Date(heute.getFullYear(),heute.getMonth()-11,1);
  function relevantMonat(m){
    if(!m)return false;
    const teile=m.split('-');
    const d=new Date(parseInt(teile[0]),parseInt(teile[1])-1,1);
    return d>=zwoelfMonateAb;
  }
  const belegeRelevant=(S.belege||[]).filter(b=>relevantMonat(b.monat));
  const kats=S.profile?.kategorien||DEFAULT_KATS;
  const katSummen=kats.map(k=>({label:k.label,summe:belegeRelevant.filter(b=>b.kategorie===k.id&&b.art==='ausgabe').reduce((s,b)=>s+(b.betrag||0),0)})).filter(k=>k.summe>0).sort((a,b)=>b.summe-a.summe);
  const rotCount=belegeRelevant.filter(b=>b.steuer_ampel==='rot').length;
  const gelbCount=belegeRelevant.filter(b=>b.steuer_ampel==='gelb').length;
  const vorsteuerUnklarCount=belegeRelevant.filter(b=>b.vorsteuer_moeglich==='unklar').length;
  const gwgKandidaten=belegeRelevant.filter(b=>b.art==='ausgabe'&&(b.betrag||0)>=400&&(b.betrag||0)<=1500&&!b.ist_anlage);
  const grossAnschaffungen=belegeRelevant.filter(b=>b.art==='ausgabe'&&((b.betrag||0)>=1500||b.ist_anlage));
  const bewirtung=belegeRelevant.filter(b=>/bewirt|restaurant|gasthaus|caf[eé]|kaffeehaus/i.test(((b.beschreibung||'')+' '+(b.lieferant||''))));
  const gesamtAusgaben=belegeRelevant.filter(b=>b.art==='ausgabe').reduce((s,b)=>s+(b.betrag||0),0);
  return{
    anzahlBelege:belegeRelevant.length,
    gesamtAusgaben,katSummen,rotCount,gelbCount,vorsteuerUnklarCount,
    gwgAnzahl:gwgKandidaten.length,
    grossAnschaffungenAnzahl:grossAnschaffungen.length,
    bewirtungAnzahl:bewirtung.length,
    aktuellerMonat:heute.getMonth()+1,
    aktuellesJahr:heute.getFullYear(),
  };
}
async function generiereTippsKI(ctx){
  const prompt=`Du bist eine sachkundige, aber vorsichtige Sparringspartnerin für steuerliche Optimierung in Österreich — speziell für Einzelunternehmerinnen mit Einnahmen-Ausgaben-Rechnung (EÄR), die mindestens eine angestellte Person beschäftigen (Beispiel: Friseursalon). Dein Ziel: der Nutzerin helfen, proaktiv die richtigen Fragen zu stellen, bevor sie mit ihrer Steuerberatung spricht — nicht, die Steuerberatung zu ersetzen.

WICHTIGE REGELN (nicht verhandelbar):
- Du bist KEIN Ersatz für die Steuerberatung. Jeder Tipp ist ein Diskussionspunkt fürs Gespräch mit der Steuerberatung, keine verbindliche Aussage.

// ── Tesseract OCR für Bilder ──────────────────────────────────────────────────
function rotateBildCanvas(img,deg){
  const c=document.createElement('canvas');
  const swap=deg===90||deg===270;
  c.width=swap?img.height:img.width;
  c.height=swap?img.width:img.height;
  const ctx=c.getContext('2d');
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(img,-img.width/2,-img.height/2);
  return c;
}
function loadImg(url){
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
}
function vorverarbeiteCanvas(src){
  const c=document.createElement('canvas');
  c.width=src.width||src.naturalWidth;
  c.height=src.height||src.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.filter='grayscale(1) contrast(1.6) brightness(1.1)';
  ctx.drawImage(src,0,0,c.width,c.height);
  return c;
}
async function ocrCanvas(canvas){
  const result=await Tesseract.recognize(canvas,'deu',{logger:()=>{}});
  return result?.data?.text||null;
}
function ocrScore(t){
  if(!t||t.trim().length<20)return 0;
  let s=0;
  if(/\d,\d{2}/.test(t))s+=3;
  if(/€|eur/i.test(t))s+=2;
  if(/\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{2,4}/.test(t))s+=3;
  if(/\b(januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember|jänner)\b/i.test(t))s+=4;
  if(/\b(endbetrag|gesamtbetrag|summe|bezahlt|rechnung|quittung|hofer|spar|billa|scissors)\b/i.test(t))s+=4;
  if(/\b(atu|uid|steuer|mwst)\b/i.test(t))s+=2;
  s+=Math.min(t.trim().length/100,3);
  return s;
}
async function ocrBild(file){
  try{
    if(typeof Tesseract==='undefined')return null;
    const url=URL.createObjectURL(file);
    const img=await loadImg(url);
    URL.revokeObjectURL(url);
    const basis=document.createElement('canvas');
    basis.width=img.width;basis.height=img.height;
    basis.getContext('2d').drawImage(img,0,0);
    const varianten=[
      vorverarbeiteCanvas(basis),
      vorverarbeiteCanvas(rotateBildCanvas(img,90)),
      vorverarbeiteCanvas(rotateBildCanvas(img,270)),
      vorverarbeiteCanvas(rotateBildCanvas(img,180)),
    ];
    const texte=await Promise.all(varianten.map(c=>ocrCanvas(c).catch(()=>null)));
    let besterText=null,besterScore=-1;
    for(const t of texte){
      const sc=ocrScore(t);
      if(sc>besterScore){besterScore=sc;besterText=t;}
    }
    if(!besterText||besterScore===0){
      besterText=texte.filter(Boolean).sort((a,b)=>b.length-a.length)[0]||null;
    }
    return besterText;
  }catch(e){console.warn('OCR Fehler:',e);return null;}
}

async function verarbeiteFile(file){
  S.loading=true;render();
  try{
    let text=file.name;
    if(file.type==='text/plain')text=await file.text();
    else if(file.type==='application/pdf'){
      const pdfText=await extractPdfText(file);
      text=pdfText||('PDF: '+file.name);
    }
    else if(file.type.startsWith('image/')){
      const ocrText=await ocrBild(file);
      text=ocrText&&ocrText.trim().length>20?ocrText:('Bild: '+file.name);
    }
    // Storage Upload immer zuerst, unabhängig vom API-Key
    let datei_url=null;
    try{
      const pfad=S.userId+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const upR=await fetch(SB_URL+'/storage/v1/object/belege/'+pfad,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+S.token,'Content-Type':file.type||'application/octet-stream'},body:file});
      if(upR.ok){datei_url=SB_URL+'/storage/v1/object/belege/'+pfad;}
    }catch(e){console.warn('Storage Upload fehlgeschlagen:',e);}
    // QR-Code-Zeilen entfernen: österr. Registrierkassen-QR enthält "_R1-AT0_" etc.
    // Diese Zeilen verwirren die Betragserkennung (enthalten Zahlen wie 14,97)
    function bereinigeFuerAnalyse(t){
      return t.split(/\n/).filter(z=>{
        const s=z.trim();
        // Zeilen mit typischen QR/Barcode-Mustern überspringen
        if(/^_R[0-9]-/.test(s))return false;           // "_R1-AT0_..."
        if(/AT0_\d+\/\d+/.test(s))return false;        // "AT0_633/006_003-..."
        if(/T\d{2}:\d{2}:\d{2}MSR/.test(s))return false; // Timestamp+MSR
        if(/[A-Za-z0-9+\/]{30,}={0,2}$/.test(s)&&!/[äöüÄÖÜ\s,]/.test(s))return false; // Base64
        if((s.match(/[A-Z0-9]/g)||[]).length>s.length*0.7&&s.length>20&&!/[äöü,\s]/.test(s))return false; // zu viele Großbuchstaben/Zahlen ohne Leerzeichen
        return true;
      }).join('\n');
    }
    const textBereinigt=bereinigeFuerAnalyse(text);
    let res,quelle='ki',kiFehler=null;
    try{res=await analyzeClaude(textBereinigt,file.name);}
    catch(e){
      // Kein API-Key oder Fehler → lokale Analyse aus PDF-Text
      quelle='lokal';
      kiFehler=(e&&e.message==='kein_key')?'Kein API-Key hinterlegt':((e&&e.message)||'Unbekannter Fehler bei der KI-Erkennung');
      console.warn('KI-Erkennung fehlgeschlagen, nutze lokale Analyse:',kiFehler);
      res=analyzeLokal(textBereinigt,file.name);
    }
    const kats=S.profile?.kategorien||DEFAULT_KATS;
    // Prüfansicht öffnen statt sofort speichern
    if(S.pruef&&S.pruef.localUrl)URL.revokeObjectURL(S.pruef.localUrl);
    S.pruef={
      res:{
        datum:res.datum||new Date().toISOString().split('T')[0],
        betrag:res.betrag||0,
        netto:res.netto||null,
        ust_betrag:res.ust_betrag||null,
        ust_satz:res.ust_satz||null,
        lieferant:res.lieferant||'',
        uid_lieferant:res.uid_lieferant||null,
        rechnungsnummer:res.rechnungsnummer||null,
        art:res.art||'ausgabe',
        kategorie:res.kategorie||kats[0].id,
        beschreibung:res.beschreibung||file.name,
        betrieblich:res.betrieblich||'ja',
        betrieblicher_anteil:res.betrieblicher_anteil||null,
        vorsteuer_moeglich:res.vorsteuer_moeglich||'unklar',
        ist_anlage:res.ist_anlage||false,
        ki_confidence:res.ki_confidence||null,
        steuer_ampel:res.steuer_ampel||'gelb',
      },
      dateiname:file.name,
      pdfText:text,
      ocrRaw:text,
      fileType:file.type,
      localUrl:URL.createObjectURL(file),
      datei_url,
      quelle,
      kiFehler
    };
  }catch(e){toast('Fehler: '+e.message,'err');}
  S.loading=false;render();
}

// Verarbeitet mehrere Dateien sequenziell und zeigt Fortschritt.
// Bei Einzeldatei: direkt in Prüfansicht (wie bisher).
// Bei mehreren Dateien: alle automatisch speichern, Ergebnis-Zusammenfassung.
async function verarbeiteFileBulk(files){
  if(!files||!files.length)return;
  if(files.length===1){await verarbeiteFile(files[0]);return;}

  // Bulk-Modus: alle Dateien automatisch analysieren und speichern (ohne Prüf-Modal)
  S.bulkModus=true;
  S.bulkQueue=[...files];
  S.bulkTotal=files.length;
  S.bulkDone=0;
  S.bulkFehler=[];
  S.loading=true;
  render();

  for(const file of files){
    try{
      let text=file.name;
      if(file.type==='text/plain')text=await file.text();
      else if(file.type==='application/pdf'){
        const pdfText=await extractPdfText(file);
        text=pdfText||('PDF: '+file.name);
      }else if(file.type.startsWith('image/')){
        const ocrText=await ocrBild(file);
        text=ocrText&&ocrText.trim().length>20?ocrText:('Bild: '+file.name);
      }
      // Storage Upload
      let datei_url=null;
      try{
        const pfad=S.userId+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const upR=await fetch(SB_URL+'/storage/v1/object/belege/'+pfad,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+S.token,'Content-Type':file.type||'application/octet-stream'},body:file});
        if(upR.ok)datei_url=SB_URL+'/storage/v1/object/belege/'+pfad;
      }catch(e){console.warn('Storage Upload fehlgeschlagen:',e);}
      // QR-Code-Bereinigung (gleich wie in verarbeiteFile)
      function bereinige(t){return t.split(/\n/).filter(z=>{const s=z.trim();if(/^_R[0-9]-/.test(s))return false;if(/AT0_\d+\/\d+/.test(s))return false;if(/T\d{2}:\d{2}:\d{2}MSR/.test(s))return false;if(/[A-Za-z0-9+\/]{30,}={0,2}$/.test(s)&&!/[äöüÄÖÜ\s,]/.test(s))return false;if((s.match(/[A-Z0-9]/g)||[]).length>s.length*0.7&&s.length>20&&!/[äöü,\s]/.test(s))return false;return true;}).join('\n');}
      const textB=bereinige(text);
      let res;
      try{res=await analyzeClaude(textB,file.name);}
      catch(e){res=analyzeLokal(textB,file.name);}
      const kats=S.profile?.kategorien||DEFAULT_KATS;
      const datum=res.datum||new Date().toISOString().split('T')[0];
      const monat=datum.substring(0,7);
      const betrag=parseFloat(res.betrag)||0;
      if(betrag>0){
        await insertBeleg({
          datum,betrag,netto:res.netto||null,ust_betrag:res.ust_betrag||null,ust_satz:res.ust_satz||null,
          art:res.art||'ausgabe',lieferant:(res.lieferant||'').substring(0,60),
          uid_lieferant:res.uid_lieferant||null,rechnungsnummer:res.rechnungsnummer||null,
          kategorie:res.kategorie||kats[0].id,beschreibung:(res.beschreibung||file.name).substring(0,60),
          monat,dateiname:file.name,datei_url,
          betrieblich:res.betrieblich||'ja',betrieblicher_anteil:res.betrieblicher_anteil||null,
          vorsteuer_moeglich:res.vorsteuer_moeglich||'unklar',ist_anlage:res.ist_anlage||false,
          ki_confidence:res.ki_confidence||null,steuer_ampel:res.steuer_ampel||'gelb',
        });
      }else{
        S.bulkFehler.push(file.name+' (Betrag nicht erkannt)');
      }
    }catch(e){
      S.bulkFehler.push(file.name+' ('+e.message+')');
    }
    S.bulkDone++;
    render();
  }

  // Abschluss
  S.loading=false;
  S.bulkModus=false;
  await loadBelege();
  const ok=S.bulkTotal-S.bulkFehler.length;
  toast(ok+' von '+S.bulkTotal+' Belegen gespeichert'+(S.bulkFehler.length?' · '+S.bulkFehler.length+' fehlgeschlagen':'')+(S.bulkFehler.length?'':'  ✓'));
  S.bulkQueue=[];S.ansicht='belege';
  render();
}

    b.datum||'',
    csvClean(b.lieferant),
    csvClean(b.beschreibung),

    (b.betrag||0).toFixed(2).replace('.',',') // Komma fuer oesterr. Excel/BMD
  ].join(';')).join('\n');
  // UTF-8 BOM damit BMD/Excel Umlaute korrekt liest
  const bom='\uFEFF';
  const blob=new Blob([bom+kopf+z],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);

function exportAbschlussCSV(){
  const bfm=S.belege.filter(b=>b.monat===S.monat);
  if(!bfm.length){toast('Keine Belege in diesem Monat','err');return;}
  const kats=S.profile?.kategorien||DEFAULT_KATS;
  const kopf='Datum;Lieferant;Beschreibung;Kategorie;Art;Brutto (EUR);Netto (EUR);MwSt (EUR)\n';
  const zeilen=bfm.map(b=>{
    const brutto=b.betrag||0;
    const netto=b.art==='ausgabe'?brutto/1.2:brutto;
    const mwst=b.art==='ausgabe'?brutto-netto:0;
    const kat=kats.find(k=>k.id===b.kategorie);
    return [
      b.datum||'',
      csvClean(b.lieferant||''),
      csvClean(b.beschreibung||''),
      csvClean(kat?kat.label:b.kategorie||''),
      b.art==='ausgabe'?'Ausgabe':'Einnahme',
      brutto.toFixed(2).replace('.',','),
      netto.toFixed(2).replace('.',','),
      mwst.toFixed(2).replace('.',',')
    ].join(';');
  }).join('\n');
  // Zusammenfassung
  const sumBrutto=bfm.filter(b=>b.art==='ausgabe').reduce((s,b)=>s+(b.betrag||0),0);
  const sumNetto=sumBrutto/1.2;
  const sumMwSt=sumBrutto-sumNetto;
  const zusammen='\n;;GESAMT AUSGABEN;;Ausgabe;'+sumBrutto.toFixed(2).replace('.',',')+';'+sumNetto.toFixed(2).replace('.',',')+';'+sumMwSt.toFixed(2).replace('.',',');
  const bom='\uFEFF';
  const blob=new Blob([bom+kopf+zeilen+zusammen],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Steuerberater_'+mL(S.monat).replace(' ','_')+'.csv';
  a.click();
  toast('CSV exportiert ✓');
}

function pruefNichtRechnung(text,filename){
  const tl=(text+' '+filename).toLowerCase();
  const signale=[
    'zahlungsavis','avis','mahnung','mahnschreiben','zahlungserinnerung',
    'lieferschein','lieferung','bestellbestaetigung','bestellbestätigung',
    'auftragsbestaetigung','auftragsbestätigung','proforma','angebot',
    'kostenvoranschlag','gutschrift ohne steuer','versandbestaetigung',
    'versandbestätigung','packing list','delivery note'
  ];
  return signale.some(s=>tl.includes(s));
}
function pruefDublette(lieferant,datum,betrag,dateiname){
  const belege=S.belege||[];
  const b=parseFloat(betrag)||0;
  const lio=(lieferant||'').toLowerCase().substring(0,20);
  return belege.find(x=>{
    const xl=(x.lieferant||'').toLowerCase().substring(0,20);
    const xb=parseFloat(x.betrag)||0;
    const datumMatch=x.datum===datum;
    const betragMatch=b>0&&xb>0&&Math.abs(b-xb)<0.02;
    const liefMatch=lio.length>3&&xl.includes(lio.substring(0,10));
    const dateiMatch=dateiname&&x.beschreibung&&(
      x.beschreibung.toLowerCase().includes(dateiname.toLowerCase().replace(/\.[^.]+$/,'').substring(0,15))
    );
    return (datumMatch&&betragMatch&&liefMatch)||(dateiMatch&&betragMatch);
  });
}

// PDF-Canvas Viewer
let _pruefPdf=null,_pruefPage=1;
async function pruefRenderCanvas(url){
  if(!window.pdfjsLib)return;
  try{
    const ab=await (await fetch(url)).arrayBuffer();
    _pruefPdf=await pdfjsLib.getDocument({data:ab}).promise;
    _pruefPage=1;
    await pruefDrawPage();
  }catch(e){console.warn('PDF canvas Fehler:',e);}
}
async function pruefDrawPage(){
  if(!_pruefPdf)return;
  const canvas=document.getElementById('pruef-pdf-canvas');
  if(!canvas)return;
  const page=await _pruefPdf.getPage(_pruefPage);
  const wrap=document.getElementById('pruef-pdf-wrap');
  const w=wrap?wrap.clientWidth:300;
  const dpr=window.devicePixelRatio||1;
  const vpFull=page.getViewport({scale:1});
  // Rendere auf volle Breite des Containers, scharf (dpr-skaliert)
  const scale=(w/vpFull.width)*dpr;
  const vp=page.getViewport({scale});
  // Canvas native Größe = scharf
  canvas.width=vp.width;canvas.height=vp.height;
  // CSS-Darstellung = Containerbreite, Höhe proportional
  canvas.style.width=w+'px';canvas.style.height=(vp.height/dpr)+'px';
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const info=document.getElementById('pruef-pdf-info');
  if(info)info.textContent=_pruefPage+' / '+_pruefPdf.numPages;
}
async function pruefPdfPage(dir){
  if(!_pruefPdf)return;
  const next=_pruefPage+dir;
  if(next<1||next>_pruefPdf.numPages)return;
  _pruefPage=next;
  await pruefDrawPage();
}

      +'<div class="grid2"><div class="card" style="margin-bottom:0"><div class="stat-label">Ausgaben</div><div class="stat-value" style="color:var(--red)">'+eur(ausg)+'</div><div class="stat-sub">'+bfm.filter(b=>b.art==='ausgabe').length+' Belege</div></div><div class="card" style="margin-bottom:0"><div class="stat-label">Einnahmen</div><div class="stat-value" style="color:var(--green)">'+eur(einn)+'</div><div class="stat-sub">'+bfm.filter(b=>b.art==='einnahme').length+' Belege</div></div></div>'
      +(katS.length?'<div class="card"><div class="section-title">Ausgaben nach Kategorie</div>'+bars+'</div>':'')
      +(bfm.length===0?'<div class="empty"><div class="empty-icon">📂</div><div style="font-size:14px">Noch keine Belege für<br><strong>'+mL(S.monat)+'</strong>.</div><button class="btn-primary" style="margin-top:16px;width:auto;padding:10px 24px" onclick="S.ansicht=\'neu\';render()">Ersten Beleg erfassen</button></div>':'')
      +(bfm.length?'<button class="btn-primary" onclick="exportCSV()">📤 Als BMD-CSV herunterladen</button>':'');
  }

  else if(ansicht==='belege'){
    const items=bfm.map(b=>{
      const k=kk(b.kategorie);
      if(String(S.editId)===String(b.id)){
        const eO=kats.map(k=>'<option value="'+k.id+'"'+(k.id===S.editData.kategorie?' selected':'')+'>'+k.icon+' '+k.label+'</option>').join('');
        return'<div class="beleg-item"><div class="edit-form"><input class="inp" type="date" value="'+(S.editData.datum||'')+'" onchange="S.editData.datum=this.value"/><input class="inp" placeholder="Lieferant" value="'+(S.editData.lieferant||'')+'" oninput="S.editData.lieferant=this.value"/><input class="inp" placeholder="Beschreibung" value="'+(S.editData.beschreibung||'')+'" oninput="S.editData.beschreibung=this.value"/><div class="form-row"><input class="inp" placeholder="Betrag" value="'+(S.editData.betrag||'')+'" oninput="S.editData.betrag=this.value" style="flex:1"/><select class="inp" onchange="S.editData.art=this.value" style="flex:1"><option value="ausgabe"'+(S.editData.art==='ausgabe'?' selected':'')+'>Ausgabe</option><option value="einnahme"'+(S.editData.art==='einnahme'?' selected':'')+'>Einnahme</option></select></div><select class="inp" onchange="S.editData.kategorie=this.value">'+eO+'</select><div class="edit-actions"><button class="btn-save" onclick="doEdit()">Speichern</button><button class="btn-cancel" onclick="S.editId=null;render()">Abbrechen</button></div></div></div>';

      return'<div class="beleg-item"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div><span class="beleg-tag" style="background:#7C6B8A1A;color:#7C6B8A">'+(k?.icon||'📦')+' '+(k?.label||'')+'</span><span style="font-size:10px;color:var(--ink3);margin-left:4px">'+b.datum+'</span></div><div class="beleg-name">'+(b.lieferant||'—')+'</div><div class="beleg-desc">'+(b.beschreibung||'')+'</div></div><div class="beleg-amount" style="color:'+(b.art==='ausgabe'?'var(--red)':'var(--green)')+'">'+(b.art==='ausgabe'?'−':'+')+eur(b.betrag||0)+'</div></div><div class="beleg-actions"><button class="btn-sm btn-edit" onclick="S.editId=\''+b.id+'\';S.editData=Object.assign({},S.belege.find(x=>x.id===\''+b.id+'\'));render()">✏️ Bearbeiten</button><button class="btn-sm btn-del" onclick="if(confirm(\'Löschen?\'))deleteBelegDB(\''+b.id+'\').then(()=>render()).catch(e=>toast(\'Fehler: \'+e.message,\'err\'))">🗑️ Löschen</button></div></div>';
    }).join('');
    inhalt='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-size:13px;color:var(--ink3)">'+bfm.length+' Belege · '+mL(S.monat)+'</div>'+(bfm.length?'<button class="btn-outline" onclick="exportCSV()">📤 BMD-CSV</button>':'')+'</div>'+(bfm.length===0?'<div class="empty"><div class="empty-icon">🗂️</div><div style="font-size:14px">Keine Belege in diesem Monat.</div></div>':items);

  else if(ansicht==='neu'){
    const keySec=S.showKeyInput||!S.apiKey

      :'<div class="key-section"><span style="font-size:12px;color:var(--accent);font-weight:500">🔑 API-Key hinterlegt</span><button onclick="S.showKeyInput=true;render()" style="background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer">ändern</button></div>';
    const mO=kats.map(k=>'<option value="'+k.id+'"'+(S.manuell.kategorie===k.id?' selected':'')+'>'+k.icon+' '+k.label+'</option>').join('');
    inhalt=keySec
      +(S.loading&&S.bulkModus
        // Bulk-Fortschrittsanzeige
        ?'<div class="card" style="margin-bottom:12px">'
          +'<div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px">📦 Bulk-Upload läuft…</div>'
          +'<div style="font-size:12px;color:var(--ink2);margin-bottom:10px">'+S.bulkDone+' von '+S.bulkTotal+' Belegen verarbeitet</div>'
          +'<div style="background:#E8E0EF;border-radius:6px;height:8px;overflow:hidden">'
            +'<div style="background:var(--accent);height:8px;border-radius:6px;transition:width 0.3s;width:'+(S.bulkTotal>0?Math.round(S.bulkDone/S.bulkTotal*100):0)+'%"></div>'
          +'</div>'
          +(S.bulkFehler.length?'<div style="font-size:11px;color:var(--red);margin-top:8px">⚠️ Fehler: '+S.bulkFehler.join(', ')+'</div>':'')
        +'</div>'
        :(S.loading?'<div class="analyzing"><div class="analyzing-dot"></div><span style="font-size:13px;color:var(--accent);font-weight:500">Beleg wird analysiert…</span></div>':''))
      +(S.loading
        ?'<div class="upload-zone"><div style="font-size:32px;margin-bottom:8px">⏳</div><div style="font-size:14px;font-weight:600;color:var(--accent)">'+(S.bulkModus?S.bulkDone+' / '+S.bulkTotal+' verarbeitet…':'Wird analysiert…')+'</div>'+(S.bulkModus?'<div style="font-size:11px;color:var(--ink3);margin-top:4px">Bitte warten — Belege werden automatisch gespeichert</div>':'')+'</div>'
        :'<div style="display:flex;gap:10px;margin-bottom:0">'
         +'<div class="upload-zone" style="flex:1;min-height:90px" onclick="document.getElementById(\'fi\').click()"><div style="font-size:26px;margin-bottom:4px">📎</div><div style="font-size:13px;font-weight:600;color:var(--accent)">Hochladen</div><div style="font-size:11px;color:var(--ink3);margin-top:2px">PDF, Foto oder mehrere</div></div>'
         +'<div class="upload-zone" style="flex:1;min-height:90px;border-color:var(--accent);background:#F3F0F8" onclick="document.getElementById(\'fic\').click()"><div style="font-size:26px;margin-bottom:4px">📷</div><div style="font-size:13px;font-weight:600;color:var(--accent)">Scannen</div><div style="font-size:11px;color:var(--ink3);margin-top:2px">Kamera öffnen</div></div>'
         +'</div>')
      +'<input type="file" id="fi" accept=".pdf,image/*,.txt" multiple style="display:none" onchange="verarbeiteFileBulk(Array.from(this.files));this.value=\'\'"/>'
      +'<input type="file" id="fic" accept="image/*" capture="environment" style="display:none" onchange="verarbeiteFileBulk(Array.from(this.files));this.value=\'\'"/>'
      +'<div class="card"><div class="section-title">Oder manuell eingeben</div><div class="form-group"><input class="inp" id="manuell-datum" type="date" value="'+S.manuell.datum+'" onchange="S.manuell.datum=this.value"/><input class="inp" id="manuell-lieferant" placeholder="Lieferant" value="'+S.manuell.lieferant+'" oninput="S.manuell.lieferant=this.value"/><input class="inp" id="manuell-beschreibung" placeholder="Beschreibung *" value="'+S.manuell.beschreibung+'" oninput="S.manuell.beschreibung=this.value"/><div class="form-row"><input class="inp" id="manuell-betrag" placeholder="Betrag *" inputmode="decimal" value="'+S.manuell.betrag+'" oninput="S.manuell.betrag=this.value" style="flex:1"/><select class="inp" id="manuell-art" onchange="S.manuell.art=this.value" style="flex:1"><option value="ausgabe">Ausgabe</option><option value="einnahme">Einnahme</option></select></div><select class="inp" id="manuell-kategorie" onchange="S.manuell.kategorie=this.value">'+mO+'</select><button class="btn-primary" onclick="doManuell()">Beleg speichern</button></div></div>';
  }

  else if(ansicht==='tipps'){
    const datumFmt=S.tippsDatum?new Date(S.tippsDatum).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):null;
    const cards=(S.tipps?.tipps||[]).map(t=>'<div class="card"><div style="font-size:14px;font-weight:700;color:var(--accent);margin-bottom:6px">💡 '+t.titel+'</div><div style="font-size:13px;color:var(--ink2);line-height:1.5">'+t.text+'</div></div>').join('');
    inhalt='<div class="card" style="background:#F0EAF4"><div style="font-size:13px;color:var(--ink2);line-height:1.5">Unverbindliche Steuerspar-Impulse auf Basis deiner letzten 12 Monate — als Gesprächsgrundlage für deine Steuerberatung, keine Buchhaltung oder Steuerberatung.</div></div>'
      +(S.tippsLoading?'<div class="analyzing"><div class="analyzing-dot"></div><span style="font-size:13px;color:var(--accent);font-weight:500">Tipps werden erstellt…</span></div>':'')
      +(cards?cards:(S.tippsLoading?'':'<div class="empty"><div class="empty-icon">💡</div><div style="font-size:14px">Noch keine Tipps erstellt.</div></div>'))
      +(S.tipps?.hinweis?'<div style="font-size:11px;color:var(--ink3);margin:10px 0;line-height:1.5">ℹ️ '+S.tipps.hinweis+'</div>':'')
      +(datumFmt?'<div style="font-size:11px;color:var(--ink3);margin-bottom:10px">Zuletzt aktualisiert: '+datumFmt+' Uhr</div>':'')
      +'<button class="btn-primary" '+(S.tippsLoading?'disabled style="opacity:0.5"':'')+' onclick="generiereTipps()">'+(S.tipps?'🔄 Tipps neu erstellen':'💡 Tipps erstellen')+'</button>';
  }

  else if(ansicht==='abschluss'){
    const bfm=S.belege.filter(b=>b.monat===S.monat);
    const kats=S.profile?.kategorien||DEFAULT_KATS;
    const ausgaben=bfm.filter(b=>b.art==='ausgabe');
    const einnahmen=bfm.filter(b=>b.art==='einnahme');
    const sumAusgaben=ausgaben.reduce((s,b)=>s+(b.betrag||0),0);
    const sumEinnahmen=einnahmen.reduce((s,b)=>s+(b.betrag||0),0);
    const netto=sumAusgaben/1.2;
    const mwst=sumAusgaben-netto;

    // Kategorien-Summen
    const katSummen={};
    ausgaben.forEach(b=>{
      const k=b.kategorie||'sonstige';
      katSummen[k]=(katSummen[k]||0)+(b.betrag||0);
    });
    const katRows=Object.entries(katSummen).sort((a,b)=>b[1]-a[1]).map(([kid,sum])=>{
      const k=kats.find(x=>x.id===kid)||{icon:'📦',label:kid};
      const pct=sumAusgaben>0?Math.round(sum/sumAusgaben*100):0;
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
        +'<span style="font-size:18px">'+k.icon+'</span>'
        +'<div style="flex:1">'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
            +'<span style="font-size:13px;font-weight:600">'+k.label+'</span>'
            +'<span style="font-size:13px;font-weight:700">'+sum.toFixed(2).replace('.',',')+'&nbsp;€</span>'
          +'</div>'
          +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--accent)"></div></div>'
        +'</div>'
      +'</div>';
    }).join('');

    inhalt='<div class="card"><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Monatsabschluss · '+mL(S.monat)+'</div>'
      +'<div class="grid2">'
        +'<div><div class="stat-label">Ausgaben gesamt</div><div class="stat-value" style="color:var(--red)">'+sumAusgaben.toFixed(2).replace('.',',')+'&nbsp;€</div></div>'
        +'<div><div class="stat-label">Einnahmen gesamt</div><div class="stat-value" style="color:var(--green)">'+sumEinnahmen.toFixed(2).replace('.',',')+'&nbsp;€</div></div>'
        +'<div><div class="stat-label">Netto (20% MwSt)</div><div class="stat-value">'+netto.toFixed(2).replace('.',',')+'&nbsp;€</div></div>'
        +'<div><div class="stat-label">Vorsteuer (MwSt)</div><div class="stat-value">'+mwst.toFixed(2).replace('.',',')+'&nbsp;€</div></div>'
      +'</div>'
      +'<div style="font-size:10px;color:var(--ink3);margin-top:4px">Anzahl Belege: '+bfm.length+'</div>'
    +'</div>'
    +(katRows?'<div class="card"><div style="font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:12px">Ausgaben nach Kategorie</div>'+katRows+'</div>':'')
    +'<div style="display:flex;gap:9px;margin-bottom:10px">'
      +'<button class="btn-primary" onclick="exportAbschlussCSV()" style="flex:1">📥 CSV Steuerberater</button>'
      +'<button class="btn-primary" onclick="exportCSV()" style="flex:1;background:#3D2F4E">📥 CSV BMD</button>'
    +'</div>'
    +'<div style="font-size:11px;color:var(--ink3);line-height:1.5;margin-top:4px">Steuerberater: Datum, Lieferant, Brutto, Netto, MwSt. · BMD: kompaktes Format für BMD-Import.</div>';
  }


  else if(ansicht==='einstellungen'){
    inhalt='<div class="card"><div class="section-title">⚙️ Einstellungen</div><div style="display:flex;flex-direction:column;gap:14px">'
      +'<div><div style="font-size:11px;color:var(--ink3);margin-bottom:4px">KONTO</div><div style="font-size:13px">'+(S.userId?.substring(0,8)+'…')+'</div></div>'
      +'<div><div style="font-size:11px;color:var(--ink3);margin-bottom:4px">BETRIEB</div><div style="font-size:14px;font-weight:600">'+(p?.name||'')+'</div></div>'
      +'<div><div style="font-size:11px;color:var(--ink3);margin-bottom:6px">KATEGORIEN</div>'+kats.map(k=>'<div style="font-size:13px;padding:3px 0">'+k.icon+' '+k.label+'</div>').join('')+'</div>'
      +'<button class="btn-primary" onclick="loadBelege().then(()=>{toast(\'Synchronisiert ✓\');render();})" style="background:#F0EAF4;color:var(--accent)">🔄 Synchronisieren</button>'
      +'<button class="btn-primary" onclick="doLogout()" style="background:#FEF0EE;color:var(--red)">Abmelden</button>'
      +'</div></div>'
      +'<div style="text-align:center;margin-top:16px;font-size:11px;color:var(--ink3);letter-spacing:1px">✦ AI Circle Community Tool ✦</div>';
  }

  app.innerHTML='<div class="header"><div class="header-left">'+logoH+'<div><div class="header-sub">'+(p?.name||'')+'</div><div class="header-title">Meine Belege</div></div></div><select class="month-select" onchange="S.monat=this.value;render()">'+mOpts+'</select></div>'
    +'<nav class="nav"><button class="nav-btn'+(ansicht==='dashboard'?' active':'')+'" onclick="S.ansicht=\'dashboard\';render()">Übersicht</button><button class="nav-btn'+(ansicht==='belege'?' active':'')+'" onclick="S.ansicht=\'belege\';render()">Belege</button><button class="nav-btn'+(ansicht==='neu'?' active':'')+'" onclick="S.ansicht=\'neu\';render()">+ Neu</button><button class="nav-btn'+(ansicht==='abschluss'?' active':'')+'" onclick="S.ansicht=\'abschluss\';render()">📊 Abschluss</button><button class="nav-btn'+(ansicht==='tipps'?' active':'')+'" onclick="S.ansicht=\'tipps\';render()">💡 Tipps</button><button class="nav-btn'+(ansicht==='einstellungen'?' active':'')+'" onclick="S.ansicht=\'einstellungen\';render()">⚙️</button></nav>'
    +'<main class="main">'+inhalt+'</main>';

  const dz=document.getElementById('dz');
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');verarbeiteFileBulk(Array.from(e.dataTransfer.files));});
  }
}

function addKat(){
  S.draft.kategorien.push({id:'k'+Date.now(),icon:'📦',label:''});
  render();
}
function removeKat(i){
  // collect current values first
  S.draft.kategorien.forEach((_,idx)=>{
    const e=document.getElementById('ke'+idx);
    const n=document.getElementById('kn'+idx);
    if(e)S.draft.kategorien[idx].icon=e.value;
    if(n)S.draft.kategorien[idx].label=n.value;
  });
  S.draft.kategorien.splice(i,1);
  render();
}
async function collectAndSave(){
  // collect all field values before saving
  const name=document.getElementById('sname')?.value?.trim();
  const emoji=document.getElementById('semoji')?.value||'💼';
  const pin=document.getElementById('spin')?.value;
  S.draft.kategorien.forEach((_,i)=>{
    const e=document.getElementById('ke'+i);
    const n=document.getElementById('kn'+i);
    if(e)S.draft.kategorien[i].icon=e.value;
    if(n)S.draft.kategorien[i].label=n.value;
  });
  S.draft.name=name||'';
  S.draft.emoji=emoji;
  S.draft.pin=pin||'';
  await saveSetup();
}

async function doManuell(){
  // Felder direkt aus dem DOM lesen (sicherer auf Mobile)
  const datumEl=document.querySelector('#manuell-datum');
  const lieferantEl=document.querySelector('#manuell-lieferant');
  const beschEl=document.querySelector('#manuell-beschreibung');
  const betragEl=document.querySelector('#manuell-betrag');
  const artEl=document.querySelector('#manuell-art');
  const katEl=document.querySelector('#manuell-kategorie');
  if(datumEl)S.manuell.datum=datumEl.value;
  if(lieferantEl)S.manuell.lieferant=lieferantEl.value;
  if(beschEl)S.manuell.beschreibung=beschEl.value;
  if(betragEl)S.manuell.betrag=betragEl.value;
  if(artEl)S.manuell.art=artEl.value;
  if(katEl)S.manuell.kategorie=katEl.value;
  if(!S.manuell.betrag||!S.manuell.beschreibung){toast('Betrag und Beschreibung sind Pflichtfelder','err');return;}
  const kats=S.profile?.kategorien||DEFAULT_KATS;
  const monat=S.manuell.datum?S.manuell.datum.substring(0,7):S.monat;
  try{
    await insertBeleg({datum:S.manuell.datum||new Date().toISOString().split('T')[0],betrag:parseFloat(String(S.manuell.betrag).replace(',','.')),art:S.manuell.art||'ausgabe',lieferant:S.manuell.lieferant||'',kategorie:S.manuell.kategorie||kats[0].id,beschreibung:S.manuell.beschreibung,monat});
    S.manuell=emptyM();S.ansicht='belege';render();toast('Beleg gespeichert ✓');
  }catch(e){toast('Fehler beim Speichern: '+e.message,'err');}
}
async function doEdit(){
  const d=S.editData;
  try{
    await updateBelegDB(S.editId,{datum:d.datum,betrag:parseFloat(String(d.betrag).replace(',','.')),art:d.art,lieferant:d.lieferant,kategorie:d.kategorie,beschreibung:d.beschreibung});
    S.editId=null;render();toast('Beleg aktualisiert ✓');
  }catch(e){toast('Fehler: '+e.message,'err');}
}
function saveKey(){
  const v=document.getElementById('aki')?.value?.trim();
  if(!v){toast('Bitte Key eingeben','err');return;}
  S.apiKey=v;S.showKeyInput=false;
  try{localStorage.setItem('sb_apikey',v);}catch(e){}
  toast('API-Key gespeichert ✓');render();
}

boot();
</script>
<script>
// ── Wörni / Claude – sicherer Proxy ──
async function claudeAnfrage(system, userText, maxTokens) {
  maxTokens = maxTokens || 400;
  const res = await fetch(SB_URL + '/functions/v1/rapid-function', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.token },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: maxTokens,
      system: system,
      messages: [{ role: 'user', content: userText }]
    })
  });
  const data = await res.json();
  return data?.content?.[0]?.text || null;
}
</script>
